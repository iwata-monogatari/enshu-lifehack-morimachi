<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">祭礼の日程を出発前に確かめる順番</title><desc id="d">前年の目安から今年の公式発表、当日の天候と交通、現地掲示へ確認を進める道筋</desc><rect width="1000" height="560" fill="#f2f4eb"/><path d="M100 415H900" stroke="#c7944f" stroke-width="25"/><g fill="#fff" stroke="#526f58" stroke-width="5"><circle cx="120" cy="415" r="68"/><circle cx="375" cy="415" r="68"/><circle cx="630" cy="415" r="68"/><circle cx="880" cy="415" r="68"/></g><g text-anchor="middle" fill="#294b35"><text x="120" y="405" font-size="21">前年の目安</text><text x="120" y="438" font-size="17">まだ予定</text><text x="375" y="405" font-size="21">今年の発表</text><text x="375" y="438" font-size="17">主催者・町</text><text x="630" y="405" font-size="21">当日の情報</text><text x="630" y="438" font-size="17">雨・交通</text><text x="880" y="405" font-size="21">現地掲示</text><text x="880" y="438" font-size="17">案内に従う</text></g><path d="M610 125q40-60 80 0q60-50 95 20q-15 55-90 40h-65q-65 0-55-45q5-25 35-15" fill="#9cb3bf"/><path d="M625 210l-18 55M690 210l-18 55M755 210l-18 55" stroke="#68a4bd" stroke-width="8"/><text x="45" y="58" font-size="34" font-weight="700" fill="#2f3529">固定日ではなく、年と当日の二段階で確認する</text></svg>
