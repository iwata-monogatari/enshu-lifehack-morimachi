<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">森町の神社で舞楽を見守る人々</title><desc id="d">山と社殿を背景に、舞殿で奉納される舞楽を地域の人と来訪者が静かに見守る夕景</desc><rect width="1000" height="560" fill="#f7e9d5"/><circle cx="830" cy="100" r="58" fill="#e7a658"/><path d="M0 265Q190 100 360 250T700 220T1000 205V0H0Z" fill="#58795d"/><rect x="365" y="220" width="300" height="190" fill="#8c4e3e"/><path d="M320 230l195-115 195 115z" fill="#5b3932"/><rect x="415" y="285" width="200" height="125" fill="#e6c385"/><g fill="#334c38"><circle cx="165" cy="395" r="18"/><path d="M145 417h40l18 80h-76z"/><circle cx="250" cy="410" r="16"/><path d="M232 430h36l16 68h-68z"/><circle cx="770" cy="395" r="18"/><path d="M750 417h40l18 80h-76z"/></g><g transform="translate(500 315)"><circle cy="-15" r="16" fill="#f0c096"/><path d="M-35 10h70l28 70h-126z" fill="#d98945"/><path d="M0 5v80" stroke="#fff" stroke-width="8"/></g><text x="45" y="55" font-size="34" font-weight="700" fill="#2f3529">祭礼は観光公演ではなく、地域が守る神事</text></svg>
