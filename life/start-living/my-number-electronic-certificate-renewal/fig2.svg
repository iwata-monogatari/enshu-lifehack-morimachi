<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="9" data-scene-index="3"><title id="title">森町でマイナンバーカードの電子証明書を更新する前に確認することの挿絵3</title><desc id="desc">森町の山並み、道、森町でマイナンバーカードの電子証明書を更新する前に確認することでは暗証番号と持ち物を知りたいを混同しないの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,138 100,132 200,222 300,124 400,205 500,206 600,181 700,150 800,152 900,141 1000,228 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 361 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 419 360 424 520 450 S780 333 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#d49a3a" opacity=".55"/><g data-scene="document"><rect x="360" y="250" width="260" height="180" rx="18" fill="#fff" stroke="#173f36" stroke-width="8"/><path d="M395 305h190M395 345h150M395 385h175" stroke="#173f36" stroke-width="10" opacity=".55"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">行政手続・森町でマイナンバーカードの電子証</text></svg>