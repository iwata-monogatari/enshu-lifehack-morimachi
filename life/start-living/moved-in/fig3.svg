<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" data-illustration="mori-editorial">
<title id="t">転入前後の生活を整える時間軸</title><desc id="d">引越し前の水道連絡、居住開始後の転入届、役場後の学校やごみ確認、落ち着いた後の証明取得を朝昼夕の風景で示す</desc>
<rect width="1000" height="560" fill="#edf5f8"/><circle cx="120" cy="105" r="52" fill="#efc86b"/><path d="M0 345Q150 245 300 330T600 310T1000 275V560H0Z" fill="#9ec498"/><path d="M70 430H925" stroke="#fff8dc" stroke-width="20" stroke-linecap="round"/>
<g font-family="sans-serif" text-anchor="middle"><g transform="translate(145 420)"><circle r="62" fill="#fff" stroke="#466b57" stroke-width="5"/><text y="-12" font-size="21" fill="#244d38">引越し前</text><text y="22" font-size="17" fill="#536356">水道・持ち物</text></g><g transform="translate(390 420)"><circle r="62" fill="#fff" stroke="#466b57" stroke-width="5"/><text y="-12" font-size="21" fill="#244d38">居住開始</text><text y="22" font-size="17" fill="#536356">14日を数える</text></g><g transform="translate(635 420)"><circle r="62" fill="#fff" stroke="#466b57" stroke-width="5"/><text y="-12" font-size="21" fill="#244d38">役場の後</text><text y="22" font-size="17" fill="#536356">学校・ごみ</text></g><g transform="translate(865 420)"><circle r="62" fill="#fff" stroke="#466b57" stroke-width="5"/><text y="-12" font-size="21" fill="#244d38">生活開始</text><text y="22" font-size="17" fill="#536356">記録を保管</text></g></g>
<g transform="translate(285 175)"><rect width="140" height="95" fill="#fff" stroke="#55715b" stroke-width="4"/><path d="M-12 4L70-38l82 42" fill="#a0604d"/><rect x="55" y="52" width="30" height="43" fill="#71503c"/></g><g transform="translate(610 115)"><rect width="160" height="115" fill="#fff9ec" stroke="#55715b" stroke-width="4"/><path d="M-12 5L80-43l92 48" fill="#bc6651"/><text x="80" y="62" text-anchor="middle" font-size="22" fill="#244d38">役場</text></g><text x="50" y="58" font-size="34" font-weight="700" fill="#173e2b">期限だけでなく、暮らしが動き出す順番で考える</text>
