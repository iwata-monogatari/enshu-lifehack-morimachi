<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="13" data-scene-index="1"><title id="title">森町で住民票コードを確認する必要があるとき｜提出先と再交付の考え方の挿絵1</title><desc id="desc">森町の山並み、道、森町で住民票コードを確認する必要があるときの結論：住民票コードの提出を求められたとき、確認できる書類、住民票への記載、番号の扱いを知りたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,126 100,213 200,189 300,223 400,144 500,149 600,127 700,203 800,244 900,124 1000,152 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 399 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 392 360 415 520 450 S780 364 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#d49a3a" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#d49a3a" opacity=".55"/><circle cx="311" cy="180" r="21" fill="#d49a3a" opacity=".55"/><g data-scene="transport"><rect x="330" y="305" width="340" height="130" rx="34" fill="#fff" stroke="#173f36" stroke-width="9"/><circle cx="410" cy="455" r="32" fill="#d49a3a"/><circle cx="590" cy="455" r="32" fill="#d49a3a"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">行政手続・森町で住民票コードを確認する必要</text></svg>