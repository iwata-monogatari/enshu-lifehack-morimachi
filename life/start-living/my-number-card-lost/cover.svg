<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="10" data-scene-index="1"><title id="title">森町でマイナンバーカードを紛失したときの停止・再交付の順番の挿絵1</title><desc id="desc">森町の山並み、道、森町でマイナンバーカードを紛失したときの停止・再交付の順番の結論：マイナンバーカード紛失時に直ちに停止し、警察届出と再交付を進める順番を知りたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,135 100,233 200,203 300,152 400,157 500,175 600,245 700,172 800,149 900,163 1000,165 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 345 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 378 360 384 520 450 S780 337 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><g data-scene="culture"><path d="M350 470V320h300v150M320 320h360L500 205Z" fill="#fff" stroke="#173f36" stroke-width="9"/><path d="M430 470V365h140v105" fill="#d49a3a"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">行政手続・森町でマイナンバーカードを紛失し</text></svg>