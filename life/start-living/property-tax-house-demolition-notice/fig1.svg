<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="20" data-scene-index="2"><title id="title">森町で家屋を取り壊した後の固定資産税手続き｜登記と町への届出を分けるの挿絵2</title><desc id="desc">森町の山並み、道、森町で家屋を取り壊した後の固定資産税手続きを森町公式の「家屋解体後に法務局の滅失登記と森町税務課への届出のどちらが必要か知りたい」で確かめるの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,218 100,200 200,145 300,233 400,245 500,184 600,160 700,237 800,192 900,192 1000,137 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 356 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 384 360 377 520 450 S780 420 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><g data-scene="land"><path d="M285 460 390 270l110 105 105-155 120 240Z" fill="#fff" stroke="#173f36" stroke-width="9"/><path d="M500 375v100" stroke="#d49a3a" stroke-width="18"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">行政手続・森町で家屋を取り壊した後の固定資</text></svg>