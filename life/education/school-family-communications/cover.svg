<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="45" data-scene-index="1"><title id="title">森町の学校から届く連絡を家族で管理する｜紙・メール・緊急連絡先の整理の挿絵1</title><desc id="desc">森町の山並み、道、森町の学校から届く連絡を家族で管理するの結論：学校の配布物、メール、電話連絡を見落とさず、保護者間で締切と緊急連絡先を共有したいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#f4e4c8"/><polygon points="0,240 100,127 200,192 300,155 400,219 500,153 600,210 700,217 800,242 900,245 1000,161 1000,350 0,350" fill="#5a3827" opacity=".22"/><path d="M0 430 Q250 355 500 430 T1000 410 V560 H0Z" fill="#5a3827" opacity=".18"/><path d="M60 500 C230 439 360 407 520 450 S780 404 940 390" fill="none" stroke="#4f7b57" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#4f7b57" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#4f7b57" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#4f7b57" opacity=".55"/><g data-scene="land"><path d="M285 460 390 270l110 105 105-155 120 240Z" fill="#fff" stroke="#5a3827" stroke-width="9"/><path d="M500 375v100" stroke="#4f7b57" stroke-width="18"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#5a3827">教育・森町の学校から届く連絡を家族で管</text></svg>