<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="49" data-scene-index="1"><title id="title">森町の学校給食だよりを家庭で活用する｜献立から買物・体調記録へつなぐの挿絵1</title><desc id="desc">森町の山並み、道、森町の学校給食だよりを家庭で活用するの結論：学校給食の献立や給食だよりを確認し、家庭の夕食、食材の重なり、子どもの体調記録に役立てたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,149 100,208 200,212 300,236 400,242 500,155 600,157 700,163 800,171 900,213 1000,187 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 377 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 427 360 401 520 450 S780 341 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#d49a3a" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#d49a3a" opacity=".55"/><circle cx="311" cy="180" r="21" fill="#d49a3a" opacity=".55"/><circle cx="378" cy="222" r="12" fill="#d49a3a" opacity=".55"/><circle cx="445" cy="264" r="15" fill="#d49a3a" opacity=".55"/><circle cx="512" cy="180" r="18" fill="#d49a3a" opacity=".55"/><g data-scene="transport"><rect x="330" y="305" width="340" height="130" rx="34" fill="#fff" stroke="#173f36" stroke-width="9"/><circle cx="410" cy="455" r="32" fill="#d49a3a"/><circle cx="590" cy="455" r="32" fill="#d49a3a"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">教育・森町の学校給食だよりを家庭で活用</text></svg>