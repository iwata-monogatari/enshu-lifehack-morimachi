<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="43" data-scene-index="1"><title id="title">森町の特別支援教育を相談したいとき｜就学前から在学中までの窓口の挿絵1</title><desc id="desc">森町の山並み、道、森町の特別支援教育を相談したいときの結論：子どもの学習や生活に支援が必要なとき、就学相談と学校での支援をどこへ相談するか知りたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,245 100,124 200,178 300,160 400,178 500,150 600,196 700,241 800,195 900,176 1000,120 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 410 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 431 360 387 520 450 S780 370 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><g data-scene="transport"><rect x="330" y="305" width="340" height="130" rx="34" fill="#fff" stroke="#173f36" stroke-width="9"/><circle cx="410" cy="455" r="32" fill="#d49a3a"/><circle cx="590" cy="455" r="32" fill="#d49a3a"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">教育・森町の特別支援教育を相談したいと</text></svg>