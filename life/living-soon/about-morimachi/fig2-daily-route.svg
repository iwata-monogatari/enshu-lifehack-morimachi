<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">移住前に平日の生活動線を試す</title><desc id="d">森町の家から学校、駅、病院、買い物先、勤務先へ車と鉄道で移動し、朝夕の所要時間を家族が記録する編集挿絵</desc><rect width="1000" height="560" fill="#f4f2e6"/><path d="M75 410C210 220 370 430 500 250S760 380 925 145" fill="none" stroke="#cfad72" stroke-width="55"/><g fill="#fff" stroke="#315b48" stroke-width="5"><rect x="45" y="360" width="145" height="95" rx="12"/><rect x="220" y="135" width="145" height="95" rx="12"/><rect x="430" y="330" width="145" height="95" rx="12"/><rect x="650" y="185" width="145" height="95" rx="12"/><rect x="810" y="60" width="145" height="95" rx="12"/></g><g font-family="sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#29483b"><text x="117" y="415">候補の家</text><text x="292" y="190">学校・駅</text><text x="502" y="385">買い物</text><text x="722" y="240">病院</text><text x="882" y="115">勤務先</text><text x="500" y="520">平日朝・夕、雨の日も同じ道を走って記録する</text></g><g fill="#527f9b"><circle cx="390" cy="300" r="20"/><rect x="365" y="300" width="50" height="24" rx="6"/></g></svg>
