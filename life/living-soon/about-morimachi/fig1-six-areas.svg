<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">森町六地区の暮らしを比べる地形図風景</title><desc id="d">太田川と山並み、天浜線を背景に、森、一宮、飯田、園田、天方、三倉の六地区を暮らしの条件で比べる編集挿絵</desc><rect width="1000" height="560" fill="#edf5e5"/><path d="M0 170Q150 30 320 170T620 135T1000 170V0H0z" fill="#a9cfad"/><path d="M0 440Q250 330 460 420T1000 400" fill="none" stroke="#66aabd" stroke-width="35"/><path d="M80 355Q300 300 520 350T920 305" fill="none" stroke="#555" stroke-width="8"/><g fill="#fff" stroke="#315b48" stroke-width="4"><circle cx="180" cy="250" r="56"/><circle cx="360" cy="205" r="56"/><circle cx="535" cy="260" r="56"/><circle cx="700" cy="205" r="56"/><circle cx="280" cy="390" r="56"/><circle cx="740" cy="390" r="56"/></g><g font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#29483b"><text x="180" y="259">森</text><text x="360" y="214">一宮</text><text x="535" y="269">飯田</text><text x="700" y="214">園田</text><text x="280" y="399">天方</text><text x="740" y="399">三倉</text><text x="500" y="525">地区名ではなく、毎日の移動と土地条件で比べる</text></g></svg>
