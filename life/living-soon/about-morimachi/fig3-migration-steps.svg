<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">森町移住を急がず確かめる道筋</title><desc id="d">オンライン相談から複数回来町、六地区比較、住まいの調査、仕事と学校の確認、転入手続きまでを山道に沿って進む家族の編集挿絵</desc><rect width="1000" height="560" fill="#eef6ed"/><path d="M0 210Q190 80 360 190T700 150T1000 170V0H0z" fill="#acd0ae"/><path d="M55 470C180 330 275 450 390 305S610 340 720 205S870 190 945 80" fill="none" stroke="#d3ae70" stroke-width="62"/><g fill="#fff" stroke="#315b48" stroke-width="4"><circle cx="120" cy="405" r="50"/><circle cx="320" cy="350" r="50"/><circle cx="500" cy="280" r="50"/><circle cx="690" cy="215" r="50"/><circle cx="870" cy="125" r="50"/></g><g font-family="sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#29483b"><text x="120" y="400">相談</text><text x="120" y="425">整理</text><text x="320" y="345">複数回</text><text x="320" y="370">来町</text><text x="500" y="275">地区</text><text x="500" y="300">比較</text><text x="690" y="210">住まい</text><text x="690" y="235">調査</text><text x="870" y="120">転入</text><text x="870" y="145">準備</text><text x="500" y="525" font-size="24">補助金より先に、続けられる暮らしかを確かめる</text></g></svg>
