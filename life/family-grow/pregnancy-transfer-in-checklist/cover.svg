<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="22" data-scene-index="1"><title id="title">森町へ妊娠中に転入したとき｜母子健康手帳と受診票の切替を分けて確認の挿絵1</title><desc id="desc">森町の山並み、道、森町へ妊娠中に転入したときの結論：妊娠中に森町へ転入するとき、母子健康手帳を引き続き使えるか、妊婦健診受診票や相談先をどう切り替えるか知りたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,213 100,181 200,132 300,139 400,159 500,127 600,127 700,227 800,130 900,160 1000,243 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 349 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 376 360 427 520 450 S780 407 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#d49a3a" opacity=".55"/><g data-scene="culture"><path d="M350 470V320h300v150M320 320h360L500 205Z" fill="#fff" stroke="#173f36" stroke-width="9"/><path d="M430 470V365h140v105" fill="#d49a3a"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">子育て・森町へ妊娠中に転入したときの受診</text></svg>