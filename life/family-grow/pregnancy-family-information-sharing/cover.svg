<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="34" data-scene-index="1"><title id="title">森町で父親・パートナーが母子保健情報を共有する｜妊娠期からの家族記録の挿絵1</title><desc id="desc">森町の山並み、道、森町で父親・パートナーが母子保健情報を共有するの結論：妊娠中の健診予定、緊急連絡先、出生後の届出をパートナーや家族と共有する方法を知りたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,148 100,246 200,232 300,129 400,133 500,233 600,148 700,179 800,211 900,187 1000,185 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 361 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 425 360 440 520 450 S780 425 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#d49a3a" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#d49a3a" opacity=".55"/><g data-scene="culture"><path d="M350 470V320h300v150M320 320h360L500 205Z" fill="#fff" stroke="#173f36" stroke-width="9"/><path d="M430 470V365h140v105" fill="#d49a3a"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">子育て・森町で父親・パートナーが母子保健</text></svg>