<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="27" data-scene-index="1"><title id="title">森町の保育所申込みで就労証明書を準備する｜勤務先依頼から提出前確認までの挿絵1</title><desc id="desc">森町の山並み、道、森町の保育所申込みで就労証明書を準備するの結論：保育所申込みに必要な就労証明書を勤務先へ依頼し、就労時間、復職日、記載漏れを確認したいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#f4e4c8"/><polygon points="0,210 100,205 200,248 300,242 400,131 500,189 600,174 700,120 800,194 900,188 1000,135 1000,350 0,350" fill="#5a3827" opacity=".22"/><path d="M0 430 Q250 364 500 430 T1000 410 V560 H0Z" fill="#5a3827" opacity=".18"/><path d="M60 500 C230 396 360 448 520 450 S780 387 940 390" fill="none" stroke="#4f7b57" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#4f7b57" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#4f7b57" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#4f7b57" opacity=".55"/><circle cx="311" cy="180" r="21" fill="#4f7b57" opacity=".55"/><circle cx="378" cy="222" r="12" fill="#4f7b57" opacity=".55"/><circle cx="445" cy="264" r="15" fill="#4f7b57" opacity=".55"/><circle cx="512" cy="180" r="18" fill="#4f7b57" opacity=".55"/><g data-scene="land"><path d="M285 460 390 270l110 105 105-155 120 240Z" fill="#fff" stroke="#5a3827" stroke-width="9"/><path d="M500 375v100" stroke="#4f7b57" stroke-width="18"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#5a3827">子育て・森町の保育所申込みで就労証明書を</text></svg>