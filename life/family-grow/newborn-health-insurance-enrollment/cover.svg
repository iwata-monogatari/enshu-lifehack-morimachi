<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="24" data-scene-index="1"><title id="title">森町で出生後に赤ちゃんの健康保険を整える｜加入先を決めて申請を分けるの挿絵1</title><desc id="desc">森町の山並み、道、森町で出生後に赤ちゃんの健康保険を整えるの結論：出生後、赤ちゃんを国民健康保険または家族の被用者保険へ加入させる順序と、医療費助成との関係を知りたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#f4e4c8"/><polygon points="0,177 100,176 200,185 300,201 400,148 500,204 600,173 700,121 800,145 900,197 1000,220 1000,350 0,350" fill="#5a3827" opacity=".22"/><path d="M0 430 Q250 348 500 430 T1000 410 V560 H0Z" fill="#5a3827" opacity=".18"/><path d="M60 500 C230 400 360 433 520 450 S780 354 940 390" fill="none" stroke="#4f7b57" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#4f7b57" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#4f7b57" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#4f7b57" opacity=".55"/><circle cx="311" cy="180" r="21" fill="#4f7b57" opacity=".55"/><g data-scene="home"><path d="M350 350 500 225l150 125v140H350Z" fill="#fff" stroke="#5a3827" stroke-width="9"/><rect x="470" y="405" width="60" height="85" fill="#4f7b57"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#5a3827">子育て・森町で出生後に赤ちゃんの健康保険</text></svg>