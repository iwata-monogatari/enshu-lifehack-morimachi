<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="26" data-scene-index="1"><title id="title">森町で母子健康手帳をなくしたとき｜記録の確認と再交付相談の挿絵1</title><desc id="desc">森町の山並み、道、森町で母子健康手帳をなくしたときの結論：母子健康手帳を紛失・汚損したとき、再交付の相談、健診・予防接種記録の確認、今後の保管方法を知りたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#e2ebf7"/><polygon points="0,206 100,181 200,161 300,143 400,211 500,170 600,173 700,212 800,166 900,195 1000,132 1000,350 0,350" fill="#283f66" opacity=".22"/><path d="M0 430 Q250 363 500 430 T1000 410 V560 H0Z" fill="#283f66" opacity=".18"/><path d="M60 500 C230 391 360 409 520 450 S780 357 940 390" fill="none" stroke="#b75d43" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#b75d43" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#b75d43" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#b75d43" opacity=".55"/><circle cx="311" cy="180" r="21" fill="#b75d43" opacity=".55"/><circle cx="378" cy="222" r="12" fill="#b75d43" opacity=".55"/><circle cx="445" cy="264" r="15" fill="#b75d43" opacity=".55"/><g data-scene="people"><circle cx="430" cy="290" r="42" fill="#b75d43"/><circle cx="570" cy="290" r="42" fill="#fff" stroke="#283f66" stroke-width="8"/><path d="M355 475q75-155 150 0M495 475q75-155 150 0" fill="none" stroke="#283f66" stroke-width="18"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#283f66">子育て・森町で母子健康手帳をなくしたとき</text></svg>