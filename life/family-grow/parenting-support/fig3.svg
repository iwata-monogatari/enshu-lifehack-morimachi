<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">困った日の子育て支援の選び方</title><desc id="d">家で迷う親子から、電話相談、遊び場、医療、預かり、緊急連絡へ複数の道が分かれる情景</desc><rect width="1000" height="560" fill="#f7f1eb"/><g transform="translate(80 220)"><rect width="200" height="150" fill="#fff" stroke="#526d57" stroke-width="5"/><path d="M-20 5L100-58 220 5" fill="#a86c50"/><circle cx="75" cy="95" r="18" fill="#e8ac83"/><circle cx="125" cy="110" r="14" fill="#e8ac83"/></g><path d="M290 300C430 300 400 120 560 120M290 300C430 300 430 245 560 245M290 300C430 300 430 370 560 370M290 300C430 300 400 490 560 490" fill="none" stroke="#d6af67" stroke-width="18" stroke-linecap="round"/><g fill="#fff" stroke="#4f755b" stroke-width="4"><rect x="560" y="70" width="360" height="95" rx="18"/><rect x="560" y="198" width="360" height="95" rx="18"/><rect x="560" y="326" width="360" height="95" rx="18"/><rect x="560" y="448" width="360" height="80" rx="18"/></g><g fill="#234c36" font-size="22"><text x="590" y="125">話を整理したい → こども家庭センター</text><text x="590" y="253">遊ぶ・交流したい → 児童館・支援センター</text><text x="590" y="381">病気・預け先 → 医療機関・保育の窓口</text><text x="590" y="496">危険が迫る → 110・119、緊急の相談先</text></g><text x="50" y="55" font-size="34" font-weight="700" fill="#173e2b">一つの入口で抱えず、状況に合う道を選ぶ</text></svg>
