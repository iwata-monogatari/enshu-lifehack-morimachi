<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">子どもの年齢と相談先を結ぶ路線図</title><desc id="d">妊娠、乳幼児、園、小学校、中高生の各段階を一本の道で結び、相談、健康、預け先、学校の入口へ枝分かれさせた図</desc><rect width="1000" height="560" fill="#f1f7f2"/><path d="M100 360H900" stroke="#d8a85b" stroke-width="24" stroke-linecap="round"/><g fill="#fff" stroke="#426a53" stroke-width="5"><circle cx="120" cy="360" r="58"/><circle cx="310" cy="360" r="58"/><circle cx="500" cy="360" r="58"/><circle cx="690" cy="360" r="58"/><circle cx="880" cy="360" r="58"/></g><g font-size="21" fill="#244b36" text-anchor="middle"><text x="120" y="368">妊娠</text><text x="310" y="368">乳幼児</text><text x="500" y="368">園</text><text x="690" y="368">小学校</text><text x="880" y="368">中高生</text></g><g stroke="#719179" stroke-width="7"><path d="M310 300V180"/><path d="M500 300V125"/><path d="M690 300V180"/><path d="M880 300V125"/></g><g fill="#fff" stroke="#719179" stroke-width="4"><rect x="225" y="105" width="170" height="75" rx="15"/><rect x="415" y="50" width="170" height="75" rx="15"/><rect x="605" y="105" width="170" height="75" rx="15"/><rect x="795" y="50" width="170" height="75" rx="15"/></g><g font-size="19" fill="#244b36" text-anchor="middle"><text x="310" y="150">健診・予防接種</text><text x="500" y="95">保育・預かり</text><text x="690" y="150">学童・学校</text><text x="880" y="95">相談・居場所</text></g><text x="50" y="515" font-size="24" fill="#516558">年齢だけで決めず、「今の困りごと」から途中駅を選ぶ</text><text x="50" y="50" font-size="34" font-weight="700" fill="#173e2b">妊娠から18歳まで、相談先は途切れない</text></svg>
