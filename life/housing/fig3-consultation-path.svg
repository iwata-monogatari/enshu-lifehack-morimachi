<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">住まい相談の窓口を選ぶ道筋</title><desc id="d">家族が書類を整理し、森町役場、法務局、金融機関、不動産会社へ目的別に進む分岐路を描いた編集挿絵</desc><rect width="1000" height="560" fill="#edf5f7"/><path d="M80 480Q360 390 500 275" fill="none" stroke="#d5b581" stroke-width="70"/><path d="M500 275L250 90M500 275L500 70M500 275L750 90M500 275L900 310" fill="none" stroke="#d5b581" stroke-width="42"/><g fill="#fff" stroke="#315b48" stroke-width="5"><rect x="120" y="355" width="230" height="105" rx="15"/><rect x="120" y="35" width="240" height="95" rx="15"/><rect x="390" y="25" width="220" height="95" rx="15"/><rect x="660" y="35" width="240" height="95" rx="15"/><rect x="735" y="260" width="220" height="95" rx="15"/></g><g font-family="sans-serif" font-weight="700" fill="#27473c" text-anchor="middle"><text x="235" y="400" font-size="26">家族で状況整理</text><text x="235" y="95" font-size="28">森町役場</text><text x="500" y="84" font-size="28">法務局</text><text x="780" y="95" font-size="28">金融機関</text><text x="845" y="320" font-size="25">不動産会社</text><text x="500" y="520" font-size="24">目的を一文にしてから、必要な窓口へ</text></g></svg>
