<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">空き家バンクに関わる人の役割</title><desc id="d">森町役場、所有者、利用希望者、宅地建物取引業者が円卓で、情報提供、物件確認、条件交渉、契約支援の役割を分ける編集挿絵</desc><rect width="1000" height="560" fill="#eef5f2"/><circle cx="500" cy="280" r="125" fill="#fff" stroke="#315b48" stroke-width="6"/><g fill="#d9ead5" stroke="#315b48" stroke-width="5"><circle cx="500" cy="75" r="65"/><circle cx="200" cy="280" r="65"/><circle cx="800" cy="280" r="65"/><circle cx="500" cy="485" r="65"/></g><g font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#29483b"><text x="500" y="82" font-size="24">森町役場</text><text x="200" y="287" font-size="24">所有者</text><text x="800" y="274" font-size="22">利用</text><text x="800" y="301" font-size="22">希望者</text><text x="500" y="477" font-size="21">宅建業者</text><text x="500" y="505" font-size="19">必要時</text><text x="500" y="255" font-size="25">役割を分ける</text><text x="500" y="294" font-size="21">町は契約当事者</text><text x="500" y="323" font-size="21">ではありません</text></g><path d="M500 140v15M265 280h110M625 280h110M500 405v15" stroke="#d18a45" stroke-width="10"/></svg>
