<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">森町の空き家を見学する確認点</title><desc id="d">山際の空き家を家族が見学し、雨漏り、床、基礎、水道、境界、接道、斜面を屋内外で確かめる編集挿絵</desc><rect width="1000" height="560" fill="#f7f1df"/><path d="M0 210l220-120 210 125 230-105 340 110V0H0z" fill="#bad3b0"/><path d="M235 235h490v250H235z" fill="#fff9e8" stroke="#334f43" stroke-width="6"/><path d="m190 245 290-180 290 180z" fill="#985e4d" stroke="#334f43" stroke-width="6"/><rect x="300" y="305" width="115" height="180" fill="#d7a96f"/><rect x="515" y="300" width="130" height="95" fill="#bde0e6" stroke="#334f43" stroke-width="5"/><path d="M480 70v410" stroke="#d14f4f" stroke-width="5" stroke-dasharray="15 12"/><g font-family="sans-serif" font-size="23" font-weight="700" fill="#253d34"><text x="65" y="300">接道・境界</text><text x="70" y="340">水路・斜面</text><text x="760" y="300">屋根・雨漏り</text><text x="760" y="340">床・基礎</text><text x="760" y="380">水道・排水</text><text x="370" y="535">写真とメモを残し、その場で契約を決めない</text></g></svg>
