<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">空き家バンクの登録から交渉まで</title><desc id="d">森町の山里にある空き家を、所有者が役場へ登録し、利用希望者が見学した後、当事者または宅建業者と契約を進める流れの編集挿絵</desc><rect width="1000" height="560" fill="#f0f6e8"/><path d="M0 200Q180 80 360 190T720 170T1000 180V0H0z" fill="#bad7b5"/><g fill="#fff" stroke="#315b48" stroke-width="5"><rect x="50" y="315" width="190" height="120" rx="14"/><rect x="285" y="315" width="190" height="120" rx="14"/><rect x="520" y="315" width="190" height="120" rx="14"/><rect x="755" y="315" width="190" height="120" rx="14"/></g><g fill="none" stroke="#d18a45" stroke-width="12"><path d="M240 375h45M475 375h45M710 375h45"/></g><g font-family="sans-serif" font-size="25" font-weight="700" fill="#2b4b3c" text-anchor="middle"><text x="145" y="365">所有者が</text><text x="145" y="400">書類提出</text><text x="380" y="365">町が調査・</text><text x="380" y="400">情報公開</text><text x="615" y="365">利用申込・</text><text x="615" y="400">見学</text><text x="850" y="365">当事者で交渉</text><text x="850" y="400">必要なら仲介</text><text x="500" y="505">町は情報提供。交渉・契約・管理は行わない</text></g></svg>
