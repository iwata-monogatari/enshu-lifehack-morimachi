<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">土地と建物を現地で確認する順序</title><desc id="d">森町の傾斜地と平地に建つ家を前に、道路、境界、水路、地目、災害リスクを順番に確認する人物の編集挿絵</desc><rect width="1000" height="560" fill="#f6f1df"/><path d="M0 230L220 100l210 130 210-90 360 100v320H0z" fill="#c9ddb5"/><path d="M0 420h1000" stroke="#777" stroke-width="70"/><path d="M60 420h880" stroke="#fff" stroke-width="6" stroke-dasharray="38 25"/><path d="M570 220h230v170H570z" fill="#fff7de" stroke="#315b48" stroke-width="5"/><path d="m545 225 140-105 140 105z" fill="#b06d55" stroke="#315b48" stroke-width="5"/><path d="M355 250v160" stroke="#2b6f77" stroke-width="18"/><path d="M330 250h50" stroke="#2b6f77" stroke-width="8"/><path d="M190 220v180M245 220v180" stroke="#e99e3f" stroke-width="6" stroke-dasharray="12 10"/><g font-family="sans-serif" font-size="24" font-weight="700" fill="#263c35"><text x="90" y="190">境界</text><text x="310" y="205">水路</text><text x="570" y="95">建物・登記</text><text x="725" y="485">接道</text><text x="65" y="520">現地 → 公図・登記 → 役場 → 家族の判断</text></g></svg>
