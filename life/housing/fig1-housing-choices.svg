<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">森町で住まいの選択肢を比べる風景</title><desc id="d">太田川と山、茶畑のある森町で、賃貸住宅、空き家、土地、実家を家族が一つの机で比較している編集挿絵</desc><rect width="1000" height="560" fill="#eef7ef"/><path d="M0 190 Q180 70 350 185T700 160T1000 180V0H0Z" fill="#b8d8bd"/><path d="M0 250 Q210 160 410 235T760 220T1000 230V560H0Z" fill="#dce9c8"/><path d="M0 430 Q240 350 470 430T1000 410" fill="none" stroke="#5ea6b4" stroke-width="34"/><g fill="#fff7de" stroke="#315b48" stroke-width="5"><path d="M95 315h190v130H95z"/><path d="m75 320 115-85 115 85z"/><path d="M690 300h210v145H690z"/><path d="m665 305 130-95 130 95z"/></g><g fill="#6a9c57"><path d="M345 300l55-60 55 60z"/><path d="M430 305l55-60 55 60z"/><path d="M515 310l55-60 55 60z"/></g><rect x="300" y="375" width="380" height="118" rx="20" fill="#fff" stroke="#315b48" stroke-width="5"/><g fill="#e9b86e" stroke="#315b48" stroke-width="4"><circle cx="365" cy="350" r="28"/><circle cx="615" cy="350" r="28"/></g><g fill="#315b48" font-family="sans-serif" font-size="25" font-weight="700"><text x="330" y="425">借りる</text><text x="435" y="425">買う</text><text x="535" y="425">守る</text><text x="410" y="468">売る前に条件を整理</text></g></svg>
