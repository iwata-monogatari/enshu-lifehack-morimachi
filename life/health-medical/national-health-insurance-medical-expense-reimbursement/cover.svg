<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="64" data-scene-index="1"><title id="title">森町の国民健康保険で療養費を申請する場面｜立替払いと必要書類を確認の挿絵1</title><desc id="desc">森町の山並み、道、森町の国民健康保険で療養費を申請する場面の結論：国保加入者が医療費を全額立て替えた場合など、療養費申請の対象になり得る場面と書類を知りたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,125 100,212 200,133 300,142 400,130 500,163 600,134 700,184 800,238 900,158 1000,136 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 385 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 360 360 405 520 450 S780 351 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#d49a3a" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#d49a3a" opacity=".55"/><circle cx="311" cy="180" r="21" fill="#d49a3a" opacity=".55"/><circle cx="378" cy="222" r="12" fill="#d49a3a" opacity=".55"/><circle cx="445" cy="264" r="15" fill="#d49a3a" opacity=".55"/><circle cx="512" cy="180" r="18" fill="#d49a3a" opacity=".55"/><circle cx="579" cy="222" r="21" fill="#d49a3a" opacity=".55"/><circle cx="646" cy="264" r="12" fill="#d49a3a" opacity=".55"/><circle cx="713" cy="180" r="15" fill="#d49a3a" opacity=".55"/><circle cx="780" cy="222" r="18" fill="#d49a3a" opacity=".55"/><g data-scene="culture"><path d="M350 470V320h300v150M320 320h360L500 205Z" fill="#fff" stroke="#173f36" stroke-width="9"/><path d="M430 470V365h140v105" fill="#d49a3a"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">健康・森町の国民健康保険で療養費を申請</text></svg>