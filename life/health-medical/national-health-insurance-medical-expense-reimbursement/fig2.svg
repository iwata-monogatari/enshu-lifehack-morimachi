<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="64" data-scene-index="3"><title id="title">森町の国民健康保険で療養費を申請する場面｜立替払いと必要書類を確認の挿絵3</title><desc id="desc">森町の山並み、道、森町の国民健康保険で療養費を申請する場面では立替払いと申請前照会を混同しないの確認場面</desc><rect width="1000" height="560" rx="32" fill="#e2ebf7"/><polygon points="0,196 100,163 200,137 300,128 400,247 500,198 600,146 700,215 800,142 900,175 1000,201 1000,350 0,350" fill="#283f66" opacity=".22"/><path d="M0 430 Q250 396 500 430 T1000 410 V560 H0Z" fill="#283f66" opacity=".18"/><path d="M60 500 C230 413 360 372 520 450 S780 427 940 390" fill="none" stroke="#b75d43" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#b75d43" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#b75d43" opacity=".55"/><g data-scene="home"><path d="M350 350 500 225l150 125v140H350Z" fill="#fff" stroke="#283f66" stroke-width="9"/><rect x="470" y="405" width="60" height="85" fill="#b75d43"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#283f66">健康・森町の国民健康保険で療養費を申請</text></svg>