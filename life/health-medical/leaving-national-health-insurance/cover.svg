<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="72" data-scene-index="1"><title id="title">森町の国民健康保険をやめる手続き｜就職・扶養入り後の届出と返却物の挿絵1</title><desc id="desc">森町の山並み、道、森町の国民健康保険をやめる手続きの結論：就職して社会保険へ加入したり家族の扶養に入ったりした後、森町の国保喪失届、資格書類、保険料を確認したいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#f4e4c8"/><polygon points="0,200 100,158 200,243 300,158 400,198 500,134 600,236 700,186 800,132 900,143 1000,166 1000,350 0,350" fill="#5a3827" opacity=".22"/><path d="M0 430 Q250 355 500 430 T1000 410 V560 H0Z" fill="#5a3827" opacity=".18"/><path d="M60 500 C230 421 360 400 520 450 S780 421 940 390" fill="none" stroke="#4f7b57" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#4f7b57" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#4f7b57" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#4f7b57" opacity=".55"/><circle cx="311" cy="180" r="21" fill="#4f7b57" opacity=".55"/><circle cx="378" cy="222" r="12" fill="#4f7b57" opacity=".55"/><circle cx="445" cy="264" r="15" fill="#4f7b57" opacity=".55"/><circle cx="512" cy="180" r="18" fill="#4f7b57" opacity=".55"/><circle cx="579" cy="222" r="21" fill="#4f7b57" opacity=".55"/><g data-scene="home"><path d="M350 350 500 225l150 125v140H350Z" fill="#fff" stroke="#5a3827" stroke-width="9"/><rect x="470" y="405" width="60" height="85" fill="#4f7b57"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#5a3827">健康・森町の国民健康保険をやめる手続き</text></svg>