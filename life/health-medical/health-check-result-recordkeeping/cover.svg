<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="68" data-scene-index="1"><title id="title">森町で健診結果を保管・比較する｜数値を自己判断せず相談準備につなげるの挿絵1</title><desc id="desc">森町の山並み、道、森町で健診結果を保管・比較するの結論：毎年の健診結果を保管し、前年との差、受診勧奨、生活記録を整理して専門職へ相談する準備をしたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#e2ebf7"/><polygon points="0,200 100,134 200,241 300,178 400,172 500,167 600,132 700,167 800,200 900,242 1000,157 1000,350 0,350" fill="#283f66" opacity=".22"/><path d="M0 430 Q250 370 500 430 T1000 410 V560 H0Z" fill="#283f66" opacity=".18"/><path d="M60 500 C230 435 360 368 520 450 S780 392 940 390" fill="none" stroke="#b75d43" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#b75d43" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#b75d43" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#b75d43" opacity=".55"/><circle cx="311" cy="180" r="21" fill="#b75d43" opacity=".55"/><g data-scene="people"><circle cx="430" cy="290" r="42" fill="#b75d43"/><circle cx="570" cy="290" r="42" fill="#fff" stroke="#283f66" stroke-width="8"/><path d="M355 475q75-155 150 0M495 475q75-155 150 0" fill="none" stroke="#283f66" stroke-width="18"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#283f66">健康・森町で健診結果を保管・比較するの</text></svg>