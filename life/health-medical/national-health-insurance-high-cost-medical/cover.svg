<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="57" data-scene-index="1"><title id="title">森町の国民健康保険で高額療養費を申請する方法の挿絵1</title><desc id="desc">森町の山並み、道、森町の国民健康保険で高額療養費を申請する方法の結論：医療費の自己負担が高くなったとき、高額療養費の対象、申請、振込までを知りたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#f4e4c8"/><polygon points="0,133 100,130 200,217 300,212 400,126 500,127 600,191 700,199 800,128 900,182 1000,124 1000,350 0,350" fill="#5a3827" opacity=".22"/><path d="M0 430 Q250 365 500 430 T1000 410 V560 H0Z" fill="#5a3827" opacity=".18"/><path d="M60 500 C230 408 360 447 520 450 S780 396 940 390" fill="none" stroke="#4f7b57" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#4f7b57" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#4f7b57" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#4f7b57" opacity=".55"/><circle cx="311" cy="180" r="21" fill="#4f7b57" opacity=".55"/><g data-scene="land"><path d="M285 460 390 270l110 105 105-155 120 240Z" fill="#fff" stroke="#5a3827" stroke-width="9"/><path d="M500 375v100" stroke="#4f7b57" stroke-width="18"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#5a3827">健康・森町の国民健康保険で高額療養費を</text></svg>