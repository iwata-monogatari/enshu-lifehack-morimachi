<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="67" data-scene-index="1"><title id="title">森町でお薬手帳と医療情報を家族に共有する｜通院先・服薬・緊急連絡を整理の挿絵1</title><desc id="desc">森町の山並み、道、森町でお薬手帳と医療情報を家族に共有するの結論：複数の医療機関へ通う本人や高齢家族について、薬の情報、アレルギー、通院先、緊急連絡先を整理したいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,133 100,196 200,123 300,221 400,166 500,215 600,140 700,211 800,196 900,243 1000,181 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 375 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 371 360 445 520 450 S780 414 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#d49a3a" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#d49a3a" opacity=".55"/><g data-scene="transport"><rect x="330" y="305" width="340" height="130" rx="34" fill="#fff" stroke="#173f36" stroke-width="9"/><circle cx="410" cy="455" r="32" fill="#d49a3a"/><circle cx="590" cy="455" r="32" fill="#d49a3a"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">健康・森町でお薬手帳と医療情報を家族に</text></svg>