<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="70" data-scene-index="1"><title id="title">森町の国民健康保険料を産前産後に確認する｜対象期間と届出資料を整理の挿絵1</title><desc id="desc">森町の山並み、道、森町の国民健康保険料を産前産後に確認するの結論：国保加入者が出産予定または出産したとき、産前産後期間の保険料負担軽減と届出の要否を知りたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,151 100,215 200,143 300,155 400,198 500,161 600,198 700,134 800,160 900,176 1000,207 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 387 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 399 360 444 520 450 S780 354 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#d49a3a" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#d49a3a" opacity=".55"/><circle cx="311" cy="180" r="21" fill="#d49a3a" opacity=".55"/><circle cx="378" cy="222" r="12" fill="#d49a3a" opacity=".55"/><circle cx="445" cy="264" r="15" fill="#d49a3a" opacity=".55"/><g data-scene="culture"><path d="M350 470V320h300v150M320 320h360L500 205Z" fill="#fff" stroke="#173f36" stroke-width="9"/><path d="M430 470V365h140v105" fill="#d49a3a"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">健康・森町の国民健康保険料を産前産後に</text></svg>