<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="65" data-scene-index="1"><title id="title">森町の国民健康保険で第三者行為の届出が必要なとき｜交通事故後の連絡順序の挿絵1</title><desc id="desc">森町の山並み、道、森町の国民健康保険で第三者行為の届出が必要なときの結論：交通事故など相手方の行為で国保を使う可能性があるとき、保険者への届出と示談前の確認を知りたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#e2ebf7"/><polygon points="0,128 100,238 200,150 300,238 400,178 500,165 600,160 700,211 800,130 900,172 1000,237 1000,350 0,350" fill="#283f66" opacity=".22"/><path d="M0 430 Q250 349 500 430 T1000 410 V560 H0Z" fill="#283f66" opacity=".18"/><path d="M60 500 C230 372 360 442 520 450 S780 429 940 390" fill="none" stroke="#b75d43" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#b75d43" opacity=".55"/><g data-scene="document"><rect x="360" y="250" width="260" height="180" rx="18" fill="#fff" stroke="#283f66" stroke-width="8"/><path d="M395 305h190M395 345h150M395 385h175" stroke="#283f66" stroke-width="10" opacity=".55"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#283f66">健康・森町の国民健康保険で第三者行為の</text></svg>