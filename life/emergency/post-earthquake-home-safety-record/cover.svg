<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="83" data-scene-index="1"><title id="title">森町で地震後に自宅へ戻る判断を急がない｜外観記録と公的情報の確認の挿絵1</title><desc id="desc">森町の山並み、道、森町で地震後に自宅へ戻る判断を急がないの結論：地震後に自宅の外観、周囲の道路、電気・ガスの異常を記録し、危険を感じたら立ち入らず公的情報を確認したいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#e2ebf7"/><polygon points="0,149 100,229 200,234 300,165 400,188 500,214 600,178 700,147 800,250 900,170 1000,160 1000,350 0,350" fill="#283f66" opacity=".22"/><path d="M0 430 Q250 408 500 430 T1000 410 V560 H0Z" fill="#283f66" opacity=".18"/><path d="M60 500 C230 361 360 407 520 450 S780 341 940 390" fill="none" stroke="#b75d43" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#b75d43" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#b75d43" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#b75d43" opacity=".55"/><circle cx="311" cy="180" r="21" fill="#b75d43" opacity=".55"/><circle cx="378" cy="222" r="12" fill="#b75d43" opacity=".55"/><circle cx="445" cy="264" r="15" fill="#b75d43" opacity=".55"/><circle cx="512" cy="180" r="18" fill="#b75d43" opacity=".55"/><circle cx="579" cy="222" r="21" fill="#b75d43" opacity=".55"/><g data-scene="document"><rect x="360" y="250" width="260" height="180" rx="18" fill="#fff" stroke="#283f66" stroke-width="8"/><path d="M395 305h190M395 345h150M395 385h175" stroke="#283f66" stroke-width="10" opacity=".55"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#283f66">防災・森町で地震後に自宅へ戻る判断を急</text></svg>