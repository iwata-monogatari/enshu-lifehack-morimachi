<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="87" data-scene-index="1"><title id="title">森町を訪問中に災害が起きたとき｜現在地・交通・一時避難を確認の挿絵1</title><desc id="desc">森町の山並み、道、森町を訪問中に災害が起きたときの結論：観光や仕事で森町に滞在中、警報や地震が起きた場合の情報源と一時避難先を知りたいの確認場面</desc><rect width="1000" height="560" rx="32" fill="#f4e4c8"/><polygon points="0,233 100,130 200,217 300,170 400,224 500,156 600,175 700,120 800,217 900,125 1000,247 1000,350 0,350" fill="#5a3827" opacity=".22"/><path d="M0 430 Q250 368 500 430 T1000 410 V560 H0Z" fill="#5a3827" opacity=".18"/><path d="M60 500 C230 401 360 447 520 450 S780 398 940 390" fill="none" stroke="#4f7b57" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#4f7b57" opacity=".55"/><g data-scene="land"><path d="M285 460 390 270l110 105 105-155 120 240Z" fill="#fff" stroke="#5a3827" stroke-width="9"/><path d="M500 375v100" stroke="#4f7b57" stroke-width="18"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#5a3827">防災・森町を訪問中に災害が起きたときの</text></svg>