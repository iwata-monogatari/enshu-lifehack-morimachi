<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">遠州の小京都という呼称を確かめる資料の道</title><desc id="d">森町之賦、全国京都会議、町並みと舞楽の三つの資料を道で結んだ図</desc><rect width="1000" height="560" fill="#fff8eb"/><path d="M100 420C260 310 340 385 500 250S760 220 900 105" fill="none" stroke="#c69a55" stroke-width="24" stroke-linecap="round"/><g fill="#fff" stroke="#59735b" stroke-width="5"><rect x="50" y="340" width="220" height="130" rx="16"/><rect x="385" y="190" width="230" height="130" rx="16"/><rect x="720" y="45" width="230" height="130" rx="16"/></g><g text-anchor="middle" fill="#294a35"><text x="160" y="395" font-size="24">1923年</text><text x="160" y="430" font-size="20">「森町之賦」</text><text x="500" y="245" font-size="24">2012年</text><text x="500" y="280" font-size="20">全国京都会議へ加盟</text><text x="835" y="100" font-size="24">現在</text><text x="835" y="135" font-size="20">景観と文化を歩いて読む</text></g><text x="48" y="60" font-size="34" font-weight="700" fill="#243f2c">愛称、加盟、現地の事実を分けて確かめる</text></svg>
