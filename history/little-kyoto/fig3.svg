<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">遠州森駅から町並みを歩く半日の道</title><desc id="d">遠州森駅、太田川、城下の町並み、寺社、和菓子店を歩いて巡る場面</desc><rect width="1000" height="560" fill="#edf4ec"/><path d="M85 440C240 330 340 445 490 320S760 300 915 120" fill="none" stroke="#e3c06f" stroke-width="30" stroke-linecap="round"/><g fill="#fff" stroke="#507059" stroke-width="4"><rect x="45" y="365" width="170" height="115"/><rect x="325" y="300" width="170" height="115"/><rect x="585" y="230" width="165" height="115"/><rect x="785" y="65" width="170" height="115"/></g><g text-anchor="middle" fill="#284b35" font-size="21"><text x="130" y="430">遠州森駅</text><text x="410" y="365">太田川と橋</text><text x="668" y="295">城下の町並み</text><text x="870" y="130">寺社・店</text></g><g fill="#557c5c"><circle cx="260" cy="390" r="15"/><path d="M260 407l-22 48h44z"/><circle cx="530" cy="330" r="15"/><path d="M530 347l-22 48h44z"/></g><text x="48" y="55" font-size="34" font-weight="700" fill="#243f2c">名所を急がず、川と暮らしの間を歩く</text></svg>
