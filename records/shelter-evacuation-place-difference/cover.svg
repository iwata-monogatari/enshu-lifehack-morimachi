<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="252" data-scene-index="1"><title id="title">森町で避難所と指定緊急避難場所を家族メモで分けるの挿絵1</title><desc id="desc">森町の山並み、道、避難所と指定緊急避難場所を家族メモで分けるで災害種別と地図の版・改訂日を混ぜないの確認場面</desc><rect width="1000" height="560" rx="32" fill="#f4e4c8"/><polygon points="0,209 100,129 200,152 300,171 400,213 500,204 600,194 700,217 800,239 900,233 1000,198 1000,350 0,350" fill="#5a3827" opacity=".22"/><path d="M0 430 Q250 369 500 430 T1000 410 V560 H0Z" fill="#5a3827" opacity=".18"/><path d="M60 500 C230 380 360 388 520 450 S780 398 940 390" fill="none" stroke="#4f7b57" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#4f7b57" opacity=".55"/><g data-scene="home"><path d="M350 350 500 225l150 125v140H350Z" fill="#fff" stroke="#5a3827" stroke-width="9"/><rect x="470" y="405" width="60" height="85" fill="#4f7b57"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#5a3827">防災記録・避難所と指定緊急避難場所を家族メ</text></svg>