<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="252" data-scene-index="2"><title id="title">森町で避難所と指定緊急避難場所を家族メモで分けるの挿絵2</title><desc id="desc">森町の山並み、道、避難所と指定緊急避難場所を家族メモで分けるの対象住所を森町公式主資料から転記するの確認場面</desc><rect width="1000" height="560" rx="32" fill="#e2ebf7"/><polygon points="0,231 100,122 200,144 300,140 400,143 500,177 600,152 700,145 800,142 900,163 1000,192 1000,350 0,350" fill="#283f66" opacity=".22"/><path d="M0 430 Q250 361 500 430 T1000 410 V560 H0Z" fill="#283f66" opacity=".18"/><path d="M60 500 C230 437 360 401 520 450 S780 339 940 390" fill="none" stroke="#b75d43" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#b75d43" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#b75d43" opacity=".55"/><g data-scene="transport"><rect x="330" y="305" width="340" height="130" rx="34" fill="#fff" stroke="#283f66" stroke-width="9"/><circle cx="410" cy="455" r="32" fill="#b75d43"/><circle cx="590" cy="455" r="32" fill="#b75d43"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#283f66">防災記録・避難所と指定緊急避難場所を家族メ</text></svg>