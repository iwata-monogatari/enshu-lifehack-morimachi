<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="253" data-scene-index="1"><title id="title">森町でハザードマップ改訂日を不動産資料へ記録するの挿絵1</title><desc id="desc">森町の山並み、道、ハザードマップ改訂日を不動産資料へ記録するで災害種別と地図の版・改訂日を混ぜないの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,156 100,245 200,236 300,237 400,129 500,125 600,191 700,241 800,193 900,147 1000,242 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 377 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 384 360 390 520 450 S780 406 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#d49a3a" opacity=".55"/><g data-scene="transport"><rect x="330" y="305" width="340" height="130" rx="34" fill="#fff" stroke="#173f36" stroke-width="9"/><circle cx="410" cy="455" r="32" fill="#d49a3a"/><circle cx="590" cy="455" r="32" fill="#d49a3a"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">防災・不・ハザードマップ改訂日を不動産資料</text></svg>