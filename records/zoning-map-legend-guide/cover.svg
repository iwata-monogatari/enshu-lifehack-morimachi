<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="241" data-scene-index="1"><title id="title">森町で都市計画図の色と凡例と境界線を順に読むの挿絵1</title><desc id="desc">森町の山並み、道、都市計画図の色と凡例と境界線を順に読むで対象地番と計画図の凡例を混ぜないの確認場面</desc><rect width="1000" height="560" rx="32" fill="#dcefe5"/><polygon points="0,247 100,199 200,124 300,219 400,169 500,133 600,157 700,204 800,202 900,188 1000,193 1000,350 0,350" fill="#173f36" opacity=".22"/><path d="M0 430 Q250 376 500 430 T1000 410 V560 H0Z" fill="#173f36" opacity=".18"/><path d="M60 500 C230 389 360 408 520 450 S780 343 940 390" fill="none" stroke="#d49a3a" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#d49a3a" opacity=".55"/><g data-scene="transport"><rect x="330" y="305" width="340" height="130" rx="34" fill="#fff" stroke="#173f36" stroke-width="9"/><circle cx="410" cy="455" r="32" fill="#d49a3a"/><circle cx="590" cy="455" r="32" fill="#d49a3a"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#173f36">都市計画・都市計画図の色と凡例と境界線を順</text></svg>