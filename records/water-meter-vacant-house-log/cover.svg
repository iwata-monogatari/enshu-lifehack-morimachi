<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="231" data-scene-index="1"><title id="title">森町で水道検針票の使用量変化を空き家管理記録にするの挿絵1</title><desc id="desc">森町の山並み、道、水道検針票の使用量変化を空き家管理記録にするで使用者名義とお客さま番号を混ぜないの確認場面</desc><rect width="1000" height="560" rx="32" fill="#f4e4c8"/><polygon points="0,250 100,150 200,127 300,147 400,127 500,138 600,187 700,245 800,138 900,146 1000,188 1000,350 0,350" fill="#5a3827" opacity=".22"/><path d="M0 430 Q250 391 500 430 T1000 410 V560 H0Z" fill="#5a3827" opacity=".18"/><path d="M60 500 C230 438 360 412 520 450 S780 403 940 390" fill="none" stroke="#4f7b57" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#4f7b57" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#4f7b57" opacity=".55"/><g data-scene="land"><path d="M285 460 390 270l110 105 105-155 120 240Z" fill="#fff" stroke="#5a3827" stroke-width="9"/><path d="M500 375v100" stroke="#4f7b57" stroke-width="18"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#5a3827">水道・空・水道検針票の使用量変化を空き家管</text></svg>