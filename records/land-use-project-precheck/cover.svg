<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="242" data-scene-index="1"><title id="title">森町で土地利用事業の対象面積と事前相談記録を整理するの挿絵1</title><desc id="desc">森町の山並み、道、土地利用事業の対象面積と事前相談記録を整理するで対象地番と計画図の凡例を混ぜないの確認場面</desc><rect width="1000" height="560" rx="32" fill="#e2ebf7"/><polygon points="0,208 100,143 200,198 300,225 400,208 500,234 600,231 700,222 800,244 900,234 1000,152 1000,350 0,350" fill="#283f66" opacity=".22"/><path d="M0 430 Q250 347 500 430 T1000 410 V560 H0Z" fill="#283f66" opacity=".18"/><path d="M60 500 C230 402 360 422 520 450 S780 399 940 390" fill="none" stroke="#b75d43" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#b75d43" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#b75d43" opacity=".55"/><g data-scene="people"><circle cx="430" cy="290" r="42" fill="#b75d43"/><circle cx="570" cy="290" r="42" fill="#fff" stroke="#283f66" stroke-width="8"/><path d="M355 475q75-155 150 0M495 475q75-155 150 0" fill="none" stroke="#283f66" stroke-width="18"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#283f66">土地利用・土地利用事業の対象面積と事前相談</text></svg>