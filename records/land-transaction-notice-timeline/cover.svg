<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="245" data-scene-index="1"><title id="title">森町で国土利用計画の土地取引届出を契約日から逆算するの挿絵1</title><desc id="desc">森町の山並み、道、国土利用計画の土地取引届出を契約日から逆算するで対象地番と計画図の凡例を混ぜないの確認場面</desc><rect width="1000" height="560" rx="32" fill="#e2ebf7"/><polygon points="0,192 100,190 200,234 300,232 400,152 500,235 600,132 700,148 800,248 900,211 1000,138 1000,350 0,350" fill="#283f66" opacity=".22"/><path d="M0 430 Q250 337 500 430 T1000 410 V560 H0Z" fill="#283f66" opacity=".18"/><path d="M60 500 C230 365 360 422 520 450 S780 350 940 390" fill="none" stroke="#b75d43" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#b75d43" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#b75d43" opacity=".55"/><circle cx="244" cy="264" r="18" fill="#b75d43" opacity=".55"/><circle cx="311" cy="180" r="21" fill="#b75d43" opacity=".55"/><circle cx="378" cy="222" r="12" fill="#b75d43" opacity=".55"/><g data-scene="document"><rect x="360" y="250" width="260" height="180" rx="18" fill="#fff" stroke="#283f66" stroke-width="8"/><path d="M395 305h190M395 345h150M395 385h175" stroke="#283f66" stroke-width="10" opacity=".55"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#283f66">土地取引・国土利用計画の土地取引届出を契約</text></svg>