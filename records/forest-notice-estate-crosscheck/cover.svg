<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="296" data-scene-index="1"><title id="title">森町で森林取得届の対象地番を相続財産目録と照合するの挿絵1</title><desc id="desc">森町の山並み、道、森林取得届の対象地番を相続財産目録と照合するで山林の地番と取得原因・課税年度を混ぜないの確認場面</desc><rect width="1000" height="560" rx="32" fill="#e2ebf7"/><polygon points="0,210 100,241 200,154 300,134 400,178 500,140 600,223 700,219 800,225 900,153 1000,151 1000,350 0,350" fill="#283f66" opacity=".22"/><path d="M0 430 Q250 399 500 430 T1000 410 V560 H0Z" fill="#283f66" opacity=".18"/><path d="M60 500 C230 426 360 428 520 450 S780 425 940 390" fill="none" stroke="#b75d43" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#b75d43" opacity=".55"/><g data-scene="people"><circle cx="430" cy="290" r="42" fill="#b75d43"/><circle cx="570" cy="290" r="42" fill="#fff" stroke="#283f66" stroke-width="8"/><path d="M355 475q75-155 150 0M495 475q75-155 150 0" fill="none" stroke="#283f66" stroke-width="18"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#283f66">森林・相・森林取得届の対象地番を相続財産目</text></svg>