<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="297" data-scene-index="1"><title id="title">森町で山林の入口・作業道・境界目印を写真地図にするの挿絵1</title><desc id="desc">森町の山並み、道、山林の入口・作業道・境界目印を写真地図にするで山林の地番と取得原因・課税年度を混ぜないの確認場面</desc><rect width="1000" height="560" rx="32" fill="#f4e4c8"/><polygon points="0,172 100,132 200,160 300,140 400,186 500,189 600,202 700,122 800,205 900,201 1000,127 1000,350 0,350" fill="#5a3827" opacity=".22"/><path d="M0 430 Q250 368 500 430 T1000 410 V560 H0Z" fill="#5a3827" opacity=".18"/><path d="M60 500 C230 354 360 446 520 450 S780 394 940 390" fill="none" stroke="#4f7b57" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#4f7b57" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#4f7b57" opacity=".55"/><g data-scene="land"><path d="M285 460 390 270l110 105 105-155 120 240Z" fill="#fff" stroke="#5a3827" stroke-width="9"/><path d="M500 375v100" stroke="#4f7b57" stroke-width="18"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#5a3827">山林管理・山林の入口・作業道・境界目印を写</text></svg>