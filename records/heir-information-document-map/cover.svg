<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="230" data-scene-index="1"><title id="title">森町で法定相続情報一覧図と町への提出書類を分けて管理するの挿絵1</title><desc id="desc">森町の山並み、道、法定相続情報一覧図と町への提出書類を分けて管理するで故人名義と対象手続きを混ぜないの確認場面</desc><rect width="1000" height="560" rx="32" fill="#e2ebf7"/><polygon points="0,195 100,128 200,148 300,143 400,181 500,123 600,175 700,126 800,126 900,222 1000,121 1000,350 0,350" fill="#283f66" opacity=".22"/><path d="M0 430 Q250 350 500 430 T1000 410 V560 H0Z" fill="#283f66" opacity=".18"/><path d="M60 500 C230 428 360 439 520 450 S780 352 940 390" fill="none" stroke="#b75d43" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#b75d43" opacity=".55"/><g data-scene="people"><circle cx="430" cy="290" r="42" fill="#b75d43"/><circle cx="570" cy="290" r="42" fill="#fff" stroke="#283f66" stroke-width="8"/><path d="M355 475q75-155 150 0M495 475q75-155 150 0" fill="none" stroke="#283f66" stroke-width="18"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#283f66">相続書類・法定相続情報一覧図と町への提出書</text></svg>