<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial" data-topic-id="142" data-scene-index="2"><title id="title">森町で相続した山林の場所を地番から探す資料順の挿絵2</title><desc id="desc">森町の山並み、道、届出制度の解説ではなく、地番・登記事項・森林資料を照合して場所を探したい人が集める資料の確認場面</desc><rect width="1000" height="560" rx="32" fill="#f4e4c8"/><polygon points="0,210 100,220 200,244 300,231 400,173 500,137 600,121 700,144 800,241 900,213 1000,164 1000,350 0,350" fill="#5a3827" opacity=".22"/><path d="M0 430 Q250 376 500 430 T1000 410 V560 H0Z" fill="#5a3827" opacity=".18"/><path d="M60 500 C230 358 360 418 520 450 S780 379 940 390" fill="none" stroke="#4f7b57" stroke-width="24" stroke-linecap="round"/><circle cx="110" cy="180" r="12" fill="#4f7b57" opacity=".55"/><circle cx="177" cy="222" r="15" fill="#4f7b57" opacity=".55"/><g data-scene="document"><rect x="360" y="250" width="260" height="180" rx="18" fill="#fff" stroke="#5a3827" stroke-width="8"/><path d="M395 305h190M395 345h150M395 385h175" stroke="#5a3827" stroke-width="10" opacity=".55"/></g><text x="500" y="72" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#5a3827">相続・死亡日、通知日、申請日を混同しな</text></svg>