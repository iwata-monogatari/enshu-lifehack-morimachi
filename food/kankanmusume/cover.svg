<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">森町の朝のとうもろこし畑と甘々娘</title><desc id="d">朝露が残る森町のとうもろこし畑で、生産者が甘々娘を一本ずつ確認し、直売所へ運ぶ情景の編集挿絵</desc><rect width="1000" height="560" fill="#fff4cb"/><circle cx="825" cy="95" r="55" fill="#f3bd4c"/><path d="M0 185Q180 55 350 175T690 155T1000 175V0H0z" fill="#b8d7ac"/><path d="M0 560V285Q170 235 350 285T700 270T1000 300V560Z" fill="#6fa95e"/><g stroke="#315b48" stroke-width="7" fill="none"><path d="M140 490V250m145 240V225m145 265V245m145 245V220m145 270V250"/></g><g fill="#f4cc48" stroke="#315b48" stroke-width="4"><ellipse cx="170" cy="340" rx="28" ry="65"/><ellipse cx="315" cy="315" rx="28" ry="65"/><ellipse cx="460" cy="340" rx="28" ry="65"/><ellipse cx="605" cy="315" rx="28" ry="65"/><ellipse cx="750" cy="345" rx="28" ry="65"/></g><g fill="#e6ad76" stroke="#315b48" stroke-width="4"><circle cx="860" cy="290" r="35"/><path d="M820 330h80l25 150H795z"/></g><text x="55" y="95" font-family="sans-serif" font-size="43" font-weight="800" fill="#29483b">森町の甘々娘を、確かめて買う</text><text x="55" y="145" font-family="sans-serif" font-size="25" font-weight="700" fill="#476355">販売日は畑と販売者の案内で変わります</text></svg>
