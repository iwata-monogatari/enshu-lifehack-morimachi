<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">甘々娘を買いに行く前の確認順序</title><desc id="d">家族がスマートフォンで販売者の当日案内を確認し、保冷バッグと現金を準備して森町の直売所へ向かう編集挿絵</desc><rect width="1000" height="560" fill="#eef6ed"/><path d="M70 445C250 280 380 430 520 280S790 315 930 145" fill="none" stroke="#d3ae70" stroke-width="60"/><g fill="#fff" stroke="#315b48" stroke-width="5"><rect x="55" y="345" width="210" height="125" rx="18"/><rect x="390" y="230" width="220" height="125" rx="18"/><rect x="735" y="85" width="210" height="125" rx="18"/></g><g font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#29483b"><text x="160" y="390">当日の販売を</text><text x="160" y="425">販売者へ確認</text><text x="500" y="275">保冷・支払・</text><text x="500" y="310">持ち帰り準備</text><text x="840" y="130">案内に従い</text><text x="840" y="165">安全に購入</text><text x="500" y="525">早朝・価格・在庫を過去情報で決めない</text></g></svg>
