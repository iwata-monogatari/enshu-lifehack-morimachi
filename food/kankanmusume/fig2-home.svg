<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">甘々娘を持ち帰って保存する台所</title><desc id="d">森町で購入した甘々娘を家族が本数ごとに分け、当日食べる分、冷蔵する分、加熱して保存する分を台所で整理する編集挿絵</desc><rect width="1000" height="560" fill="#fff7e2"/><rect x="65" y="315" width="870" height="160" rx="18" fill="#d6aa77"/><g fill="#f1c647" stroke="#315b48" stroke-width="4"><ellipse cx="185" cy="300" rx="32" ry="86"/><ellipse cx="275" cy="300" rx="32" ry="86"/><ellipse cx="455" cy="300" rx="32" ry="86"/><ellipse cx="545" cy="300" rx="32" ry="86"/><ellipse cx="725" cy="300" rx="32" ry="86"/><ellipse cx="815" cy="300" rx="32" ry="86"/></g><g fill="#fff" stroke="#315b48" stroke-width="4"><rect x="105" y="85" width="250" height="85" rx="12"/><rect x="375" y="85" width="250" height="85" rx="12"/><rect x="645" y="85" width="250" height="85" rx="12"/></g><g font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#29483b"><text x="230" y="138">今日食べる</text><text x="500" y="138">冷蔵する</text><text x="770" y="138">加熱・保存</text><text x="500" y="530">購入量を先に決め、帰宅後すぐに扱う</text></g></svg>
