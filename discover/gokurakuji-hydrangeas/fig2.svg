<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">極楽寺訪問前の四枚確認カード</title><desc id="desc">花の状態だけでは出発条件がそろいません。四枚の情報を同じ年の公式で確認します。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f4b942"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#183f35">極楽寺訪問前の四枚確認カード</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#dcebdd" stroke="#183f35" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183f35">撮影日</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#dcebdd" stroke="#183f35" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183f35">開園・受付</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#dcebdd" stroke="#183f35" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183f35">当年料金</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#dcebdd" stroke="#183f35" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183f35">駐車・往復交通</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183f35">静岡県森町で確認する順番を整理した編集図解</text></svg>