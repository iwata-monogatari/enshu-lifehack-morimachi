<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">自転車出発前の八項目点検ホイール</title><desc id="desc">自転車の車輪を模した円へ、ヘルメット、保険、タイヤ、ブレーキ、灯火、反射器材、荷物、天候・経路を配置する固有チェック図です。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f4b942"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#183f35">自転車出発前の八項目点検ホイール</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#dcebdd" stroke="#183f35" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183f35">頭に合うヘルメット</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#dcebdd" stroke="#183f35" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183f35">家族を含む補償範囲</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#dcebdd" stroke="#183f35" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183f35">触って行う車体点検</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#dcebdd" stroke="#183f35" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183f35">夜間灯火と反射</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183f35">静岡県森町で確認する順番を整理した編集図解</text></svg>