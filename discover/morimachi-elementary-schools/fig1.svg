<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">森町 小学校の確認図1</title><desc id="desc">候補住所の番地確認から、学校教育課照会、物件契約、住民生活課転入、教育委員会の転入学通知、指定校提出までを時系列にしたSVG。指定校変更は審査がある別枝として描く。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f4b942"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#183f35">森町 小学校の確認図1</text><g><circle cx="160" cy="250" r="68" fill="#dcebdd" stroke="#183f35" stroke-width="5"/><text x="160" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183f35">森町 小学校</text><path d="M230 250h82" stroke="#f4b942" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="380" cy="250" r="68" fill="#dcebdd" stroke="#183f35" stroke-width="5"/><text x="380" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183f35">森町 小学校 学区</text><path d="M230 250h82" stroke="#f4b942" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="600" cy="250" r="68" fill="#dcebdd" stroke="#183f35" stroke-width="5"/><text x="600" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183f35">森町 通学区域</text><path d="M230 250h82" stroke="#f4b942" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="820" cy="250" r="68" fill="#dcebdd" stroke="#183f35" stroke-width="5"/><text x="820" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183f35">公式情報を再確認</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183f35">静岡県森町で確認する順番を整理した編集図解</text></svg>