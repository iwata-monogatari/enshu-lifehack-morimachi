<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">本人更新と代理人更新の分岐図</title><desc id="desc">森町役場へ本人が行く場合と、照会書兼回答書を封かんして代理人が行く場合を分け、更新翌営業日以降のコンビニ交付確認まで示します。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f4b942"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#183f35">本人更新と代理人更新の分岐図</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#dcebdd" stroke="#183f35" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183f35">本人はカードと通知書</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#dcebdd" stroke="#183f35" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183f35">代理人は封かん書類</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#dcebdd" stroke="#183f35" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183f35">森町役場の現行窓口</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#dcebdd" stroke="#183f35" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#183f35">利用再開はサービス別</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183f35">静岡県森町で確認する順番を整理した編集図解</text></svg>