<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">森町 ごみ 分別の確認図1</title><desc id="desc">住所と建物名から、町内会・集合住宅、利用集積所、当年度カレンダー、品目別容器へ四段階で進み、隣地区への誤持込みを止める固有SVG。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d6a84b"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#3d315b">森町 ごみ 分別の確認図1</text><g><circle cx="160" cy="250" r="68" fill="#e7e0f2" stroke="#3d315b" stroke-width="5"/><text x="160" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3d315b">森町 ごみ 分別</text><path d="M230 250h82" stroke="#d6a84b" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="380" cy="250" r="68" fill="#e7e0f2" stroke="#3d315b" stroke-width="5"/><text x="380" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3d315b">森町 ごみ 収集日</text><path d="M230 250h82" stroke="#d6a84b" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="600" cy="250" r="68" fill="#e7e0f2" stroke="#3d315b" stroke-width="5"/><text x="600" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3d315b">森町 粗大ごみ</text><path d="M230 250h82" stroke="#d6a84b" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="820" cy="250" r="68" fill="#e7e0f2" stroke="#3d315b" stroke-width="5"/><text x="820" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3d315b">公式情報を再確認</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#3d315b">静岡県森町で確認する順番を整理した編集図解</text></svg>