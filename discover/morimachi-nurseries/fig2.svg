<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">森町 保育園の確認図2</title><desc id="desc">六月から八月の見学、九月から十月の一斉募集、書類補正、利用調整、内定、正式決定、ならし保育を横につなぎ、途中入園・転入・不成立の分岐を別色で示すSVG。空き表示は保証でない注意も配置する。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d9654f"/></marker></defs><rect width="960" height="560" rx="24" fill="#fff8f0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#24504a">森町 保育園の確認図2</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#d7eee7" stroke="#24504a" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24504a">森町 保育園</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#d7eee7" stroke="#24504a" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24504a">森町 こども園</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#d7eee7" stroke="#24504a" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24504a">森町 保育園 入園</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#d7eee7" stroke="#24504a" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24504a">公式情報を再確認</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#24504a">静岡県森町で確認する順番を整理した編集図解</text></svg>