<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">森町の家族4人・平日昼の分散行動マップ</title><desc id="desc">森地区の自宅、町外の勤務先、一宮地区の学校、天方地区の通所先から、各自が安全を確保し、無理に自宅へ集まらず伝言を残す流れを示します。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d9654f"/></marker></defs><rect width="960" height="560" rx="24" fill="#fff8f0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#24504a">森町の家族4人・平日昼の分散行動マップ</text><g><circle cx="160" cy="250" r="68" fill="#d7eee7" stroke="#24504a" stroke-width="5"/><text x="160" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#24504a">その場で安全確保</text><path d="M230 250h82" stroke="#d9654f" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="380" cy="250" r="68" fill="#d7eee7" stroke="#24504a" stroke-width="5"/><text x="380" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#24504a">第一集合候補</text><path d="M230 250h82" stroke="#d9654f" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="600" cy="250" r="68" fill="#d7eee7" stroke="#24504a" stroke-width="5"/><text x="600" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#24504a">第二集合候補</text><path d="M230 250h82" stroke="#d9654f" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="820" cy="250" r="68" fill="#d7eee7" stroke="#24504a" stroke-width="5"/><text x="820" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#24504a">危険なら帰宅しない</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#24504a">静岡県森町で確認する順番を整理した編集図解</text></svg>