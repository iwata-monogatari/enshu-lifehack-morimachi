<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">乳児・幼児・小学生で変える横丁の一品</title><desc id="desc">乳児は授乳、幼児は小皿、小学生は二つまでを起点に、食べ切れる量を選びます。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#77966d"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf2"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#4a3428">乳児・幼児・小学生で変える横丁の一品</text><g><circle cx="160" cy="250" r="68" fill="#efe3ce" stroke="#4a3428" stroke-width="5"/><text x="160" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4a3428">乳児 授乳と持参食</text><path d="M230 250h82" stroke="#77966d" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="380" cy="250" r="68" fill="#efe3ce" stroke="#4a3428" stroke-width="5"/><text x="380" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4a3428">幼児 小皿から開始</text><path d="M230 250h82" stroke="#77966d" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="600" cy="250" r="68" fill="#efe3ce" stroke="#4a3428" stroke-width="5"/><text x="600" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4a3428">小学生 二つまで選択</text><path d="M230 250h82" stroke="#77966d" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="820" cy="250" r="68" fill="#efe3ce" stroke="#4a3428" stroke-width="5"/><text x="820" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4a3428">追加は食後に判断</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4a3428">静岡県森町で確認する順番を整理した編集図解</text></svg>