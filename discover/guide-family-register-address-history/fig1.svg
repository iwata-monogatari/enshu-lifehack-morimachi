<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">本籍の切替で附票が分かれる住所年表</title><desc id="desc">婚姻、転籍、戸籍改製を境に附票を三つへ分け、旧住所から現住所までを時系列で接続します。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d6a84b"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#3d315b">本籍の切替で附票が分かれる住所年表</text><g><circle cx="160" cy="250" r="68" fill="#e7e0f2" stroke="#3d315b" stroke-width="5"/><text x="160" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3d315b">旧本籍の除附票</text><path d="M230 250h82" stroke="#d6a84b" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="380" cy="250" r="68" fill="#e7e0f2" stroke="#3d315b" stroke-width="5"/><text x="380" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3d315b">婚姻後の附票</text><path d="M230 250h82" stroke="#d6a84b" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="600" cy="250" r="68" fill="#e7e0f2" stroke="#3d315b" stroke-width="5"/><text x="600" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3d315b">転籍後の附票</text><path d="M230 250h82" stroke="#d6a84b" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="820" cy="250" r="68" fill="#e7e0f2" stroke="#3d315b" stroke-width="5"/><text x="820" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3d315b">住所を連続させる</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#3d315b">静岡県森町で確認する順番を整理した編集図解</text></svg>