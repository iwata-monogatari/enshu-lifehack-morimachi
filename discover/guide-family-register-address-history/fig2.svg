<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">登記簿上住所から現在住所までの証明ルート</title><desc id="desc">登記簿の旧住所を起点に、現在附票、除附票、住民票除票、代替資料を順に照合する判断図です。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e87d4c"/></marker></defs><rect width="960" height="560" rx="24" fill="#fff9f2"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#29465b">登記簿上住所から現在住所までの証明ルート</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#dceaf1" stroke="#29465b" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#29465b">登記簿の旧住所</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#dceaf1" stroke="#29465b" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#29465b">現在附票</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#dceaf1" stroke="#29465b" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#29465b">切れ目を補う</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#dceaf1" stroke="#29465b" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#29465b">法務局へ確認</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#29465b">静岡県森町で確認する順番を整理した編集図解</text></svg>