<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">静岡県森町のランチ総合ガイド｜和食、季節料理、町なか散策を組み合わせるの表紙</title><desc id="desc">登録有形文化財の遠州森駅を左端、秋葉街道の本町を中央、柏屋と町なかの和菓子店を右へ置き、列車で着いた親子と杖を持つ高齢者が、予約時刻、昼食、短い町歩き、帰りの列車へ進む情景を描く。山並み、茶畑、連子格子の建物を背景にし、距離の数字を断定しない。を、遠州森町の山並みと川を背景に描いた編集イラスト。</desc>
