<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">静岡県森町・ことまち横丁総合ガイド｜食べ歩き、お茶、小國神社参拝を一度に楽しむの表紙</title><desc id="desc">同じ一宮3956-1のエリアを、左の駐車場、中央のことまち横丁、右奥の小國神社参道と社叢で一続きに描く。横丁には茶缶、わらび餅、かりん糖、湯呑みを持つ家族を置き、参拝前は手荷物を少なく、帰りに土産を受け取る往復動線を二色の道で示す。森町の山並み、杉檜の杜、宮川を背景に入れ、文字カードの羅列にしない。を、遠州森町の山並みと川を背景に描いた編集イラスト。</desc>
