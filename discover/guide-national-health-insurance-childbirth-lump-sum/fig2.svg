<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">出産前から差額申請までの確認線</title><desc id="desc">加入保険と施設方式の確認、合意文書、出産、領収・明細の照合、50万円との差額申請を時系列で示します。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d6a84b"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#3d315b">出産前から差額申請までの確認線</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">出産時の保険者</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">合意文書を保管</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">明細で代理受取額</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">翌日から二年以内</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#3d315b">静岡県森町で確認する順番を整理した編集図解</text></svg>