<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">ワンストップか確定申告かの確認分岐</title><desc id="desc">寄付時の選択を固定せず、年末と申告前に条件を再確認します。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#77966d"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf2"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#4a3428">ワンストップか確定申告かの確認分岐</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">確定申告予定</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">寄付先自治体数</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">期限・受付</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">住所氏名変更</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4a3428">静岡県森町で確認する順番を整理した編集図解</text></svg>