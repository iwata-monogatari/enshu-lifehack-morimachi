<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">コテージ・バンガロー・テント区画の選択表</title><desc id="desc">家型・小屋型・テント型の三列に、夜間トイレ、調理、雨、荷物、子どもの条件を並べる。未掲載設備は電話確認の空欄として表現する。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#77966d"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf2"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#4a3428">コテージ・バンガロー・テント区画の選択表</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">アクティ森 キャンプ</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">コテージ アクティ</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">吉川キャンプ場 カワセミの里</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">公式情報を再確認</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4a3428">静岡県森町で確認する順番を整理した編集図解</text></svg>