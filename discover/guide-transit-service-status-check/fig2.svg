<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">遅延発生から帰路再設計までの分岐路</title><desc id="desc">遅延表示を起点に、待機、次便、家族送迎、予定変更へ道が分かれ、各道の先に勤務先・学校・家族への連絡札を置いた図解です。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#77966d"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf2"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#4a3428">遅延発生から帰路再設計までの分岐路</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">現在地と更新時刻</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">帰り便を再確認</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">連絡先へ共有</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">次の確認時刻</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4a3428">静岡県森町で確認する順番を整理した編集図解</text></svg>