<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">森町 和菓子の確認図2</title><desc id="desc">駅を始点と終点にした輪状の簡略図へ、町歩き、第一店、予約品を受け取る第二店を配置する。箱を持つ区間だけ色を濃くし、期限の短い品を最後に買う順番と売り切れ時の帰駅判断を示す記事固有SVG。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d9654f"/></marker></defs><rect width="960" height="560" rx="24" fill="#fff8f0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#24504a">森町 和菓子の確認図2</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#d7eee7" stroke="#24504a" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24504a">森町 和菓子</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#d7eee7" stroke="#24504a" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24504a">森町 栗蒸し羊羹</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#d7eee7" stroke="#24504a" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24504a">森町 梅衣</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#d7eee7" stroke="#24504a" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24504a">公式情報を再確認</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#24504a">静岡県森町で確認する順番を整理した編集図解</text></svg>