<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">アレルギー対応六場面盤</title><desc id="desc">本人を中心に、給食、授業、運動、行事、放課後、緊急時を配置し、保護者・医師・学校の情報源を線で結ぶ記事固有図解です。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d6a84b"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#3d315b">アレルギー対応六場面盤</text><g><circle cx="160" cy="250" r="68" fill="#e7e0f2" stroke="#3d315b" stroke-width="5"/><text x="160" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3d315b">給食</text><path d="M230 250h82" stroke="#d6a84b" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="380" cy="250" r="68" fill="#e7e0f2" stroke="#3d315b" stroke-width="5"/><text x="380" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3d315b">食品を扱う授業</text><path d="M230 250h82" stroke="#d6a84b" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="600" cy="250" r="68" fill="#e7e0f2" stroke="#3d315b" stroke-width="5"/><text x="600" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3d315b">運動</text><path d="M230 250h82" stroke="#d6a84b" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="820" cy="250" r="68" fill="#e7e0f2" stroke="#3d315b" stroke-width="5"/><text x="820" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#3d315b">校外行事</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#3d315b">静岡県森町で確認する順番を整理した編集図解</text></svg>