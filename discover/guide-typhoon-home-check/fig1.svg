<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">台風前に森町の家の四方向を点検する情景図</title><desc id="desc">家族が地上から屋根・窓・雨どいを見て、庭とベランダの飛散物を屋内へ移す場面です。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#77966d"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf2"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#4a3428">台風前に森町の家の四方向を点検する情景図</text><g><circle cx="160" cy="250" r="68" fill="#efe3ce" stroke="#4a3428" stroke-width="5"/><text x="160" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4a3428">地上から確認</text><path d="M230 250h82" stroke="#77966d" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="380" cy="250" r="68" fill="#efe3ce" stroke="#4a3428" stroke-width="5"/><text x="380" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4a3428">飛散物を収納</text><path d="M230 250h82" stroke="#77966d" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="600" cy="250" r="68" fill="#efe3ce" stroke="#4a3428" stroke-width="5"/><text x="600" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4a3428">窓と雨戸</text><path d="M230 250h82" stroke="#77966d" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="820" cy="250" r="68" fill="#efe3ce" stroke="#4a3428" stroke-width="5"/><text x="820" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#4a3428">排水を確保</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4a3428">静岡県森町で確認する順番を整理した編集図解</text></svg>