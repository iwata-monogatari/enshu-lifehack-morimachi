<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">祈祷条件を四つに分ける受付前の確認図</title><desc id="desc">予約の扱い、受付場所と時間、初穂料、祭儀時間を別々に最新確認し、家族の退出時刻へ直接足しません。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e87d4c"/></marker></defs><rect width="960" height="560" rx="24" fill="#fff9f2"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#29465b">祈祷条件を四つに分ける受付前の確認図</text><g><circle cx="160" cy="250" r="68" fill="#dceaf1" stroke="#29465b" stroke-width="5"/><text x="160" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#29465b">予約の扱い</text><path d="M230 250h82" stroke="#e87d4c" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="380" cy="250" r="68" fill="#dceaf1" stroke="#29465b" stroke-width="5"/><text x="380" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#29465b">受付場所と時間</text><path d="M230 250h82" stroke="#e87d4c" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="600" cy="250" r="68" fill="#dceaf1" stroke="#29465b" stroke-width="5"/><text x="600" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#29465b">初穂料を再確認</text><path d="M230 250h82" stroke="#e87d4c" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="820" cy="250" r="68" fill="#dceaf1" stroke="#29465b" stroke-width="5"/><text x="820" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#29465b">祭儀と待ちを分離</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#29465b">静岡県森町で確認する順番を整理した編集図解</text></svg>