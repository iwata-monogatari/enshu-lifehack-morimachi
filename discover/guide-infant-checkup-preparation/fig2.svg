<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">案内到着から結果保管までの七日前準備</title><desc id="desc">対象日確認、問診、持参物、当日受付、結果保管を時系列にし、欠席・転入・急な症状の分岐を示します。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d6a84b"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#3d315b">案内到着から結果保管までの七日前準備</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">7日前 日程</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">3日前 問診</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">前日 持参物</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">翌日 結果保管</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#3d315b">静岡県森町で確認する順番を整理した編集図解</text></svg>