<title id="title">静岡県森町の文化財を調べて訪ねる｜指定区分・公開可否・保存配慮の手引きの表紙</title><desc id="desc">縦軸に指定主体と登録、横軸に建造物、祭礼・舞楽、史跡・所蔵品、天然記念物を置く。各セルへ公開確認先、見学日、触れない対象を短く示し、指定区分だけで公開方法を決められないことを示す記事固有SVG。を、遠州森町の山並みと川を背景に描いた編集イラスト。</desc>
