<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">森町で屋外の火を扱う前の四つの確認図</title><desc id="desc">野外焼却、たき火、火入れ、消防への届出を四つの別の箱に分け、町・消防への確認と当日の中止判断へつなげます。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e87d4c"/></marker></defs><rect width="960" height="560" rx="24" fill="#fff9f2"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#29465b">森町で屋外の火を扱う前の四つの確認図</text><g><circle cx="160" cy="250" r="68" fill="#dceaf1" stroke="#29465b" stroke-width="5"/><text x="160" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#29465b">野外焼却は原則禁止</text><path d="M230 250h82" stroke="#e87d4c" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="380" cy="250" r="68" fill="#dceaf1" stroke="#29465b" stroke-width="5"/><text x="380" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#29465b">たき火の条件</text><path d="M230 250h82" stroke="#e87d4c" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="600" cy="250" r="68" fill="#dceaf1" stroke="#29465b" stroke-width="5"/><text x="600" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#29465b">火入れ許可</text><path d="M230 250h82" stroke="#e87d4c" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="820" cy="250" r="68" fill="#dceaf1" stroke="#29465b" stroke-width="5"/><text x="820" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#29465b">消防への届出</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#29465b">静岡県森町で確認する順番を整理した編集図解</text></svg>