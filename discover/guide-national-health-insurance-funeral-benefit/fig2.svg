<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">死亡後の手続と葬祭費の位置</title><desc id="desc">死亡届から葬儀を経て、森町国保の葬祭費請求、審査、5万円の振込確認へ進む流れを、別手続との分岐を含めて示します。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#77966d"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf2"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#4a3428">死亡後の手続と葬祭費の位置</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">死亡届は別手続</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">葬祭資料を保管</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">二年以内に請求</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#efe3ce" stroke="#4a3428" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#4a3428">決定後に口座振込</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#4a3428">静岡県森町で確認する順番を整理した編集図解</text></svg>