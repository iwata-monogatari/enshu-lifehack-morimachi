<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">王道型と町歩き・季節型を選ぶ二本の旅程</title><desc id="desc">初日の参拝と二日目の体験、または町歩きと花の一方を選びます。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f4b942"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#183f35">王道型と町歩き・季節型を選ぶ二本の旅程</text><g><circle cx="160" cy="250" r="68" fill="#dcebdd" stroke="#183f35" stroke-width="5"/><text x="160" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183f35">王道型 参拝から体験</text><path d="M230 250h82" stroke="#f4b942" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="380" cy="250" r="68" fill="#dcebdd" stroke="#183f35" stroke-width="5"/><text x="380" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183f35">滞在型 町歩きから花</text><path d="M230 250h82" stroke="#f4b942" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="600" cy="250" r="68" fill="#dcebdd" stroke="#183f35" stroke-width="5"/><text x="600" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183f35">宿で夜を整える</text><path d="M230 250h82" stroke="#f4b942" stroke-width="10" marker-end="url(#a)"/></g><g><circle cx="820" cy="250" r="68" fill="#dcebdd" stroke="#183f35" stroke-width="5"/><text x="820" y="257" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183f35">一方だけ選ぶ</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#183f35">静岡県森町で確認する順番を整理した編集図解</text></svg>