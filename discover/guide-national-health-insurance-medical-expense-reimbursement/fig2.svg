<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">支払先から申請・決定までの返金経路</title><desc id="desc">医療機関での後日精算を最初に確認し、精算できない場合は森町国保へ申請、審査、決定通知へ進む道筋を示す図。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#e87d4c"/></marker></defs><rect width="960" height="560" rx="24" fill="#fff9f2"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#29465b">支払先から申請・決定までの返金経路</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#dceaf1" stroke="#29465b" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#29465b">後日精算</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#dceaf1" stroke="#29465b" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#29465b">必要書類</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#dceaf1" stroke="#29465b" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#29465b">国保の審査</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#dceaf1" stroke="#29465b" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#29465b">決定通知</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#29465b">静岡県森町で確認する順番を整理した編集図解</text></svg>