<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">連絡不能時に危険へ入らない分岐図</title><desc id="desc">再試行、第二担当、地域集約、緊急通報へ段階を上げ、倒壊・浸水・土砂・火災があれば訪問を中止する流れを描きます。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d6a84b"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#3d315b">連絡不能時に危険へ入らない分岐図</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">時刻を決めて再試行</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">第二担当へ</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">地域で重複確認</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">危険なら近づかず通報</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#3d315b">静岡県森町で確認する順番を整理した編集図解</text></svg>