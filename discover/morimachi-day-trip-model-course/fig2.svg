<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">半日から一日へ伸ばす判断</title><desc id="desc">主目的、食事、帰路を確保し、同じ地区内の一項目だけを追加します。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d9654f"/></marker></defs><rect width="960" height="560" rx="24" fill="#fff8f0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#24504a">半日から一日へ伸ばす判断</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#d7eee7" stroke="#24504a" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24504a">主目的を守る</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#d7eee7" stroke="#24504a" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24504a">食事と休憩</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#d7eee7" stroke="#24504a" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24504a">帰りを先に確認</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#d7eee7" stroke="#24504a" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#24504a">雨・混雑は短縮</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#24504a">静岡県森町で確認する順番を整理した編集図解</text></svg>