<svg xmlns="http://www.w3.org/2000/svg" data-illustration="mori-editorial" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">森町文化会館 ミキホールの確認図2</title><desc id="desc">会館を中央に、共有駐車場270台、森町病院前駅徒歩約1分、遠州森駅徒歩約10分、バス確認を四方向へ配置する。満車、運休、終演延長から次便・送迎へ切り替える矢印を示す記事固有SVG。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#d6a84b"/></marker></defs><rect width="960" height="560" rx="24" fill="#fffaf0"/><text x="480" y="72" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#3d315b">森町文化会館 ミキホールの確認図2</text><g><rect x="80" y="175" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">森町文化会館 ミキホール</text></g><g><rect x="550" y="175" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">森町文化会館 座席表</text></g><g><rect x="80" y="330" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="280" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">森町文化会館 駐車場</text></g><g><rect x="550" y="330" width="400" height="110" rx="18" fill="#e7e0f2" stroke="#3d315b" stroke-width="4"/><text x="750" y="240" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#3d315b">公式情報を再確認</text></g><text x="480" y="520" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#3d315b">静岡県森町で確認する順番を整理した編集図解</text></svg>