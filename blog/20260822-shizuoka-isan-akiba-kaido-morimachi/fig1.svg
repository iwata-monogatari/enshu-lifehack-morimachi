<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="sia1Title sia1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="sia1Title">静岡県森町の旧街道沿いに立つ秋葉山常夜灯と鞘堂を横から描いたイラスト</title>
  <desc id="sia1Desc">中央に切妻屋根の木造の鞘堂があり、その内側に瓦づくりの常夜灯が納まって灯明がともっています。鞘堂の脇には幟が一本立ち、手前では年配の住民が布を持って台座を拭き、その隣で子どもが油の容器を持っています。左側には旧街道の商家の並びと旅籠の看板が続きます。右側には山へ向かう坂道があり、笠をかぶった参詣者の後ろ姿が小さく描かれています。背景には段になった茶畑、杉林、遠州の山並みが連なっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="sia1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6d6e6"/><stop offset="1" stop-color="#f0ece0"/>
    </linearGradient>
    <linearGradient id="sia1Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#87a1b6"/><stop offset="1" stop-color="#b3c5cd"/>
    </linearGradient>
    <radialGradient id="sia1Flame" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#f2b544" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="158" fill="url(#sia1Sky)"/>
  <path fill="url(#sia1Far)" d="M0 100 L98 38 L196 100 L304 30 L412 100 L524 28 L632 100 L742 38 L848 100 L948 42 L1000 82 L1000 146 L0 146 Z"/>

  <path fill="#7fae57" d="M0 158 C 220 150, 440 172, 660 160 C 770 154, 866 164, 1000 158 L1000 198 L0 204 Z"/>
  <g stroke="#5d8840" stroke-width="4" opacity="0.85" fill="none">
    <path d="M0 168 C 220 160, 440 182, 660 170 C 770 164, 866 174, 1000 168"/>
    <path d="M0 184 C 220 176, 440 198, 660 186 C 770 180, 866 190, 1000 184"/>
  </g>
  <g fill="#3f6b52">
    <path d="M8 202 l15 -54 l15 54 z"/><path d="M40 202 l12 -44 l12 44 z"/>
    <path d="M948 202 l15 -52 l15 52 z"/><path d="M920 202 l12 -42 l12 42 z"/>
  </g>
  <path fill="#e0e8d4" d="M0 200 L1000 194 L1000 560 L0 560 Z"/>

  <!-- 旧街道の路面 -->
  <path fill="#cdc0a5" d="M0 448 L1000 396 L1000 470 L0 528 Z"/>
  <g stroke="#bcae91" stroke-width="4" fill="none" opacity="0.8">
    <path d="M0 476 L1000 424"/>
  </g>

  <!-- 左：商家の並びと旅籠 -->
  <g>
    <path d="M-10 300 L110 258 L230 300 Z" fill="#6f5f4c"/>
    <rect x="6" y="300" width="208" height="130" fill="#efe9dc" stroke="#b6ad9c" stroke-width="4"/>
    <g fill="#8a6a44">
      <rect x="24" y="318" width="52" height="60"/><rect x="92" y="318" width="52" height="60"/>
      <rect x="160" y="318" width="42" height="60"/>
    </g>
    <rect x="6" y="386" width="208" height="14" fill="#8a6a44"/>
    <rect x="30" y="404" width="86" height="34" rx="4" fill="#fdf8ea" stroke="#8a6a44" stroke-width="4"/>
    <text x="42" y="430" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="22" font-weight="bold" fill="#6b5233">旅籠</text>
    <path d="M96 258 L124 258 L124 236 L96 236 Z" fill="#8a6a44"/>
  </g>

  <!-- 中央：鞘堂と常夜灯 -->
  <g>
    <!-- 屋根 -->
    <path d="M356 268 L500 202 L644 268 Z" fill="#6b6154"/>
    <path d="M372 264 L500 210 L628 264 Z" fill="#8a8073"/>
    <path d="M356 268 L644 268 L644 282 L356 282 Z" fill="#5d5449"/>
    <!-- 柱 -->
    <rect x="380" y="282" width="20" height="176" fill="#8a6a44"/>
    <rect x="600" y="282" width="20" height="176" fill="#8a6a44"/>
    <rect x="368" y="452" width="264" height="18" fill="#6f5a3f"/>
    <!-- 内部の光 -->
    <ellipse cx="500" cy="360" rx="120" ry="100" fill="url(#sia1Flame)"/>
    <!-- 常夜灯（瓦製） -->
    <rect x="452" y="416" width="96" height="36" fill="#9b8f7c" stroke="#6f6455" stroke-width="4"/>
    <rect x="466" y="376" width="68" height="42" fill="#b0a48f" stroke="#6f6455" stroke-width="4"/>
    <rect x="458" y="336" width="84" height="42" fill="#f4e3b4" stroke="#a08d55" stroke-width="4"/>
    <path d="M500 348 C 490 362, 510 362, 500 348 Z" fill="#e8893f"/>
    <path d="M500 342 l10 22 l-20 0 z" fill="#f2b544"/>
    <path d="M442 336 L558 336 L570 314 L430 314 Z" fill="#8a8073"/>
    <path d="M492 314 L508 314 L508 300 L492 300 Z" fill="#6b6154"/>
  </g>

  <!-- 幟 -->
  <g>
    <rect x="664" y="252" width="10" height="216" fill="#8a6a44"/>
    <path d="M674 258 L742 258 L742 396 L674 396 Z" fill="#ffffff" stroke="#b8443a" stroke-width="4"/>
    <g fill="#b8443a">
      <rect x="700" y="278" width="18" height="18"/><rect x="700" y="308" width="18" height="18"/>
      <rect x="700" y="338" width="18" height="18"/>
    </g>
  </g>

  <!-- 手前：住民と子ども -->
  <g>
    <circle cx="286" cy="392" r="22" fill="#f0d8bd" stroke="#c8a888" stroke-width="3"/>
    <path d="M264 386 L308 386 L304 372 L268 372 Z" fill="#9aa5a3"/>
    <path d="M258 414 L314 414 L322 494 L250 494 Z" fill="#5f7f8e"/>
    <path d="M314 428 L364 448" stroke="#f0d8bd" stroke-width="14" stroke-linecap="round"/>
    <rect x="356" y="436" width="34" height="24" rx="4" fill="#e8e2d2" stroke="#a8a08c" stroke-width="3"/>
  </g>
  <g>
    <circle cx="212" cy="440" r="17" fill="#f0d8bd" stroke="#c8a888" stroke-width="3"/>
    <path d="M192 434 L232 434 L228 422 L196 422 Z" fill="#4b7a63"/>
    <path d="M190 458 L234 458 L240 512 L184 512 Z" fill="#7a9e6d"/>
    <rect x="230" y="472" width="30" height="40" rx="6" fill="#c8a45a" stroke="#8f7433" stroke-width="4"/>
  </g>

  <!-- 右：坂道と参詣者 -->
  <g>
    <path d="M790 396 C 860 372, 910 330, 962 292" stroke="#cdc0a5" stroke-width="26" fill="none" stroke-linecap="round"/>
    <g>
      <ellipse cx="862" cy="330" rx="22" ry="9" fill="#d8c79c" stroke="#a8956b" stroke-width="3"/>
      <path d="M848 336 L876 336 L882 386 L842 386 Z" fill="#6f7f8e"/>
      <rect x="884" y="322" width="6" height="66" fill="#8a6a44"/>
    </g>
    <g>
      <ellipse cx="922" cy="300" rx="18" ry="8" fill="#d8c79c" stroke="#a8956b" stroke-width="3"/>
      <path d="M910 306 L934 306 L938 346 L906 346 Z" fill="#8a7f6c"/>
    </g>
  </g>
</svg>
