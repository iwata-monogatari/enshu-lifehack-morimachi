    <rect x="446" y="306" width="122" height="40" rx="6" fill="#ffffff" stroke="#6c7b6f" stroke-width="4"/>
    <text x="507" y="333" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="17" font-weight="bold" fill="#33463a" text-anchor="middle">森林組合前</text>
    <path d="M470 372 h58 l-10 -12 h20 l18 20 l-18 20 h-20 l10 -12 h-58 Z" fill="#d6a83c"/>
