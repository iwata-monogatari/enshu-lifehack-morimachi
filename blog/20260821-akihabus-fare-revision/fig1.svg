<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="afr1Title afr1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="afr1Title">静岡県森町の山あいの家から袋井方面へバスで出る道筋のイラスト</title>
  <desc id="afr1Desc">左手前に瓦屋根の家と杖を持った高齢の女性が立ち、細い道に森町営バスの小型車両が停まっています。車体の上に二百円の札が下がります。中ほどには森林組合前と書かれた乗り継ぎのバス停があり、そこから右へ秋葉線の路線バスが袋井方面へ走ります。秋葉線のバスの上には七百十円の札があり、その手前に五百九十円と書かれた札が斜線で消されています。右奥には袋井の駅舎と病院の白い棟、店の看板が並びます。背景には遠州の山並み、杉林、段になった茶畑、川と橋が広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="afr1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd6ec"/><stop offset="1" stop-color="#e8f0e4"/>
    </linearGradient>
    <linearGradient id="afr1Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#88a6bb"/><stop offset="1" stop-color="#b4c9d1"/>
    </linearGradient>
    <linearGradient id="afr1Road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7b3ab"/><stop offset="1" stop-color="#9a968f"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="182" fill="url(#afr1Sky)"/>
  <path fill="url(#afr1Far)" d="M0 118 L96 50 L206 118 L322 42 L440 118 L558 40 L676 118 L792 52 L900 118 L1000 70 L1000 164 L0 164 Z"/>

