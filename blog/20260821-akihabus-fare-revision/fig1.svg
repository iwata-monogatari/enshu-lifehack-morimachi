    <rect x="812" y="228" width="156" height="72" rx="4" fill="#e3e7ea" stroke="#9fa9b0" stroke-width="3"/>
    <path d="M806 228 L890 196 L974 228 Z" fill="#b9c4cb" stroke="#8d979e" stroke-width="3"/>
    <g fill="#93b3c9"><rect x="828" y="246" width="22" height="26"/><rect x="862" y="246" width="22" height="26"/><rect x="896" y="246" width="22" height="26"/><rect x="930" y="246" width="22" height="26"/></g>
    <rect x="856" y="278" width="34" height="22" fill="#6f8391"/>
