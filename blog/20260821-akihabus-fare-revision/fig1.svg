    <rect x="744" y="398" width="34" height="34" rx="3" fill="#bcd4e0"/>
    <circle cx="662" cy="472" r="17" fill="#3b3f42"/><circle cx="662" cy="472" r="7" fill="#b9bdbe"/>
    <circle cx="782" cy="472" r="17" fill="#3b3f42"/><circle cx="782" cy="472" r="7" fill="#b9bdbe"/>
    <text x="718" y="458" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="14" font-weight="bold" fill="#3d5364" text-anchor="middle">秋葉線</text>
  </g>

  <!-- 運賃の札：590円に斜線、710円 -->
