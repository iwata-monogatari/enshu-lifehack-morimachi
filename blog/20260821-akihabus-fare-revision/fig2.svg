<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="afr2Title afr2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="afr2Title">森町の親のバス代を確かめる順番を一本の道として描いたイラスト</title>
  <desc id="afr2Desc">左端に瓦屋根の実家と、卓に置かれた財布と診察券があります。道を右へ進むと、一つ目の地点で乗るバス停と降りるバス停の名前を書いた二枚の札、二つ目の地点で受話器と電話番号の札、三つ目の地点で通院日に丸を付けた暦が並びます。四つ目で道が二つに分かれ、上の道は定期券の券面へ、下の道は現金と回数券へ続きます。二本の道は最後に役場の窓口で合流し、領収証と預金通帳を出して年三千円の助成を申請する場面が描かれています。背景には遠州の山並み、杉林、段になった茶畑が続いています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="afr2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2d9ea"/><stop offset="1" stop-color="#eaf1e6"/>
    </linearGradient>
    <linearGradient id="afr2Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#90aabc"/><stop offset="1" stop-color="#bbccd3"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#f0f4ec"/>
  <rect width="1000" height="150" fill="url(#afr2Sky)"/>
  <path fill="url(#afr2Far)" d="M0 96 L92 42 L192 96 L300 36 L410 96 L520 34 L630 96 L740 44 L846 96 L940 46 L1000 92 L1000 140 L0 140 Z"/>
  <path fill="#7fae57" d="M0 150 C 210 142, 430 164, 650 152 C 762 146, 860 156, 1000 150 L1000 184 L0 190 Z"/>
  <g stroke="#5d8840" stroke-width="4" opacity="0.85" fill="none">
    <path d="M0 160 C 210 152, 430 174, 650 162 C 762 156, 860 166, 1000 160"/>
    <path d="M0 174 C 210 166, 430 188, 650 176 C 762 170, 860 180, 1000 174"/>
  </g>
  <g fill="#3f6b52">
    <path d="M8 188 l15 -52 l15 52 z"/><path d="M40 188 l12 -42 l12 42 z"/>
    <path d="M952 188 l15 -50 l15 50 z"/><path d="M922 188 l12 -40 l12 40 z"/>
  </g>
  <path fill="#e2ead9" d="M0 186 L1000 180 L1000 560 L0 560 Z"/>

  <!-- 道：本線と、四つ目で分かれる二本 -->
  <path fill="#b9b5ac" d="M104 332 L648 332 L648 376 L104 376 Z"/>
  <path fill="#b9b5ac" d="M636 336 L892 258 L906 296 L648 374 Z"/>
  <path fill="#b9b5ac" d="M640 340 L900 388 L892 428 L634 380 Z"/>
  <g stroke="#f2f0e8" stroke-width="5" stroke-dasharray="26 22" fill="none">
    <path d="M116 354 L640 354"/>
    <path d="M652 344 L898 270"/>
    <path d="M652 364 L896 410"/>
  </g>

  <!-- 実家と卓 -->
  <g>
    <path d="M10 262 L78 226 L146 262 Z" fill="#7d6a58"/>
    <path d="M18 259 L78 226 L138 259 Z" fill="#a08a72"/>
    <rect x="24" y="262" width="108" height="66" fill="#f2eee4" stroke="#b6ad9c" stroke-width="3"/>
    <rect x="38" y="278" width="32" height="26" fill="#cfd9d6" stroke="#9aa5a3" stroke-width="3"/>
    <rect x="86" y="278" width="32" height="26" fill="#cfd9d6" stroke="#9aa5a3" stroke-width="3"/>
  </g>
  <g>
    <rect x="14" y="440" width="150" height="12" rx="3" fill="#c9a877"/>
    <rect x="28" y="452" width="10" height="44" fill="#b2915f"/><rect x="140" y="452" width="10" height="44" fill="#b2915f"/>
    <rect x="28" y="400" width="62" height="40" rx="6" fill="#8a6f52" stroke="#6d573f" stroke-width="3"/>
    <rect x="48" y="414" width="26" height="12" rx="2" fill="#d9c9a8"/>
    <rect x="98" y="408" width="60" height="32" rx="4" fill="#ffffff" stroke="#9aa5a3" stroke-width="3"/>
    <g stroke="#c3ccd1" stroke-width="4"><path d="M106 418 h44"/><path d="M106 428 h30"/></g>
  </g>

  <!-- 1 バス停の名前 -->
  <g>
    <rect x="206" y="260" width="8" height="76" fill="#9aa39b"/>
    <rect x="140" y="176" width="146" height="40" rx="6" fill="#ffffff" stroke="#6c7b6f" stroke-width="4"/>
    <text x="213" y="203" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="17" font-weight="bold" fill="#33463a" text-anchor="middle">乗るバス停</text>
    <rect x="140" y="222" width="146" height="40" rx="6" fill="#ffffff" stroke="#6c7b6f" stroke-width="4"/>
    <text x="213" y="249" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="17" font-weight="bold" fill="#33463a" text-anchor="middle">降りるバス停</text>
    <circle cx="210" cy="354" r="22" fill="#1f3e52"/>
    <text x="210" y="362" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  </g>

  <!-- 2 電話で区間の運賃を聞く -->
  <g>
    <rect x="386" y="278" width="8" height="58" fill="#9aa39b"/>
    <rect x="320" y="186" width="140" height="92" rx="10" fill="#ffffff" stroke="#3f5b6d" stroke-width="4"/>
    <path d="M344 226 q22 -26 44 0" fill="none" stroke="#c0453c" stroke-width="10" stroke-linecap="round"/>
    <circle cx="344" cy="228" r="9" fill="#c0453c"/><circle cx="388" cy="228" r="9" fill="#c0453c"/>
    <text x="390" y="266" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="16" font-weight="bold" fill="#3d5364" text-anchor="middle">区間の運賃</text>
    <circle cx="390" cy="354" r="22" fill="#1f3e52"/>
    <text x="390" y="362" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  </g>

  <!-- 3 暦で月の回数を数える -->
  <g>
    <rect x="541" y="292" width="8" height="44" fill="#9aa39b"/>
    <rect x="478" y="176" width="146" height="92" rx="6" fill="#ffffff" stroke="#8f978f" stroke-width="4"/>
    <rect x="478" y="176" width="146" height="20" rx="6" fill="#3f5b6d"/>
    <g fill="#d2dbe0">
      <rect x="490" y="206" width="20" height="14"/><rect x="518" y="206" width="20" height="14"/><rect x="546" y="206" width="20" height="14"/><rect x="574" y="206" width="20" height="14"/><rect x="598" y="206" width="18" height="14"/>
      <rect x="490" y="230" width="20" height="14"/><rect x="518" y="230" width="20" height="14"/><rect x="546" y="230" width="20" height="14"/><rect x="574" y="230" width="20" height="14"/><rect x="598" y="230" width="18" height="14"/>
    </g>
    <circle cx="528" cy="213" r="11" fill="none" stroke="#c0453c" stroke-width="4"/>
    <circle cx="584" cy="237" r="11" fill="none" stroke="#c0453c" stroke-width="4"/>
    <text x="551" y="288" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="16" font-weight="bold" fill="#3d5364" text-anchor="middle">月の回数</text>
    <circle cx="545" cy="354" r="22" fill="#1f3e52"/>
    <text x="545" y="362" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  </g>

  <!-- 4 分かれ道 -->
  <g>
    <circle cx="646" cy="354" r="24" fill="#c0453c"/>
    <text x="646" y="363" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  </g>

  <!-- 上の道：定期券 -->
  <g>
    <rect x="782" y="242" width="8" height="52" fill="#9aa39b"/>
    <rect x="700" y="182" width="172" height="62" rx="8" fill="#ffffff" stroke="#2f5f45" stroke-width="4"/>
    <rect x="700" y="182" width="172" height="18" rx="8" fill="#4d7f5f"/>
    <text x="786" y="228" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#2f5f45" text-anchor="middle">定期券</text>
  </g>

  <!-- 下の道：現金と回数券 -->
  <g>
    <rect x="656" y="404" width="180" height="64" rx="8" fill="#ffffff" stroke="#8a6f52" stroke-width="4"/>
    <rect x="672" y="420" width="54" height="34" rx="4" fill="#e5dcc4" stroke="#b09a70" stroke-width="3"/>
    <g stroke="#c3b28c" stroke-width="3"><path d="M682 432 h34"/><path d="M682 442 h22"/></g>
    <text x="786" y="446" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="20" font-weight="bold" fill="#7a613f" text-anchor="middle">現金</text>
  </g>

  <!-- 5 役場の窓口と年3,000円の助成 -->
  <g>
    <rect x="876" y="252" width="120" height="124" rx="6" fill="#f4f4ef" stroke="#98a09a" stroke-width="4"/>
    <path d="M872 252 L936 216 L1000 252 Z" fill="#7f8f96" stroke="#63727a" stroke-width="3"/>
    <rect x="890" y="284" width="94" height="34" rx="4" fill="#d5dee2" stroke="#96a3aa" stroke-width="3"/>
    <text x="937" y="308" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="15" font-weight="bold" fill="#33475a" text-anchor="middle">役場の窓口</text>
    <rect x="888" y="328" width="40" height="30" rx="3" fill="#ffffff" stroke="#a5aeb2" stroke-width="3"/>
    <rect x="940" y="328" width="40" height="30" rx="3" fill="#e8ddc2" stroke="#b6a077" stroke-width="3"/>
    <circle cx="868" cy="400" r="22" fill="#1f3e52"/>
    <text x="868" y="408" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <rect x="866" y="430" width="130" height="48" rx="8" fill="#ffffff" stroke="#d6a83c" stroke-width="5"/>
    <text x="931" y="462" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="20" font-weight="bold" fill="#8a6a1c" text-anchor="middle">年3,000円</text>
  </g>

  <!-- 下部の帯 -->
  <rect x="0" y="490" width="1000" height="70" fill="#1f3e52"/>
  <rect x="0" y="490" width="1000" height="5" fill="#d6a83c"/>
  <text x="26" y="522" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="19" font-weight="bold" fill="#ffffff">1から3は電話1本で埋まる。分かれ道は4つ目に来る</text>
  <text x="26" y="548" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="16" fill="#cddae2">区間名 → 改定後の運賃 → 月の回数 → 定期か現金か → 助成の申請</text>
</svg>
