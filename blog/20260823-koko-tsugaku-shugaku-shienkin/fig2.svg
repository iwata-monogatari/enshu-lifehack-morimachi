<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="kts2Title kts2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="kts2Title">森町から高校へ通うときの費用を確かめる順番を、四つの段として描いたイラスト</title>
  <desc id="kts2Desc">左端に学生服の生徒と通学かばんが立ち、そこから右上へ階段状の段が伸びます。一段目には就学支援金の申請画面を映した端末が置かれ、所得制限のない新制度を確かめる場面が描かれています。二段目には入学料と入学検定料の納付書があり、支援金の対象外である費用を書き出す様子が描かれます。三段目には定期券と路線バスの停留所標識が並び、通学の経路と定期代を調べる段になっています。四段目には役場の建物と5万円と書かれた封筒があり、森っ子就学応援金を申請する段として示されています。背景には段になった茶畑と杉林、遠州の山並みが続いています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="kts2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbdcea"/><stop offset="1" stop-color="#eef2e6"/>
    </linearGradient>
    <linearGradient id="kts2Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba7bb"/><stop offset="1" stop-color="#b7cad1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="112" fill="url(#kts2Sky)"/>
  <path fill="url(#kts2Far)" d="M0 76 L94 22 L188 76 L292 16 L398 76 L508 14 L614 76 L722 22 L828 76 L930 26 L1000 62 L1000 104 L0 104 Z"/>
  <path fill="#7fae57" d="M0 112 C 220 106, 440 124, 660 114 C 770 108, 866 116, 1000 112 L1000 142 L0 146 Z"/>
  <g stroke="#5d8840" stroke-width="3" opacity="0.85" fill="none">
    <path d="M0 122 C 220 116, 440 134, 660 124 C 770 118, 866 126, 1000 122"/>
  </g>
  <g fill="#3f6b52">
    <path d="M10 144 l13 -40 l13 40 z"/><path d="M42 144 l11 -32 l11 32 z"/>
    <path d="M948 142 l13 -38 l13 38 z"/><path d="M920 142 l11 -30 l11 30 z"/>
  </g>
  <path fill="#e2ead9" d="M0 142 L1000 136 L1000 560 L0 560 Z"/>

  <!-- 左：学生服の生徒とかばん -->
  <g>
    <circle cx="88" cy="368" r="22" fill="#e2c39a" stroke="#8b6f4e" stroke-width="3"/>
    <path fill="#33475a" d="M62 396 q26 -14 52 0 l7 66 l-66 0 z"/>
    <path fill="#c9d6de" d="M84 396 l4 30 l8 -30 z"/>
    <rect x="60" y="462" width="20" height="42" fill="#2c3a46"/>
    <rect x="96" y="462" width="20" height="42" fill="#2c3a46"/>
    <rect x="122" y="410" width="44" height="34" rx="5" fill="#9b7b4e" stroke="#6f5636" stroke-width="3"/>
    <path stroke="#6f5636" stroke-width="3" fill="none" d="M122 424 L166 424"/>
    <text x="46" y="534" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="19" font-weight="bold" fill="#3b4a52">進路を決める前に</text>
  </g>

  <g font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif">
    <!-- 1段目：就学支援金 -->
    <rect x="204" y="396" width="184" height="126" rx="10" fill="#ffffff" stroke="#2f7f5f" stroke-width="5"/>
    <g>
      <rect x="222" y="420" width="70" height="80" rx="6" fill="#eef4ee" stroke="#2f7f5f" stroke-width="3"/>
      <rect x="230" y="432" width="54" height="46" fill="#c4dfd0"/>
      <path stroke="#2f7f5f" stroke-width="4" fill="none" d="M238 456 l10 12 l20 -24"/>
      <circle cx="257" cy="490" r="5" fill="#2f7f5f"/>
    </g>
    <text x="304" y="436" font-size="27" font-weight="bold" fill="#22503f">①</text>
    <text x="302" y="468" font-size="18" fill="#31564a">支援金の</text>
    <text x="302" y="492" font-size="18" fill="#31564a">上限額</text>

    <!-- 2段目：納付書 -->
    <rect x="398" y="338" width="184" height="126" rx="10" fill="#ffffff" stroke="#b3392c" stroke-width="5"/>
    <g>
      <rect x="416" y="362" width="72" height="78" rx="3" fill="#fdf6f4" stroke="#b3392c" stroke-width="3"/>
      <g stroke="#c9756a" stroke-width="3" fill="none">
        <path d="M426 382 L478 382"/><path d="M426 398 L478 398"/><path d="M426 414 L458 414"/>
      </g>
      <rect x="424" y="422" width="42" height="12" fill="#e9b6ae"/>
    </g>
    <text x="498" y="378" font-size="27" font-weight="bold" fill="#a1332a">②</text>
    <text x="496" y="410" font-size="18" fill="#7a3b34">入学料と</text>
    <text x="496" y="434" font-size="18" fill="#7a3b34">検定料</text>

    <!-- 3段目：定期券とバス停 -->
    <rect x="592" y="280" width="184" height="126" rx="10" fill="#ffffff" stroke="#4e7f9c" stroke-width="5"/>
    <g>
      <rect x="610" y="316" width="76" height="46" rx="5" fill="#dfeaf1" stroke="#4d6c80" stroke-width="3"/>
      <rect x="618" y="326" width="44" height="10" fill="#8fb2c4"/>
      <path stroke="#4d6c80" stroke-width="3" fill="none" d="M618 346 L678 346"/>
      <rect x="638" y="368" width="8" height="34" fill="#6f7f88"/>
      <circle cx="642" cy="366" r="13" fill="#ffffff" stroke="#4d6c80" stroke-width="4"/>
    </g>
    <text x="698" y="320" font-size="27" font-weight="bold" fill="#2f6c8d">③</text>
    <text x="696" y="352" font-size="18" fill="#3c5c6d">経路と</text>
    <text x="696" y="376" font-size="18" fill="#3c5c6d">定期代</text>

    <!-- 4段目：役場と5万円 -->
    <rect x="786" y="212" width="190" height="136" rx="10" fill="#ffffff" stroke="#a5762a" stroke-width="5"/>
    <text x="802" y="254" font-size="27" font-weight="bold" fill="#7d5c12">④</text>
    <text x="846" y="246" font-size="18" fill="#6a5222">森っ子就学</text>
    <text x="846" y="270" font-size="18" fill="#6a5222">応援金 5万円</text>
    <g>
      <path fill="#8f9aa0" d="M804 300 l40 -22 l40 22 z"/>
      <rect x="812" y="300" width="64" height="38" fill="#dfe5e8" stroke="#7b8890" stroke-width="3"/>
      <rect x="836" y="316" width="18" height="22" fill="#8f9aa0"/>
      <rect x="898" y="298" width="66" height="42" rx="4" fill="#fff6df" stroke="#a5762a" stroke-width="4"/>
      <path stroke="#a5762a" stroke-width="3" fill="none" d="M898 300 L931 322 L964 300"/>
    </g>
  </g>

  <text x="204" y="548" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" fill="#4a5a50">③まで出してから志望校を並べると、比較が家計の言葉になる</text>
</svg>
