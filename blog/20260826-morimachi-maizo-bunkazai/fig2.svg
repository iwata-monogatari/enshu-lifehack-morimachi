<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="mz2title mz2desc">
<title id="mz2title">森町の土地を掘る前に確かめる五つの段</title>
<desc id="mz2desc">地番を確かめ、住宅地図に範囲を囲み、社会教育課へ照会し、試掘か着工かに分かれ、最後に工事着手の60日前を逆算する。</desc>
