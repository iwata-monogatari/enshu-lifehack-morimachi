<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial">
  <title id="title">相続前の対策あり23％と対策なし77％</title>
  <desc id="desc">相続で空き家を取得した全国推計世帯について、相続前の対策あり23％と対策なし77％を示し、複数回答の内訳を別に並べた図。</desc>
  <rect width="1000" height="560" fill="#eef6f3"/>
  <path d="M0 185 L135 86 L242 170 L385 54 L520 170 L665 82 L790 176 L910 104 L1000 170 V250 H0Z" fill="#789587"/>
  <path d="M0 210 Q190 170 375 205 T735 194 T1000 214 V285 H0Z" fill="#a9c787"/>
  <rect x="70" y="58" width="860" height="86" rx="16" fill="#fffdf5" stroke="#3f665f" stroke-width="4"/>
  <text x="500" y="97" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#254d49">相続で空き家を取得した世帯・全国拡大推計</text>
  <text x="500" y="128" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#526c66">N=742千世帯　国土交通省「令和6年空き家所有者実態調査結果」</text>
  <rect x="100" y="205" width="184" height="82" rx="10" fill="#d86945"/>
  <rect x="284" y="205" width="616" height="82" rx="10" fill="#d6ddd5"/>
  <text x="192" y="242" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">対策あり</text>
  <text x="192" y="272" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#fff">23.0％</text>
  <text x="592" y="242" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#334d48">対策なし</text>
  <text x="592" y="272" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#334d48">77.0％</text>
  <rect x="100" y="325" width="800" height="152" rx="16" fill="#fff" stroke="#9ab2a7" stroke-width="3"/>
  <text x="132" y="365" font-family="sans-serif" font-size="22" font-weight="700" fill="#31564f">対策ありの内訳（複数回答）</text>
  <text x="132" y="408" font-family="sans-serif" font-size="21" fill="#3f554f">被相続人との話し合い</text><text x="530" y="408" font-family="sans-serif" font-size="22" font-weight="700" fill="#c3593b">16.7％</text>
  <text x="132" y="447" font-family="sans-serif" font-size="20" fill="#3f554f">遺言の作成支援 1.8％　／　後見制度・家族信託 1.3％　／　その他 4.3％</text>
  <text x="500" y="526" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="700" fill="#244a46">23％は森町値でも「話し合った世帯」の割合でもない</text>
</svg>
