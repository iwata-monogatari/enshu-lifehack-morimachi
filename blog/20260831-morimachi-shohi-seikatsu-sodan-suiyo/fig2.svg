<text x="374" y="260" font-size="13" fill="#6b5c22">水曜 9:00-16:00</text>
<text x="374" y="280" font-size="13" fill="#6b5c22">相談員がいる日</text>
<text x="374" y="302" font-size="13" fill="#6b5c22">平日 8:30-17:15</text>
<text x="374" y="322" font-size="14" font-weight="bold" fill="#6b5c22">85-6319</text>
<text x="288" y="356" font-size="14" fill="#4a5a4b">水曜以外も町職員が受付</text>

