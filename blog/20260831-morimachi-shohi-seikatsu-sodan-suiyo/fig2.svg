<rect x="748" y="248" width="176" height="86" rx="4" fill="#e6dfcd" stroke="#b09a68" stroke-width="3"/>
<rect x="748" y="248" width="176" height="18" fill="#c9b98a"/>
<rect x="762" y="276" width="52" height="40" rx="2" fill="#ffffff" stroke="#b6ae95" stroke-width="3"/>
<rect x="822" y="276" width="40" height="40" rx="6" fill="#33404a" stroke="#1f2a31" stroke-width="3"/>
<rect x="828" y="282" width="28" height="28" rx="2" fill="#f4f7f8"/>
<rect x="870" y="276" width="42" height="40" rx="2" fill="#fdf6e4" stroke="#cfae3f" stroke-width="3"/>
<text x="874" y="302" font-size="12" fill="#8a6c1c">振込控</text>
<text x="744" y="356" font-size="14" fill="#4a5a4b">届いた日と電話した日を書く</text>
</g>

<rect x="0" y="400" width="1000" height="160" fill="#dfe8d2"/>
<text x="44" y="438" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="19" font-weight="bold" fill="#33503f">水曜まで待たなくていい。平日はいつでも受け付ける</text>
<g font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="16" fill="#4a5a4b">
<text x="44" y="472">・伝えるのは3つ。届いたものの種類、書かれていた金額、払ったか払っていないか</text>
<text x="44" y="502">・森町を管轄するのは袋井警察署（管轄区域は袋井市と周智郡）。掛川警察署ではない</text>
<text x="44" y="532">・全国の被害額は2026年1〜3月で937.9億円。前年同期より413.9億円増（警察庁）</text>
</g>
</svg>
