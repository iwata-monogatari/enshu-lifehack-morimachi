<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="sh2title sh2desc">
<title id="sh2title">森町で詐欺かもしれないと思ったときに動く順番</title>
<desc id="sh2desc">四つの場面が左から右へ一本の道でつながっている。一つ目は払わない・かけ直さない場面で、ハガキに書かれた電話番号に大きなバツ印が付いている。二つ目は森町役場へ電話する場面で、毎週水曜は相談員が九時から十六時、それ以外の平日は町職員が八時三十分から十七時十五分、電話番号は〇五三八の八五の六三一九と記されている。三つ目は袋井警察署または警察相談専用電話へ連絡する場面。四つ目は封筒と着信履歴と振込の控えを一つの箱にまとめ、日付を書き込む場面。背景には段になった茶畑と杉林の山並みが広がっている。</desc>
<defs>
<linearGradient id="sh2sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#d5e2ec"/><stop offset="1" stop-color="#eff2e9"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="url(#sh2sky)"/>
