<text x="84" y="266" font-size="13" fill="#7a6a4a">訴訟最終告知のお知らせ</text>
<rect x="84" y="278" width="120" height="26" rx="3" fill="#eef0e9" stroke="#c3c9cc" stroke-width="2"/>
<text x="92" y="297" font-size="14" fill="#6b7d85">03-0000-0000</text>
<g stroke="#c8452f" stroke-width="7" stroke-linecap="round">
<path d="M84 276 L204 306"/><path d="M204 276 L84 306"/>
</g>
<text x="60" y="356" font-size="14" fill="#a63b31">記載の番号にかけ直さない</text>

<rect x="272" y="196" width="212" height="166" rx="8" fill="#ffffff" stroke="#7d8f76" stroke-width="3"/>
<text x="288" y="224" font-size="17" font-weight="bold" fill="#1f3e52">2　森町役場へ電話</text>
<rect x="292" y="238" width="64" height="94" rx="10" fill="#4d7f9e" stroke="#31607d" stroke-width="3"/>
<rect x="300" y="250" width="48" height="52" rx="4" fill="#dfeaf2"/>
