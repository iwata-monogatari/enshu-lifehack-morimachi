<path d="M60 374 L940 374" stroke="#c9bfa3" stroke-width="14" stroke-linecap="round"/>
<g fill="#eceee4"><circle cx="270" cy="374" r="10"/><circle cx="500" cy="374" r="10"/><circle cx="730" cy="374" r="10"/></g>

