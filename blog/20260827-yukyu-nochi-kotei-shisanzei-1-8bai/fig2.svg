<text x="42" y="448" font-size="13" fill="#5a6a5c">課税明細書の畑の欄</text>
<text x="42" y="466" font-size="13" fill="#5a6a5c">地番・地目・面積</text>
</g>

<g font-family="'Meiryo','Hiragino Sans',sans-serif">
<circle cx="283" cy="268" r="26" fill="#1f3e52"/><text x="272" y="277" font-size="22" font-weight="bold" fill="#ffffff">2</text>
<rect x="219" y="312" width="128" height="92" rx="10" fill="#ffffff" stroke="#7d8f76" stroke-width="3"/>
<rect x="235" y="326" width="96" height="34" rx="4" fill="#eaf1e4"/>
<text x="240" y="349" font-size="13.5" font-weight="bold" fill="#1f3e52">農地管理係</text>
<path d="M249 378 q11 -14 27 -6 q16 8 30 -4" fill="none" stroke="#4f6f86" stroke-width="5"/>
<text x="219" y="428" font-size="14.5" font-weight="bold" fill="#33503f">区域を確かめる</text>
<text x="219" y="448" font-size="13" fill="#5a6a5c">農業振興地域内か</text>
<text x="219" y="466" font-size="13" fill="#5a6a5c">地番を伝えて聞く</text>
</g>

<g font-family="'Meiryo','Hiragino Sans',sans-serif">
<circle cx="460" cy="268" r="26" fill="#1f3e52"/><text x="449" y="277" font-size="22" font-weight="bold" fill="#ffffff">3</text>
<rect x="396" y="312" width="128" height="92" fill="#ffffff" stroke="#7d8f76" stroke-width="3"/>
