<text x="586" y="366" font-size="13" fill="#3f5c33">刈れば緑区分</text>
<text x="573" y="428" font-size="14.5" font-weight="bold" fill="#33503f">草を刈り続ける</text>
<text x="573" y="448" font-size="13" fill="#5a6a5c">決められない間も</text>
<text x="573" y="466" font-size="13" fill="#5a6a5c">緑8.8ha・黄8.7ha</text>
</g>

