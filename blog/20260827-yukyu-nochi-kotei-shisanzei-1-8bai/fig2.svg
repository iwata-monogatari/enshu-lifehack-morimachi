<text x="396" y="448" font-size="13" fill="#5a6a5c">農業委員会へ</text>
<text x="396" y="466" font-size="13" fill="#5a6a5c">勧告は行われない</text>
</g>

<g font-family="'Meiryo','Hiragino Sans',sans-serif">
