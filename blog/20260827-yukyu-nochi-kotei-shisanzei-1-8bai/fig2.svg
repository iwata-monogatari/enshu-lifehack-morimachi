<text x="900" y="356" font-size="14" font-weight="bold" fill="#33503f">10年貸せば</text>
<text x="900" y="378" font-size="14" font-weight="bold" fill="#33503f">3年 2分の1</text>
<text x="900" y="398" font-size="12" fill="#3f6b52">令和10年3月末まで</text>
<circle cx="866" cy="226" r="14" fill="#7d6a4a"/>
<text x="774" y="440" font-size="13.5" fill="#5a6a5c">分かれ目は、伝えたかどうか</text>
</g>

