<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="yk2title yk2desc">
<title id="yk2title">使っていない畑について今日できる四つの段と、罰と支援の秤</title>
<desc id="yk2desc">課税明細書で評価額を出し、農業振興地域内かを聞き、貸す意思を先に伝え、決められなければ草を刈り続ける四つの段と、課税強化と軽減措置を左右に載せた秤を描いた図。</desc>
<defs>
<linearGradient id="yk2sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#d4e5f0"/><stop offset="1" stop-color="#edf3e8"/>
</linearGradient>
</defs>
