  <g stroke="#6d8a3c" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M18 500 C 26 440, 20 400, 34 356"/><path d="M62 508 C 72 448, 64 408, 78 364"/>
    <path d="M108 500 C 116 442, 110 400, 124 358"/><path d="M154 508 C 164 446, 156 406, 170 362"/>
