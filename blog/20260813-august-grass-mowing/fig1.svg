    <path d="M292 494 C 300 436, 294 396, 308 352"/><path d="M338 502 C 348 442, 340 402, 354 358"/>
    <path d="M384 492 C 392 434, 386 394, 400 350"/><path d="M430 500 C 440 440, 432 400, 446 356"/>
  </g>
  <g stroke="#9cb862" stroke-width="5" fill="none" stroke-linecap="round">
