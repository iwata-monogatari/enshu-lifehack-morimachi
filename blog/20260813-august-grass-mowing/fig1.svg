    <rect x="486" y="452" width="216" height="42" rx="6" fill="#ffffff" stroke="#3e6b55" stroke-width="4"/>
    <text x="594" y="480" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f3e52" text-anchor="middle">空き家・空き地バンク</text>
  </g>
  <rect x="740" y="176" width="228" height="34" rx="7" fill="#ffffff" stroke="#3e6b55" stroke-width="3"/>
  <text x="854" y="199" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f3e52" text-anchor="middle">刈り終えた同じ土地</text>

