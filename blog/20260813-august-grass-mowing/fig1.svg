<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ag1Title ag1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="ag1Title">草の伸びた実家の畑と、刈り終えた直後の空き地を並べて描いたイラスト</title>
  <desc id="ag1Desc">奥に遠州の山並みと杉林、段になった茶畑が広がります。左には腰の高さまで草が伸びた畑があり、奥に傾いた物置が立ち、畦道が草に埋もれています。右には刈り終えた直後の空き地があり、刈った草が山に積まれ、軽トラックの荷台に草の袋が積まれています。境の畦には刈払機が立てかけられ、地面に手袋と水筒が置かれています。空き地の隅には空き家・空き地バンクと書かれた小さな看板があります。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="ag1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8ccdf"/><stop offset="1" stop-color="#eaf1e4"/>
    </linearGradient>
    <linearGradient id="ag1Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba9bc"/><stop offset="1" stop-color="#b6cbd2"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="170" fill="url(#ag1Sky)"/>
  <!-- 夏の日ざしと入道雲 -->
  <circle cx="112" cy="56" r="38" fill="#ffd664"/>
  <g fill="#ffffff">
    <circle cx="700" cy="72" r="38"/><circle cx="752" cy="50" r="46"/>
    <circle cx="808" cy="74" r="36"/><circle cx="756" cy="94" r="36"/>
  </g>
  <path fill="url(#ag1Far)" d="M0 116 L104 58 L214 114 L330 48 L450 114 L566 46 L682 114 L796 58 L902 114 L1000 74 L1000 160 L0 160 Z"/>
  <path fill="#7fae57" d="M0 176 C 230 166, 450 190, 670 178 C 770 172, 860 182, 1000 176 L1000 214 L0 220 Z"/>
