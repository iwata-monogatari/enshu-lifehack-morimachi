<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ag2Title ag2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="ag2Title">実家の草刈りを決める順番を、一本の道と三つの分かれ道として描いたイラスト</title>
  <desc id="ag2Desc">左端に草の伸びた畑と瓦屋根の実家があり、そこから右へ道が伸びます。最初の区間では敷地の図を広げ、毎回刈る場所と年一回でよい場所を色分けしています。次の区間ではカレンダーに年四回の印を付けています。三つ目の地点で道が三方向に分かれ、上の道は計量所と軽トラックへ続いて「10キロにつき163円」の札が、真ん中の道は刈草を受け入れるリサイクルセンターへ続いて「7時30分から18時・日祝休」の札が、下の道は空き家バンクの看板が立つ家へ続いて「清掃・支障木伐採 上限10万円」の札が立っています。奥には段になった茶畑と杉林、遠州の山並みが広がります。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="ag2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8d5e8"/><stop offset="1" stop-color="#ebf2e6"/>
    </linearGradient>
    <linearGradient id="ag2Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fadbe"/><stop offset="1" stop-color="#bacfd5"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="158" fill="url(#ag2Sky)"/>
  <path fill="url(#ag2Far)" d="M0 100 L96 46 L200 98 L312 38 L426 98 L540 36 L654 98 L766 46 L874 98 L1000 62 L1000 146 L0 146 Z"/>
  <path fill="#7fae57" d="M0 160 C 240 150, 460 174, 690 162 C 790 156, 880 166, 1000 160 L1000 196 L0 202 Z"/>
  <g stroke="#5f8a42" stroke-width="4" opacity="0.85" fill="none">
    <path d="M0 170 C 240 160, 460 184, 690 172 C 790 166, 880 176, 1000 170"/>
    <path d="M0 186 C 240 176, 460 200, 690 188 C 790 182, 880 192, 1000 186"/>
  </g>
  <g fill="#3f6b52">
    <path d="M6 200 l15 -52 l15 52 z"/><path d="M958 200 l15 -52 l15 52 z"/>
  </g>
  <path fill="#e0e9d7" d="M0 198 L1000 192 L1000 560 L0 560 Z"/>

  <!-- 道 -->
  <path d="M0 486 C 170 486, 292 462, 424 418 C 512 388, 572 354, 652 326"
        stroke="#c9c0a4" stroke-width="52" fill="none" stroke-linecap="round"/>
  <path d="M0 486 C 170 486, 292 462, 424 418 C 512 388, 572 354, 652 326"
        stroke="#e0d9c2" stroke-width="8" fill="none" stroke-dasharray="20 22"/>

  <!-- 左端：草の伸びた畑と実家 -->
  <g>
    <path fill="#8aa552" d="M0 204 L206 198 L200 384 L0 396 Z"/>
    <g stroke="#6d8a3c" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M14 388 C 22 344, 16 314, 30 282"/><path d="M56 392 C 64 348, 58 318, 72 286"/>
      <path d="M98 388 C 106 344, 100 314, 114 282"/><path d="M140 392 C 148 348, 142 318, 156 286"/>
      <path d="M182 386 C 190 342, 184 312, 198 280"/>
    </g>
    <path d="M96 292 L164 250 L232 292 Z" fill="#6f7c82"/>
    <path d="M110 292 L164 260 L218 292 Z" fill="#8b979b"/>
    <rect x="110" y="292" width="108" height="66" fill="#e9e3d3" stroke="#bdb49f" stroke-width="4"/>
    <rect x="126" y="308" width="34" height="40" fill="#4e5a5f" stroke="#948a72" stroke-width="3"/>
    <rect x="172" y="308" width="32" height="40" fill="#4e5a5f" stroke="#948a72" stroke-width="3"/>
  </g>

  <!-- 区間1：敷地の図を色分け -->
  <g>
    <rect x="28" y="410" width="248" height="86" rx="6" fill="#b98f5d" stroke="#8f6b3f" stroke-width="4"/>
    <rect x="44" y="398" width="216" height="88" rx="4" fill="#fbf8ee" stroke="#a89a7c" stroke-width="4"/>
    <g fill="#f0c862" stroke="#c8a03c" stroke-width="3">
      <rect x="58" y="412" width="86" height="34"/><rect x="58" y="452" width="60" height="26"/>
    </g>
    <g fill="#b7d8b0" stroke="#7fa878" stroke-width="3">
      <rect x="156" y="412" width="90" height="30"/><rect x="130" y="452" width="116" height="26"/>
    </g>
    <path d="M148 398 L148 486" stroke="#a89a7c" stroke-width="3" fill="none"/>
    <rect x="14" y="506" width="276" height="34" rx="7" fill="#ffffff" stroke="#3e6b55" stroke-width="3"/>
    <text x="152" y="529" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f3e52" text-anchor="middle">毎回刈る所と年一回の所</text>
  </g>

  <!-- 区間2：カレンダーに年四回の印 -->
  <g>
    <rect x="322" y="368" width="216" height="128" rx="6" fill="#ffffff" stroke="#8a949a" stroke-width="4" transform="rotate(-7 430 432)"/>
    <g transform="rotate(-7 430 432)">
      <rect x="322" y="368" width="216" height="26" fill="#3e6b55"/>
      <g stroke="#d3dade" stroke-width="3" fill="none">
        <path d="M376 394 L376 496 M430 394 L430 496 M484 394 L484 496"/>
        <path d="M322 428 L538 428 M322 462 L538 462"/>
      </g>
      <g fill="#c0563c">
        <circle cx="349" cy="411" r="10"/><circle cx="457" cy="445" r="10"/>
        <circle cx="403" cy="445" r="10"/><circle cx="511" cy="479" r="10"/>
      </g>
    </g>
    <rect x="316" y="510" width="240" height="34" rx="7" fill="#ffffff" stroke="#3e6b55" stroke-width="3"/>
    <text x="436" y="533" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f3e52" text-anchor="middle">年に何回、いつ刈るか</text>
  </g>

  <!-- 三方向の分かれ道 -->
  <g fill="none" stroke="#c9c0a4" stroke-width="32" stroke-linecap="round">
    <path d="M652 326 C 726 296, 800 258, 884 236"/>
    <path d="M652 326 C 738 328, 806 336, 890 344"/>
    <path d="M652 326 C 722 352, 786 400, 860 442"/>
  </g>

  <!-- 上：計量所と軽トラック -->
  <g>
    <rect x="800" y="182" width="80" height="52" fill="#eef0ec" stroke="#a8b0ac" stroke-width="4"/>
    <rect x="812" y="196" width="54" height="24" fill="#b6d3e0" stroke="#8aa8b6" stroke-width="3"/>
    <rect x="884" y="212" width="110" height="22" fill="#b4bcb8" stroke="#8e9793" stroke-width="4"/>
    <rect x="896" y="180" width="52" height="32" fill="#e6eae6" stroke="#9aa39f" stroke-width="4"/>
    <rect x="948" y="188" width="38" height="24" fill="#f0f3f0" stroke="#9aa39f" stroke-width="4"/>
    <rect x="902" y="164" width="30" height="18" rx="4" fill="#c8bf7e" stroke="#a29a5f" stroke-width="3"/>
    <rect x="792" y="240" width="204" height="30" rx="6" fill="#3e6b55"/>
    <text x="894" y="261" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">10キロにつき163円</text>
  </g>

  <!-- 中：リサイクルセンター -->
  <g>
    <path d="M760 344 L828 306 L896 344 Z" fill="#7f8b90"/>
    <rect x="772" y="344" width="112" height="58" fill="#eef0ec" stroke="#a8b0ac" stroke-width="4"/>
    <rect x="788" y="360" width="80" height="28" fill="#b6d3e0" stroke="#8aa8b6" stroke-width="3"/>
    <path d="M902 400 C 916 358, 950 348, 972 366 C 992 356, 1000 380, 998 400 Z"
          fill="#a8a04e" stroke="#877f36" stroke-width="4"/>
    <rect x="754" y="410" width="240" height="52" rx="6" fill="#3e6b55"/>
    <text x="874" y="432" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">7時30分から18時</text>
    <text x="874" y="452" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">日曜・祝日は休み</text>
  </g>

  <!-- 下：空き家バンクの家 -->
  <g>
    <path d="M604 470 L672 430 L740 470 Z" fill="#6f7c82"/>
    <rect x="616" y="470" width="112" height="60" fill="#e9e3d3" stroke="#bdb49f" stroke-width="4"/>
    <rect x="632" y="486" width="36" height="36" fill="#4e5a5f" stroke="#948a72" stroke-width="3"/>
    <rect x="684" y="486" width="30" height="36" fill="#b9ac91" stroke="#948a72" stroke-width="3"/>
    <path d="M760 540 L760 496" stroke="#9aa39f" stroke-width="8" fill="none"/>
    <rect x="746" y="470" width="248" height="52" rx="6" fill="#3e6b55"/>
    <text x="870" y="492" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">清掃・支障木伐採</text>
    <text x="870" y="512" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">上限10万円</text>
  </g>

  <rect x="576" y="228" width="200" height="34" rx="7" fill="#ffffff" stroke="#c0563c" stroke-width="3"/>
  <text x="676" y="251" font-family="sans-serif" font-size="17" font-weight="bold" fill="#c0563c" text-anchor="middle">分かれ道は三つ目</text>
</svg>
