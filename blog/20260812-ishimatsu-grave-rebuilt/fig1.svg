<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ig1Title ig1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="ig1Title">大洞院の門前に立つ石松の墓と、訪ねる人のいない山あいの墓地を並べて描いたイラスト</title>
  <desc id="ig1Desc">奥に遠州の山並みと杉林、段になった茶畑が広がります。左には杉木立に囲まれた寺の山門があり、その手前に角の丸く削れた墓石が立ち、手を合わせる人と線香の煙が描かれています。墓石のそばに「三代目」と書かれた小さな札が立っています。右には草の伸びた斜面の墓地があり、傾いた墓石と倒れた花立て、枯れた供花が並び、参る人はいません。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="ig1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6dced"/><stop offset="1" stop-color="#e9f1e4"/>
    </linearGradient>
    <linearGradient id="ig1Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba9bc"/><stop offset="1" stop-color="#b6cbd2"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="196" fill="url(#ig1Sky)"/>
  <path fill="url(#ig1Far)" d="M0 128 L106 66 L216 126 L332 54 L452 124 L568 50 L684 126 L798 64 L904 124 L1000 82 L1000 172 L0 172 Z"/>

  <!-- 茶畑 -->
  <path fill="#7fae57" d="M0 196 C 230 186, 450 210, 670 198 C 770 192, 860 202, 1000 196 L1000 240 L0 246 Z"/>
  <g stroke="#5f8a42" stroke-width="4" opacity="0.85" fill="none">
    <path d="M0 206 C 230 196, 450 220, 670 208 C 770 202, 860 212, 1000 206"/>
    <path d="M0 222 C 230 212, 450 236, 670 224 C 770 218, 860 228, 1000 222"/>
  </g>
  <path fill="#dfe8d6" d="M0 242 L1000 236 L1000 560 L0 560 Z"/>

  <!-- 左：杉木立 -->
  <g fill="#3f6b52">
    <path d="M20 300 l26 -104 l26 104 z"/><path d="M62 300 l22 -86 l22 86 z"/>
    <path d="M334 300 l24 -96 l24 96 z"/><path d="M376 300 l20 -78 l20 78 z"/>
  </g>
  <g fill="#335943">
    <path d="M32 300 l14 -62 l14 62 z"/><path d="M346 300 l14 -58 l14 58 z"/>
  </g>

  <!-- 山門 -->
  <g>
    <path d="M96 268 L242 208 L388 268 Z" fill="#5c4a3a"/>
    <path d="M120 268 L242 218 L364 268 Z" fill="#7a6450"/>
    <path d="M88 272 L396 272 L396 284 L88 284 Z" fill="#4a3c2f"/>
    <g fill="#6b5643">
      <rect x="130" y="284" width="22" height="112"/>
      <rect x="332" y="284" width="22" height="112"/>
    </g>
    <rect x="152" y="300" width="180" height="96" fill="#3c332a"/>
    <path d="M152 300 L332 300" stroke="#6b5643" stroke-width="8" fill="none"/>
    <rect x="196" y="316" width="92" height="80" fill="#2c261f"/>
  </g>

  <!-- 石松の墓（角が丸く削れた墓石） -->
  <g>
    <rect x="188" y="452" width="112" height="18" rx="3" fill="#b9bdb4" stroke="#93988e" stroke-width="3"/>
    <rect x="200" y="434" width="88" height="20" rx="3" fill="#c8ccc3" stroke="#93988e" stroke-width="3"/>
    <path d="M216 434 L216 380 q2 -14 8 -20 q10 -10 20 -10 l14 0 q12 2 14 14 l2 70 z" fill="#d5d8cf" stroke="#93988e" stroke-width="3"/>
    <path d="M216 412 q12 4 12 22" stroke="#bcc0b7" stroke-width="6" fill="none"/>
    <path d="M266 396 q10 6 8 24" stroke="#bcc0b7" stroke-width="6" fill="none"/>
    <!-- 線香の煙 -->
    <g stroke="#b7c3c8" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9">
      <path d="M310 452 C 322 430, 302 418, 314 396"/>
      <path d="M326 456 C 338 434, 318 422, 330 400"/>
    </g>
    <rect x="300" y="452" width="40" height="12" rx="3" fill="#8a7a5e"/>
    <!-- 三代目の札 -->
    <path d="M148 500 L148 452" stroke="#8a7a5e" stroke-width="5" fill="none"/>
    <rect x="102" y="424" width="92" height="30" rx="6" fill="#ffffff" stroke="#c0563c" stroke-width="3"/>
    <text x="148" y="445" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c0563c" text-anchor="middle">三代目</text>
  </g>

  <!-- 手を合わせる人 -->
  <g>
    <circle cx="384" cy="424" r="20" fill="#e8cdae" stroke="#c0a184" stroke-width="3"/>
    <path d="M364 420 q20 -22 40 0 q-2 -22 -20 -22 q-18 0 -20 22 z" fill="#4a4038"/>
    <path d="M362 456 q22 -12 44 0 l8 68 l-60 0 z" fill="#6e8fa6" stroke="#527389" stroke-width="3"/>
    <path d="M368 472 q16 -14 32 0" stroke="#e8cdae" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M378 462 l6 -14 l6 14 z" fill="#e8cdae" stroke="#c0a184" stroke-width="2"/>
  </g>

  <!-- 右：草の伸びた斜面の墓地 -->
  <g>
    <path d="M560 322 L1000 296 L1000 560 L560 560 Z" fill="#d5e0c9"/>
    <path d="M560 322 C 700 314, 860 302, 1000 296" stroke="#b9c9a8" stroke-width="5" fill="none"/>
    <!-- 段の土留め -->
    <g stroke="#bdb49f" stroke-width="6" fill="none">
      <path d="M566 402 L1000 384"/><path d="M572 478 L1000 458"/>
    </g>
    <!-- 傾いた墓石 -->
    <g>
      <rect x="596" y="352" width="72" height="14" rx="3" fill="#b9bdb4" stroke="#969a90" stroke-width="3"/>
      <path d="M612 352 L610 292 L652 290 L654 352 Z" fill="#cdd0c7" stroke="#969a90" stroke-width="3" transform="rotate(-7 632 322)"/>
    </g>
    <g>
      <rect x="712" y="342" width="70" height="14" rx="3" fill="#b9bdb4" stroke="#969a90" stroke-width="3"/>
      <path d="M728 342 L728 284 L768 284 L768 342 Z" fill="#cdd0c7" stroke="#969a90" stroke-width="3" transform="rotate(5 748 314)"/>
    </g>
    <g>
      <rect x="848" y="428" width="80" height="16" rx="3" fill="#b9bdb4" stroke="#969a90" stroke-width="3"/>
      <path d="M866 428 L862 358 L910 356 L914 428 Z" fill="#cdd0c7" stroke="#969a90" stroke-width="3" transform="rotate(-10 888 394)"/>
    </g>
    <g>
      <rect x="628" y="500" width="76" height="16" rx="3" fill="#b9bdb4" stroke="#969a90" stroke-width="3"/>
      <path d="M646 500 L644 436 L688 434 L690 500 Z" fill="#cdd0c7" stroke="#969a90" stroke-width="3" transform="rotate(6 667 468)"/>
    </g>
    <!-- 倒れた花立てと枯れた供花 -->
    <g>
      <rect x="742" y="492" width="46" height="18" rx="6" fill="#a9ada3" stroke="#83877e" stroke-width="3" transform="rotate(-18 765 501)"/>
      <g stroke="#a08a52" stroke-width="4" fill="none" stroke-linecap="round">
        <path d="M786 494 L822 480"/><path d="M788 502 L826 494"/><path d="M784 486 L814 466"/>
      </g>
    </g>
    <!-- 伸びた草 -->
    <g stroke="#8aa552" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M580 540 C 576 516, 588 506, 584 484"/>
      <path d="M700 548 C 696 524, 708 514, 704 492"/>
      <path d="M730 400 C 726 380, 736 372, 732 354"/>
      <path d="M812 380 C 808 360, 818 352, 814 334"/>
      <path d="M932 520 C 928 496, 940 486, 936 464"/>
      <path d="M960 534 C 956 510, 968 500, 964 478"/>
      <path d="M604 448 C 600 428, 610 420, 606 402"/>
    </g>
  </g>
</svg>
