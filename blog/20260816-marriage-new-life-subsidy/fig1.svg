  <g>
    <rect x="244" y="342" width="136" height="90" fill="#f1f4f2" stroke="#93a0a6" stroke-width="4"/>
    <path d="M244 342 L244 432 L200 432 L200 380 L222 342 Z" fill="#e2e8e8" stroke="#93a0a6" stroke-width="4"/>
