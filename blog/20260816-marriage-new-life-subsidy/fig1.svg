  <!-- 手前の帯 -->
  <g>
    <rect x="26" y="500" width="298" height="36" rx="6" fill="#ffffff" stroke="#1f3e52" stroke-width="4"/>
    <text x="175" y="525" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f3e52" text-anchor="middle">引越しは一日、領収書は半年</text>
  </g>
</svg>
