<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="mn1Title mn1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="mn1Title">森町で新生活を始める夫婦の、引越しの日と書類をまとめる日を並べて描いたイラスト</title>
<desc id="mn1Desc">左手では、生け垣のある瓦屋根の家の前に引越業者の小型トラックが止まり、作業の人が段ボールを抱えて降ろし、夫婦がそれを受け取っています。右手には縁側のような低い卓があり、その上に契約書と領収書の束、封筒、印鑑、通帳が広げられています。卓のそばの柱に月ごとの枠が並んだ暦が掛かり、七月の欄と二月の欄に赤い丸が付いています。奥には役場らしい建物と明かりのついた窓が見え、そこへ続く細い道があります。背景には太田川らしい流れと橋、段になった茶畑、杉木立、遠州の山並みが夏の空を背に広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="mn1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd8e6"/><stop offset="1" stop-color="#eff3e7"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#f2f4ea"/>
  <rect width="1000" height="150" fill="url(#mn1Sky)"/>
  <circle cx="906" cy="46" r="24" fill="#f6e6b4"/>
  <path fill="#9db4be" d="M0 104 L104 48 L212 104 L322 42 L440 104 L560 46 L676 104 L796 50 L906 104 L1000 64 L1000 146 L0 146 Z"/>
  <g fill="#3d6350">
    <path d="M14 150 l13 -44 l13 44 z"/><path d="M44 150 l11 -36 l11 36 z"/><path d="M70 150 l12 -40 l12 40 z"/>
    <path d="M912 150 l13 -44 l13 44 z"/><path d="M942 150 l14 -48 l14 48 z"/><path d="M972 150 l11 -36 l11 36 z"/>
  </g>

  <!-- 段になった茶畑 -->
  <path fill="#8fb469" d="M0 152 C 250 144, 470 168, 720 154 C 840 148, 920 160, 1000 152 L1000 202 L0 208 Z"/>
  <g stroke="#5f8543" stroke-width="5" opacity="0.9" fill="none">
    <path d="M0 166 C 250 158, 470 182, 720 168 C 840 162, 920 174, 1000 166"/>
    <path d="M0 182 C 250 174, 470 198, 720 184 C 840 178, 920 190, 1000 182"/>
    <path d="M0 198 C 250 190, 470 214, 720 200 C 840 194, 920 206, 1000 198"/>
  </g>

  <!-- 川と橋 -->
  <path fill="#a6cde2" d="M0 210 L1000 202 L1000 244 L0 254 Z"/>
  <g stroke="#e2f0f6" stroke-width="4" fill="none">
    <path d="M30 232 L250 226"/><path d="M720 224 L950 216"/>
  </g>
  <rect x="330" y="200" width="300" height="10" fill="#cfc7ae"/>
  <g fill="#b6ae95"><rect x="362" y="210" width="9" height="36"/><rect x="474" y="208" width="9" height="36"/><rect x="586" y="206" width="9" height="36"/></g>

  <rect x="0" y="248" width="1000" height="312" fill="#e6e9d9"/>

  <!-- 奥：役場と細い道 -->
  <g>
    <path d="M448 448 L486 326 L604 326 L636 448 Z" fill="#d5cdb2"/>
    <rect x="452" y="264" width="184" height="62" fill="#eceee6" stroke="#9aa196" stroke-width="4"/>
    <path d="M438 268 L544 226 L650 268 Z" fill="#7c8a90"/>
    <g fill="#f6d98f" stroke="#c9a94f" stroke-width="3">
      <rect x="468" y="282" width="34" height="26"/><rect x="586" y="282" width="34" height="26"/>
    </g>
    <rect x="516" y="282" width="56" height="44" fill="#d9c9a4" stroke="#a89571" stroke-width="3"/>
    <g stroke="#7c8a90" stroke-width="5"><path d="M488 226 L488 200 M600 226 L600 200"/></g>
    <rect x="462" y="176" width="164" height="28" rx="4" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="544" y="197" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3e52" text-anchor="middle">役場の窓口</text>
  </g>

  <!-- 左：家と生け垣 -->
  <g>
    <rect x="24" y="316" width="184" height="128" fill="#f4eee2" stroke="#a3997f" stroke-width="4"/>
    <path d="M6 320 L116 256 L226 320 Z" fill="#6a7a80"/>
    <rect x="6" y="320" width="220" height="12" fill="#55636a"/>
