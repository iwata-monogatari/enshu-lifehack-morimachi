    <g fill="#9aa6ac"><circle cx="238" cy="438" r="6"/><circle cx="348" cy="438" r="6"/></g>
  </g>

  <!-- 段ボールを運ぶ人 -->
  <g>
    <circle cx="410" cy="330" r="17" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M394 356 C 394 396, 398 420, 400 446 L426 446 C 430 420, 436 396, 434 356 Z" fill="#4f7c8f" stroke="#345a6b" stroke-width="3"/>
