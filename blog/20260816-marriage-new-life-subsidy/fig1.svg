    <rect x="140" y="372" width="46" height="72" fill="#c9b48c" stroke="#9c8763" stroke-width="3"/>
    <rect x="84" y="290" width="64" height="20" rx="3" fill="#fdfbf2" stroke="#b9b09a" stroke-width="3"/>
    <path d="M8 444 C 60 424, 128 424, 186 444 L186 468 L8 468 Z" fill="#6f9a58" stroke="#4f7440" stroke-width="3"/>
  </g>

