  </g>

  <!-- 右下：柱に掛けた暦 -->
  <g>
    <rect x="668" y="300" width="16" height="188" fill="#a68a5c"/>
    <rect x="948" y="300" width="16" height="188" fill="#a68a5c"/>
    <rect x="676" y="302" width="280" height="112" rx="5" fill="#fdfbf2" stroke="#8d8368" stroke-width="4"/>
    <rect x="676" y="302" width="280" height="30" rx="5" fill="#1f3e52"/>
    <text x="816" y="325" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">7月 に始まり 2月 に閉じる</text>
    <g stroke="#c3bda6" stroke-width="3">
      <path d="M676 360 L956 360 M676 388 L956 388"/>
      <path d="M723 332 L723 414 M770 332 L770 414 M816 332 L816 414 M863 332 L863 414 M910 332 L910 414"/>
    </g>
    <circle cx="700" cy="346" r="12" fill="none" stroke="#c0563c" stroke-width="4"/>
    <circle cx="932" cy="401" r="12" fill="none" stroke="#c0563c" stroke-width="4"/>
  </g>

  <!-- 右下：低い卓と書類 -->
  <g>
    <rect x="596" y="482" width="384" height="26" fill="#b98f5d"/>
    <rect x="596" y="508" width="384" height="10" fill="#9c7648"/>
    <rect x="618" y="518" width="16" height="42" fill="#9c7648"/>
    <rect x="942" y="518" width="16" height="42" fill="#9c7648"/>
    <!-- 契約書の束 -->
    <rect x="620" y="446" width="118" height="36" fill="#ffffff" stroke="#98a2a8" stroke-width="3"/>
    <rect x="628" y="434" width="118" height="36" fill="#f6f8f7" stroke="#98a2a8" stroke-width="3"/>
    <g stroke="#b8c1c6" stroke-width="3"><path d="M642 448 L730 448 M642 460 L706 460"/></g>
    <!-- 領収書 -->
    <rect x="762" y="452" width="76" height="30" fill="#fdf3d8" stroke="#c4ad6a" stroke-width="3"/>
    <rect x="770" y="440" width="76" height="30" fill="#fdf8e8" stroke="#c4ad6a" stroke-width="3"/>
    <g stroke="#c4ad6a" stroke-width="3"><path d="M782 456 L834 456"/></g>
    <!-- 封筒 -->
    <rect x="858" y="440" width="70" height="42" fill="#f0ece0" stroke="#a89b7c" stroke-width="3"/>
    <path d="M858 440 L893 464 L928 440" fill="none" stroke="#a89b7c" stroke-width="3"/>
    <!-- 印鑑と通帳 -->
    <rect x="938" y="446" width="20" height="36" rx="4" fill="#8d5f43" stroke="#6b4630" stroke-width="3"/>
    <circle cx="948" cy="440" r="9" fill="#c0563c" stroke="#8f3b28" stroke-width="3"/>
    <rect x="628" y="490" width="48" height="0" fill="none"/>
