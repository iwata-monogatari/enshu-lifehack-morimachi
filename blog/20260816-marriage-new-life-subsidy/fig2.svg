<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="mn2Title mn2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="mn2Title">結婚新生活支援補助金の申請までに確かめる順番を、一本の道すじとして描いたイラスト</title>
<desc id="mn2Desc">左端に婚姻届を持った夫婦が立つ役場の窓口があり、そこから右へ道が伸びています。最初の地点では、二人が講座の案内を持った職員から説明を受け、そばに受講証明書らしい紙が置かれています。次の地点では、二人が課税証明書と滞納がないことの証明書を窓口で受け取っています。三つ目の地点では、住まいの前で契約書と領収書を封筒にまとめ、引越業者の伝票を確かめています。四つ目の地点で道が二つに分かれ、上の道は年内に一度相談へ行く場面へ、下の道は書類がそろってから提出に行く場面へ続き、二つの道は合流して最後に申請書を手渡す場面になります。画面の下には七月一日から二月二十六日までの帯が伸びています。背景には遠州の山並みと杉木立、段になった茶畑が広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="mn2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcd8e6"/><stop offset="1" stop-color="#eff3e7"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#f2f4ea"/>
  <rect width="1000" height="140" fill="url(#mn2Sky)"/>
  <path fill="#9db4be" d="M0 96 L100 46 L206 96 L316 40 L432 96 L552 42 L668 96 L788 48 L898 96 L1000 60 L1000 136 L0 136 Z"/>
  <g fill="#3d6350">
    <path d="M16 140 l13 -44 l13 44 z"/><path d="M46 140 l11 -36 l11 36 z"/>
    <path d="M928 140 l13 -44 l13 44 z"/><path d="M958 140 l14 -48 l14 48 z"/>
  </g>
  <path fill="#8fb469" d="M0 142 C 240 134, 460 156, 700 144 C 830 138, 910 150, 1000 142 L1000 178 L0 184 Z"/>
  <g stroke="#6a8f4c" stroke-width="4" opacity="0.8" fill="none">
    <path d="M0 156 C 240 148, 460 170, 700 158 C 830 152, 910 164, 1000 156"/>
    <path d="M0 172 C 240 164, 460 186, 700 174 C 830 168, 910 180, 1000 172"/>
  </g>
  <path fill="#e6e9d9" d="M0 180 L1000 174 L1000 560 L0 560 Z"/>

  <!-- 道すじ -->
  <g stroke="#cbc2a6" stroke-width="26" fill="none" stroke-linecap="round">
    <path d="M150 386 L610 386"/>
    <path d="M610 386 L690 292 L818 292"/>
    <path d="M610 386 L690 476 L818 476"/>
    <path d="M818 292 L888 382"/>
    <path d="M818 476 L888 382"/>
  </g>
  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-dasharray="16 14" opacity="0.85">
    <path d="M150 386 L610 386"/><path d="M610 386 L690 292 L818 292"/><path d="M610 386 L690 476 L818 476"/>
  </g>

  <!-- 出発点：婚姻届を出す窓口 -->
  <g>
    <rect x="26" y="290" width="126" height="112" fill="#eceee6" stroke="#9aa196" stroke-width="4"/>
    <path d="M12 294 L89 250 L166 294 Z" fill="#7c8a90"/>
    <rect x="46" y="314" width="40" height="32" fill="#f6d98f" stroke="#c9a94f" stroke-width="3"/>
    <rect x="102" y="314" width="34" height="32" fill="#f6d98f" stroke="#c9a94f" stroke-width="3"/>
    <rect x="60" y="360" width="60" height="42" fill="#d9c9a4" stroke="#a89571" stroke-width="3"/>
    <circle cx="172" cy="336" r="14" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M158 358 C 158 384, 162 398, 164 412 L184 412 C 188 398, 192 384, 190 358 Z" fill="#c47f92" stroke="#9c5c6f" stroke-width="3"/>
    <rect x="186" y="342" width="64" height="34" rx="3" fill="#fdfbf2" stroke="#b9b09a" stroke-width="3"/>
    <text x="218" y="365" font-family="sans-serif" font-size="15" fill="#4a5560" text-anchor="middle">婚姻届</text>
    <path d="M182 358 L190 358" stroke="#f0d2b0" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 1 講座と受講証明書 -->
  <g>
    <rect x="236" y="200" width="188" height="40" rx="6" fill="#ffffff" stroke="#1f3e52" stroke-width="4"/>
    <text x="330" y="227" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3e52" text-anchor="middle">1 講座の要件を聞く</text>
    <circle cx="272" cy="316" r="15" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M256 340 C 256 370, 260 386, 262 402 L286 402 C 290 386, 296 370, 294 340 Z" fill="#87a45f" stroke="#5f7b3d" stroke-width="3"/>
    <path d="M294 352 L322 344" stroke="#f0d2b0" stroke-width="7" stroke-linecap="round"/>
    <circle cx="366" cy="312" r="15" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M350 336 C 350 366, 354 382, 356 400 L380 400 C 384 382, 390 366, 388 336 Z" fill="#5f86a8" stroke="#3f6684" stroke-width="3"/>
    <path d="M350 350 L326 344" stroke="#f0d2b0" stroke-width="7" stroke-linecap="round"/>
    <rect x="300" y="256" width="70" height="52" rx="3" fill="#fdfbf2" stroke="#b9b09a" stroke-width="3"/>
    <g stroke="#c3bda6" stroke-width="3"><path d="M312 274 L358 274 M312 288 L344 288"/></g>
    <circle cx="352" cy="296" r="8" fill="none" stroke="#c0563c" stroke-width="3"/>
  </g>

  <!-- 2 課税証明書と滞納なし証明書 -->
  <g>
    <rect x="424" y="200" width="196" height="40" rx="6" fill="#ffffff" stroke="#1f3e52" stroke-width="4"/>
    <text x="522" y="227" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3e52" text-anchor="middle">2 証明書をそろえる</text>
    <rect x="440" y="258" width="76" height="54" rx="3" fill="#eaf3ea" stroke="#7f9c85" stroke-width="3"/>
    <g stroke="#a4bfa9" stroke-width="3"><path d="M452 276 L504 276 M452 290 L486 290"/></g>
    <rect x="530" y="258" width="76" height="54" rx="3" fill="#f6efe0" stroke="#b09a6a" stroke-width="3"/>
    <g stroke="#cbb98d" stroke-width="3"><path d="M542 276 L594 276 M542 290 L576 290"/></g>
    <rect x="452" y="330" width="152" height="24" rx="4" fill="#d9c9a4" stroke="#a89571" stroke-width="3"/>
    <circle cx="472" cy="316" r="14" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <circle cx="584" cy="316" r="14" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
  </g>

  <!-- 3 契約書と領収書を封筒へ -->
  <g>
    <rect x="216" y="432" width="238" height="40" rx="6" fill="#ffffff" stroke="#1f3e52" stroke-width="4"/>
    <text x="335" y="459" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3e52" text-anchor="middle">3 契約書と領収書を一つに</text>
    <rect x="242" y="486" width="96" height="60" fill="#f6f8f7" stroke="#98a2a8" stroke-width="3"/>
    <path d="M242 486 L290 518 L338 486" fill="none" stroke="#98a2a8" stroke-width="3"/>
    <rect x="352" y="484" width="62" height="34" fill="#fdf3d8" stroke="#c4ad6a" stroke-width="3"/>
    <rect x="360" y="496" width="62" height="34" fill="#fdf8e8" stroke="#c4ad6a" stroke-width="3"/>
    <g stroke="#c4ad6a" stroke-width="3"><path d="M370 512 L410 512"/></g>
    <rect x="120" y="476" width="72" height="46" fill="#f1f4f2" stroke="#93a0a6" stroke-width="3"/>
    <path d="M120 476 L120 522 L92 522 L92 496 L104 476 Z" fill="#e2e8e8" stroke="#93a0a6" stroke-width="3"/>
    <rect x="98" y="486" width="18" height="14" fill="#b8d6e4" stroke="#8aa9b8" stroke-width="2"/>
    <circle cx="116" cy="526" r="12" fill="#404a52" stroke="#232b31" stroke-width="3"/>
    <circle cx="176" cy="526" r="12" fill="#404a52" stroke="#232b31" stroke-width="3"/>
    <rect x="196" y="496" width="34" height="26" fill="#d5b284" stroke="#a5875e" stroke-width="3"/>
    <path d="M213 496 L213 522" stroke="#a5875e" stroke-width="3"/>
  </g>

  <!-- 分岐の道標 -->
  <g>
    <path d="M610 452 L610 348" stroke="#8f7f5e" stroke-width="8"/>
    <circle cx="610" cy="386" r="12" fill="#ffffff" stroke="#c0563c" stroke-width="4"/>
  </g>

  <!-- 上の道：年内に一度相談 -->
  <g>
    <rect x="638" y="196" width="312" height="40" rx="6" fill="#ffffff" stroke="#c0563c" stroke-width="4"/>
    <text x="794" y="223" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0563c" text-anchor="middle">早い道：年内に一度、窓口で聞く</text>
    <circle cx="708" cy="256" r="15" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M692 280 C 692 306, 696 320, 698 336 L722 336 C 726 320, 732 306, 730 280 Z" fill="#c47f92" stroke="#9c5c6f" stroke-width="3"/>
    <path d="M730 292 L764 284" stroke="#f0d2b0" stroke-width="7" stroke-linecap="round"/>
    <rect x="770" y="252" width="96" height="30" rx="4" fill="#d9c9a4" stroke="#a89571" stroke-width="3"/>
    <circle cx="892" cy="252" r="15" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M876 276 C 876 302, 880 316, 882 332 L906 332 C 910 316, 916 302, 914 276 Z" fill="#4f7c8f" stroke="#345a6b" stroke-width="3"/>
  </g>

  <!-- 下の道：そろってから提出 -->
  <g>
    <rect x="638" y="504" width="330" height="40" rx="6" fill="#ffffff" stroke="#5f7b3d" stroke-width="4"/>
    <text x="803" y="531" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6b33" text-anchor="middle">確実な道：そろってから提出に行く</text>
    <circle cx="712" cy="424" r="15" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M696 448 C 696 474, 700 488, 702 502 L726 502 C 730 488, 736 474, 734 448 Z" fill="#87a45f" stroke="#5f7b3d" stroke-width="3"/>
    <rect x="738" y="446" width="52" height="38" rx="3" fill="#fdfbf2" stroke="#b9b09a" stroke-width="3"/>
    <g stroke="#c3bda6" stroke-width="3"><path d="M748 462 L780 462 M748 474 L770 474"/></g>
    <path d="M732 456 L740 456" stroke="#f0d2b0" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 合流：申請書を手渡す -->
  <g>
    <rect x="874" y="332" width="112" height="70" fill="#eceee6" stroke="#9aa196" stroke-width="4"/>
    <path d="M862 336 L930 300 L998 336 Z" fill="#7c8a90"/>
    <rect x="892" y="352" width="76" height="24" fill="#f6d98f" stroke="#c9a94f" stroke-width="3"/>
    <circle cx="852" cy="382" r="14" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M838 404 C 838 430, 842 444, 844 458 L866 458 C 870 444, 874 430, 872 404 Z" fill="#5f86a8" stroke="#3f6684" stroke-width="3"/>
    <path d="M870 400 L892 392" stroke="#f0d2b0" stroke-width="6" stroke-linecap="round"/>
    <rect x="888" y="380" width="34" height="24" rx="3" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
  </g>

  <!-- 期間の帯 -->
  <g>
    <rect x="26" y="18" width="948" height="36" rx="8" fill="#1f3e52"/>
    <rect x="26" y="18" width="948" height="6" rx="3" fill="#d6a83c"/>
    <text x="500" y="45" font-family="sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">申請できるのは 令和8年7月1日 から 令和9年2月26日 まで（予算上限で早く閉じることあり）</text>
  </g>
</svg>
