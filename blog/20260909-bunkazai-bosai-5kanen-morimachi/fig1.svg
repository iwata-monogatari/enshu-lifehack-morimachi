<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc" data-illustration="mori-editorial"><title id="title">文化財防災5年計画の対象を類型別に分ける図</title><desc id="desc">2026年度から2030年度の国計画を、建造物の防火と耐震、史跡等の斜面や水害、保存活用施設の水害や老朽化に分け、森町の個別対象は別確認と示す。</desc><rect width="1200" height="675" fill="#f5f2e8"/><rect x="50" y="45" width="1100" height="105" rx="22" fill="#214d63"/><text x="600" y="92" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#fff">第1次文化財防災対策5か年計画</text><text x="600" y="130" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#dceaf0">2026年度 → 2030年度　全国の区分別目標</text><g font-family="sans-serif"><rect x="55" y="200" width="330" height="185" rx="20" fill="#fff" stroke="#b1583e" stroke-width="5"/><text x="220" y="250" text-anchor="middle" font-size="29" font-weight="700" fill="#8b3f2f">建造物</text><text x="220" y="302" text-anchor="middle" font-size="31" fill="#333">防火</text><text x="220" y="350" text-anchor="middle" font-size="31" fill="#333">耐震</text><rect x="435" y="200" width="330" height="185" rx="20" fill="#fff" stroke="#557b5c" stroke-width="5"/><text x="600" y="250" text-anchor="middle" font-size="29" font-weight="700" fill="#3f6748">史跡等</text><text x="600" y="302" text-anchor="middle" font-size="31" fill="#333">危険斜面</text><text x="600" y="350" text-anchor="middle" font-size="31" fill="#333">水害・老朽化</text><rect x="815" y="200" width="330" height="185" rx="20" fill="#fff" stroke="#9a742f" stroke-width="5"/><text x="980" y="250" text-anchor="middle" font-size="27" font-weight="700" fill="#7b591f">保存活用施設</text><text x="980" y="302" text-anchor="middle" font-size="31" fill="#333">水害</text><text x="980" y="350" text-anchor="middle" font-size="31" fill="#333">老朽化</text><path d="M600 410v58" stroke="#436b76" stroke-width="8"/><path d="M580 454l20 28 20-28" fill="#436b76"/><rect x="205" y="480" width="790" height="125" rx="24" fill="#e6f0ec" stroke="#436b76" stroke-width="5"/><text x="600" y="528" text-anchor="middle" font-size="31" font-weight="700" fill="#234f54">森町の社寺すべてへ一律適用ではない</text><text x="600" y="572" text-anchor="middle" font-size="25" fill="#425b5c">個別の対象・支援・年度は文化財担当へ確認</text></g><rect x="0" y="635" width="1200" height="40" fill="#d3a82c"/></svg>
