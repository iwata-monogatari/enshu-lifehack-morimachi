<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc" data-illustration="mori-editorial"><title id="title">木造社寺の点検を三欄へまとめる図</title><desc id="desc">建物一棟について最終点検日、次に確認する人、修理や更新の概算額を一枚へ書き、不明欄には未確認、確認先、期限を記す。</desc><rect width="1200" height="675" fill="#eef3ed"/><path d="M55 175L235 55l180 120" fill="#5f4939" stroke="#44372e" stroke-width="6"/><rect x="92" y="170" width="286" height="320" fill="#d8c794" stroke="#5c4a39" stroke-width="6"/><rect x="205" y="290" width="72" height="200" fill="#76513a"/><circle cx="259" cy="386" r="6" fill="#e2c76d"/><rect x="84" y="500" width="302" height="32" fill="#856c42"/><g font-family="sans-serif"><rect x="445" y="55" width="700" height="545" rx="24" fill="#fffdf4" stroke="#315c64" stroke-width="6"/><text x="795" y="112" text-anchor="middle" font-size="34" font-weight="700" fill="#214d63">一棟につき一枚</text><line x1="480" y1="145" x2="1110" y2="145" stroke="#9db2ad" stroke-width="3"/><text x="500" y="205" font-size="27" font-weight="700" fill="#8b3f2f">1　最終点検日</text><rect x="500" y="230" width="565" height="62" rx="10" fill="#f6eee7" stroke="#c69a87" stroke-width="3"/><text x="525" y="270" font-size="23" fill="#555">何を・誰が・いつ確認したか</text><text x="500" y="350" font-size="27" font-weight="700" fill="#3f6748">2　次に確認する人</text><rect x="500" y="375" width="565" height="62" rx="10" fill="#eaf3ea" stroke="#8eb293" stroke-width="3"/><text x="525" y="415" font-size="23" fill="#555">役割・連絡先・用件</text><text x="500" y="495" font-size="27" font-weight="700" fill="#7b591f">3　修理・更新の概算額</text><rect x="500" y="520" width="565" height="62" rx="10" fill="#f7f1df" stroke="#c5a765" stroke-width="3"/><text x="525" y="560" font-size="23" fill="#555">未確認なら確認先＋期限</text></g><rect x="0" y="635" width="1200" height="40" fill="#d3a82c"/></svg>
