<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ohm2Title ohm2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="ohm2Title">森町の実家の水害リスクを確かめる順番を一本の道として描いたイラスト</title>
  <desc id="ohm2Desc">左端に瓦屋根の実家があります。道を右へ進むと、一つ目の地点に太田川と三倉川という川の名前を書いた二枚の札、二つ目の地点に浸水深を六段階に色分けした浸水想定区域図と実家の位置を示す赤い印、三つ目の地点に巻き尺と、地盤面から玄関の敷居までの高さを書き込む記録用紙、四つ目の地点に避難所となる学校の建物とそこまでの経路を示した地図、五つ目の地点に火災保険の証券と水災補償の確認欄が並びます。背景には遠州の山並み、杉林、段になった茶畑が続いています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="ohm2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3d9ea"/><stop offset="1" stop-color="#eaf1e6"/>
    </linearGradient>
    <linearGradient id="ohm2Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#90aabc"/><stop offset="1" stop-color="#bbccd3"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#f0f4ec"/>
  <rect width="1000" height="146" fill="url(#ohm2Sky)"/>
  <path fill="url(#ohm2Far)" d="M0 92 L88 40 L186 92 L292 34 L400 92 L510 32 L620 92 L730 42 L836 92 L938 44 L1000 88 L1000 136 L0 136 Z"/>
  <path fill="#7fae57" d="M0 146 C 210 138, 430 160, 650 148 C 762 142, 860 152, 1000 146 L1000 178 L0 184 Z"/>
  <g stroke="#5d8840" stroke-width="4" opacity="0.85" fill="none">
    <path d="M0 156 C 210 148, 430 170, 650 158 C 762 152, 860 162, 1000 156"/>
    <path d="M0 170 C 210 162, 430 184, 650 172 C 762 166, 860 176, 1000 170"/>
  </g>
  <g fill="#3f6b52">
    <path d="M6 182 l14 -48 l14 48 z"/><path d="M36 182 l11 -38 l11 38 z"/>
    <path d="M956 182 l14 -46 l14 46 z"/><path d="M928 182 l11 -36 l11 36 z"/>
  </g>
  <path fill="#e2ead9" d="M0 180 L1000 174 L1000 560 L0 560 Z"/>

  <!-- 道 -->
  <path fill="#b9b5ac" d="M96 330 L956 330 L956 374 L96 374 Z"/>
  <g stroke="#f2f0e8" stroke-width="5" stroke-dasharray="26 22" fill="none">
    <path d="M108 352 L946 352"/>
  </g>

  <!-- 実家 -->
  <g>
    <path d="M4 250 L56 220 L108 250 Z" fill="#7d6a58"/>
    <path d="M11 247 L56 220 L101 247 Z" fill="#a08a72"/>
    <rect x="14" y="250" width="84" height="60" fill="#f2eee4" stroke="#b6ad9c" stroke-width="3"/>
    <rect x="26" y="264" width="24" height="22" fill="#cfd9d6" stroke="#9aa5a3" stroke-width="3"/>
    <rect x="62" y="264" width="24" height="22" fill="#cfd9d6" stroke="#9aa5a3" stroke-width="3"/>
    <rect x="44" y="292" width="24" height="18" fill="#8a7a66"/>
  </g>

  <!-- 1 川の名前 -->
  <g>
    <rect x="186" y="268" width="8" height="66" fill="#9aa39b"/>
    <rect x="122" y="182" width="136" height="40" rx="6" fill="#ffffff" stroke="#5f7a8c" stroke-width="4"/>
    <text x="190" y="209" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="18" font-weight="bold" fill="#2c4a5e" text-anchor="middle">太田川</text>
    <rect x="122" y="228" width="136" height="40" rx="6" fill="#ffffff" stroke="#5f7a8c" stroke-width="4"/>
    <text x="190" y="255" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="18" font-weight="bold" fill="#2c4a5e" text-anchor="middle">三倉川</text>
    <circle cx="190" cy="352" r="22" fill="#1f3e52"/>
    <text x="190" y="360" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  </g>

  <!-- 2 浸水想定区域図 -->
  <g>
    <rect x="350" y="288" width="8" height="46" fill="#9aa39b"/>
    <rect x="288" y="180" width="140" height="108" rx="6" fill="#ffffff" stroke="#8f978f" stroke-width="4"/>
    <rect x="288" y="180" width="140" height="18" rx="6" fill="#1f3e52"/>
    <g>
      <rect x="300" y="206" width="116" height="12" fill="#2f5f96"/>
      <rect x="300" y="220" width="116" height="12" fill="#4a86bd"/>
      <rect x="300" y="234" width="116" height="12" fill="#77b0d6"/>
      <rect x="300" y="248" width="116" height="12" fill="#a7d0e6"/>
      <rect x="300" y="262" width="116" height="12" fill="#cbe4f1"/>
    </g>
    <path d="M368 246 l10 -18 l10 18 z" fill="#c0453c"/>
    <circle cx="378" cy="226" r="9" fill="#c0453c"/>
    <text x="354" y="308" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="16" font-weight="bold" fill="#3d5364" text-anchor="middle">区域図の色</text>
    <circle cx="354" cy="352" r="22" fill="#1f3e52"/>
    <text x="354" y="360" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  </g>

  <!-- 3 巻き尺で段差を測る -->
  <g>
    <rect x="514" y="288" width="8" height="46" fill="#9aa39b"/>
    <rect x="452" y="186" width="140" height="102" rx="8" fill="#ffffff" stroke="#8a7c1c" stroke-width="4"/>
    <rect x="468" y="240" width="34" height="34" rx="4" fill="#e4d24a" stroke="#8a7c1c" stroke-width="3"/>
    <g stroke="#8a7c1c" stroke-width="2"><path d="M468 250 h34"/><path d="M468 258 h20"/><path d="M468 266 h34"/></g>
    <path d="M485 236 v-32 M478 208 l7 -9 l7 9" fill="none" stroke="#8a7c1c" stroke-width="4"/>
    <rect x="514" y="204" width="62" height="66" rx="4" fill="#f6f4ea" stroke="#b3a878" stroke-width="3"/>
    <g stroke="#cdc39c" stroke-width="4"><path d="M524 220 h42"/><path d="M524 236 h42"/><path d="M524 252 h28"/></g>
    <text x="522" y="308" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="16" font-weight="bold" fill="#3d5364" text-anchor="middle">敷居までの高さ</text>
    <circle cx="518" cy="352" r="22" fill="#1f3e52"/>
    <text x="518" y="360" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  </g>

  <!-- 4 避難所と経路 -->
  <g>
    <rect x="678" y="292" width="8" height="42" fill="#9aa39b"/>
    <rect x="616" y="184" width="140" height="108" rx="6" fill="#ffffff" stroke="#4d7f5f" stroke-width="4"/>
    <rect x="632" y="242" width="66" height="34" fill="#eef2ee" stroke="#8ea08f" stroke-width="3"/>
    <path d="M626 242 L665 220 L704 242 Z" fill="#7f8f96" stroke="#63727a" stroke-width="3"/>
    <g fill="#c6d3d8"><rect x="642" y="252" width="16" height="16"/><rect x="670" y="252" width="16" height="16"/></g>
    <path d="M712 274 q10 -34 -12 -46 q-22 -12 -8 -34" fill="none" stroke="#c0453c" stroke-width="5" stroke-dasharray="10 8"/>
    <circle cx="712" cy="276" r="7" fill="#c0453c"/>
    <text x="686" y="312" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="16" font-weight="bold" fill="#3d5364" text-anchor="middle">避難先と経路</text>
    <circle cx="682" cy="352" r="22" fill="#1f3e52"/>
    <text x="682" y="360" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  </g>

  <!-- 5 火災保険の証券 -->
  <g>
    <rect x="842" y="292" width="8" height="42" fill="#9aa39b"/>
    <rect x="780" y="184" width="140" height="108" rx="6" fill="#ffffff" stroke="#8a6f52" stroke-width="4"/>
    <rect x="780" y="184" width="140" height="20" rx="6" fill="#8a6f52"/>
    <g stroke="#cdc4b0" stroke-width="4"><path d="M796 220 h108"/><path d="M796 238 h108"/></g>
    <rect x="796" y="252" width="26" height="26" rx="3" fill="#ffffff" stroke="#4d7f5f" stroke-width="4"/>
    <path d="M801 265 l6 7 l12 -14" fill="none" stroke="#2f5f45" stroke-width="5"/>
    <text x="872" y="274" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="17" font-weight="bold" fill="#6b543c" text-anchor="middle">水災補償</text>
    <text x="850" y="312" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="16" font-weight="bold" fill="#3d5364" text-anchor="middle">保険の証券</text>
    <circle cx="846" cy="352" r="22" fill="#1f3e52"/>
    <text x="846" y="360" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  </g>

  <!-- 手前：色ではなく高さ -->
  <g>
    <rect x="96" y="410" width="808" height="62" rx="10" fill="#ffffff" stroke="#c0453c" stroke-width="5"/>
    <text x="500" y="450" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="24" font-weight="bold" fill="#a83a31" text-anchor="middle">床の高さは、図ではなく巻き尺で分かる</text>
  </g>

  <!-- 下部の帯 -->
  <rect x="0" y="490" width="1000" height="70" fill="#1f3e52"/>
  <rect x="0" y="490" width="1000" height="5" fill="#d6a83c"/>
  <text x="26" y="522" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="19" font-weight="bold" fill="#ffffff">先に決まるのは地図ではなく、実家の前を流れる川の名前</text>
  <text x="26" y="548" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="16" fill="#cddae2">川の名前 → 区域図の色 → 敷居までの高さ → 避難先と経路 → 保険の水災補償</text>
</svg>
