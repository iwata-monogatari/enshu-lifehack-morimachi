<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="owTitle owDesc" preserveAspectRatio="xMidYMid meet">
  <title id="owTitle">お盆週の森町役場の窓口の開き方を描いたイラスト</title>
  <desc id="owDesc">夕暮れの森町で、瓦色の屋根をのせた役場の庁舎に明かりがともり、その右手にコンビニのマルチコピー機が置かれた店先が並んでいます。二つの建物の前には紐に吊るされた七枚の日めくり札が横に並び、月曜から日曜までの日付と窓口の終わり時刻が書かれています。火曜の札は閉庁、水曜の札だけが一枚だけ長く垂れ下がって19時までと示され、土曜と日曜の札も閉庁です。手前の道を仕事帰りの人が庁舎へ、子ども連れがコンビニへ歩いています。背景には段になった茶畑と杉林、森町の山並みが広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="owSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d7ea6"/><stop offset="0.55" stop-color="#a8bfd0"/><stop offset="1" stop-color="#f3caa0"/>
    </linearGradient>
    <linearGradient id="owFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d8ba1"/><stop offset="1" stop-color="#97b1bd"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#dfe9c8"/>
  <rect width="1000" height="310" fill="url(#owSky)"/>

  <!-- 沈みかけた日 -->
  <circle cx="882" cy="212" r="36" fill="#ffd18c" opacity="0.95"/>

  <!-- 山並みと杉 -->
  <path fill="url(#owFar)" d="M0 236 L90 196 L180 240 L280 188 L380 238 L480 186 L580 240 L680 192 L780 238 L880 196 L1000 234 L1000 270 L0 270 Z"/>
  <g fill="#4c7860">
    <path d="M16 270 l16 -44 l16 44 z"/><path d="M50 270 l13 -34 l13 34 z"/>
    <path d="M930 270 l14 -38 l14 38 z"/><path d="M962 270 l17 -48 l17 48 z"/>
  </g>

  <!-- 段になった茶畑 -->
  <path fill="#7ba954" d="M0 264 C 240 252, 460 248, 640 262 C 800 274, 900 266, 1000 258 L1000 300 L0 312 Z"/>
  <g stroke="#69934a" stroke-width="4" opacity="0.5">
    <path d="M0 280 C 240 268, 460 264, 640 278 C 800 290, 900 282, 1000 274"/>
    <path d="M0 298 C 240 286, 460 282, 640 296 C 800 306, 900 298, 1000 290"/>
  </g>
  <path fill="#dfe9c8" d="M0 308 L1000 294 L1000 560 L0 560 Z"/>

  <!-- 役場の庁舎 -->
  <g>
    <path d="M76 244 L280 182 L484 244 Z" fill="#8b9aa2"/>
    <path d="M96 238 L280 194 L464 238 Z" fill="#a2b0b6"/>
    <rect x="96" y="244" width="368" height="102" fill="#eef1ec" stroke="#c3c8c1" stroke-width="3"/>
    <rect x="128" y="252" width="304" height="28" rx="5" fill="#1f3e52"/>
    <text x="280" y="273" font-family="sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">森町役場</text>
    <g fill="#ffe9a8" stroke="#c9ab6a" stroke-width="3">
      <rect x="120" y="292" width="60" height="40"/><rect x="192" y="292" width="60" height="40"/>
      <rect x="264" y="292" width="60" height="40"/>
    </g>
    <rect x="344" y="292" width="52" height="54" fill="#cfe0ea" stroke="#a9bfcb" stroke-width="3"/>
    <rect x="404" y="298" width="48" height="48" fill="#b98f5d" stroke="#94703f" stroke-width="3"/>
  </g>

  <!-- コンビニとマルチコピー機 -->
  <g>
    <rect x="630" y="262" width="292" height="84" fill="#f4f2e8" stroke="#c9c0ab" stroke-width="3"/>
    <rect x="630" y="262" width="292" height="24" fill="#2f7d5a"/>
    <text x="776" y="280" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">コンビニ</text>
    <rect x="648" y="296" width="142" height="46" fill="#cfe0ea" stroke="#a9bfcb" stroke-width="3"/>
    <path d="M719 296 L719 342" stroke="#a9bfcb" stroke-width="3"/>
    <rect x="820" y="290" width="76" height="56" fill="#e8ebe8" stroke="#98a2a6" stroke-width="3"/>
    <rect x="828" y="298" width="60" height="14" fill="#ffe9a8" stroke="#c9ab6a" stroke-width="2"/>
    <rect x="836" y="322" width="44" height="18" fill="#c3c8c1"/>
  </g>

  <!-- 七枚の日めくり札 -->
  <path d="M34 350 Q 500 336 966 348" stroke="#8b8577" stroke-width="3" fill="none"/>

  <g font-family="sans-serif" text-anchor="middle">
    <!-- 月 -->
    <path d="M125 342 L125 358" stroke="#8b8577" stroke-width="2"/>
    <rect x="70" y="358" width="110" height="76" rx="8" fill="#f4f6ee" stroke="#9aa79b" stroke-width="3"/>
    <text x="125" y="382" font-size="14" fill="#4a5a52">8/10</text>
    <text x="125" y="408" font-size="22" font-weight="bold" fill="#1f3e52">月</text>
    <text x="125" y="427" font-size="12" fill="#3e6b55">17:15</text>
    <!-- 火 -->
    <path d="M250 340 L250 358" stroke="#8b8577" stroke-width="2"/>
    <rect x="195" y="358" width="110" height="76" rx="8" fill="#ddd8cd" stroke="#a49c8d" stroke-width="3"/>
    <text x="250" y="382" font-size="14" fill="#5a544a">8/11</text>
    <text x="250" y="408" font-size="22" font-weight="bold" fill="#6b5f52">火</text>
    <text x="250" y="427" font-size="11" fill="#7a3b30">閉庁（山の日）</text>
    <!-- 水（この週で最も長い日） -->
    <path d="M375 339 L375 358" stroke="#8b8577" stroke-width="2"/>
    <rect x="320" y="358" width="110" height="104" rx="8" fill="#1f3e52" stroke="#12293a" stroke-width="3"/>
    <text x="375" y="383" font-size="14" fill="#cfe0ea">8/12</text>
    <text x="375" y="412" font-size="24" font-weight="bold" fill="#ffffff">水</text>
    <text x="375" y="440" font-size="15" font-weight="bold" fill="#ffd98a">19:00まで</text>
    <!-- 木 -->
    <path d="M500 338 L500 358" stroke="#8b8577" stroke-width="2"/>
    <rect x="445" y="358" width="110" height="76" rx="8" fill="#f4f6ee" stroke="#9aa79b" stroke-width="3"/>
    <text x="500" y="382" font-size="14" fill="#4a5a52">8/13</text>
    <text x="500" y="408" font-size="22" font-weight="bold" fill="#1f3e52">木</text>
    <text x="500" y="427" font-size="12" fill="#3e6b55">17:15</text>
    <!-- 金 -->
    <path d="M625 339 L625 358" stroke="#8b8577" stroke-width="2"/>
    <rect x="570" y="358" width="110" height="76" rx="8" fill="#f4f6ee" stroke="#9aa79b" stroke-width="3"/>
    <text x="625" y="382" font-size="14" fill="#4a5a52">8/14</text>
    <text x="625" y="408" font-size="22" font-weight="bold" fill="#1f3e52">金</text>
    <text x="625" y="427" font-size="12" fill="#3e6b55">17:15</text>
    <!-- 土 -->
    <path d="M750 341 L750 358" stroke="#8b8577" stroke-width="2"/>
    <rect x="695" y="358" width="110" height="76" rx="8" fill="#ddd8cd" stroke="#a49c8d" stroke-width="3"/>
    <text x="750" y="382" font-size="14" fill="#5a544a">8/15</text>
    <text x="750" y="408" font-size="22" font-weight="bold" fill="#6b5f52">土</text>
    <text x="750" y="427" font-size="12" fill="#7a3b30">閉庁</text>
    <!-- 日 -->
    <path d="M875 343 L875 358" stroke="#8b8577" stroke-width="2"/>
    <rect x="820" y="358" width="110" height="76" rx="8" fill="#ddd8cd" stroke="#a49c8d" stroke-width="3"/>
    <text x="875" y="382" font-size="14" fill="#5a544a">8/16</text>
    <text x="875" y="408" font-size="22" font-weight="bold" fill="#6b5f52">日</text>
    <text x="875" y="427" font-size="12" fill="#7a3b30">閉庁</text>
  </g>

  <!-- 手前の道 -->
  <path d="M-20 514 C 250 504, 520 498, 1020 492" stroke="#cdc6b2" stroke-width="58" fill="none" stroke-linecap="round"/>
  <path d="M-20 514 C 250 504, 520 498, 1020 492" stroke="#ffffff" stroke-width="4" stroke-dasharray="22 22" opacity="0.7" fill="none"/>

  <!-- 仕事帰りの人（庁舎へ） -->
  <g>
    <circle cx="168" cy="486" r="20" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
    <path d="M148 480 q20 -21 40 0 q0 -17 -20 -17 q-20 0 -20 17 z" fill="#463d33"/>
    <path d="M144 512 q24 -13 48 0 l6 46 l-60 0 z" fill="#37536b"/>
    <path d="M192 522 q22 6 24 26" stroke="#e6c49d" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="204" y="540" width="44" height="20" rx="4" fill="#8a6f5a" stroke="#6b5443" stroke-width="3"/>
  </g>

  <!-- 子ども連れ（コンビニへ） -->
  <g>
    <circle cx="796" cy="490" r="19" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
    <path d="M777 484 q19 -20 38 0 q0 -16 -19 -16 q-19 0 -19 16 z" fill="#5b4a36"/>
    <path d="M774 514 q22 -12 44 0 l6 46 l-56 0 z" fill="#5c8b6d"/>
    <circle cx="856" cy="506" r="15" fill="#f0d3ad" stroke="#c4a077" stroke-width="3"/>
    <path d="M841 500 q15 -16 30 0 q-6 -11 -15 -11 q-9 0 -15 11 z" fill="#6b563d"/>
    <path d="M840 526 q16 -10 32 0 l5 34 l-42 0 z" fill="#dc9a63"/>
    <path d="M820 522 q18 4 20 12" stroke="#e6c49d" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
</svg>
