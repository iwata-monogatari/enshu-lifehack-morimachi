<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ow2Title ow2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="ow2Title">お盆週の用事を三つの行き先へ振り分ける順番を描いたイラスト</title>
  <desc id="ow2Desc">上段に森町の山並みと茶畑を背景として、月曜から日曜までの七つの帯が横に並び、開いている日と閉庁の日、水曜だけ19時までであることが示されています。その下では、書類を抱えた人が立つところから三本の道が分かれます。上の道はコンビニのマルチコピー機へ、真ん中の道は昼の役場のカウンターへ、下の道は明かりのついた夜の庁舎と19時を指す時計へ続き、それぞれの道の上に、そこへ回す用事の札が置かれています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="ow2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6dcec"/><stop offset="1" stop-color="#eaf2ea"/>
    </linearGradient>
    <linearGradient id="ow2Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fadbe"/><stop offset="1" stop-color="#b8ccd2"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef2e6"/>
  <rect width="1000" height="112" fill="url(#ow2Sky)"/>

  <!-- 山並み・杉・茶畑 -->
  <path fill="url(#ow2Far)" d="M0 76 L96 44 L192 80 L296 40 L400 78 L508 38 L616 80 L720 42 L824 78 L920 42 L1000 74 L1000 100 L0 100 Z"/>
  <g fill="#57876a">
    <path d="M18 100 l13 -32 l13 32 z"/><path d="M46 100 l10 -25 l10 25 z"/>
    <path d="M940 100 l12 -30 l12 30 z"/><path d="M966 100 l14 -36 l14 36 z"/>
  </g>
  <path fill="#7ba954" d="M0 96 C 250 88, 470 86, 660 94 C 820 100, 910 96, 1000 90 L1000 114 L0 118 Z"/>
  <path fill="#eef2e6" d="M0 116 L1000 110 L1000 560 L0 560 Z"/>

  <!-- 一週間の帯 -->
  <g font-family="sans-serif" text-anchor="middle">
