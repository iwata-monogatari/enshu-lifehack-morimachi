    <rect x="832" y="132" width="124" height="52" rx="7" fill="#ddd8cd" stroke="#a49c8d" stroke-width="3"/>
    <text x="894" y="154" font-size="15" font-weight="bold" fill="#6b5f52">日 8/16</text>
    <text x="894" y="174" font-size="13" fill="#7a3b30">閉庁</text>
  </g>

