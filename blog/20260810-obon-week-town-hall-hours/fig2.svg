    <rect x="654" y="298" width="180" height="28" rx="8" fill="#1f3e52"/>
    <text x="744" y="318" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">毎日 6:30-23:00</text>
  </g>

