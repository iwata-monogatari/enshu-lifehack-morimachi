    <rect x="172" y="132" width="124" height="52" rx="7" fill="#ddd8cd" stroke="#a49c8d" stroke-width="3"/>
    <text x="234" y="154" font-size="15" font-weight="bold" fill="#6b5f52">火 8/11</text>
    <text x="234" y="174" font-size="13" fill="#7a3b30">閉庁（山の日）</text>

    <rect x="304" y="124" width="124" height="68" rx="7" fill="#1f3e52" stroke="#12293a" stroke-width="3"/>
    <text x="366" y="150" font-size="16" font-weight="bold" fill="#ffffff">水 8/12</text>
    <text x="366" y="174" font-size="15" font-weight="bold" fill="#ffd98a">8:30-19:00</text>

    <rect x="436" y="132" width="124" height="52" rx="7" fill="#dff0e4" stroke="#8fb79c" stroke-width="3"/>
    <text x="498" y="154" font-size="15" font-weight="bold" fill="#1f3e52">木 8/13</text>
    <text x="498" y="174" font-size="13" fill="#3e6b55">8:30-17:15</text>

    <rect x="568" y="132" width="124" height="52" rx="7" fill="#dff0e4" stroke="#8fb79c" stroke-width="3"/>
    <text x="630" y="154" font-size="15" font-weight="bold" fill="#1f3e52">金 8/14</text>
    <text x="630" y="174" font-size="13" fill="#3e6b55">8:30-17:15</text>

