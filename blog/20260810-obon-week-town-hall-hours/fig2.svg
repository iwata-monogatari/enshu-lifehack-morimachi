    <rect x="664" y="348" width="140" height="24" rx="4" fill="#1f3e52"/>
    <text x="734" y="366" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">まどぐち</text>
    <circle cx="700" cy="386" r="15" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
