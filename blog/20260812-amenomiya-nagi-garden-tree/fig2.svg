<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ng2Title ng2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="ng2Title">お盆に実家の庭の木を確かめる順番を道筋として描いたイラスト</title>
  <desc id="ng2Desc">左端に枝を大きく広げた庭の大木と実家があり、そこから右へ道が伸びます。最初の区間では巻尺で幹の周りを測り、数字をノートに書きます。次の区間では屋根と電線に近い枝を見上げて写真を撮ります。三つ目の地点で道が三方向に分かれ、上の道は高所作業車のある伐採業者へ、真ん中の道は隣家との境界へ、下の道は空き家バンクの看板が立つ家へ続き、それぞれに札が立っています。奥には段になった茶畑と杉林、山並みが広がります。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="ng2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6dced"/><stop offset="1" stop-color="#e9f1e4"/>
    </linearGradient>
    <linearGradient id="ng2Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba9bc"/><stop offset="1" stop-color="#b6cbd2"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="140" fill="url(#ng2Sky)"/>
  <path fill="url(#ng2Far)" d="M0 88 L96 40 L200 86 L318 34 L438 86 L556 32 L676 86 L790 42 L898 86 L1000 54 L1000 124 L0 124 Z"/>
  <g fill="#3f6b52">
    <path d="M16 140 l12 -30 l12 30 z"/><path d="M44 140 l10 -24 l10 24 z"/>
    <path d="M940 140 l12 -28 l12 28 z"/><path d="M966 140 l11 -26 l11 26 z"/>
  </g>
  <path fill="#7fae57" d="M0 140 C 240 132, 460 154, 690 142 C 790 136, 880 146, 1000 140 L1000 178 L0 184 Z"/>
  <g stroke="#5f8a42" stroke-width="4" opacity="0.85" fill="none">
    <path d="M0 150 C 240 142, 460 164, 690 152 C 790 146, 880 156, 1000 150"/>
    <path d="M0 166 C 240 158, 460 180, 690 168 C 790 162, 880 172, 1000 166"/>
  </g>
  <path fill="#dfe8d6" d="M0 180 L1000 174 L1000 560 L0 560 Z"/>

  <!-- 道 -->
  <path d="M112 352 L570 352 L866 228" fill="none" stroke="#cbbfa4" stroke-width="34" stroke-linecap="round"/>
  <path d="M570 352 L866 352" fill="none" stroke="#cbbfa4" stroke-width="34" stroke-linecap="round"/>
  <path d="M570 352 L866 486" fill="none" stroke="#cbbfa4" stroke-width="34" stroke-linecap="round"/>
  <g stroke="#f2ece0" stroke-width="4" stroke-dasharray="18 16" fill="none">
    <path d="M128 352 L570 352"/><path d="M576 350 L854 234"/>
    <path d="M576 352 L854 352"/><path d="M576 354 L854 480"/>
  </g>

  <!-- 左端：実家と庭の大木 -->
  <g>
    <path d="M18 330 L74 292 L130 330 Z" fill="#8b979b"/>
    <rect x="26" y="330" width="96" height="58" fill="#e9e3d3" stroke="#bdb49f" stroke-width="4"/>
    <rect x="40" y="344" width="32" height="34" fill="#b9ac91" stroke="#948a72" stroke-width="3"/>
    <rect x="84" y="344" width="26" height="44" fill="#b9ac91" stroke="#948a72" stroke-width="3"/>
    <path d="M124 388 C 118 344, 122 318, 128 292 L152 292 C 158 318, 162 344, 156 388 Z" fill="#7a6247"/>
    <g stroke="#5f4c37" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M130 298 C 104 282, 86 274, 60 270"/><path d="M152 298 C 176 280, 192 272, 214 268"/>
    </g>
    <ellipse cx="140" cy="240" rx="82" ry="58" fill="#4f7c46"/>
    <ellipse cx="72" cy="264" rx="44" ry="30" fill="#3f6b3c"/>
    <ellipse cx="208" cy="262" rx="42" ry="28" fill="#3f6b3c"/>
    <text x="140" y="412" font-family="sans-serif" font-size="16" font-weight="bold" fill="#42535c" text-anchor="middle">実家の庭木</text>
  </g>

  <!-- 区間1：幹を測る -->
  <g>
    <circle cx="262" cy="352" r="19" fill="#3e6b55"/>
    <text x="262" y="359" font-family="sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <circle cx="248" cy="268" r="17" fill="#e8cdae" stroke="#c0a184" stroke-width="3"/>
    <path d="M231 264 q17 -19 34 0 q-2 -19 -17 -19 q-15 0 -17 19 z" fill="#4a4038"/>
    <path d="M230 296 q18 -11 36 0 l5 40 l-46 0 z" fill="#6e8fa6" stroke="#527389" stroke-width="3"/>
    <path d="M266 308 L300 300" stroke="#e8cdae" stroke-width="10" stroke-linecap="round" fill="none"/>
    <circle cx="312" cy="298" r="17" fill="#d8892f" stroke="#a8681e" stroke-width="4"/>
    <circle cx="312" cy="298" r="6" fill="#f4e7cd"/>
    <path d="M296 288 C 276 280, 254 280, 236 288" stroke="#f0d878" stroke-width="8" fill="none"/>
    <rect x="182" y="400" width="164" height="30" rx="7" fill="#ffffff" stroke="#3e6b55" stroke-width="3"/>
    <text x="264" y="421" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">幹の周りを測る</text>
    <rect x="208" y="436" width="112" height="26" rx="6" fill="#3e6b55"/>
    <text x="264" y="455" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">数字を書く</text>
  </g>

  <!-- 区間2：枝の写真を撮る -->
  <g>
    <circle cx="428" cy="352" r="19" fill="#3e6b55"/>
    <text x="428" y="359" font-family="sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <!-- 電柱と電線 -->
    <path d="M508 342 L508 208" stroke="#9aa39f" stroke-width="8" fill="none"/>
    <path d="M486 226 L530 226 M488 246 L528 246" stroke="#9aa39f" stroke-width="5" fill="none"/>
    <path d="M486 230 C 442 240, 410 244, 372 238" stroke="#6b7570" stroke-width="4" fill="none"/>
    <!-- 枝 -->
    <path d="M380 320 C 402 292, 424 268, 448 250" stroke="#7a6247" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="432" cy="252" rx="50" ry="32" fill="#4f7c46"/>
    <!-- 人とカメラ -->
    <circle cx="392" cy="304" r="16" fill="#e8cdae" stroke="#c0a184" stroke-width="3"/>
    <path d="M376 300 q16 -18 32 0 q-2 -18 -16 -18 q-14 0 -16 18 z" fill="#4a4038"/>
    <path d="M375 330 q17 -10 34 0 l5 28 l-44 0 z" fill="#6e8fa6" stroke="#527389" stroke-width="3"/>
    <rect x="396" y="288" width="34" height="24" rx="5" fill="#4a5a63" stroke="#33434b" stroke-width="3"/>
    <circle cx="413" cy="300" r="7" fill="#cfe0e6"/>
    <rect x="346" y="400" width="164" height="30" rx="7" fill="#ffffff" stroke="#3e6b55" stroke-width="3"/>
    <text x="428" y="421" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">枝を写真に撮る</text>
  </g>

  <!-- 分岐点 -->
  <g>
    <circle cx="570" cy="352" r="19" fill="#c0563c"/>
    <text x="570" y="359" font-family="sans-serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  </g>

  <!-- 上：伐採業者と高所作業車 -->
  <g>
    <rect x="700" y="140" width="112" height="48" rx="5" fill="#e6e9e5" stroke="#9aa39f" stroke-width="4"/>
    <path d="M812 188 L812 144 L856 144 L878 168 L878 188 Z" fill="#e6e9e5" stroke="#9aa39f" stroke-width="4"/>
    <path d="M826 152 L852 152 L866 168 L826 168 Z" fill="#cfe0e6" stroke="#9aa39f" stroke-width="3"/>
    <g fill="#4a5a63">
      <circle cx="738" cy="196" r="16"/><circle cx="850" cy="196" r="16"/>
    </g>
    <path d="M746 140 L746 96 L820 78" stroke="#d8892f" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="812" y="60" width="42" height="28" rx="4" fill="#d8892f" stroke="#a8681e" stroke-width="3"/>
    <rect x="666" y="212" width="228" height="30" rx="7" fill="#ffffff" stroke="#3e6b55" stroke-width="3"/>
    <text x="780" y="233" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">見積もりを二社に頼む</text>
  </g>

  <!-- 中：境界と隣家 -->
  <g>
    <path d="M690 330 L690 384" stroke="#c0563c" stroke-width="6" fill="none" stroke-dasharray="12 8"/>
    <rect x="682" y="316" width="18" height="18" rx="3" fill="#f0f0ea" stroke="#c0563c" stroke-width="3"/>
    <path d="M714 330 L772 296 L830 330 Z" fill="#8b979b"/>
    <rect x="724" y="330" width="96" height="52" fill="#e9e3d3" stroke="#bdb49f" stroke-width="4"/>
    <rect x="740" y="344" width="30" height="30" fill="#cfe0e6" stroke="#9fadb2" stroke-width="3"/>
    <path d="M664 336 C 640 322, 620 316, 600 314" stroke="#7a6247" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="646" cy="326" rx="34" ry="22" fill="#4f7c46"/>
    <rect x="624" y="396" width="252" height="30" rx="7" fill="#ffffff" stroke="#3e6b55" stroke-width="3"/>
    <text x="750" y="417" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">越えた枝は所有者が切る</text>
  </g>

  <!-- 下：空き家バンク -->
  <g>
    <path d="M700 470 L768 430 L836 470 Z" fill="#8b979b"/>
    <rect x="712" y="470" width="112" height="50" fill="#e9e3d3" stroke="#bdb49f" stroke-width="4"/>
    <rect x="728" y="482" width="34" height="30" fill="#cfe0e6" stroke="#9fadb2" stroke-width="3"/>
    <rect x="778" y="482" width="30" height="38" fill="#b9ac91" stroke="#948a72" stroke-width="3"/>
    <path d="M866 520 L866 462" stroke="#8a7a5e" stroke-width="6" fill="none"/>
    <rect x="852" y="428" width="132" height="32" rx="6" fill="#ffffff" stroke="#c0563c" stroke-width="3"/>
    <text x="918" y="450" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0563c" text-anchor="middle">空き家バンク</text>
    <rect x="628" y="528" width="234" height="30" rx="7" fill="#ffffff" stroke="#3e6b55" stroke-width="3"/>
    <text x="745" y="549" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">支障木伐採 上限10万円</text>
  </g>
</svg>
