<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ng1Title ng1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="ng1Title">天宮神社の境内に立つナギの大木と、実家の庭に立つ大木を並べて描いたイラスト</title>
  <desc id="ng1Desc">奥に遠州の山並みと杉林、段になった茶畑が広がります。左には神社の本殿と拝殿があり、その右手に幹の太いナギが立ち、根元に「県指定天然記念物」と書かれた標柱と低い柵が置かれています。葉が厚く重なり、木の下は暗く描かれています。右には瓦屋根の実家があり、屋根の上と電線の上に枝を伸ばした庭の大木が立っています。幹には巻尺が当てられ、根元には落ち葉と枯れ枝が描かれています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="ng1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6dced"/><stop offset="1" stop-color="#e9f1e4"/>
    </linearGradient>
    <linearGradient id="ng1Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba9bc"/><stop offset="1" stop-color="#b6cbd2"/>
    </linearGradient>
    <radialGradient id="ng1Crown" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#3f7350"/><stop offset="1" stop-color="#24512f"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="180" fill="url(#ng1Sky)"/>
  <path fill="url(#ng1Far)" d="M0 120 L104 62 L214 118 L330 50 L450 118 L566 48 L682 118 L796 60 L902 118 L1000 78 L1000 164 L0 164 Z"/>
  <path fill="#7fae57" d="M0 182 C 230 172, 450 196, 670 184 C 770 178, 860 188, 1000 182 L1000 224 L0 230 Z"/>
  <g stroke="#5f8a42" stroke-width="4" opacity="0.85" fill="none">
    <path d="M0 192 C 230 182, 450 206, 670 194 C 770 188, 860 198, 1000 192"/>
    <path d="M0 208 C 230 198, 450 222, 670 210 C 770 204, 860 214, 1000 208"/>
  </g>
  <path fill="#dfe8d6" d="M0 226 L1000 220 L1000 560 L0 560 Z"/>

  <!-- 杉林 -->
  <g fill="#3f6b52">
    <path d="M8 226 l16 -58 l16 58 z"/><path d="M42 226 l13 -46 l13 46 z"/>
    <path d="M952 226 l15 -54 l15 54 z"/><path d="M918 226 l13 -46 l13 46 z"/>
  </g>

  <!-- 左：神社の社殿 -->
  <g>
    <path d="M40 300 L156 246 L272 300 Z" fill="#6b5643"/>
    <path d="M62 300 L156 256 L250 300 Z" fill="#8a7154"/>
    <path d="M32 300 L280 300 L280 312 L32 312 Z" fill="#59483a"/>
    <rect x="62" y="312" width="188" height="98" fill="#efe7d6" stroke="#bdb49f" stroke-width="4"/>
    <g fill="#b03c30">
      <rect x="80" y="330" width="18" height="80"/><rect x="214" y="330" width="18" height="80"/>
    </g>
    <rect x="106" y="330" width="100" height="80" fill="#c8bda8" stroke="#a2977f" stroke-width="3"/>
    <g stroke="#a2977f" stroke-width="3" fill="none">
      <path d="M131 330 L131 410 M156 330 L156 410 M181 330 L181 410"/>
    </g>
    <!-- 階段 -->
    <g fill="#cfc6b3" stroke="#aca392" stroke-width="2">
      <rect x="112" y="410" width="88" height="10"/><rect x="104" y="420" width="104" height="10"/>
      <rect x="96" y="430" width="120" height="10"/>
    </g>
  </g>

  <!-- ナギの大木 -->
  <g>
    <path d="M330 470 C 322 400, 328 352, 336 306 L378 306 C 384 352, 390 400, 384 470 Z" fill="#7a6247"/>
    <g stroke="#5f4c37" stroke-width="4" fill="none">
      <path d="M344 460 C 340 404, 344 356, 348 312"/>
      <path d="M368 462 C 372 406, 370 358, 366 312"/>
    </g>
    <ellipse cx="356" cy="216" rx="120" ry="104" fill="url(#ng1Crown)"/>
    <ellipse cx="288" cy="252" rx="62" ry="48" fill="#2c5c38"/>
    <ellipse cx="428" cy="248" rx="60" ry="46" fill="#2c5c38"/>
    <!-- 木の下の暗がり -->
    <ellipse cx="356" cy="474" rx="132" ry="24" fill="#b9c7ae" opacity="0.85"/>
    <!-- 柵 -->
    <g stroke="#8a7a5e" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M262 490 L262 452"/><path d="M320 494 L320 456"/>
      <path d="M394 494 L394 456"/><path d="M452 490 L452 452"/>
      <path d="M258 466 L456 462"/>
    </g>
    <!-- 標柱 -->
    <path d="M196 542 L196 452" stroke="#a49274" stroke-width="14" fill="none"/>
    <rect x="128" y="446" width="140" height="34" rx="6" fill="#ffffff" stroke="#3e6b55" stroke-width="3"/>
    <text x="198" y="469" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">県指定天然記念物</text>
    <rect x="292" y="500" width="128" height="30" rx="7" fill="#3e6b55"/>
    <text x="356" y="521" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">目通り5.0m</text>
  </g>

  <!-- 右：実家と庭の大木 -->
  <g>
    <path d="M572 372 L680 302 L788 372 Z" fill="#6f7c82"/>
    <path d="M590 372 L680 312 L770 372 Z" fill="#8b979b"/>
    <rect x="590" y="372" width="180" height="100" fill="#e9e3d3" stroke="#bdb49f" stroke-width="4"/>
    <g fill="#b9ac91" stroke="#948a72" stroke-width="3">
      <rect x="606" y="394" width="66" height="62"/><rect x="690" y="394" width="66" height="62"/>
    </g>
    <g stroke="#948a72" stroke-width="3" fill="none">
      <path d="M628 394 L628 456 M650 394 L650 456"/>
      <path d="M712 394 L712 456 M734 394 L734 456"/>
    </g>
  </g>
  <!-- 庭の大木（屋根と電線に枝がかかる） -->
  <g>
    <path d="M826 502 C 818 440, 824 400, 834 360 L872 360 C 880 400, 886 440, 878 502 Z" fill="#7a6247"/>
    <g stroke="#5f4c37" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M840 372 C 800 350, 760 336, 700 330"/>
      <path d="M866 368 C 900 344, 930 330, 962 322"/>
      <path d="M848 360 C 832 320, 826 300, 830 274"/>
    </g>
    <ellipse cx="770" cy="316" rx="78" ry="52" fill="#4f7c46"/>
    <ellipse cx="912" cy="304" rx="70" ry="48" fill="#4f7c46"/>
    <ellipse cx="838" cy="262" rx="76" ry="56" fill="#5d8b4e"/>
    <ellipse cx="700" cy="326" rx="46" ry="32" fill="#4f7c46"/>
    <!-- 枯れ枝 -->
    <path d="M872 396 C 906 386, 926 378, 946 362" stroke="#9c8a6a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M930 372 L942 358 M918 376 L924 362" stroke="#9c8a6a" stroke-width="4" fill="none"/>
    <!-- 巻尺 -->
    <path d="M818 440 C 840 452, 872 452, 890 440" stroke="#f0d878" stroke-width="9" fill="none"/>
    <path d="M818 440 C 840 452, 872 452, 890 440" stroke="#b89a2c" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
    <circle cx="906" cy="430" r="20" fill="#d8892f" stroke="#a8681e" stroke-width="4"/>
    <circle cx="906" cy="430" r="7" fill="#f4e7cd"/>
    <!-- 落ち葉 -->
    <g fill="#a89050">
      <ellipse cx="792" cy="522" rx="12" ry="6"/><ellipse cx="822" cy="532" rx="11" ry="5"/>
      <ellipse cx="898" cy="526" rx="12" ry="6"/><ellipse cx="932" cy="536" rx="10" ry="5"/>
    </g>
  </g>
  <!-- 電柱と電線（枝の手前に描く） -->
  <g>
    <path d="M962 512 L962 176" stroke="#9aa39f" stroke-width="10" fill="none"/>
    <path d="M930 202 L994 202 M934 232 L990 232" stroke="#9aa39f" stroke-width="6" fill="none"/>
    <path d="M930 206 C 818 224, 702 232, 566 220" stroke="#5f6a65" stroke-width="4" fill="none"/>
    <path d="M934 236 C 820 254, 704 262, 568 250" stroke="#5f6a65" stroke-width="4" fill="none"/>
  </g>
  <rect x="736" y="486" width="212" height="30" rx="7" fill="#ffffff" stroke="#c0563c" stroke-width="3"/>
  <text x="842" y="507" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0563c" text-anchor="middle">測った人は、まだいない</text>
</svg>
