    <path d="M686 424 C 686 448, 690 458, 692 468 L714 468 C 718 458, 722 448, 720 424 Z" fill="#7a5b8c" stroke="#57406a" stroke-width="3"/>
    <path d="M686 432 L666 424" stroke="#f0d2b0" stroke-width="6" stroke-linecap="round"/>
    <path d="M664 414 L648 420 L648 436 L664 442 Z" fill="#b8563a" stroke="#8a3b26" stroke-width="3"/>
  </g>

  <!-- 笛方（奥） -->
  <g>
    <circle cx="612" cy="300" r="13" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M600 318 C 600 336, 604 344, 606 352 L626 352 C 628 344, 632 336, 630 318 Z" fill="#3c5f43" stroke="#28422e" stroke-width="3"/>
    <path d="M622 300 L662 292" stroke="#e8dfc6" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 舞台の下：教える大人と待つ子ども -->
  <g>
    <circle cx="186" cy="418" r="17" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M168 444 C 168 486, 174 508, 176 528 L204 528 C 208 508, 216 486, 214 444 Z" fill="#b8845e" stroke="#8d6242" stroke-width="3"/>
    <path d="M212 456 L246 440" stroke="#f0d2b0" stroke-width="8" stroke-linecap="round"/>
    <path d="M246 440 L262 430" stroke="#f0d2b0" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="300" cy="494" r="14" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M284 516 C 284 536, 288 548, 290 560 L316 560 C 318 548, 322 536, 320 516 Z" fill="#87a45f" stroke="#5f7b3d" stroke-width="3"/>
    <circle cx="356" cy="498" r="14" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M340 520 C 340 538, 344 550, 346 560 L372 560 C 374 550, 378 538, 376 520 Z" fill="#d8785e" stroke="#a75340" stroke-width="3"/>
  </g>

  <!-- 空いた座布団 -->
  <g fill="#c9cdbd" stroke="#a7ab99" stroke-width="3">
    <rect x="412" y="504" width="64" height="34" rx="6"/>
    <rect x="492" y="504" width="64" height="34" rx="6"/>
    <rect x="572" y="504" width="64" height="34" rx="6"/>
  </g>

  <!-- 札 -->
  <g>
    <rect x="734" y="474" width="242" height="42" rx="6" fill="#ffffff" stroke="#c0563c" stroke-width="4"/>
    <text x="855" y="502" font-family="sans-serif" font-size="19" font-weight="bold" fill="#c0563c" text-anchor="middle">舞うのは小学生と中学生</text>
  </g>
</svg>
