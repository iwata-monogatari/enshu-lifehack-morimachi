<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="cr1Title cr1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="cr1Title">森町の神社の舟形の舞台で子どもが舞う場面を描いたイラスト</title>
  <desc id="cr1Desc">神社の境内に舟形の舞台があり、その上では、かまきりの形のかぶりものをつけ背中に四枚の羽根を背負った子どもが舞っています。舞台の左側では別の子どもが丸柱に手をかけて登ろうとしています。舞台の左右には鼓を打つ人が二人ずつ並び、奥では横笛を吹く人が座っています。舞台の下では大人が身ぶりで手の形を教え、その前に稽古を待つ子どもが二人だけ座っています。舞台の脇には誰も座っていない座布団が三枚並んでいます。背景には社殿の屋根と杉木立、遠州の山並みと段になった茶畑が広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="cr1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8cade"/><stop offset="1" stop-color="#e9f0e4"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef2e6"/>
  <rect width="1000" height="170" fill="url(#cr1Sky)"/>
  <path fill="#8fa9b8" d="M0 116 L98 58 L206 114 L316 52 L432 114 L552 54 L668 114 L788 60 L898 114 L1000 76 L1000 162 L0 162 Z"/>
  <g fill="#3d6350">
    <path d="M22 176 l16 -56 l16 56 z"/><path d="M56 176 l13 -46 l13 46 z"/><path d="M88 176 l15 -50 l15 50 z"/>
    <path d="M886 176 l15 -50 l15 50 z"/><path d="M918 176 l17 -58 l17 58 z"/><path d="M954 176 l14 -48 l14 48 z"/>
  </g>
  <path fill="#7fae57" d="M0 178 C 230 170, 430 192, 650 180 C 790 172, 890 184, 1000 176 L1000 214 L0 220 Z"/>
  <g stroke="#5f8a42" stroke-width="4" opacity="0.85" fill="none">
    <path d="M0 192 C 230 184, 430 206, 650 194 C 790 186, 890 198, 1000 190"/>
    <path d="M0 206 C 230 198, 430 220, 650 208 C 790 200, 890 212, 1000 204"/>
  </g>
  <path fill="#dde3d2" d="M0 216 L1000 210 L1000 560 L0 560 Z"/>

  <!-- 社殿 -->
  <g>
    <rect x="316" y="196" width="368" height="60" fill="#e8e0cc" stroke="#a99a78" stroke-width="4"/>
    <path d="M282 200 L500 132 L718 200 Z" fill="#6a7a80"/>
    <path d="M282 200 L718 200 L718 214 L282 214 Z" fill="#55656b"/>
    <path d="M470 132 L470 108 M530 132 L530 108" stroke="#55656b" stroke-width="6"/>
  </g>

  <!-- 舟形の舞台 -->
  <g>
    <path d="M258 452 C 300 490, 700 490, 742 452 L742 330 L258 330 Z" fill="#e5d9bd" stroke="#a3915f" stroke-width="5"/>
    <path d="M258 330 L742 330 L742 346 L258 346 Z" fill="#c9b072"/>
    <!-- 高覧 -->
    <g stroke="#a3915f" stroke-width="5" fill="none">
      <path d="M266 384 L266 346 M742 384 L742 346"/>
      <path d="M258 384 L742 384" stroke-width="6"/>
    </g>
    <!-- うすべり -->
    <rect x="400" y="392" width="200" height="48" fill="#f4eeda" stroke="#c8ba90" stroke-width="3"/>
    <!-- 三本の柱 -->
    <g stroke="#8d7a4c" stroke-width="12" stroke-linecap="round">
      <path d="M348 330 L348 214"/><path d="M500 330 L500 200"/><path d="M652 330 L652 214"/>
    </g>
    <!-- 神紋幕 -->
    <path d="M470 214 L672 214 L672 268 L470 268 Z" fill="#3f5674" opacity="0.9"/>
    <g fill="#e6ecf2"><circle cx="516" cy="240" r="9"/><circle cx="570" cy="240" r="9"/><circle cx="624" cy="240" r="9"/></g>
  </g>

  <!-- 蟷螂を舞う子ども -->
  <g>
    <path d="M448 356 C 420 344, 404 366, 424 384 Z" fill="#7fa85a" stroke="#5c7f3c" stroke-width="3"/>
    <path d="M552 356 C 580 344, 596 366, 576 384 Z" fill="#7fa85a" stroke="#5c7f3c" stroke-width="3"/>
    <path d="M462 350 C 444 336, 442 316, 460 306 Z" fill="#93bd6a" stroke="#5c7f3c" stroke-width="3"/>
    <path d="M538 350 C 556 336, 558 316, 540 306 Z" fill="#93bd6a" stroke="#5c7f3c" stroke-width="3"/>
    <circle cx="500" cy="326" r="24" fill="#8fb45f" stroke="#5c7f3c" stroke-width="4"/>
    <g fill="#33421f"><circle cx="490" cy="320" r="5"/><circle cx="510" cy="320" r="5"/></g>
    <path d="M486 302 L478 282 M514 302 L522 282" stroke="#5c7f3c" stroke-width="4"/>
    <path d="M482 350 C 482 386, 486 400, 488 414 L512 414 C 516 400, 520 386, 518 350 Z" fill="#d8a5b8" stroke="#b07f92" stroke-width="3"/>
    <path d="M472 360 L444 372 M528 360 L556 372" stroke="#f0d2b0" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 柱に手をかける子ども（龍の役） -->
  <g>
    <circle cx="372" cy="336" r="15" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M358 358 C 358 386, 362 400, 364 414 L386 414 C 390 400, 394 386, 392 358 Z" fill="#5f86a8" stroke="#3f6684" stroke-width="3"/>
    <path d="M362 364 L348 340" stroke="#f0d2b0" stroke-width="7" stroke-linecap="round"/>
    <path d="M388 364 L400 344" stroke="#f0d2b0" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- 鼓の奏者（左右） -->
  <g>
