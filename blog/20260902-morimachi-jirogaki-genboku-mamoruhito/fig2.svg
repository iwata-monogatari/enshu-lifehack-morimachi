<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial"><title id="title">次郎柿原木を守る一年の作業</title><desc id="desc">剪定、施肥、樹勢観察、写真記録と引継ぎを円環にした図。</desc><rect width="1000" height="560" rx="24" fill="#edf3e7"/><circle cx="500" cy="300" r="190" fill="#fffdf4" stroke="#8aa36c" stroke-width="12"/><path d="M500 300 L500 116 M500 300 L684 300 M500 300 L500 484 M500 300 L316 300" stroke="#d8e2c9" stroke-width="5"/><g font-family="sans-serif" text-anchor="middle"><g fill="#38504a" font-size="26" font-weight="700"><text x="500" y="74">剪定</text><text x="790" y="308">樹勢観察</text><text x="500" y="540">写真・引継ぎ</text><text x="205" y="308">施肥</text></g><g transform="translate(435 205)"><path d="M65 184 V62" stroke="#684d35" stroke-width="20"/><path d="M65 88 Q8 52 4 12 M65 88 Q124 48 130 10" stroke="#684d35" stroke-width="14" fill="none"/><circle cx="8" cy="16" r="48" fill="#74965c"/><circle cx="126" cy="14" r="49" fill="#74965c"/><circle cx="65" cy="44" r="55" fill="#83a764"/><circle cx="32" cy="75" r="15" fill="#df7f2c"/><circle cx="101" cy="68" r="15" fill="#df7f2c"/></g><text x="500" y="34" font-size="34" font-weight="700" fill="#304346">守る仕事を一人の勘で終わらせない</text></g><g fill="none" stroke="#c16f2d" stroke-width="9"><path d="M620 125 Q720 170 760 240"/><path d="M755 360 Q700 440 620 470"/><path d="M380 470 Q290 430 245 360"/><path d="M245 240 Q290 160 380 125"/></g></svg>
