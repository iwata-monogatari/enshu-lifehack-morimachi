<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial"><title id="title">次郎柿原木を守る年表</title><desc id="desc">発見、火災、再生、県指定、空洞確認、保存会発足を結ぶ年表。</desc><rect width="1000" height="560" rx="24" fill="#f3f1df"/><path d="M0 405 Q180 330 350 390 T700 380 T1000 400 V560 H0Z" fill="#dce8cf"/><path d="M80 280 H920" stroke="#6b7651" stroke-width="9" stroke-linecap="round"/><g font-family="sans-serif" text-anchor="middle"><g fill="#c16f2d"><circle cx="110" cy="280" r="17"/><circle cx="260" cy="280" r="17"/><circle cx="400" cy="280" r="17"/><circle cx="555" cy="280" r="17"/><circle cx="715" cy="280" r="17"/><circle cx="875" cy="280" r="17"/></g><g font-size="23" font-weight="700" fill="#304346"><text x="110" y="225">1844–47頃</text><text x="260" y="225">1869</text><text x="400" y="225">1870</text><text x="555" y="225">1944</text><text x="715" y="225">1995</text><text x="875" y="225">2004</text></g><g font-size="19" fill="#4d5d58"><text x="110" y="330">幼木を発見</text><text x="260" y="330">火災</text><text x="400" y="330">根元から再生</text><text x="555" y="330">県指定</text><text x="715" y="330">空洞確認</text><text x="875" y="330">保存会発足</text></g><text x="500" y="70" font-size="38" font-weight="700" fill="#304346">約160年は、手を入れてつないだ時間</text><text x="500" y="116" font-size="23" fill="#6d5f42">火災後の地上部は約140年</text></g><g transform="translate(442 372)"><path d="M58 120 V38" stroke="#6d5337" stroke-width="18"/><path d="M58 62 Q12 38 6 10 M58 62 Q106 34 118 8" stroke="#6d5337" stroke-width="12" fill="none"/><circle cx="9" cy="12" r="36" fill="#709557"/><circle cx="112" cy="13" r="38" fill="#709557"/><circle cx="58" cy="30" r="41" fill="#7da25d"/><circle cx="30" cy="52" r="13" fill="#dc7d29"/><circle cx="87" cy="48" r="13" fill="#dc7d29"/></g></svg>
