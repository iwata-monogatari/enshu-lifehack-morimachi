<title id="mm2title">もりもり2万人まつりに関わるときの確認の四段</title>
<desc id="mm2desc">カレンダーに11月22日と9月11日の印を付け、出店料8,800円に横幕3,300円と電気3,300円を積み上げて総額を出し、当日の9時間30分を三人で割り、実行委員会の番号0538-85-6319を控えるまでの順序を、荒天中止の掲示とともに描いた図。</desc>
