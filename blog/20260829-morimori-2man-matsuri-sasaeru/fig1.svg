<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="mm1title mm1desc">
<title id="mm1title">森町産業祭の当日、出店する側の一日</title>
<desc id="mm1desc">文化会館の駐車場を会場にした産業祭で、午前6時に軽トラックから荷を下ろし、午前9時からテントの下で茶と野菜を売り、午後3時30分に机と椅子を片付けるまでの三つの場面を、一本の時間の帯の上に並べた図。テントの脇に出店料8,800円の札、机の下に1,500Wまでの電源が描かれている。</desc>
