<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="fnu2Title fnu2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="fnu2Title">地区の祭りに外部の資金を入れるまでの順番を、四つの段として描いたイラスト</title>
  <desc id="fnu2Desc">左端に地区の集会所があり、そこから階段状の段が右上へ伸びています。一段目には見積書と電卓が置かれ、必要な費目と金額を書き出す場面が描かれています。二段目には鞘堂に納まった常夜灯と屋台があり、指定文化財かどうかを確かめる札が立っています。三段目には役場の建物と受話器が並び、担当窓口へ確認する場面になっています。四段目にはふるさと納税の申込画面を映した端末があり、使い道の区分名を書いた紙が添えられています。背景には段になった茶畑と杉林、遠州の山並みが続いています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="fnu2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbdcea"/><stop offset="1" stop-color="#eef2e6"/>
    </linearGradient>
    <linearGradient id="fnu2Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba7bb"/><stop offset="1" stop-color="#b7cad1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="120" fill="url(#fnu2Sky)"/>
  <path fill="url(#fnu2Far)" d="M0 78 L92 26 L186 78 L292 20 L398 78 L508 18 L614 78 L722 26 L828 78 L930 30 L1000 66 L1000 110 L0 110 Z"/>
  <path fill="#7fae57" d="M0 120 C 220 114, 440 132, 660 122 C 770 116, 866 124, 1000 120 L1000 150 L0 154 Z"/>
  <g stroke="#5d8840" stroke-width="3" opacity="0.85" fill="none">
    <path d="M0 130 C 220 124, 440 142, 660 132 C 770 126, 866 134, 1000 130"/>
  </g>
  <g fill="#3f6b52">
    <path d="M8 152 l13 -42 l13 42 z"/><path d="M950 152 l13 -40 l13 40 z"/>
  </g>
  <path fill="#e2ead9" d="M0 150 L1000 144 L1000 560 L0 560 Z"/>

  <!-- 階段 -->
  <g fill="#cdc0a5" stroke="#b3a487" stroke-width="4">
    <rect x="150" y="468" width="200" height="92"/>
    <rect x="350" y="404" width="200" height="156"/>
    <rect x="550" y="340" width="200" height="220"/>
    <rect x="750" y="276" width="240" height="284"/>
  </g>

  <!-- 左端：集会所 -->
  <g>
    <path d="M12 420 L76 384 L140 420 Z" fill="#7d6a58"/>
    <rect x="24" y="420" width="104" height="66" fill="#f2eee4" stroke="#b6ad9c" stroke-width="4"/>
    <rect x="38" y="436" width="28" height="24" fill="#cfd9d6" stroke="#9aa5a3" stroke-width="3"/>
    <rect x="86" y="436" width="28" height="24" fill="#cfd9d6" stroke="#9aa5a3" stroke-width="3"/>
    <rect x="56" y="472" width="42" height="14" fill="#c9b58a"/>
  </g>

  <!-- 1段目：見積書と電卓 -->
  <g>
    <rect x="170" y="368" width="120" height="96" rx="6" fill="#ffffff" stroke="#7d8a80" stroke-width="5"/>
    <g stroke="#9aa8a0" stroke-width="4" fill="none">
      <path d="M186 394 L274 394"/><path d="M186 414 L274 414"/><path d="M186 434 L240 434"/>
    </g>
    <rect x="298" y="404" width="46" height="60" rx="6" fill="#dfe9ee" stroke="#6f8b99" stroke-width="4"/>
    <rect x="306" y="412" width="30" height="14" fill="#8fb7a2"/>
    <g fill="#6f8b99"><rect x="306" y="432" width="9" height="9"/><rect x="320" y="432" width="9" height="9"/><rect x="306" y="446" width="9" height="9"/><rect x="320" y="446" width="9" height="9"/></g>
    <text x="164" y="358" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="23" font-weight="bold" fill="#2b6f54">1. 費目と金額</text>
    <circle cx="200" cy="506" r="18" fill="#2f7f5f" stroke="#ffffff" stroke-width="5"/>
    <text x="193" y="515" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff">1</text>
  </g>

  <!-- 2段目：鞘堂と屋台 -->
  <g>
    <path d="M368 322 L426 288 L484 322 Z" fill="#6b6154"/>
    <rect x="376" y="322" width="10" height="52" fill="#8a6a44"/>
    <rect x="466" y="322" width="10" height="52" fill="#8a6a44"/>
    <rect x="404" y="336" width="44" height="26" fill="#f4e3b4" stroke="#a08d55" stroke-width="4"/>
    <path d="M426 340 l7 16 l-14 0 z" fill="#e8893f"/>
    <rect x="368" y="372" width="116" height="12" fill="#6f5a3f"/>
    <path d="M498 348 L544 348 L550 362 L492 362 Z" fill="#8a6a44"/>
    <rect x="500" y="362" width="42" height="22" fill="#c8a877" stroke="#8a6a44" stroke-width="3"/>
    <text x="360" y="278" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="23" font-weight="bold" fill="#2b6f54">2. 指定の有無</text>
    <circle cx="400" cy="442" r="18" fill="#2f7f5f" stroke="#ffffff" stroke-width="5"/>
    <text x="393" y="451" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff">2</text>
  </g>

  <!-- 3段目：役場と受話器 -->
  <g>
    <rect x="572" y="252" width="112" height="66" fill="#f2eee4" stroke="#9aa5a3" stroke-width="4"/>
    <path d="M566 252 L690 252 L678 230 L578 230 Z" fill="#7d8a80"/>
    <rect x="590" y="272" width="26" height="26" fill="#cfd9d6" stroke="#9aa5a3" stroke-width="3"/>
    <rect x="640" y="272" width="26" height="26" fill="#cfd9d6" stroke="#9aa5a3" stroke-width="3"/>
    <g transform="translate(700 258)">
      <path d="M0 22 C 0 8, 12 -2, 26 -2 C 40 -2, 52 8, 52 22" stroke="#4b6f8a" stroke-width="10" fill="none"/>
      <rect x="-8" y="18" width="20" height="16" rx="5" fill="#4b6f8a"/>
      <rect x="40" y="18" width="20" height="16" rx="5" fill="#4b6f8a"/>
    </g>
    <text x="560" y="220" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="23" font-weight="bold" fill="#2b6f54">3. 窓口に聞く</text>
    <circle cx="600" cy="378" r="18" fill="#2f7f5f" stroke="#ffffff" stroke-width="5"/>
    <text x="593" y="387" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff">3</text>
  </g>

  <!-- 4段目：端末と区分名の紙 -->
  <g>
    <rect x="774" y="176" width="150" height="98" rx="8" fill="#3b4a52" stroke="#26313a" stroke-width="5"/>
    <rect x="786" y="188" width="126" height="74" rx="4" fill="#dfe9ee"/>
    <g stroke="#6f8b99" stroke-width="4" fill="none">
      <path d="M798 208 L900 208"/><path d="M798 226 L900 226"/><path d="M798 244 L862 244"/>
    </g>
    <rect x="936" y="196" width="54" height="78" rx="4" fill="#ffffff" stroke="#7d8a80" stroke-width="4"/>
    <g stroke="#9aa8a0" stroke-width="3" fill="none">
      <path d="M946 216 L980 216"/><path d="M946 232 L980 232"/><path d="M946 248 L968 248"/>
    </g>
    <text x="756" y="164" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="23" font-weight="bold" fill="#2b6f54">4. 区分名を伝える</text>
    <circle cx="800" cy="316" r="18" fill="#2f7f5f" stroke="#ffffff" stroke-width="5"/>
    <text x="793" y="325" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="21" font-weight="bold" fill="#ffffff">4</text>
    <text x="770" y="368" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="20" fill="#3b4a42">遠州の小京都</text>
    <text x="770" y="394" font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif" font-size="20" fill="#3b4a42">まちづくり事業</text>
  </g>
</svg>
