<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" data-illustration="mori-editorial" role="img" aria-labelledby="title desc">
  <title id="title">空き家の浄化槽を継続する場合と正式に休止する場合の比較</title>
  <desc id="desc">左に継続時の保守点検、清掃、法定検査、右に休止前清掃、休止届、検査機関への連絡を示す。</desc>
  <rect width="1000" height="560" rx="20" fill="#f4f1e7"/>
  <path d="M0 128L125 54l122 65 143-91 141 96 148-76 131 74 110-56v-66H0z" fill="#bdd3d2"/>
  <path d="M0 143l130-55 154 68 158-62 142 66 171-63 145 55 100-35v63H0z" fill="#88aa98"/>
  <rect x="36" y="28" width="928" height="78" rx="14" fill="#fffdf6" stroke="#315f5a" stroke-width="3"/>
  <text x="70" y="78" font-family="sans-serif" font-size="34" font-weight="700" fill="#214b48">空き家の浄化槽　継続と正式な休止</text>
  <rect x="52" y="158" width="420" height="300" rx="18" fill="#e8f3eb" stroke="#417a62" stroke-width="4"/>
  <rect x="528" y="158" width="420" height="300" rx="18" fill="#e7f0f5" stroke="#456f87" stroke-width="4"/>
  <circle cx="104" cy="211" r="27" fill="#4f8a70"/>
  <path d="M90 211l10 11 20-25" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="148" y="222" font-family="sans-serif" font-size="30" font-weight="700" fill="#285a48">継続</text>
  <text x="84" y="274" font-family="sans-serif" font-size="23" font-weight="700" fill="#264b40">保守点検　年3〜4回以上</text>
  <text x="84" y="321" font-family="sans-serif" font-size="23" font-weight="700" fill="#264b40">清掃　　　年1回以上</text>
  <text x="84" y="368" font-family="sans-serif" font-size="23" font-weight="700" fill="#264b40">法定検査　年1回</text>
  <rect x="82" y="398" width="360" height="38" rx="8" fill="#fff" opacity=".9"/>
  <text x="101" y="425" font-family="sans-serif" font-size="18" fill="#355d50">帰省・片付け・内覧で使う見込み</text>
  <circle cx="581" cy="211" r="27" fill="#537e96"/>
  <path d="M568 212h26M581 199v26" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <text x="625" y="222" font-family="sans-serif" font-size="30" font-weight="700" fill="#335f76">休止</text>
  <text x="558" y="272" font-family="sans-serif" font-size="22" font-weight="700" fill="#2f5365">1　許可業者が休止前清掃</text>
  <text x="558" y="318" font-family="sans-serif" font-size="22" font-weight="700" fill="#2f5365">2　清掃記録を添えて休止届</text>
  <text x="558" y="364" font-family="sans-serif" font-size="22" font-weight="700" fill="#2f5365">3　検査機関へ休止を連絡</text>
  <rect x="558" y="398" width="360" height="38" rx="8" fill="#fff" opacity=".9"/>
  <text x="577" y="425" font-family="sans-serif" font-size="18" fill="#405e6b">再開まで三つの義務を免除</text>
  <rect x="52" y="484" width="896" height="52" rx="11" fill="#6f4937"/>
  <text x="500" y="518" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#fff">空き家・電源OFFだけでは休止にならない</text>
</svg>
