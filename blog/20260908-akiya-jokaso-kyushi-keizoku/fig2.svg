<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" data-illustration="mori-editorial" role="img" aria-labelledby="title desc">
  <title id="title">浄化槽を休止か継続か決める前に一枚へ集める情報</title>
  <desc id="desc">銘板、保守点検、清掃、法定検査、次の使用日、現地担当を確認し、窓口と業者へ相談する流れ。</desc>
