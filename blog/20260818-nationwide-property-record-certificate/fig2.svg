<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="pr2Title pr2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="pr2Title">森町の実家から法務局を経て、見つかった土地の届出まで進む確認の順番を一本の道すじとして描いたイラスト</title>
<desc id="pr2Desc">左端の実家の縁側で、古い権利証と登記の書類、封筒の束を探す場面から道が始まります。次に役場の窓口で戸籍と住民票の除票を受け取り、親の昔の住所を並べる場面が続きます。三つ目に法務局の窓口で所有不動産記録証明書を請求し、収入印紙を貼る場面があります。そこから道が三つに分かれ、上の道は九十日と書かれた立札のある杉林へ、中の道は十カ月と書かれた立札のある水田へ、下の道は瓦屋根の家と課税明細書へ続きます。三つの道は右端で合流し、家族が地図に印を並べて記録に残す場面で終わります。下には八月から十一月までの帯が伸びています。背景には遠州の山並みと杉木立、段になった茶畑、太田川らしい流れと橋が広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="pr2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3d9e6"/><stop offset="1" stop-color="#f0f4e8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#f2f4ea"/>
  <rect width="1000" height="132" fill="url(#pr2Sky)"/>
  <path fill="#9db4be" d="M0 92 L92 42 L198 92 L308 38 L422 92 L540 40 L656 92 L776 44 L888 92 L1000 56 L1000 128 L0 128 Z"/>
  <g fill="#3d6350">
    <path d="M18 132 l12 -40 l12 40 z"/><path d="M46 132 l14 -46 l14 46 z"/><path d="M78 132 l11 -34 l11 34 z"/>
    <path d="M898 132 l12 -40 l12 40 z"/><path d="M928 132 l14 -46 l14 46 z"/><path d="M962 132 l11 -34 l11 34 z"/>
  </g>

  <!-- 段になった茶畑 -->
  <path fill="#8fb469" d="M0 134 C 260 126, 500 150, 740 136 C 850 130, 930 142, 1000 134 L1000 176 L0 182 Z"/>
  <g stroke="#5f8543" stroke-width="5" opacity="0.9" fill="none">
    <path d="M0 148 C 260 140, 500 164, 740 150 C 850 144, 930 156, 1000 148"/>
    <path d="M0 164 C 260 156, 500 180, 740 166 C 850 160, 930 172, 1000 164"/>
  </g>

  <!-- 川と橋 -->
  <path fill="#a6cde2" d="M0 188 L1000 180 L1000 212 L0 220 Z"/>
  <g stroke="#e2f0f6" stroke-width="4" fill="none">
    <path d="M40 206 L230 200"/><path d="M690 198 L936 192"/>
  </g>
  <rect x="352" y="178" width="248" height="9" fill="#cfc7ae"/>
  <g fill="#b6ae95"><rect x="384" y="187" width="8" height="28"/><rect x="474" y="185" width="8" height="28"/><rect x="564" y="183" width="8" height="28"/></g>

  <rect x="0" y="216" width="1000" height="344" fill="#e6e9d9"/>

  <!-- 道すじ（本線） -->
  <path d="M48 456 C 190 456, 236 404, 366 404 C 486 404, 528 352, 640 352" fill="none" stroke="#cfc4a6" stroke-width="30" stroke-linecap="round"/>
  <path d="M48 456 C 190 456, 236 404, 366 404 C 486 404, 528 352, 640 352" fill="none" stroke="#fbf7ea" stroke-width="4" stroke-dasharray="16 16"/>
  <!-- 三つの分岐 -->
  <path d="M640 352 C 700 352, 720 268, 800 268 C 862 268, 890 292, 926 300" fill="none" stroke="#cfc4a6" stroke-width="24" stroke-linecap="round"/>
  <path d="M640 352 C 700 352, 724 350, 800 350 C 862 350, 890 316, 926 306" fill="none" stroke="#cfc4a6" stroke-width="24" stroke-linecap="round"/>
  <path d="M640 352 C 700 352, 720 434, 800 434 C 862 434, 890 342, 926 314" fill="none" stroke="#cfc4a6" stroke-width="24" stroke-linecap="round"/>
  <g fill="none" stroke="#fbf7ea" stroke-width="4" stroke-dasharray="14 14">
    <path d="M640 352 C 700 352, 720 268, 800 268 C 862 268, 890 292, 926 300"/>
    <path d="M640 352 C 700 352, 724 350, 800 350 C 862 350, 890 316, 926 306"/>
    <path d="M640 352 C 700 352, 720 434, 800 434 C 862 434, 890 342, 926 314"/>
  </g>

  <!-- 1. 実家の縁側で権利証を探す -->
  <g>
    <rect x="14" y="286" width="122" height="96" fill="#f4eee2" stroke="#a3997f" stroke-width="4"/>
    <path d="M2 290 L75 244 L148 290 Z" fill="#6a7a80"/>
    <rect x="2" y="290" width="146" height="10" fill="#55636a"/>
    <rect x="30" y="316" width="42" height="34" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <rect x="86" y="316" width="42" height="34" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <circle cx="76" cy="406" r="17" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M56 384 a20 18 0 0 1 40 0 z" fill="#4b4238"/>
    <path d="M58 430 C 58 454, 60 464, 62 478 L90 478 C 92 464, 96 454, 94 430 Z" fill="#5c86a0" stroke="#3f6379" stroke-width="3"/>
    <rect x="100" y="404" width="62" height="44" fill="#e9e2cd" stroke="#a89b7c" stroke-width="3"/>
    <rect x="100" y="404" width="12" height="44" fill="#8d5f43"/>
    <g fill="#fdfbf2" stroke="#a89b7c" stroke-width="3">
      <rect x="112" y="452" width="52" height="26"/><rect x="122" y="444" width="52" height="26"/>
    </g>
    <rect x="8" y="492" width="184" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="100" y="513" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">1 権利証と封筒を出す</text>
  </g>

  <!-- 2. 役場の窓口で除票と戸籍をそろえる -->
  <g>
    <rect x="228" y="276" width="130" height="66" fill="#eceee6" stroke="#9aa196" stroke-width="4"/>
    <path d="M216 280 L293 242 L370 280 Z" fill="#7c8a90"/>
    <rect x="242" y="296" width="30" height="24" fill="#f6d98f" stroke="#c9a94f" stroke-width="3"/>
    <rect x="314" y="296" width="30" height="24" fill="#f6d98f" stroke="#c9a94f" stroke-width="3"/>
    <rect x="224" y="342" width="140" height="16" fill="#b98f5d"/>
    <circle cx="258" cy="376" r="16" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M239 355 a19 17 0 0 1 38 0 z" fill="#57493c"/>
    <path d="M241 398 C 241 422, 243 432, 245 446 L271 446 C 273 432, 277 422, 275 398 Z" fill="#87a45f" stroke="#5f7b3d" stroke-width="3"/>
    <rect x="284" y="372" width="72" height="48" fill="#fdfbf2" stroke="#a89b7c" stroke-width="3"/>
    <g stroke="#cfc5a8" stroke-width="3" fill="none"><path d="M294 386 L346 386 M294 398 L346 398 M294 410 L332 410"/></g>
    <rect x="210" y="462" width="188" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="304" y="483" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">2 昔の住所を並べる</text>
  </g>

  <!-- 3. 法務局で証明書を請求し、収入印紙を貼る -->
  <g>
    <rect x="440" y="248" width="128" height="70" fill="#eceee6" stroke="#9aa196" stroke-width="4"/>
    <path d="M428 252 L504 214 L580 252 Z" fill="#6f7f86"/>
    <rect x="452" y="270" width="30" height="26" fill="#cfe0ea" stroke="#8fadbd" stroke-width="3"/>
    <rect x="524" y="270" width="30" height="26" fill="#cfe0ea" stroke="#8fadbd" stroke-width="3"/>
    <rect x="436" y="318" width="140" height="16" fill="#b98f5d"/>
    <circle cx="472" cy="356" r="17" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M452 334 a20 18 0 0 1 40 0 z" fill="#4b4238"/>
    <path d="M454 380 C 454 406, 456 418, 458 434 L486 434 C 488 418, 492 406, 490 380 Z" fill="#a06a7c" stroke="#7d4d5e" stroke-width="3"/>
    <path d="M488 392 L522 380" stroke="#f0d2b0" stroke-width="9" stroke-linecap="round"/>
    <rect x="518" y="352" width="76" height="52" fill="#ffffff" stroke="#98a2a8" stroke-width="3"/>
    <rect x="518" y="352" width="76" height="14" fill="#1f3e52"/>
    <g stroke="#b8c1c6" stroke-width="3" fill="none"><path d="M528 378 L584 378 M528 390 L568 390"/></g>
    <rect x="562" y="330" width="30" height="24" fill="#f6d98f" stroke="#b58f34" stroke-width="3"/>
    <text x="577" y="348" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7d5a1f" text-anchor="middle">印紙</text>
    <rect x="422" y="462" width="212" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="528" y="483" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">3 全国分を一枚で請求</text>
  </g>

  <!-- 4a. 山：90日 -->
  <g>
    <g fill="#3d6350">
      <path d="M700 268 l16 -52 l16 52 z"/><path d="M732 268 l18 -60 l18 60 z"/><path d="M768 268 l15 -50 l15 50 z"/>
    </g>
    <rect x="742" y="268" width="10" height="40" fill="#8d8368"/>
    <rect x="694" y="228" width="106" height="32" rx="5" fill="#ffffff" stroke="#3f6b4f" stroke-width="4"/>
    <text x="747" y="250" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f5b41" text-anchor="middle">山 90日</text>
  </g>

  <!-- 4b. 田：10カ月 -->
  <g>
    <rect x="694" y="336" width="112" height="34" rx="4" fill="#a9cbe0" stroke="#7fa5b6" stroke-width="3"/>
    <g stroke="#7fb46a" stroke-width="4" fill="none">
      <path d="M706 366 L706 344 M722 366 L722 342 M738 366 L738 344 M754 366 L754 342 M770 366 L770 344 M786 366 L786 342"/>
    </g>
    <rect x="686" y="378" width="128" height="30" rx="5" fill="#ffffff" stroke="#3f6b4f" stroke-width="4"/>
    <text x="750" y="399" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f5b41" text-anchor="middle">田畑 10カ月</text>
  </g>

  <!-- 4c. 家：課税明細 -->
  <g>
    <rect x="700" y="428" width="90" height="46" fill="#f4eee2" stroke="#a3997f" stroke-width="4"/>
    <path d="M688 432 L745 402 L802 432 Z" fill="#7f8d93"/>
    <rect x="716" y="446" width="26" height="28" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <rect x="806" y="430" width="62" height="44" fill="#fdfbf2" stroke="#a89b7c" stroke-width="3"/>
    <g stroke="#cfc5a8" stroke-width="3" fill="none"><path d="M814 444 L860 444 M814 456 L860 456 M814 466 L848 466"/></g>
    <rect x="678" y="486" width="164" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="760" y="507" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">家 課税明細と照合</text>
  </g>

  <!-- 5. 合流点：地図に印を並べて記録に残す -->
  <g>
    <rect x="890" y="318" width="12" height="104" fill="#8d8368"/>
    <rect x="852" y="222" width="140" height="76" rx="6" fill="#f6f2e2" stroke="#1f3e52" stroke-width="4"/>
    <path d="M862 276 C 890 262, 908 274, 930 264 C 952 254, 968 266, 982 260" fill="none" stroke="#9fbcd0" stroke-width="4"/>
    <rect x="896" y="238" width="4" height="26" fill="#5a4a34"/>
    <path d="M900 238 L928 244 L900 250 Z" fill="#3f7f4c"/>
    <rect x="868" y="246" width="4" height="24" fill="#5a4a34"/>
    <path d="M872 246 L896 252 L872 258 Z" fill="#c0563c"/>
    <rect x="944" y="244" width="4" height="24" fill="#5a4a34"/>
    <path d="M948 244 L972 250 L948 256 Z" fill="#c0563c"/>
    <rect x="848" y="428" width="76" height="48" fill="#fdfbf2" stroke="#8d8368" stroke-width="3"/>
    <g stroke="#c3bda6" stroke-width="3" fill="none"><path d="M858 444 L914 444 M858 456 L914 456 M858 468 L896 468"/></g>
    <rect x="828" y="486" width="164" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="910" y="507" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">5 家族の記録に残す</text>
  </g>

  <!-- 下の帯：八月から十一月 -->
  <g>
    <rect x="24" y="528" width="952" height="26" rx="13" fill="#1f3e52"/>
    <text x="120" y="547" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">8月 手元の紙を集める</text>
    <text x="400" y="547" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">9月 戸籍と除票をそろえる</text>
    <text x="680" y="547" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">10月 法務局へ請求</text>
    <text x="890" y="547" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f6d98f" text-anchor="middle">11月 届出へ</text>
  </g>
</svg>
