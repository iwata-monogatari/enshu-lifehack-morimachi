    <rect x="852" y="440" width="140" height="38" rx="6" fill="#ffffff" stroke="#1f3e52" stroke-width="4"/>
    <text x="922" y="466" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f3e52" text-anchor="middle">定住推進課へ</text>
  </g>
</svg>
