<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="kks1Title kks1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="kks1Title">令和7年国勢調査の速報値で森町の人口と世帯数がどう変わったかを、二組の棒グラフとして描いたイラスト</title>
  <desc id="kks1Desc">左半分に人口の棒が二本あり、令和2年の17,457人を示す高い棒と、令和7年の15,945人を示す低い棒が並び、間に1,512人減・8.66％減と記した下向きの赤い矢印が引かれています。右半分には世帯数の棒が二本並び、6,242世帯から6,095世帯へ147世帯減・2.36％減と示されています。世帯の棒はほとんど同じ高さのままです。下段には1世帯あたり人員が2.80人から2.62人へ下がったことと、全国平均2.15人が記されています。背景には段になった茶畑と杉林、遠州の山並みが続いています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="kks1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbdcea"/><stop offset="1" stop-color="#eef2e6"/>
    </linearGradient>
    <linearGradient id="kks1Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba7bb"/><stop offset="1" stop-color="#b7cad1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="112" fill="url(#kks1Sky)"/>
  <path fill="url(#kks1Far)" d="M0 76 L94 22 L188 76 L292 16 L398 76 L508 14 L614 76 L722 22 L828 76 L930 26 L1000 62 L1000 104 L0 104 Z"/>
  <path fill="#7fae57" d="M0 112 C 220 106, 440 124, 660 114 C 770 108, 866 116, 1000 112 L1000 142 L0 146 Z"/>
  <g stroke="#5d8840" stroke-width="3" opacity="0.85" fill="none">
    <path d="M0 122 C 220 116, 440 134, 660 124 C 770 118, 866 126, 1000 122"/>
  </g>
  <g fill="#3f6b52">
    <path d="M10 144 l13 -40 l13 40 z"/><path d="M42 144 l11 -32 l11 32 z"/>
    <path d="M948 142 l13 -38 l13 38 z"/><path d="M920 142 l11 -30 l11 30 z"/>
  </g>
  <path fill="#e2ead9" d="M0 142 L1000 136 L1000 560 L0 560 Z"/>

  <g font-family="'Meiryo','Hiragino Kaku Gothic ProN',sans-serif">
    <!-- 見出し -->
    <text x="86" y="186" font-size="24" font-weight="bold" fill="#2b4a5c">人口（人）</text>
    <text x="548" y="186" font-size="24" font-weight="bold" fill="#3c5a34">世帯数（世帯）</text>

    <!-- 軸 -->
    <line x1="78" y1="470" x2="962" y2="470" stroke="#7b8a80" stroke-width="4"/>

    <!-- 人口の棒 -->
    <rect x="100" y="220" width="80" height="250" fill="#7f9db0" stroke="#4d6c80" stroke-width="4"/>
    <rect x="210" y="242" width="80" height="228" fill="#4d6c80" stroke="#33505f" stroke-width="4"/>
    <text x="94" y="212" font-size="21" font-weight="bold" fill="#33505f">17,457</text>
    <text x="204" y="234" font-size="21" font-weight="bold" fill="#33505f">15,945</text>
    <text x="98" y="496" font-size="19" fill="#41564c">令和2年</text>
    <text x="208" y="496" font-size="19" fill="#41564c">令和7年</text>

    <!-- 人口の減少 -->
    <g stroke="#b3392c" stroke-width="6" fill="none">
      <path d="M330 250 L330 316"/>
    </g>
    <path fill="#b3392c" d="M316 314 l14 26 l14 -26 z"/>
    <text x="356" y="272" font-size="25" font-weight="bold" fill="#a1332a">−1,512人</text>
    <text x="356" y="308" font-size="25" font-weight="bold" fill="#a1332a">−8.66％</text>

    <!-- 仕切り -->
    <g stroke="#9aa89c" stroke-width="3" stroke-dasharray="10 9" fill="none">
      <path d="M520 176 L520 470"/>
    </g>

    <!-- 世帯の棒 -->
    <rect x="560" y="220" width="80" height="250" fill="#9dbb7c" stroke="#5f8340" stroke-width="4"/>
    <rect x="670" y="226" width="80" height="244" fill="#5f8340" stroke="#456127" stroke-width="4"/>
    <text x="556" y="212" font-size="21" font-weight="bold" fill="#456127">6,242</text>
    <text x="666" y="218" font-size="21" font-weight="bold" fill="#456127">6,095</text>
    <text x="558" y="496" font-size="19" fill="#41564c">令和2年</text>
    <text x="668" y="496" font-size="19" fill="#41564c">令和7年</text>

    <!-- 世帯の減少 -->
    <g stroke="#7a6b2c" stroke-width="5" fill="none">
      <path d="M790 240 L790 268"/>
    </g>
    <path fill="#7a6b2c" d="M778 266 l12 22 l12 -22 z"/>
    <text x="814" y="252" font-size="24" font-weight="bold" fill="#6f6026">−147世帯</text>
    <text x="814" y="286" font-size="24" font-weight="bold" fill="#6f6026">−2.36％</text>

    <!-- 下段の註 -->
    <rect x="78" y="514" width="884" height="40" rx="7" fill="#ffffff" stroke="#8fa192" stroke-width="3"/>
    <text x="94" y="542" font-size="21" fill="#3b4a42">1世帯あたり人員は2.80人から2.62人へ。全国平均は2.15人（2020年は2.26人）</text>
  </g>
</svg>
