<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ot1title ot1desc">
<title id="ot1title">静岡県のお試し住宅13施設の地域別の偏りと、森町の空白</title>
<desc id="ot1desc">伊豆・東部・中部・西部の四つの区画に、静岡県公式のお試し住宅一覧に載る13施設を家のかたちの札で並べた図。伊豆に六つ、東部に一つ、中部に五つ、西部に一つが立ち、西部の浜松市天竜区の札の隣、森町にあたる位置には札がなく、留め穴と「掲載なし」の杭だけが置かれている。手前では荷物を持った家族三人が、その空いた場所を見ている。背景は茶畑の段と杉林の山並み。</desc>
