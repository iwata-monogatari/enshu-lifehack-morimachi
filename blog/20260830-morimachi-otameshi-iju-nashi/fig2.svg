<text x="60" y="356" font-size="15" fill="#4a5a4b">40分・3営業日前・無料</text>

<rect x="272" y="196" width="212" height="180" rx="8" fill="#ffffff" stroke="#7d8f76" stroke-width="3"/>
<text x="288" y="224" font-size="17" font-weight="bold" fill="#1f3e52">2　内見を申し込む</text>
<rect x="292" y="240" width="104" height="96" rx="4" fill="#fbfaf4" stroke="#b8c7b2" stroke-width="3"/>
