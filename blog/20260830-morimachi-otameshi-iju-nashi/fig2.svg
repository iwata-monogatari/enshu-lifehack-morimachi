<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ot2title ot2desc">
<title id="ot2title">案内の無い森町で、暮らしを試す四つの順序</title>
<desc id="ot2desc">一段目はパソコン越しにオンライン移住相談を受ける場面で、四十分・三営業日前・無料の札が添えられている。二段目は空き家・空き地バンクの物件票を見ながら内見を申し込む場面。三段目は家族三人が日曜の町を歩き、店と本の建物と駅の前を通る場面。四段目は机の上の記録用紙に地区名・道路・名義・水道・通学路が書き込まれていく場面。右端には森町の電話番号を控えたメモが描かれている。</desc>
<defs>
<linearGradient id="ot2sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#d3e0ea"/><stop offset="1" stop-color="#eff2e9"/>
</linearGradient>
</defs>
