<text x="744" y="224" font-size="17" font-weight="bold" fill="#1f3e52">4　記録に落とす</text>
<rect x="744" y="240" width="136" height="104" rx="4" fill="#ffffff" stroke="#b8c7b2" stroke-width="3"/>
<g font-size="14" fill="#4a5a4b">
<text x="756" y="264">地区名</text><text x="756" y="286">道路の幅</text>
<text x="756" y="308">名義</text><text x="756" y="330">水道・通学路</text>
</g>
<rect x="892" y="252" width="52" height="70" rx="4" fill="#f4d774" stroke="#cfae3f" stroke-width="3"/>
<text x="898" y="278" font-size="13" fill="#6b5c22">0538</text>
<text x="898" y="298" font-size="13" fill="#6b5c22">85-6321</text>
<rect x="812" y="322" width="70" height="10" rx="4" fill="#d8b04a"/>
<path d="M882 320 L906 327 L882 334 Z" fill="#8a6c34"/>
<text x="744" y="364" font-size="15" fill="#4a5a4b">半年後に効くのは、この四つ</text>
</g>

<rect x="0" y="398" width="1000" height="162" fill="#dfe8d2"/>
<text x="44" y="436" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="19" font-weight="bold" fill="#33503f">2棟あっても案内がない。だから順番のほうを決めておく</text>
<g font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="16" fill="#4a5a4b">
<text x="44" y="472">・県の一覧は11市町13施設。森町は掲載なし（2026年8月30日確認）</text>
<text x="44" y="502">・ただし森町特定居住促進計画には「鍛治島」「天宮」が整備済みで載る</text>
<text x="44" y="532">・料金も申込先も未公表。まず定住推進課移住交流係（0538-85-6321）へ</text>
</g>
</svg>
