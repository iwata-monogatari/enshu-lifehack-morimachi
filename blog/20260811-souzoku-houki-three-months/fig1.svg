    <g fill="#cfd7da">
      <rect x="838" y="304" width="14" height="12" rx="2"/><rect x="862" y="304" width="14" height="12" rx="2"/>
      <rect x="886" y="304" width="14" height="12" rx="2"/><rect x="910" y="304" width="14" height="12" rx="2"/>
