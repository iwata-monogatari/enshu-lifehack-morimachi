<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="sh1Title sh1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="sh1Title">森町の実家を前に相続放棄を考える場面を描いたイラスト</title>
  <desc id="sh1Desc">奥に山並みと杉林、段になった茶畑が広がります。左には雨戸を閉めた瓦屋根の実家があり、伸びた草と外れかけた樋が見えます。その前に鍵束を手にした人が立っています。右には三か月分のカレンダーが壁に掛かり、三枚目の月に赤い丸印がついています。カレンダーの下の机には相続放棄申述書の用紙、収入印紙、戸籍謄本の束、封筒が置かれています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="sh1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3dbee"/><stop offset="1" stop-color="#e8f0e4"/>
    </linearGradient>
    <linearGradient id="sh1Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa9bd"/><stop offset="1" stop-color="#b5cad2"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="196" fill="url(#sh1Sky)"/>

  <!-- 山並み -->
