<title id="rr2title">森町ロードレース大会に申し込むまでの四つの段</title>
<desc id="rr2desc">カレンダーに9月下旬と10月16日の印を付け、受付が始まる前にスポーツエントリーの会員登録を済ませ、四つの種目から一つだけを選び、事務局の番号0538-85-4191を控えるまでの順序を描いた図。右端には沿道の家と交通規制のコーンが並び、当日の朝に車を出せるかを確かめる必要を示している。</desc>
