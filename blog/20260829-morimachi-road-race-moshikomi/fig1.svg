<title id="rr1title">森町ロードレース大会の告知から本番までの一年</title>
<desc id="rr1desc">9月下旬に体育協会のサイトへ開催のお知らせが出て、10月中旬にインターネットで申し込み、11月末に締切が来て定員2,500人の枠が埋まり、2月の第1日曜に文化会館の前で走者がスタートするまでの流れを一本の帯の上に並べた図。帯の下には第49回から第53回までの開催日が並び、すべて2月の第1日曜であることが示されている。</desc>
