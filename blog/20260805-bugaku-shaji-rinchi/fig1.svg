  <g fill="#b8452f">
    <rect x="246" y="268" width="12" height="60" rx="3"/>
    <rect x="316" y="268" width="12" height="60" rx="3"/>
    <rect x="228" y="258" width="118" height="12" rx="4"/>
    <rect x="240" y="280" width="94" height="9" rx="3"/>
