<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="fig1Title fig1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="fig1Title">森町の社寺と、その隣の土地を描いたイラスト</title>
  <desc id="fig1Desc">奥に三倉・天方方面の山並み、中景に鎮守の森と鳥居、舞楽が奉奏される舞殿を配し、その右隣に境界杭で区切られた隣接地、空き家、畑を描いています。手前は参道と茶畑の畝、左手に水路が流れています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="f1sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8f3"/><stop offset="0.6" stop-color="#e8f2f4"/><stop offset="1" stop-color="#f3f7f1"/>
    </linearGradient>
    <linearGradient id="f1far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fc0cf"/><stop offset="1" stop-color="#b8d1da"/>
    </linearGradient>
    <linearGradient id="f1mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9c93"/><stop offset="1" stop-color="#8db2a6"/>
    </linearGradient>
    <linearGradient id="f1grove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7a5f"/><stop offset="1" stop-color="#2c5b44"/>
    </linearGradient>
    <linearGradient id="f1tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#84b165"/><stop offset="1" stop-color="#5b8c43"/>
    </linearGradient>
    <linearGradient id="f1water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bcdcea"/><stop offset="1" stop-color="#98c5db"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="url(#f1sky)"/>
  <circle cx="118" cy="78" r="34" fill="#ffffff" opacity="0.7"/>

  <!-- 遠景の山並み -->
  <path fill="url(#f1far)" d="M0 176 L86 138 L166 166 L262 122 L358 162 L452 126 L556 168 L654 132 L760 170 L858 138 L946 172 L1000 152 L1000 232 L0 232 Z"/>
  <path fill="url(#f1mid)" d="M0 206 L94 178 L188 208 L286 172 L392 210 L494 178 L598 214 L700 182 L806 216 L906 184 L1000 214 L1000 268 L0 268 Z"/>

  <!-- 里の屋根の連なり -->
  <g fill="#5c7f74" opacity="0.5">
    <path d="M40 268 l24-18 24 18 z"/><path d="M86 268 l20-15 20 15 z"/>
    <path d="M128 268 l26-19 26 19 z"/><path d="M182 268 l20-15 20 15 z"/>
    <path d="M760 266 l22-17 22 17 z"/><path d="M806 266 l18-14 18 14 z"/>
  </g>
  <rect x="0" y="264" width="1000" height="8" fill="#7fa08f" opacity="0.4"/>

  <!-- 里の地面 -->
  <path fill="#e3ecd9" d="M0 270 L1000 262 L1000 560 L0 560 Z"/>
  <path fill="#d6e5c8" d="M0 396 C220 380 420 392 620 404 C780 414 900 408 1000 400 L1000 560 L0 560 Z"/>
  <g stroke="#b9d0a4" stroke-width="4" fill="none" opacity="0.7">
    <path d="M0 312 C180 302 340 310 470 318"/>
    <path d="M660 300 C790 294 900 300 1000 296"/>
  </g>

  <!-- 鎮守の森 -->
  <g>
    <path fill="url(#f1grove)" d="M150 300 C166 232 214 196 268 196 C328 196 372 236 384 296 C420 282 462 300 474 302 L474 310 L142 310 Z"/>
    <path fill="url(#f1grove)" d="M96 306 C104 264 132 240 168 240 C204 240 232 266 240 306 Z"/>
    <path fill="#2f6249" d="M420 308 C428 272 452 250 482 250 C512 250 536 274 542 308 Z"/>
  </g>

