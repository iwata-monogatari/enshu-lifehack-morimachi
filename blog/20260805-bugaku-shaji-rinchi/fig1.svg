  <g>
    <rect x="392" y="356" width="196" height="12" rx="3" fill="#8d6a4a"/>
    <rect x="404" y="368" width="14" height="44" fill="#6f5238"/>
    <rect x="562" y="368" width="14" height="44" fill="#6f5238"/>
    <rect x="392" y="410" width="196" height="10" rx="3" fill="#6f5238"/>
    <rect x="398" y="300" width="12" height="58" fill="#7a5b3e"/>
    <rect x="570" y="300" width="12" height="58" fill="#7a5b3e"/>
    <path fill="#3f4d56" d="M376 300 L490 250 L604 300 L586 308 L490 264 L394 308 Z"/>
    <path fill="#55666f" d="M394 300 L490 258 L586 300 L586 310 L394 310 Z"/>
