      <circle cx="576" cy="326" r="11" fill="#f0d26a"/><rect x="571" y="314" width="10" height="4" fill="#8a6a2e"/>
    </g>
    <!-- 舞人 -->
    <g>
      <path d="M470 356 L462 318 L478 306 L498 306 L514 318 L506 356 Z" fill="#c0533f"/>
      <path d="M462 322 L436 342 L444 352 L468 336 Z" fill="#d9705a"/>
      <path d="M514 322 L540 342 L532 352 L508 336 Z" fill="#d9705a"/>
      <circle cx="488" cy="292" r="16" fill="#f2e2cd"/>
      <path d="M472 288 C476 272 500 272 504 288 Z" fill="#3f4d56"/>
      <rect x="480" y="286" width="16" height="5" rx="2" fill="#8c3b2b"/>
      <rect x="524" y="296" width="7" height="58" rx="3" fill="#6b5442" transform="rotate(22 527 325)"/>
      <path d="M540 292 C552 282 566 284 570 294 C560 300 546 300 540 292 Z" fill="#3f7a5f"/>
    </g>
  </g>

  <!-- 境界線と杭（社地と隣地の境） -->
  <g>
    <path d="M636 300 L636 470" stroke="#8a94a0" stroke-width="3" stroke-dasharray="12 9" fill="none"/>
    <g fill="#e2e6ea" stroke="#8a94a0" stroke-width="2">
      <rect x="629" y="330" width="14" height="26" rx="2"/>
      <rect x="629" y="404" width="14" height="26" rx="2"/>
      <rect x="629" y="452" width="14" height="26" rx="2"/>
    </g>
    <g fill="#c0392b">
      <rect x="629" y="330" width="14" height="7" rx="2"/>
      <rect x="629" y="404" width="14" height="7" rx="2"/>
      <rect x="629" y="452" width="14" height="7" rx="2"/>
    </g>
  </g>

  <!-- 隣接地の空き家 -->
  <g>
    <path fill="#6b5442" d="M690 336 L790 288 L890 336 L878 344 L790 302 L702 344 Z"/>
    <rect x="706" y="340" width="168" height="86" fill="#efe8dc" stroke="#c9bda9" stroke-width="2"/>
    <rect x="726" y="362" width="40" height="34" fill="#9fb6bf" stroke="#7d939c" stroke-width="2"/>
    <rect x="812" y="362" width="40" height="34" fill="#9fb6bf" stroke="#7d939c" stroke-width="2"/>
    <rect x="774" y="376" width="30" height="50" fill="#b99b78" stroke="#8d7355" stroke-width="2"/>
    <path d="M700 426 L880 426" stroke="#a99a86" stroke-width="4"/>
    <!-- 伸びた庭木 -->
    <path d="M906 428 C902 392 916 366 936 360" stroke="#6b7f4a" stroke-width="7" fill="none"/>
    <circle cx="938" cy="348" r="26" fill="#6f9a4e"/>
    <circle cx="912" cy="364" r="18" fill="#5f8a44"/>
  </g>

  <!-- 隣接地の畑 -->
  <g>
    <rect x="660" y="440" width="320" height="58" rx="6" fill="#cdb894"/>
    <g stroke="#a58e68" stroke-width="4">
      <path d="M672 452 L968 452"/><path d="M672 468 L968 468"/><path d="M672 484 L968 484"/>
    </g>
  </g>

  <!-- 参道 -->
  <path fill="#ded5c2" d="M446 420 L534 420 L590 560 L392 560 Z"/>
  <g stroke="#c6bba4" stroke-width="3">
    <path d="M452 448 L580 448"/><path d="M440 486 L596 486"/><path d="M424 528 L614 528"/>
  </g>

  <!-- 手前の茶畑 -->
  <g>
    <path fill="url(#f1tea)" d="M0 452 C110 436 240 448 300 470 L300 560 L0 560 Z"/>
    <g stroke="#4d7a39" stroke-width="5" fill="none" opacity="0.75">
      <path d="M0 476 C100 462 200 472 268 492"/>
      <path d="M0 506 C100 492 196 502 262 522"/>
      <path d="M0 536 C96 522 188 532 252 552"/>
    </g>
  </g>

  <!-- 水路 -->
  <path fill="url(#f1water)" d="M300 470 C340 480 356 502 352 560 L392 560 C398 500 372 470 320 456 Z"/>

  <!-- 説明ラベル -->
  <g font-family="'Hiragino Sans','Yu Gothic',Meiryo,sans-serif" font-size="19" font-weight="bold">
    <g>
      <rect x="150" y="196" width="128" height="32" rx="8" fill="#20303a" opacity="0.86"/>
      <text x="214" y="218" fill="#ffffff" text-anchor="middle">社叢と鳥居</text>
    </g>
    <g>
      <rect x="412" y="200" width="156" height="32" rx="8" fill="#20303a" opacity="0.86"/>
      <text x="490" y="222" fill="#ffffff" text-anchor="middle">舞楽が舞う舞殿</text>
    </g>
    <g>
      <rect x="666" y="248" width="180" height="32" rx="8" fill="#7a3f22" opacity="0.92"/>
      <text x="756" y="270" fill="#ffffff" text-anchor="middle">隣に接する私の土地</text>
    </g>
    <g>
      <rect x="24" y="480" width="104" height="32" rx="8" fill="#20303a" opacity="0.86"/>
      <text x="76" y="502" fill="#ffffff" text-anchor="middle">茶畑</text>
    </g>
    <g>
      <rect x="592" y="486" width="88" height="30" rx="8" fill="#ffffff" opacity="0.94" stroke="#8a94a0" stroke-width="2"/>
      <text x="636" y="507" fill="#20303a" font-size="17" text-anchor="middle">境界線</text>
    </g>
  </g>
</svg>
