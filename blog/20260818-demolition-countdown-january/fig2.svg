    <path d="M0 164 C 260 156, 500 180, 740 166 C 850 160, 930 172, 1000 164"/>
  </g>

  <!-- 川と橋 -->
  <path fill="#a6cde2" d="M0 188 L1000 180 L1000 212 L0 220 Z"/>
  <g stroke="#e2f0f6" stroke-width="4" fill="none">
    <path d="M40 206 L230 200"/><path d="M690 198 L936 192"/>
