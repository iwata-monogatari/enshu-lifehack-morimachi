<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="dm2Title dm2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="dm2Title">森町の実家を解体するときの確認の順番を一本の道すじとして描いたイラスト</title>
<desc id="dm2Desc">左端では家族が古い木造住宅を見上げ、建築年を台帳で確かめています。次に役場の窓口で補助の相談をし、「着手前」と書かれた札を受け取る場面が続きます。三つ目で複数の業者から見積書を受け取り比べる場面があります。四つ目では重機が入って建物が解体され、道路側のブロック塀も取り除かれます。五つ目で道が二つに分かれ、上の道は法務局の窓口へ滅失登記の申請書を出す場面へ、下の道は役場の税の窓口へ家屋取り壊し届出書を出す場面へ続きます。二つの道は合流し、最後に更地に杭と縄が張られ、一月一日に丸の付いた暦が立てられています。下には八月から一月までの帯が伸びています。背景には遠州の山並みと杉木立、段になった茶畑、太田川らしい流れと橋が広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="dm2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3d9e6"/><stop offset="1" stop-color="#f0f4e8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#f2f4ea"/>
  <rect width="1000" height="132" fill="url(#dm2Sky)"/>
  <path fill="#9db4be" d="M0 92 L92 42 L198 92 L308 38 L422 92 L540 40 L656 92 L776 44 L888 92 L1000 56 L1000 128 L0 128 Z"/>
  <g fill="#3d6350">
    <path d="M18 132 l12 -40 l12 40 z"/><path d="M46 132 l14 -46 l14 46 z"/><path d="M78 132 l11 -34 l11 34 z"/>
    <path d="M898 132 l12 -40 l12 40 z"/><path d="M928 132 l14 -46 l14 46 z"/><path d="M962 132 l11 -34 l11 34 z"/>
  </g>

  <!-- 段になった茶畑 -->
