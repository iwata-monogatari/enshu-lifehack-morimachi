  <rect x="352" y="178" width="248" height="9" fill="#cfc7ae"/>
  <g fill="#b6ae95"><rect x="384" y="187" width="8" height="28"/><rect x="474" y="185" width="8" height="28"/><rect x="564" y="183" width="8" height="28"/></g>

  <rect x="0" y="216" width="1000" height="344" fill="#e6e9d9"/>

  <!-- 道すじ（本線） -->
  <path d="M44 456 C 180 456, 226 406, 350 406 C 470 406, 520 356, 628 356" fill="none" stroke="#cfc4a6" stroke-width="30" stroke-linecap="round"/>
  <path d="M44 456 C 180 456, 226 406, 350 406 C 470 406, 520 356, 628 356" fill="none" stroke="#fbf7ea" stroke-width="4" stroke-dasharray="16 16"/>
  <!-- 分岐（上：法務局／下：役場の税の窓口） -->
  <path d="M628 356 C 690 356, 710 286, 788 286 C 852 286, 884 306, 918 312" fill="none" stroke="#cfc4a6" stroke-width="26" stroke-linecap="round"/>
  <path d="M628 356 C 690 356, 710 428, 788 428 C 852 428, 884 348, 918 322" fill="none" stroke="#cfc4a6" stroke-width="26" stroke-linecap="round"/>
  <g fill="none" stroke="#fbf7ea" stroke-width="4" stroke-dasharray="14 14">
    <path d="M628 356 C 690 356, 710 286, 788 286 C 852 286, 884 306, 918 312"/>
    <path d="M628 356 C 690 356, 710 428, 788 428 C 852 428, 884 348, 918 322"/>
  </g>

  <!-- 1. 建築年を台帳で確かめる -->
  <g>
    <rect x="16" y="290" width="118" height="88" fill="#f4eee2" stroke="#a3997f" stroke-width="4"/>
    <path d="M4 294 L75 250 L146 294 Z" fill="#6a7a80"/>
    <rect x="4" y="294" width="142" height="10" fill="#55636a"/>
    <rect x="32" y="316" width="38" height="30" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <rect x="84" y="316" width="38" height="30" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <circle cx="66" cy="408" r="17" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M46 386 a20 18 0 0 1 40 0 z" fill="#4b4238"/>
    <path d="M48 432 C 48 456, 50 466, 52 480 L80 480 C 82 466, 86 456, 84 432 Z" fill="#5c86a0" stroke="#3f6379" stroke-width="3"/>
    <rect x="94" y="400" width="80" height="50" fill="#fdfbf2" stroke="#a89b7c" stroke-width="3"/>
    <g stroke="#cfc5a8" stroke-width="3" fill="none"><path d="M104 414 L164 414 M104 426 L164 426 M104 438 L146 438"/></g>
    <rect x="6" y="494" width="180" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="96" y="515" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">1 建築年と床面積</text>
  </g>

  <!-- 2. 役場の窓口で補助の相談、着手前の札 -->
  <g>
    <rect x="214" y="278" width="126" height="64" fill="#eceee6" stroke="#9aa196" stroke-width="4"/>
    <path d="M202 282 L277 244 L352 282 Z" fill="#7c8a90"/>
    <rect x="228" y="298" width="28" height="24" fill="#f6d98f" stroke="#c9a94f" stroke-width="3"/>
    <rect x="298" y="298" width="28" height="24" fill="#f6d98f" stroke="#c9a94f" stroke-width="3"/>
    <rect x="210" y="342" width="136" height="16" fill="#b98f5d"/>
    <circle cx="246" cy="378" r="16" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M227 357 a19 17 0 0 1 38 0 z" fill="#57493c"/>
    <path d="M229 400 C 229 424, 231 434, 233 448 L259 448 C 261 434, 265 424, 263 400 Z" fill="#87a45f" stroke="#5f7b3d" stroke-width="3"/>
    <path d="M262 406 L292 390" stroke="#f0d2b0" stroke-width="9" stroke-linecap="round"/>
    <rect x="286" y="366" width="82" height="34" rx="4" fill="#fdf3d8" stroke="#c4ad6a" stroke-width="4"/>
    <text x="327" y="389" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7d5a1f" text-anchor="middle">着手前に</text>
    <rect x="196" y="464" width="192" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="292" y="485" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">2 補助を先に申請</text>
  </g>

  <!-- 3. 見積書を比べる -->
  <g>
    <circle cx="432" cy="326" r="17" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M412 304 a20 18 0 0 1 40 0 z" fill="#4b4238"/>
    <path d="M414 350 C 414 380, 416 394, 418 412 L446 412 C 448 394, 452 380, 450 350 Z" fill="#a06a7c" stroke="#7d4d5e" stroke-width="3"/>
    <path d="M448 362 L482 348" stroke="#f0d2b0" stroke-width="9" stroke-linecap="round"/>
    <path d="M416 362 L386 350" stroke="#f0d2b0" stroke-width="9" stroke-linecap="round"/>
    <g fill="#fdfbf2" stroke="#a89b7c" stroke-width="3">
      <rect x="344" y="312" width="56" height="42"/><rect x="470" y="308" width="56" height="42"/><rect x="536" y="316" width="56" height="42"/>
    </g>
    <g stroke="#cfc5a8" stroke-width="3" fill="none">
      <path d="M352 328 L392 328 M352 340 L380 340"/>
      <path d="M478 324 L518 324 M478 336 L506 336"/>
      <path d="M544 332 L584 332 M544 344 L572 344"/>
    </g>
    <rect x="374" y="466" width="200" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="474" y="487" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">3 見積りを複数取る</text>
  </g>

  <!-- 4. 重機が入り、家と塀が解体される -->
  <g>
    <rect x="600" y="404" width="86" height="46" fill="#e6ddcc" stroke="#a3997f" stroke-width="4"/>
    <path d="M590 408 L643 380 L696 408 Z" fill="#8c979b"/>
    <path d="M600 404 L686 450 M686 404 L600 450" stroke="#b3a68c" stroke-width="4" fill="none"/>
    <rect x="588" y="452" width="110" height="14" fill="#cfcabb" stroke="#a29c8b" stroke-width="3"/>
    <g>
      <rect x="518" y="404" width="60" height="30" rx="4" fill="#e0a437" stroke="#a9761f" stroke-width="3"/>
      <rect x="530" y="388" width="30" height="20" rx="3" fill="#cfe0ea" stroke="#8fa0aa" stroke-width="3"/>
      <circle cx="532" cy="438" r="11" fill="#4b4a45"/><circle cx="566" cy="438" r="11" fill="#4b4a45"/>
      <path d="M578 410 L608 388 L622 400" fill="none" stroke="#a9761f" stroke-width="7" stroke-linecap="round"/>
    </g>
    <rect x="512" y="504" width="192" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="608" y="525" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">4 着工は決定の後で</text>
  </g>

  <!-- 5a. 上の道：法務局へ滅失登記（1月以内） -->
  <g>
    <rect x="692" y="228" width="104" height="48" fill="#e9ecea" stroke="#8e9791" stroke-width="4"/>
    <path d="M680 232 L744 204 L808 232 Z" fill="#6f7f86"/>
    <g fill="#cfd8dc" stroke="#8fa0a8" stroke-width="3">
