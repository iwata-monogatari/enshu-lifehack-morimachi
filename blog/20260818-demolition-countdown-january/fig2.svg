    </g>
    <circle cx="716" cy="306" r="14" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M699 288 a17 15 0 0 1 34 0 z" fill="#57493c"/>
    <path d="M702 324 C 702 342, 704 350, 706 362 L728 362 C 730 350, 734 342, 732 324 Z" fill="#5c86a0" stroke="#3f6379" stroke-width="3"/>
    <rect x="740" y="292" width="52" height="34" fill="#ffffff" stroke="#98a2a8" stroke-width="3"/>
    <rect x="656" y="196" width="164" height="28" rx="5" fill="#ffffff" stroke="#7d3f2c" stroke-width="4"/>
    <text x="738" y="216" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7d3f2c" text-anchor="middle">滅失登記は1月以内</text>
  </g>

  <!-- 5b. 下の道：役場の税の窓口へ家屋取り壊し届出書 -->
  <g>
    <rect x="694" y="396" width="108" height="50" fill="#eceee6" stroke="#9aa196" stroke-width="4"/>
    <path d="M682 400 L748 370 L814 400 Z" fill="#7c8a90"/>
    <rect x="708" y="414" width="28" height="24" fill="#f6d98f" stroke="#c9a94f" stroke-width="3"/>
    <rect x="760" y="414" width="28" height="24" fill="#f6d98f" stroke="#c9a94f" stroke-width="3"/>
    <rect x="812" y="400" width="66" height="44" fill="#fdfbf2" stroke="#a89b7c" stroke-width="3"/>
    <g stroke="#cfc5a8" stroke-width="3" fill="none"><path d="M822 414 L868 414 M822 426 L868 426 M822 436 L856 436"/></g>
    <rect x="660" y="458" width="204" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="762" y="479" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f3e52" text-anchor="middle">家屋取り壊し届出書も</text>
  </g>

  <!-- 6. 合流点：更地と1月1日の暦 -->
  <g>
    <rect x="906" y="330" width="12" height="86" fill="#8d8368"/>
    <rect x="852" y="236" width="140" height="92" rx="6" fill="#fdfbf2" stroke="#7d3f2c" stroke-width="5"/>
    <rect x="852" y="236" width="140" height="26" rx="6" fill="#7d3f2c"/>
    <text x="922" y="255" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1月1日</text>
    <g stroke="#c3bda6" stroke-width="3" fill="none">
      <path d="M852 286 L992 286 M852 308 L992 308"/>
      <path d="M887 262 L887 328 M922 262 L922 328 M957 262 L957 328"/>
    </g>
    <circle cx="869" cy="274" r="11" fill="none" stroke="#c0563c" stroke-width="4"/>
    <!-- 更地と杭 -->
    <rect x="846" y="418" width="150" height="42" fill="#d9d2bd"/>
    <g fill="#e8dcc0" stroke="#a89b7c" stroke-width="3">
      <rect x="852" y="404" width="10" height="26"/><rect x="978" y="404" width="10" height="26"/>
    </g>
    <path d="M857 406 L983 406" fill="none" stroke="#c0563c" stroke-width="4"/>
    <rect x="828" y="494" width="168" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="912" y="515" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">5 賦課期日をまたぐ</text>
  </g>

  <!-- 下の帯：八月から一月 -->
  <g>
    <rect x="24" y="530" width="952" height="24" rx="12" fill="#1f3e52"/>
    <text x="120" y="547" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">8月 対象か確かめる</text>
    <text x="360" y="547" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">9月 申請と交付決定</text>
    <text x="620" y="547" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">10月 着工と届出</text>
    <text x="880" y="547" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f6d98f" text-anchor="middle">1月1日 賦課期日</text>
  </g>
</svg>
