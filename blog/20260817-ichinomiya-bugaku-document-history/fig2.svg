<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" data-illustration="mori-editorial" aria-labelledby="t d"><title id="t">舞楽史料を確かめる四段階</title><desc id="d">公式ページ、指南書と請取証、所有者への確認、社寺と田を見る現地確認を一本道でつなぐ</desc><rect width="1000" height="560" fill="#f8f1e4"/><path d="M0 430Q240 350 470 430T1000 400" fill="none" stroke="#c4975d" stroke-width="35"/><g font-family="sans-serif" font-weight="700"><g transform="translate(40 115)"><rect width="190" height="150" rx="12" fill="#fff" stroke="#526f5b" stroke-width="4"/><rect x="45" y="28" width="100" height="80" fill="#dbe7d2"/><path d="M60 52h70M60 70h70M60 88h50" stroke="#526f5b" stroke-width="5"/><text x="25" y="135" font-size="17">1 史料名を控える</text></g><g transform="translate(285 175)"><rect width="190" height="150" rx="12" fill="#fff" stroke="#526f5b" stroke-width="4"/><path d="M25 30h65v80H25zM100 30h65v80h-65z" fill="#ead9ae"/><path d="M40 50h35M40 68h35M115 50h35M115 68h35" stroke="#866b45" stroke-width="4"/><text x="27" y="135" font-size="17">2 文書と図を照合</text></g><g transform="translate(530 115)"><rect width="190" height="150" rx="12" fill="#fff" stroke="#526f5b" stroke-width="4"/><circle cx="55" cy="62" r="25" fill="#e2b98f"/><path d="M90 45h65M90 65h50M90 85h58" stroke="#526f5b" stroke-width="6"/><text x="25" y="135" font-size="17">3 閲覧条件を確認</text></g><g transform="translate(775 175)"><rect width="190" height="150" rx="12" fill="#fff" stroke="#526f5b" stroke-width="4"/><path d="M20 105q55-75 110 0z" fill="#73906b"/><path d="M130 75h45v35h-45z" fill="#a2734e"/><circle cx="55" cy="60" r="15" fill="#e2b98f"/><path d="M55 75v40" stroke="#3e3934" stroke-width="7"/><text x="22" y="135" font-size="17">4 現地の地形へ戻す</text></g><text x="55" y="510" font-size="19" fill="#31483a">記載された事実と自分の解釈を分け、原本・公開・現地をそれぞれ確認</text></g></svg>
