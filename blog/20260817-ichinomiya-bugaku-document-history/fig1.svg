<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" data-illustration="mori-editorial" aria-labelledby="t d"><title id="t">遠江一宮を支えた社寺と人々</title><desc id="d">本宮山、小國神社、天宮神社、蓮華寺、円田の水田を背景に赤と青の稚児舞、僧侶、神人、若者衆を描く</desc><rect width="1000" height="560" fill="#f6eedc"/><path d="M0 230Q190 20 370 235Q540 70 700 230Q850 100 1000 240V390H0Z" fill="#67866a"/><path d="M0 350Q220 300 430 365T1000 330V560H0Z" fill="#c7d69b"/><g stroke="#88aa62" stroke-width="7"><path d="M20 430h370M30 470h360M620 430h350M610 470h360"/></g><g fill="#9a6f4c"><path d="M90 335h170v82H90z"/><path d="M700 320h180v92H700z"/><path d="M410 300h160v105H410z"/></g><g fill="#4a392c"><path d="M65 335l110-70 110 70z"/><path d="M675 320l115-75 115 75z"/><path d="M385 300l105-70 105 70z"/></g><g font-family="sans-serif" font-size="18" font-weight="700" fill="#233d30"><text x="105" y="445">小國神社</text><text x="728" y="440">天宮神社</text><text x="450" y="430">蓮華寺</text></g><g><circle cx="325" cy="355" r="18" fill="#edc397"/><path d="M325 373v65m0-45l-30 30m30-30l28 30" stroke="#ad3434" stroke-width="18"/><circle cx="645" cy="355" r="18" fill="#edc397"/><path d="M645 373v65m0-45l-30 30m30-30l28 30" stroke="#315f9d" stroke-width="18"/></g><text x="40" y="55" font-family="sans-serif" font-size="29" font-weight="700" fill="#263e31">二社・寺院・田・担い手でつくる一宮の祭礼空間</text><text x="40" y="90" font-family="sans-serif" font-size="17" fill="#263e31">赤い左舞と青い右舞を一対として読む</text></svg>
