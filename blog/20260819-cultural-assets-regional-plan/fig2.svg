<rect x="330" y="300" width="228" height="34" rx="8" fill="#4a7a4e"/>
<text x="444" y="324" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">2 窓口に聞く</text>
<text x="350" y="360" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">役場北館1階</text>
<text x="350" y="384" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">指定か登録か</text>
