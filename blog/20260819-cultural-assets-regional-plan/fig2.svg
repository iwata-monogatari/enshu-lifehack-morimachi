<g>
<rect x="700" y="416" width="256" height="118" rx="8" fill="#fdfaf0" stroke="#8d7f5e" stroke-width="4"/>
<rect x="700" y="416" width="256" height="34" rx="8" fill="#7d4a5c"/>
<text x="828" y="440" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">4 担い手と費用を分ける</text>
<text x="720" y="476" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">誰が動くか／いくら要るか</text>
<text x="720" y="502" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">家族で1枚に書き出す</text>
<text x="720" y="526" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">結論は今日出さない</text>
</g>

