<text x="704" y="258" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">3 期間を確かめる</text>
<text x="610" y="294" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">計画期間はいつまで</text>
<text x="610" y="318" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">本文の公開はいつ</text>
<path d="M636 346 V384" stroke="#8d7f5e" stroke-width="9"/><path d="M768 346 V384" stroke="#8d7f5e" stroke-width="9"/>
