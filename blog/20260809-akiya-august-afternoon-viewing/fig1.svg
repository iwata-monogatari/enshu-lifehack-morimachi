<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="akvTitle akvDesc" preserveAspectRatio="xMidYMid meet">
  <title id="akvTitle">夏の午後、森町の集落に建つ空き家を下見する場面を描いたイラスト</title>
  <desc id="akvDesc">入道雲と強い日ざしの下に、瓦屋根の平屋の空き家が建っています。雨戸と窓が開け放たれ、家の中を風が通り抜ける道筋が矢印で示されています。庭には腰の高さまで伸びた草、傾いた物置、板塀があり、手前では二人が温度計と懐中電灯を手に立ち、木の日陰に水筒と帽子が置かれています。背景には段になった茶畑と杉林、森町の山並みが広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="akvSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc0e0"/><stop offset="0.55" stop-color="#cfe3ec"/><stop offset="1" stop-color="#f2f6e8"/>
    </linearGradient>
    <linearGradient id="akvFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa9bb"/><stop offset="1" stop-color="#b4c9cf"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="url(#akvSky)"/>

  <!-- 太陽と光線 -->
  <g>
    <circle cx="112" cy="86" r="42" fill="#ffe08a"/>
    <circle cx="112" cy="86" r="30" fill="#ffd25e"/>
    <g stroke="#ffd25e" stroke-width="7" stroke-linecap="round" opacity="0.85">
      <path d="M112 20 L112 -2"/><path d="M112 152 L112 174"/>
      <path d="M46 86 L24 86"/><path d="M178 86 L200 86"/>
      <path d="M66 40 L50 24"/><path d="M158 132 L174 148"/>
      <path d="M158 40 L174 24"/><path d="M66 132 L50 148"/>
    </g>
  </g>

  <!-- 入道雲 -->
  <g fill="#ffffff" opacity="0.95">
    <circle cx="640" cy="98" r="54"/><circle cx="704" cy="72" r="66"/>
    <circle cx="778" cy="102" r="52"/><circle cx="840" cy="86" r="44"/>
    <circle cx="700" cy="128" r="52"/><circle cx="784" cy="134" r="44"/>
    <rect x="596" y="120" width="290" height="34" rx="17"/>
  </g>

  <!-- 遠景の山 -->
  <path fill="url(#akvFar)" d="M0 176 L104 134 L206 178 L312 130 L420 174 L530 132 L638 178 L744 138 L850 176 L946 138 L1000 172 L1000 226 L0 226 Z"/>
  <g fill="#57876a">
    <path d="M16 228 l18 -50 l18 50 z"/><path d="M54 228 l14 -40 l14 40 z"/>
    <path d="M920 228 l18 -48 l18 48 z"/><path d="M958 228 l20 -54 l20 54 z"/>
  </g>

  <!-- 段になった茶畑 -->
  <path fill="#7ba954" d="M0 222 C 230 208, 440 204, 620 220 C 780 234, 890 226, 1000 214 L1000 272 L0 282 Z"/>
  <g stroke="#69934a" stroke-width="4" opacity="0.55">
    <path d="M0 240 L1000 226"/><path d="M0 258 L1000 244"/>
  </g>
  <path fill="#dbe6c1" d="M0 276 L1000 264 L1000 560 L0 560 Z"/>

  <!-- 板塀 -->
  <g>
    <rect x="0" y="330" width="196" height="76" fill="#c3a878"/>
    <g stroke="#a98d5f" stroke-width="3">
      <path d="M28 330 L28 406"/><path d="M60 330 L60 406"/><path d="M92 330 L92 406"/>
      <path d="M124 330 L124 406"/><path d="M156 330 L156 406"/><path d="M188 330 L188 406"/>
    </g>
    <rect x="0" y="324" width="196" height="10" fill="#a98d5f"/>
  </g>

  <!-- 空き家（瓦屋根の平屋） -->
  <g>
    <path d="M212 296 L470 208 L728 296 Z" fill="#7f8f97"/>
    <path d="M232 296 L470 216 L708 296 Z" fill="#93a1a8"/>
    <g stroke="#77858c" stroke-width="3">
      <path d="M280 276 L500 276"/><path d="M262 286 L520 286"/>
    </g>
    <rect x="248" y="296" width="440" height="128" fill="#efe9db"/>
    <rect x="248" y="296" width="440" height="12" fill="#cfc7b5"/>
    <!-- 開いた雨戸 -->
    <rect x="252" y="312" width="30" height="98" fill="#a9906a" stroke="#8b7350" stroke-width="3"/>
    <rect x="654" y="312" width="30" height="98" fill="#a9906a" stroke="#8b7350" stroke-width="3"/>
    <!-- 開け放った窓（奥が見える） -->
    <rect x="292" y="318" width="160" height="90" fill="#5f6f74" stroke="#8b949a" stroke-width="4"/>
    <rect x="486" y="318" width="160" height="90" fill="#5f6f74" stroke="#8b949a" stroke-width="4"/>
    <rect x="292" y="318" width="160" height="90" fill="#7d8d92" opacity="0.35"/>
    <!-- 柱 -->
    <rect x="460" y="312" width="18" height="106" fill="#d8cfba"/>
    <!-- 縁側 -->
    <rect x="240" y="418" width="456" height="20" fill="#c9a877"/>
    <rect x="240" y="438" width="456" height="10" fill="#a98a5c"/>
    <!-- 表札の空き枠 -->
    <rect x="700" y="330" width="34" height="22" fill="#f6f4ea" stroke="#a79c81" stroke-width="3"/>
  </g>

  <!-- 風の通り道 -->
  <g stroke="#3f7ea4" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M200 358 C 260 340, 330 372, 392 356"/>
    <path d="M540 356 C 610 340, 680 372, 760 352"/>
  </g>
  <g fill="#3f7ea4" opacity="0.85">
    <path d="M392 344 L418 356 L392 368 Z"/>
    <path d="M760 340 L788 352 L760 364 Z"/>
  </g>

  <!-- 物置（傾いている） -->
  <g transform="rotate(-5 830 400)">
    <rect x="776" y="342" width="112" height="80" fill="#cfd4d0" stroke="#a3aaa6" stroke-width="3"/>
    <path d="M766 344 L832 314 L898 344 Z" fill="#8f9995"/>
    <rect x="806" y="368" width="46" height="54" fill="#b4bbb7" stroke="#98a09c" stroke-width="3"/>
  </g>

  <!-- 伸びた草 -->
  <g stroke="#6f9b46" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M226 470 q10 -46 26 -62"/><path d="M254 476 q6 -44 20 -58"/>
    <path d="M282 470 q14 -42 30 -56"/><path d="M712 466 q10 -44 26 -60"/>
    <path d="M742 472 q6 -42 20 -56"/><path d="M772 466 q14 -40 30 -54"/>
    <path d="M900 470 q10 -46 26 -60"/><path d="M932 476 q6 -42 20 -56"/>
  </g>
  <path d="M180 486 C 340 474, 620 480, 1000 468 L1000 508 L180 520 Z" fill="#8fb45c" opacity="0.55"/>

  <!-- 木の日陰と水筒・帽子 -->
  <g>
    <rect x="66" y="404" width="16" height="72" fill="#7b6444"/>
    <circle cx="74" cy="386" r="52" fill="#4f8355"/>
    <circle cx="42" cy="404" r="34" fill="#5b9060"/>
    <circle cx="108" cy="404" r="34" fill="#5b9060"/>
    <ellipse cx="90" cy="490" rx="76" ry="16" fill="#a9bd88" opacity="0.75"/>
    <rect x="46" y="462" width="26" height="42" rx="7" fill="#4a7896" stroke="#37627c" stroke-width="3"/>
    <rect x="52" y="454" width="14" height="10" fill="#37627c"/>
    <ellipse cx="112" cy="488" rx="34" ry="12" fill="#e8dcb6" stroke="#c3b58a" stroke-width="3"/>
    <ellipse cx="112" cy="480" rx="18" ry="12" fill="#f2e8c8" stroke="#c3b58a" stroke-width="3"/>
  </g>

  <!-- 下見をする二人 -->
  <g>
    <!-- 温度計を持つ人 -->
    <circle cx="392" cy="452" r="22" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
    <path d="M370 446 q22 -24 44 0 q0 -18 -22 -18 q-22 0 -22 18 z" fill="#463d33"/>
    <path d="M364 478 q28 -16 56 0 l8 60 l-72 0 z" fill="#4a7896"/>
    <path d="M420 494 q28 -6 34 -30" stroke="#e6c49d" stroke-width="12" fill="none" stroke-linecap="round"/>
    <rect x="446" y="440" width="14" height="42" rx="6" fill="#f4f6f2" stroke="#7d878c" stroke-width="3"/>
    <rect x="449" y="452" width="8" height="24" fill="#c0563c"/>
    <!-- 懐中電灯を持つ人 -->
    <circle cx="546" cy="460" r="22" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
    <path d="M524 452 q22 -20 44 0 q-9 -14 -22 -14 q-13 0 -22 14 z" fill="#5b4a36"/>
    <path d="M518 486 q28 -16 56 0 l8 54 l-72 0 z" fill="#5c8b6d"/>
    <path d="M518 502 q-30 -4 -38 -26" stroke="#e6c49d" stroke-width="12" fill="none" stroke-linecap="round"/>
    <rect x="452" y="462" width="34" height="14" rx="5" fill="#3d464e"/>
    <path d="M452 462 L426 452 L426 486 L452 476 Z" fill="#ffe9a8" opacity="0.9"/>
  </g>
</svg>
