<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ty2Title ty2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="ty2Title">森町の実家の相続について、まとまらないまま年を重ねた家がいま確かめる順番を一本の道すじとして描いたイラスト</title>
<desc id="ty2Desc">左端の実家の縁側で、まず除籍謄本を見ながら親が亡くなった日を確かめる場面から道が始まります。次に暦の上で十年の残りを数える場面が続きます。三つ目に役場の窓口で戸籍と戸籍附票を郵送請求する場面があります。四つ目で道が二つに分かれ、上の道は町民生活センターでの無料法律相談の場面へ、下の道は家庭裁判所の窓口で収入印紙を貼った申立書を出す場面へ続きます。二つの道は合流し、最後に相続人が座卓を囲んで書面に署名する場面があります。道の下には八月から二月までの帯が伸びています。背景には遠州の山並みと杉木立、段になった茶畑、太田川らしい流れと橋が広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="ty2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3d9e6"/><stop offset="1" stop-color="#f0f4e8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#f2f4ea"/>
  <rect width="1000" height="132" fill="url(#ty2Sky)"/>
  <path fill="#9db4be" d="M0 92 L92 42 L198 92 L308 38 L422 92 L540 40 L656 92 L776 44 L888 92 L1000 56 L1000 128 L0 128 Z"/>
  <g fill="#3d6350">
    <path d="M18 132 l12 -40 l12 40 z"/><path d="M46 132 l14 -46 l14 46 z"/><path d="M78 132 l11 -34 l11 34 z"/>
    <path d="M898 132 l12 -40 l12 40 z"/><path d="M928 132 l14 -46 l14 46 z"/><path d="M962 132 l11 -34 l11 34 z"/>
  </g>

  <!-- 段になった茶畑 -->
  <path fill="#8fb469" d="M0 134 C 260 126, 500 150, 740 136 C 850 130, 930 142, 1000 134 L1000 176 L0 182 Z"/>
  <g stroke="#5f8543" stroke-width="5" opacity="0.9" fill="none">
    <path d="M0 148 C 260 140, 500 164, 740 150 C 850 144, 930 156, 1000 148"/>
    <path d="M0 164 C 260 156, 500 180, 740 166 C 850 160, 930 172, 1000 164"/>
  </g>

  <!-- 川と橋 -->
  <path fill="#a6cde2" d="M0 188 L1000 180 L1000 212 L0 220 Z"/>
  <g stroke="#e2f0f6" stroke-width="4" fill="none">
    <path d="M40 206 L230 200"/><path d="M690 198 L936 192"/>
  </g>
  <rect x="352" y="178" width="248" height="9" fill="#cfc7ae"/>
  <g fill="#b6ae95"><rect x="384" y="187" width="8" height="28"/><rect x="474" y="185" width="8" height="28"/><rect x="564" y="183" width="8" height="28"/></g>

  <rect x="0" y="216" width="1000" height="344" fill="#e6e9d9"/>

  <!-- 道すじ（本線） -->
  <path d="M48 452 C 190 452, 236 402, 366 402 C 486 402, 528 352, 636 352" fill="none" stroke="#cfc4a6" stroke-width="30" stroke-linecap="round"/>
  <path d="M48 452 C 190 452, 236 402, 366 402 C 486 402, 528 352, 636 352" fill="none" stroke="#fbf7ea" stroke-width="4" stroke-dasharray="16 16"/>
  <!-- 分岐（上：相談／下：家庭裁判所） -->
  <path d="M636 352 C 696 352, 716 288, 792 288 C 856 288, 884 306, 918 310" fill="none" stroke="#cfc4a6" stroke-width="26" stroke-linecap="round"/>
  <path d="M636 352 C 696 352, 716 424, 792 424 C 856 424, 884 344, 918 320" fill="none" stroke="#cfc4a6" stroke-width="26" stroke-linecap="round"/>
  <g fill="none" stroke="#fbf7ea" stroke-width="4" stroke-dasharray="14 14">
    <path d="M636 352 C 696 352, 716 288, 792 288 C 856 288, 884 306, 918 310"/>
    <path d="M636 352 C 696 352, 716 424, 792 424 C 856 424, 884 344, 918 320"/>
  </g>

  <!-- 1. 実家の縁側で除籍謄本を開き、亡くなった日を確かめる -->
  <g>
    <rect x="14" y="286" width="122" height="96" fill="#f4eee2" stroke="#a3997f" stroke-width="4"/>
    <path d="M2 290 L75 244 L148 290 Z" fill="#6a7a80"/>
    <rect x="2" y="290" width="146" height="10" fill="#55636a"/>
    <rect x="30" y="316" width="42" height="34" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <rect x="86" y="316" width="42" height="34" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <circle cx="70" cy="406" r="17" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M50 384 a20 18 0 0 1 40 0 z" fill="#4b4238"/>
    <path d="M52 430 C 52 454, 54 464, 56 478 L84 478 C 86 464, 90 454, 88 430 Z" fill="#5c86a0" stroke="#3f6379" stroke-width="3"/>
    <rect x="96" y="398" width="80" height="52" fill="#e9e2cd" stroke="#a89b7c" stroke-width="3"/>
    <rect x="96" y="398" width="13" height="52" fill="#8d5f43"/>
    <g stroke="#c1b696" stroke-width="3" fill="none"><path d="M118 412 L166 412 M118 424 L166 424 M118 436 L152 436"/></g>
    <circle cx="140" cy="424" r="12" fill="none" stroke="#c0563c" stroke-width="4"/>
    <rect x="6" y="492" width="184" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="98" y="513" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">1 亡くなった日を確定</text>
  </g>

  <!-- 2. 暦で十年の残りを数える -->
  <g>
    <rect x="242" y="256" width="140" height="100" rx="5" fill="#fdfbf2" stroke="#8d8368" stroke-width="4"/>
    <rect x="242" y="256" width="140" height="26" rx="5" fill="#1f3e52"/>
    <text x="312" y="275" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">残りを数える</text>
    <g stroke="#c3bda6" stroke-width="3" fill="none">
      <path d="M242 308 L382 308 M242 332 L382 332"/>
      <path d="M277 282 L277 356 M312 282 L312 356 M347 282 L347 356"/>
    </g>
    <circle cx="259" cy="322" r="11" fill="none" stroke="#c0563c" stroke-width="4"/>
    <circle cx="294" cy="344" r="6" fill="#c0563c"/>
    <circle cx="270" cy="376" r="16" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M251 355 a19 17 0 0 1 38 0 z" fill="#57493c"/>
    <path d="M253 398 C 253 422, 255 432, 257 446 L283 446 C 285 432, 289 422, 287 398 Z" fill="#87a45f" stroke="#5f7b3d" stroke-width="3"/>
    <path d="M286 404 L316 366" stroke="#f0d2b0" stroke-width="9" stroke-linecap="round"/>
    <rect x="214" y="462" width="190" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="309" y="483" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">2 10年の残りを書く</text>
  </g>

  <!-- 3. 役場の窓口で戸籍と附票を郵送請求 -->
  <g>
    <rect x="440" y="252" width="130" height="68" fill="#eceee6" stroke="#9aa196" stroke-width="4"/>
    <path d="M428 256 L505 218 L582 256 Z" fill="#7c8a90"/>
    <rect x="454" y="272" width="30" height="26" fill="#f6d98f" stroke="#c9a94f" stroke-width="3"/>
    <rect x="526" y="272" width="30" height="26" fill="#f6d98f" stroke="#c9a94f" stroke-width="3"/>
    <rect x="436" y="320" width="140" height="16" fill="#b98f5d"/>
    <circle cx="472" cy="358" r="17" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M452 336 a20 18 0 0 1 40 0 z" fill="#4b4238"/>
    <path d="M454 382 C 454 408, 456 420, 458 436 L486 436 C 488 420, 492 408, 490 382 Z" fill="#a06a7c" stroke="#7d4d5e" stroke-width="3"/>
    <path d="M488 394 L522 384" stroke="#f0d2b0" stroke-width="9" stroke-linecap="round"/>
    <g fill="#fdfbf2" stroke="#a89b7c" stroke-width="3">
      <rect x="516" y="366" width="66" height="34"/><rect x="524" y="356" width="66" height="34"/>
    </g>
    <path d="M524 356 L557 374 L590 356" fill="none" stroke="#a89b7c" stroke-width="3"/>
    <rect x="420" y="462" width="200" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="520" y="483" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">3 戸籍を郵送で集める</text>
  </g>

  <!-- 4a. 上の道：町民生活センターの無料法律相談 -->
  <g>
    <rect x="696" y="230" width="104" height="50" fill="#eceee6" stroke="#9aa196" stroke-width="4"/>
    <path d="M686 234 L748 206 L810 234 Z" fill="#7c8a90"/>
    <rect x="690" y="280" width="116" height="13" fill="#b98f5d"/>
    <circle cx="718" cy="310" r="14" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M701 292 a17 15 0 0 1 34 0 z" fill="#57493c"/>
    <path d="M704 328 C 704 346, 706 354, 708 366 L730 366 C 732 354, 736 346, 734 328 Z" fill="#5c86a0" stroke="#3f6379" stroke-width="3"/>
    <circle cx="774" cy="310" r="14" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M757 292 a17 15 0 0 1 34 0 z" fill="#4b4238"/>
    <path d="M760 328 C 760 346, 762 354, 764 366 L786 366 C 788 354, 792 346, 790 328 Z" fill="#87a45f" stroke="#5f7b3d" stroke-width="3"/>
    <rect x="662" y="200" width="150" height="28" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="737" y="220" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f3e52" text-anchor="middle">無料法律相談 先着6名</text>
  </g>

  <!-- 4b. 下の道：家庭裁判所へ申立て（収入印紙1200円） -->
  <g>
    <rect x="694" y="386" width="108" height="52" fill="#e9ecea" stroke="#8e9791" stroke-width="4"/>
    <path d="M682 390 L748 358 L814 390 Z" fill="#6f7f86"/>
    <g fill="#cfd8dc" stroke="#8fa0a8" stroke-width="3">
      <rect x="706" y="404" width="14" height="34"/><rect x="740" y="404" width="14" height="34"/><rect x="774" y="404" width="14" height="34"/>
    </g>
    <rect x="812" y="392" width="76" height="52" fill="#ffffff" stroke="#98a2a8" stroke-width="3"/>
    <rect x="812" y="392" width="76" height="14" fill="#1f3e52"/>
    <g stroke="#b8c1c6" stroke-width="3" fill="none"><path d="M822 418 L878 418 M822 430 L862 430"/></g>
    <rect x="856" y="370" width="46" height="26" fill="#f6d98f" stroke="#b58f34" stroke-width="3"/>
    <text x="879" y="388" font-family="sans-serif" font-size="13" font-weight="bold" fill="#7d5a1f" text-anchor="middle">1200円</text>
    <rect x="662" y="452" width="190" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="757" y="473" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f3e52" text-anchor="middle">4 家庭裁判所へ申立て</text>
  </g>

  <!-- 5. 合流点：相続人が書面に署名する -->
  <g>
    <rect x="906" y="326" width="12" height="96" fill="#8d8368"/>
    <rect x="856" y="232" width="140" height="66" rx="6" fill="#ffffff" stroke="#3f6b4f" stroke-width="5"/>
    <text x="926" y="258" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f5b41" text-anchor="middle">全員の合意なら</text>
    <text x="926" y="282" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f5b41" text-anchor="middle">10年後も可</text>
    <rect x="852" y="426" width="90" height="26" rx="4" fill="#b98f5d"/>
    <rect x="866" y="392" width="66" height="40" fill="#fdfbf2" stroke="#8d8368" stroke-width="3"/>
    <g stroke="#c3bda6" stroke-width="3" fill="none"><path d="M874 406 L924 406 M874 418 L906 418"/></g>
    <path d="M934 400 L960 386" stroke="#3f4a52" stroke-width="5" stroke-linecap="round"/>
    <rect x="832" y="486" width="164" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="914" y="507" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">5 書面にして残す</text>
  </g>

  <!-- 下の帯：八月から二月 -->
  <g>
    <rect x="24" y="528" width="952" height="26" rx="13" fill="#1f3e52"/>
    <text x="118" y="547" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">8月 日付を確かめる</text>
    <text x="392" y="547" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">9月 戸籍を集める</text>
    <text x="672" y="547" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f6d98f" text-anchor="middle">10月22日 相談日</text>
    <text x="900" y="547" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f6d98f" text-anchor="middle">2月4日 相談日</text>
  </g>
</svg>
