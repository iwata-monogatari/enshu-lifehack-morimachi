<text x="40" y="500" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="17" fill="#4a5a4b">図書館と児童館が同時に開くのは7時間30分（11月〜1月は7時間）</text>
<text x="40" y="530" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="16" fill="#4a5a4b">児童館は0歳〜18歳未満・町内外を問わず無料。役場の窓口は日曜休み</text>
</svg>
