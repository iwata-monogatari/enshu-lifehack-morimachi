<path d="M258 198 V462"/><path d="M368 198 V462"/><path d="M478 198 V462"/><path d="M588 198 V462"/><path d="M698 198 V462"/><path d="M808 198 V462"/>
</g>

<text x="40" y="222" font-size="16" fill="#33503f">森町立図書館</text>
<rect x="258" y="206" width="440" height="24" rx="6" fill="#4d8f6d"/>
<text x="272" y="224" font-size="14" fill="#ffffff">9:00〜17:00</text>

<text x="40" y="262" font-size="16" fill="#33503f">児童館・子育て支援センター</text>
<rect x="258" y="246" width="220" height="24" rx="6" fill="#4d8f6d"/>
<rect x="506" y="246" width="192" height="24" rx="6" fill="#4d8f6d"/>
<text x="272" y="264" font-size="14" fill="#ffffff">9:00〜13:00</text>
<text x="518" y="264" font-size="14" fill="#ffffff">13:30〜17:00</text>
<text x="446" y="292" font-size="13" fill="#a63b31">13:00〜13:30は閉館</text>

<text x="40" y="330" font-size="16" fill="#33503f">森の市（JA直売所）</text>
<rect x="258" y="314" width="550" height="24" rx="6" fill="#7fa84a"/>
<text x="272" y="332" font-size="14" fill="#ffffff">9:00〜18:00</text>

<text x="40" y="370" font-size="16" fill="#33503f">アクティ森</text>
<rect x="258" y="354" width="468" height="24" rx="6" fill="#7fa84a"/>
<text x="272" y="372" font-size="14" fill="#ffffff">9:00〜17:30</text>

<text x="40" y="410" font-size="16" fill="#8a6a60">公立森町病院 外来</text>
<rect x="258" y="394" width="550" height="24" rx="6" fill="#b7b2aa"/>
<text x="272" y="412" font-size="14" fill="#ffffff">日曜は休診</text>

<text x="40" y="450" font-size="16" fill="#8a6a60">町営バス 大河内線</text>
<rect x="258" y="434" width="550" height="24" rx="6" fill="#b7b2aa"/>
<text x="272" y="452" font-size="14" fill="#ffffff">土・日・祝は運休（吉川線は運行）</text>
</g>

