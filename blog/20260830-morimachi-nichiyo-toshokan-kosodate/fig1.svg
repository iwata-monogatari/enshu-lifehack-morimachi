<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ns1title ns1desc">
<title id="ns1title">森町の日曜に開いている場所と閉まっている場所</title>
<desc id="ns1desc">日曜の時間帯を横軸にした帯グラフ。上段は森町立図書館が9時から17時、森町児童館と子育て支援センターが9時から13時と13時30分から17時、農産物直売所の森の市が9時から18時、アクティ森が9時から17時30分まで開いていることを色帯で示し、13時から13時30分の児童館の帯だけ切れている。下段は公立森町病院の外来と町営バス大河内線が日曜休みであることを灰色の帯で示す。左に本棚と積み木、右に野菜の台とバス停の標識が描かれ、背景は茶畑の段と杉林の山並み。</desc>
<defs>
<linearGradient id="ns1sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#cfdfee"/><stop offset="1" stop-color="#eef2e9"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="url(#ns1sky)"/>
<path d="M0 74 L120 30 L240 76 L360 26 L480 78 L600 30 L720 76 L840 28 L960 76 L1000 54 L1000 118 L0 118 Z" fill="#8497a8"/>
<path d="M0 98 L130 62 L260 104 L390 60 L520 106 L650 62 L780 104 L910 60 L1000 92 L1000 134 L0 134 Z" fill="#6f8d78"/>
<g fill="#33604a">
<path d="M10 134 L28 92 L46 134 Z"/><path d="M48 134 L68 86 L88 134 Z"/>
<path d="M914 134 L932 92 L950 134 Z"/><path d="M952 134 L972 86 L992 134 Z"/>
</g>
<rect x="0" y="128" width="1000" height="432" fill="#eceee4"/>

<g font-family="'Meiryo','Hiragino Sans',sans-serif">
<text x="40" y="166" font-size="21" font-weight="bold" fill="#1f3e52">日曜に開いている時間（2026年8月30日確認）</text>
<g font-size="14" fill="#7a8590">
<text x="256" y="192">9時</text><text x="366" y="192">11時</text><text x="476" y="192">13時</text><text x="586" y="192">15時</text><text x="696" y="192">17時</text><text x="806" y="192">18時</text>
</g>
