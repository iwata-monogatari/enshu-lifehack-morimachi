<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ef2Title ef2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="ef2Title">森町で電気柵の補助を使うまでの五つの場面を、一本の道沿いに並べたイラスト</title>
  <desc id="ef2Desc">山あいの畑を背景に一本の農道が奥へ続き、道沿いに五つの場面が順に並びます。畑を歩いて足跡や掘り返しを確かめる場面、地図に獣の入る方向を書き込む場面、資材店で見積書を受け取る場面、役場の窓口で申請書と位置図を出す場面、柵を張ったあと草刈り機で足元を刈る場面です。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="ef2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3e6ef"/><stop offset="0.65" stop-color="#eaf2ec"/><stop offset="1" stop-color="#f5f8ee"/>
    </linearGradient>
    <linearGradient id="ef2hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#97b8c6"/><stop offset="1" stop-color="#b7d0d3"/>
    </linearGradient>
    <linearGradient id="ef2field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8c47e"/><stop offset="1" stop-color="#7ba556"/>
    </linearGradient>
  </defs>

