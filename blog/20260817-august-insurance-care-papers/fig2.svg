  <path d="M60 448 C 200 448, 244 392, 376 392 C 496 392, 536 336, 656 336" fill="none" stroke="#cfc4a6" stroke-width="30" stroke-linecap="round"/>
  <path d="M60 448 C 200 448, 244 392, 376 392 C 496 392, 536 336, 656 336" fill="none" stroke="#fbf7ea" stroke-width="4" stroke-dasharray="16 16"/>
  <!-- 分岐 -->
