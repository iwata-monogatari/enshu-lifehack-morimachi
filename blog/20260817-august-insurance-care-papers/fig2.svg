<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ai2Title ai2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="ai2Title">森町の実家で、親の医療と介護の紙を帰省後に確かめる順番を一本の道すじとして描いたイラスト</title>
<desc id="ai2Desc">左端に実家の玄関と積み上がった郵便物の束があり、そこから右へ一本の道が伸びています。最初の地点では、親と子が座卓で封筒を開け、七月下旬に届いた郵便を選り分けています。次の地点では、財布から出したカードを並べ、有効期限の年月日を虫眼鏡で確かめています。三つ目の地点では、藤色の資格確認書を財布に入れ直し、期限切れの橙色のカードを別の封筒にまとめています。四つ目で道が二つに分かれ、上の道は医療の窓口へ電話をかける場面へ、下の道は介護の窓口へ電話をかける場面へ続きます。二つの道は合流し、最後に診察券と紙をまとめた一枚の袋を作る場面があります。道の下には七月下旬から八月末までの帯が伸びています。背景には遠州の山並みと杉木立、段になった茶畑、太田川らしい流れと橋が広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="ai2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3d9e6"/><stop offset="1" stop-color="#f0f4e8"/>
    </linearGradient>
  </defs>

