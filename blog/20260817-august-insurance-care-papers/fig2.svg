    <path d="M516 404 L540 320" stroke="#f0d2b0" stroke-width="9" stroke-linecap="round"/>
    <rect x="418" y="462" width="212" height="30" rx="5" fill="#ffffff" stroke="#1f3e52" stroke-width="3"/>
    <text x="524" y="483" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">3 財布と別封筒に分ける</text>
  </g>

