    <rect x="552" y="248" width="46" height="30" rx="4" fill="#e08a3c" stroke="#b56a26" stroke-width="3"/>
    <path d="M552 248 L598 278" stroke="#8f4a1c" stroke-width="3"/>
    <circle cx="500" cy="368" r="17" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M480 346 a20 18 0 0 1 40 0 z" fill="#4b4238"/>
