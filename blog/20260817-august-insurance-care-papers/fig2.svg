    <text x="430" y="547" font-family="sans-serif" font-size="15" font-weight="bold" fill="#f6d98f" text-anchor="middle">8月1日 切り替わる</text>
    <text x="760" y="547" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">8月末 長期入院の申請期限</text>
  </g>
</svg>
