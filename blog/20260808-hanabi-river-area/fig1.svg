<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="hraTitle hraDesc" preserveAspectRatio="xMidYMid meet">
  <title id="hraTitle">夏の夕方の太田川河川敷を、花火の夜と普段の顔を重ねて描いたイラスト</title>
  <desc id="hraDesc">夕暮れの空に花火が三発上がり、その下に太田川の流れと広い河川敷が横に伸びています。堤防の上には葉桜になった桜並木とぼんぼりの柱が続き、河川敷にはグラウンドのバックネット、ローラースケート場のトラック、芝生広場、並んだ車、屋台のテントと人の姿があります。川には中州と玉石があり、川面には水位を測る量水標が立っています。奥には森町の山並み、杉林、段になった茶畑、そして川を渡る橋が見えます。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="hraSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4f70"/><stop offset="0.45" stop-color="#7e94ad"/>
      <stop offset="0.78" stop-color="#e0b58a"/><stop offset="1" stop-color="#f2ddb8"/>
    </linearGradient>
    <linearGradient id="hraWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f8fa8"/><stop offset="1" stop-color="#87b6c9"/>
    </linearGradient>
    <linearGradient id="hraFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5f74"/><stop offset="1" stop-color="#7d94a1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#8fa4bb"/>
  <rect width="1000" height="230" fill="url(#hraSky)"/>

  <!-- 花火 -->
  <g stroke-linecap="round" opacity="0.95">
    <g stroke="#f4d06a" stroke-width="4">
      <path d="M182 96 L182 46 M182 96 L218 60 M182 96 L232 96 M182 96 L218 132 M182 96 L182 146 M182 96 L146 132 M182 96 L132 96 M182 96 L146 60"/>
    </g>
    <g fill="#f9ecc0">
      <circle cx="182" cy="42" r="4"/><circle cx="222" cy="56" r="4"/><circle cx="236" cy="96" r="4"/>
      <circle cx="222" cy="136" r="4"/><circle cx="182" cy="150" r="4"/><circle cx="142" cy="136" r="4"/>
      <circle cx="128" cy="96" r="4"/><circle cx="142" cy="56" r="4"/>
    </g>
    <g stroke="#e88b6a" stroke-width="3">
      <path d="M492 70 L492 30 M492 70 L520 42 M492 70 L532 70 M492 70 L520 98 M492 70 L492 110 M492 70 L464 98 M492 70 L452 70 M492 70 L464 42"/>
    </g>
    <g fill="#f6cbb4">
      <circle cx="492" cy="26" r="3"/><circle cx="524" cy="38" r="3"/><circle cx="536" cy="70" r="3"/>
      <circle cx="524" cy="102" r="3"/><circle cx="492" cy="114" r="3"/><circle cx="460" cy="102" r="3"/>
      <circle cx="448" cy="70" r="3"/><circle cx="460" cy="38" r="3"/>
    </g>
    <g stroke="#a8d8c8" stroke-width="3">
      <path d="M768 122 L768 88 M768 122 L792 98 M768 122 L802 122 M768 122 L792 146 M768 122 L768 156 M768 122 L744 146 M768 122 L734 122 M768 122 L744 98"/>
    </g>
  </g>

  <!-- 遠景の山と杉 -->
  <path fill="url(#hraFar)" d="M0 196 L96 150 L188 194 L286 146 L392 192 L500 148 L610 194 L714 150 L822 192 L916 152 L1000 196 L1000 250 L0 250 Z"/>
  <g fill="#3d5c50">
    <path d="M28 252 l18 -54 l18 54 z"/><path d="M68 252 l15 -44 l15 44 z"/>
    <path d="M918 252 l18 -52 l18 52 z"/><path d="M956 252 l16 -46 l16 46 z"/>
  </g>
  <!-- 段になった茶畑 -->
  <path fill="#5f7f52" d="M0 246 C 220 232, 420 228, 620 242 C 800 254, 900 246, 1000 238 L1000 286 L0 292 Z"/>
  <g stroke="#4d6b43" stroke-width="4" opacity="0.6">
    <path d="M0 262 L1000 250"/><path d="M0 278 L1000 266"/>
  </g>

  <!-- 橋 -->
  <g>
    <rect x="640" y="286" width="360" height="16" fill="#c8ccc6"/>
    <rect x="640" y="278" width="360" height="7" fill="#e2e5df"/>
    <g fill="#b0b5ae">
      <rect x="700" y="302" width="18" height="58"/><rect x="810" y="302" width="18" height="62"/>
      <rect x="920" y="302" width="18" height="58"/>
    </g>
    <g stroke="#dfe3dc" stroke-width="4">
      <path d="M640 274 L1000 274"/>
    </g>
  </g>

  <!-- 堤防と桜並木（葉桜） -->
  <path fill="#93a878" d="M0 288 L1000 276 L1000 322 L0 336 Z"/>
  <g>
    <g fill="#4f7a43">
      <ellipse cx="60" cy="268" rx="40" ry="26"/><ellipse cx="170" cy="264" rx="38" ry="25"/>
      <ellipse cx="280" cy="262" rx="40" ry="26"/><ellipse cx="392" cy="258" rx="38" ry="24"/>
      <ellipse cx="504" cy="256" rx="40" ry="25"/>
    </g>
    <g stroke="#6b5238" stroke-width="7">
      <path d="M60 292 L60 268"/><path d="M170 288 L170 264"/><path d="M280 286 L280 262"/>
      <path d="M392 284 L392 258"/><path d="M504 282 L504 256"/>
    </g>
  </g>
  <!-- ぼんぼりの柱 -->
  <g>
    <g stroke="#8d8f88" stroke-width="4">
      <path d="M114 300 L114 262"/><path d="M226 298 L226 260"/><path d="M338 296 L338 258"/><path d="M450 294 L450 256"/>
    </g>
    <g fill="#f0c96a" stroke="#c39a3c" stroke-width="2">
      <rect x="104" y="240" width="22" height="24" rx="4"/><rect x="216" y="238" width="22" height="24" rx="4"/>
      <rect x="328" y="236" width="22" height="24" rx="4"/><rect x="440" y="234" width="22" height="24" rx="4"/>
    </g>
  </g>

  <!-- 河川敷（芝生） -->
  <path fill="#9cb877" d="M0 332 L1000 318 L1000 428 L0 448 Z"/>
  <!-- ローラースケート場のトラック -->
  <g>
    <ellipse cx="150" cy="382" rx="118" ry="38" fill="#b9b0a0" stroke="#9a9285" stroke-width="4"/>
    <ellipse cx="150" cy="382" rx="80" ry="22" fill="#a8bd85"/>
  </g>
  <!-- グラウンドのバックネット -->
  <g>
    <path d="M330 372 L330 306 L430 300 L430 370 Z" fill="#c9d4c2" opacity="0.55" stroke="#8d9a88" stroke-width="4"/>
    <g stroke="#8d9a88" stroke-width="2" opacity="0.8">
      <path d="M354 304 L354 372"/><path d="M380 302 L380 371"/><path d="M406 301 L406 370"/>
      <path d="M330 326 L430 320"/><path d="M330 348 L430 342"/>
    </g>
    <path d="M336 396 L470 388 L500 404 L344 412 Z" fill="#cbb894"/>
  </g>
  <!-- 並んだ車 -->
  <g>
    <g fill="#e8ebe6" stroke="#9aa29c" stroke-width="3">
      <rect x="560" y="336" width="52" height="22" rx="5"/><rect x="622" y="334" width="52" height="22" rx="5"/>
      <rect x="684" y="332" width="52" height="22" rx="5"/><rect x="746" y="330" width="52" height="22" rx="5"/>
    </g>
    <g fill="#cfd6d0" stroke="#9aa29c" stroke-width="3">
      <rect x="560" y="366" width="52" height="22" rx="5"/><rect x="622" y="364" width="52" height="22" rx="5"/>
      <rect x="684" y="362" width="52" height="22" rx="5"/><rect x="746" y="360" width="52" height="22" rx="5"/>
    </g>
  </g>
  <!-- 屋台のテントと人 -->
  <g>
    <g>
      <path d="M826 356 L886 340 L946 356 L946 362 L826 362 Z" fill="#c0442c"/>
      <rect x="832" y="362" width="108" height="30" fill="#f0ece0" stroke="#c3bda9" stroke-width="3"/>
      <g stroke="#a8a094" stroke-width="4"><path d="M834 392 L834 414"/><path d="M938 392 L938 414"/></g>
    </g>
    <g fill="#3d4a54">
      <circle cx="812" cy="398" r="8"/><rect x="805" y="408" width="14" height="26" rx="6"/>
      <circle cx="790" cy="404" r="7"/><rect x="784" y="412" width="12" height="24" rx="5"/>
      <circle cx="962" cy="400" r="8"/><rect x="955" y="410" width="14" height="26" rx="6"/>
    </g>
  </g>
  <!-- 河原の玉石 -->
  <path fill="#cdc9bb" d="M0 440 L1000 420 L1000 462 L0 484 Z"/>
  <g fill="#b4b0a2">
    <ellipse cx="90" cy="464" rx="16" ry="8"/><ellipse cx="180" cy="456" rx="13" ry="7"/>
    <ellipse cx="300" cy="452" rx="17" ry="8"/><ellipse cx="430" cy="446" rx="12" ry="6"/>
    <ellipse cx="560" cy="442" rx="16" ry="8"/><ellipse cx="700" cy="436" rx="13" ry="7"/>
    <ellipse cx="860" cy="432" rx="17" ry="8"/>
  </g>

  <!-- 川の流れ -->
  <path fill="url(#hraWater)" d="M0 480 L1000 458 L1000 560 L0 560 Z"/>
  <g stroke="#b9dbe6" stroke-width="5" fill="none" opacity="0.7">
    <path d="M40 512 C 160 500, 260 524, 400 508"/>
    <path d="M470 536 C 600 522, 700 546, 860 528"/>
  </g>
  <!-- 中州 -->
  <path fill="#c6c2b2" d="M232 528 C 300 512, 392 514, 442 530 C 392 544, 296 546, 232 528 Z"/>
  <g fill="#8aa76a"><ellipse cx="300" cy="524" rx="16" ry="7"/><ellipse cx="360" cy="526" rx="14" ry="6"/></g>
  <!-- 量水標 -->
  <g>
    <rect x="620" y="440" width="16" height="106" fill="#f2f2ec" stroke="#5b6a72" stroke-width="3"/>
    <g stroke="#5b6a72" stroke-width="3">
      <path d="M620 460 L636 460"/><path d="M620 480 L636 480"/><path d="M620 500 L636 500"/><path d="M620 520 L636 520"/>
    </g>
    <path d="M612 470 L644 470" stroke="#c0442c" stroke-width="5"/>
  </g>

  <!-- ラベル -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">
    <rect x="24" y="24" width="330" height="34" rx="8" fill="#ffffff" opacity="0.95"/>
    <text x="189" y="47" font-size="17" fill="#2c4a52" text-anchor="middle">会場は、川を流すためにある土地</text>
    <rect x="24" y="64" width="330" height="30" rx="8" fill="#2c4a52" opacity="0.92"/>
    <text x="189" y="85" font-size="15" fill="#ffffff" text-anchor="middle">花火の夜は、一年のうちの一晩だけ</text>
    <rect x="646" y="482" width="330" height="30" rx="8" fill="#a8551a" opacity="0.95"/>
    <text x="811" y="503" font-size="15" fill="#ffffff" text-anchor="middle">増水すれば、ここは水の下になる</text>
  </g>
</svg>
