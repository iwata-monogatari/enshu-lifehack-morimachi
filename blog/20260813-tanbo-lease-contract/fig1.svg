<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="tl1Title tl1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="tl1Title">他人が作っている実家の田んぼと、書類の並んだ実家の縁側を並べて描いたイラスト</title>
  <desc id="tl1Desc">奥に遠州の山並みと杉林、段になった茶畑が広がります。左には稲の育った田が並び、その中を他人の耕うん機が走っています。田の隅には字の消えた古い杭が立っています。右には瓦屋根の実家と縁側があり、低い卓の上に空欄のままの契約書、米の袋、通帳、名寄帳が並べられています。親が田のほうを指差し、帰省した子がノートに書き取っています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="tl1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfd8ec"/><stop offset="1" stop-color="#e9f1e4"/>
    </linearGradient>
    <linearGradient id="tl1Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba9bc"/><stop offset="1" stop-color="#b6cbd2"/>
    </linearGradient>
    <linearGradient id="tl1Paddy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc05c"/><stop offset="1" stop-color="#a9d071"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="180" fill="url(#tl1Sky)"/>
  <path fill="url(#tl1Far)" d="M0 118 L110 58 L222 116 L338 48 L456 116 L572 46 L690 116 L804 58 L910 116 L1000 76 L1000 162 L0 162 Z"/>
  <path fill="#7fae57" d="M0 180 C 230 170, 450 194, 670 182 C 770 176, 860 186, 1000 180 L1000 222 L0 228 Z"/>
  <g stroke="#5f8a42" stroke-width="4" opacity="0.85" fill="none">
    <path d="M0 190 C 230 180, 450 204, 670 192 C 770 186, 860 196, 1000 190"/>
    <path d="M0 206 C 230 196, 450 220, 670 208 C 770 202, 860 212, 1000 206"/>
  </g>
  <path fill="#dfe8d6" d="M0 224 L1000 218 L1000 560 L0 560 Z"/>

  <!-- 杉林 -->
  <g fill="#3f6b52">
    <path d="M10 224 l16 -58 l16 58 z"/><path d="M44 224 l13 -46 l13 46 z"/>
    <path d="M78 224 l12 -42 l12 42 z"/>
    <path d="M950 224 l15 -54 l15 54 z"/><path d="M916 224 l13 -46 l13 46 z"/>
  </g>

  <!-- 左：稲の育った田 -->
  <g>
    <path fill="url(#tl1Paddy)" d="M0 250 L470 238 L458 396 L0 420 Z"/>
    <g stroke="#5f9040" stroke-width="5" fill="none" opacity="0.9">
      <path d="M0 268 L466 256"/><path d="M0 296 L464 284"/><path d="M0 326 L462 314"/>
      <path d="M0 358 L460 346"/><path d="M0 392 L458 380"/>
    </g>
    <!-- 畦 -->
    <path fill="#c9c0a4" d="M0 420 L458 396 L470 424 L0 452 Z"/>
    <path fill="#b6ad90" d="M0 452 L470 424 L470 436 L0 464 Z"/>
    <!-- 二枚目の田 -->
    <path fill="#9ccb69" d="M0 464 L470 436 L482 520 L0 556 Z"/>
    <g stroke="#659245" stroke-width="5" fill="none" opacity="0.85">
      <path d="M0 486 L474 458"/><path d="M0 514 L478 486"/><path d="M0 544 L482 514"/>
    </g>
  </g>

  <!-- 他人の耕うん機 -->
  <g>
    <path d="M196 296 L306 290 L310 336 L192 342 Z" fill="#c8503a" stroke="#96331f" stroke-width="4"/>
    <path d="M300 300 L346 298 L352 330 L306 332 Z" fill="#e2e6e2" stroke="#9aa39f" stroke-width="4"/>
    <rect x="312" y="306" width="30" height="18" fill="#b6d3e0" stroke="#8aa8b6" stroke-width="3"/>
    <path d="M206 292 L206 262 L246 262" stroke="#6b7370" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="228" cy="348" r="26" fill="#4b5450" stroke="#2f3733" stroke-width="5"/>
    <circle cx="228" cy="348" r="9" fill="#a8b0ac"/>
    <circle cx="322" cy="346" r="18" fill="#4b5450" stroke="#2f3733" stroke-width="5"/>
    <circle cx="322" cy="346" r="6" fill="#a8b0ac"/>
    <!-- 乗っている人 -->
    <circle cx="252" cy="252" r="17" fill="#e3c39d" stroke="#b9926b" stroke-width="3"/>
    <path d="M228 248 L276 248 L272 238 L232 238 Z" fill="#6f7c82"/>
    <path d="M238 268 L266 268 L272 296 L232 296 Z" fill="#3f6f86"/>
  </g>

  <!-- 字の消えた古い杭 -->
  <g>
    <path d="M96 508 L96 418" stroke="#9b8a6c" stroke-width="14" fill="none"/>
    <path d="M84 420 L108 408 L108 424 Z" fill="#7d6e54"/>
    <rect x="34" y="424" width="132" height="34" rx="6" fill="#f3f1e6" stroke="#a89a7c" stroke-width="3"/>
    <g stroke="#c3b89c" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M48 438 L118 438"/><path d="M48 448 L92 448"/>
    </g>
  </g>

  <!-- 右：実家と縁側 -->
  <g>
    <path d="M528 268 L706 190 L884 268 Z" fill="#6f7c82"/>
    <path d="M548 268 L706 200 L864 268 Z" fill="#8b979b"/>
    <rect x="522" y="268" width="368" height="12" fill="#5c666b"/>
    <rect x="548" y="280" width="316" height="112" fill="#e9e3d3" stroke="#bdb49f" stroke-width="4"/>
    <g fill="#4e5a5f" stroke="#948a72" stroke-width="3">
      <rect x="570" y="298" width="120" height="78"/><rect x="716" y="298" width="120" height="78"/>
    </g>
    <g stroke="#c7bda4" stroke-width="3" fill="none">
      <path d="M610 298 L610 376 M650 298 L650 376"/>
      <path d="M756 298 L756 376 M796 298 L796 376"/>
    </g>
    <!-- 縁側の板張り -->
    <rect x="512" y="392" width="392" height="26" fill="#c9a877" stroke="#a4854f" stroke-width="3"/>
    <g stroke="#a4854f" stroke-width="3" fill="none">
      <path d="M512 400 L904 400 M512 410 L904 410"/>
    </g>
  </g>

  <!-- 縁側に座る親と、ノートを持つ子 -->
  <g>
    <circle cx="592" cy="332" r="22" fill="#e3c39d" stroke="#b9926b" stroke-width="3"/>
    <path d="M570 330 A22 22 0 0 1 614 330 Z" fill="#8c8e88"/>
    <path d="M576 356 L608 356 L616 392 L568 392 Z" fill="#7d9a6e"/>
    <path d="M578 366 L502 344" stroke="#7d9a6e" stroke-width="13" fill="none" stroke-linecap="round"/>
    <circle cx="494" cy="342" r="8" fill="#e3c39d"/>
    <circle cx="838" cy="330" r="22" fill="#e3c39d" stroke="#b9926b" stroke-width="3"/>
    <path d="M816 328 A22 22 0 0 1 860 328 Z" fill="#4a4038"/>
    <path d="M822 354 L854 354 L862 392 L814 392 Z" fill="#3f6f86"/>
    <rect x="856" y="352" width="58" height="42" rx="4" fill="#ffffff" stroke="#8a949a" stroke-width="3" transform="rotate(-8 885 373)"/>
    <g stroke="#b7c0c5" stroke-width="3" fill="none" transform="rotate(-8 885 373)">
      <path d="M866 364 L904 364 M866 374 L904 374 M866 384 L892 384"/>
    </g>
  </g>

  <!-- 卓の上の書類一式 -->
  <g>
    <rect x="516" y="440" width="452" height="86" rx="6" fill="#b98f5d" stroke="#8f6b3f" stroke-width="4"/>
    <rect x="516" y="516" width="452" height="14" fill="#9d7745"/>
    <!-- 空欄の契約書 -->
    <rect x="540" y="426" width="132" height="86" rx="4" fill="#ffffff" stroke="#8a949a" stroke-width="4"/>
    <rect x="554" y="440" width="104" height="14" fill="#dfe6e9"/>
    <g stroke="#c6ced2" stroke-width="4" fill="none">
      <path d="M554 468 L658 468 M554 482 L658 482 M554 496 L630 496"/>
    </g>
    <rect x="612" y="486" width="42" height="22" rx="3" fill="#fdf6e6" stroke="#c0563c" stroke-width="3"/>
    <!-- 米の袋 -->
    <path d="M700 512 L700 452 L708 440 L752 440 L760 452 L760 512 Z" fill="#e6ddc6" stroke="#b3a685" stroke-width="4"/>
    <rect x="712" y="464" width="36" height="24" rx="3" fill="#c8a25a"/>
    <!-- 通帳 -->
    <rect x="784" y="462" width="86" height="52" rx="4" fill="#3f6f86" stroke="#2c5468" stroke-width="4"/>
    <rect x="792" y="472" width="52" height="10" fill="#cfe0e8"/>
    <rect x="792" y="490" width="38" height="8" fill="#8fb2c4"/>
    <!-- 名寄帳 -->
    <rect x="884" y="448" width="80" height="66" rx="4" fill="#f6f2e4" stroke="#a89a7c" stroke-width="4"/>
    <g stroke="#c3b89c" stroke-width="3" fill="none">
      <path d="M896 462 L952 462 M896 476 L952 476 M896 490 L936 490"/>
      <path d="M924 448 L924 514"/>
    </g>
  </g>

  <rect x="94" y="176" width="272" height="34" rx="7" fill="#ffffff" stroke="#c0563c" stroke-width="3"/>
  <text x="230" y="199" font-family="sans-serif" font-size="17" font-weight="bold" fill="#c0563c" text-anchor="middle">作っているのは、親ではない</text>
</svg>
