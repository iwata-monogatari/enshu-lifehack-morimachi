<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="nss2Title nss2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="nss2Title">何もない日曜日の一日を、朝から夜までの六つの場面として描いたイラスト</title>
  <desc id="nss2Desc">森町の山並みを背景に、空を太陽が左から右へ弧を描いて移り、日が沈んだ右端には月と星が浮かんでいます。その下に六つの場面が左から順に並びます。朝の家の窓辺で外の音を聞く場面、買い物かごを持って店の駐車場に立つ場面、図書館の席に座って本を開く場面、体育館でボールをつく場面とマウンテンバイクに乗る子ども、バス停の時刻表を家族で見上げる場面、そして街灯の下の道を歩いて帰る場面です。場面ごとに7時から19時までの時刻札が添えられています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="nss2Sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe2b4"/><stop offset="0.28" stop-color="#d3e6f0"/>
      <stop offset="0.68" stop-color="#cfe3ee"/><stop offset="1" stop-color="#3f4f74"/>
    </linearGradient>
    <linearGradient id="nss2Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fadbe"/><stop offset="1" stop-color="#b8ccd2"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="url(#nss2Sky)"/>

  <!-- 一日の弧 -->
  <path d="M60 236 C 220 44, 700 44, 940 200" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 12" fill="none" opacity="0.7"/>
  <circle cx="86" cy="200" r="24" fill="#ffd27a"/>
  <circle cx="470" cy="66" r="30" fill="#ffe08a"/>
  <g fill="#f4f0e2">
    <path d="M916 158 a 30 30 0 1 0 26 40 a 24 24 0 1 1 -26 -40 z"/>
    <circle cx="862" cy="132" r="3"/><circle cx="960" cy="120" r="3"/><circle cx="900" cy="98" r="2.5"/>
  </g>

  <!-- 山並みと茶畑 -->
  <path fill="url(#nss2Far)" d="M0 218 L104 180 L208 222 L314 176 L420 218 L528 178 L636 222 L742 182 L848 220 L944 182 L1000 214 L1000 262 L0 262 Z"/>
  <g fill="#57876a">
    <path d="M20 264 l16 -44 l16 44 z"/><path d="M54 264 l12 -34 l12 34 z"/>
    <path d="M926 264 l16 -42 l16 42 z"/><path d="M960 264 l18 -50 l18 50 z"/>
  </g>
  <path fill="#7ba954" d="M0 258 C 240 244, 460 240, 640 256 C 800 270, 900 262, 1000 252 L1000 298 L0 308 Z"/>
  <g stroke="#69934a" stroke-width="4" opacity="0.5">
    <path d="M0 274 L1000 260"/><path d="M0 290 L1000 276"/>
  </g>
  <path fill="#dfe9c8" d="M0 302 L1000 290 L1000 560 L0 560 Z"/>

  <!-- 道 -->
  <path d="M-20 500 C 240 490, 420 470, 640 462 C 800 456, 920 448, 1020 442"
        stroke="#cdc6b2" stroke-width="52" fill="none" stroke-linecap="round"/>
  <path d="M-20 500 C 240 490, 420 470, 640 462 C 800 456, 920 448, 1020 442"
        stroke="#ffffff" stroke-width="4" stroke-dasharray="20 20" opacity="0.75" fill="none"/>

  <!-- 1. 7:00 朝の窓辺で音を聞く -->
  <g>
    <rect x="34" y="330" width="140" height="98" fill="#efe9db" stroke="#c9c0ab" stroke-width="3"/>
    <path d="M24 332 L104 300 L184 332 Z" fill="#8b9aa2"/>
    <rect x="58" y="350" width="90" height="60" fill="#cfe0ea" stroke="#a9bfcb" stroke-width="4"/>
    <path d="M103 350 L103 410" stroke="#a9bfcb" stroke-width="4"/>
    <circle cx="80" cy="380" r="15" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
    <path d="M65 374 q15 -16 30 0 q0 -13 -15 -13 q-15 0 -15 13 z" fill="#463d33"/>
    <g stroke="#4a7896" stroke-width="4" fill="none" opacity="0.85">
      <path d="M158 356 q14 10 0 20"/><path d="M172 348 q22 18 0 36"/>
    </g>
    <circle cx="98" cy="450" r="17" fill="#1f3e52"/>
    <text x="98" y="456" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">7:00</text>
  </g>

  <!-- 2. 9:30 買い物 -->
  <g>
    <rect x="212" y="344" width="150" height="72" fill="#f2efe4" stroke="#c9c0ab" stroke-width="3"/>
    <rect x="212" y="344" width="150" height="16" fill="#5c8b6d"/>
    <g fill="#cfe0ea" stroke="#a9bfcb" stroke-width="3">
      <rect x="226" y="372" width="44" height="34"/><rect x="286" y="372" width="44" height="34"/>
    </g>
    <rect x="196" y="416" width="182" height="10" fill="#b6b1a1"/>
    <circle cx="392" cy="392" r="17" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
    <path d="M375 384 q17 -17 34 0 q-7 -12 -17 -12 q-10 0 -17 12 z" fill="#5b4a36"/>
    <path d="M371 412 q21 -12 42 0 l5 40 l-52 0 z" fill="#8a6f5a"/>
    <path d="M368 424 q-20 6 -22 22" stroke="#e6c49d" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M330 442 L370 442 L364 468 L336 468 Z" fill="#d8c99f" stroke="#b3a175" stroke-width="3"/>
    <circle cx="272" cy="450" r="17" fill="#1f3e52"/>
    <text x="272" y="456" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">9:30</text>
  </g>

  <!-- 3. 11:00 図書館の席 -->
  <g>
    <rect x="424" y="330" width="150" height="92" fill="#f0ece0" stroke="#c9c0ab" stroke-width="3"/>
    <rect x="436" y="342" width="126" height="12" rx="3" fill="#1f3e52"/>
    <text x="499" y="352" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">としょかん</text>
    <g fill="#b9a37c" stroke="#9a8560" stroke-width="2">
      <rect x="438" y="362" width="34" height="46"/><rect x="528" y="362" width="34" height="46"/>
    </g>
    <g fill="#c9603f"><rect x="442" y="366" width="7" height="38"/><rect x="452" y="366" width="7" height="38"/></g>
    <g fill="#4a7896"><rect x="532" y="366" width="7" height="38"/><rect x="542" y="366" width="7" height="38"/></g>
    <rect x="452" y="426" width="96" height="12" rx="3" fill="#b98f5d"/>
    <rect x="462" y="438" width="8" height="26" fill="#a67f50"/><rect x="530" y="438" width="8" height="26" fill="#a67f50"/>
    <circle cx="500" cy="392" r="17" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
    <path d="M483 384 q17 -18 34 0 q-7 -12 -17 -12 q-10 0 -17 12 z" fill="#463d33"/>
    <path d="M479 412 q21 -12 42 0 l4 16 l-50 0 z" fill="#4a7896"/>
    <path d="M470 426 L500 418 L530 426 L500 432 Z" fill="#ffffff" stroke="#b9c2c6" stroke-width="2"/>
    <circle cx="588" cy="450" r="17" fill="#1f3e52"/>
    <text x="588" y="456" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">11:00</text>
  </g>

  <!-- 4. 13:30 体を動かす -->
  <g>
    <rect x="632" y="352" width="140" height="66" fill="#eef0ec" stroke="#c3c8c1" stroke-width="3"/>
    <path d="M624 354 A 78 46 0 0 1 780 354 Z" fill="#93a7ad"/>
    <g fill="#cfe0ea" stroke="#a9bfcb" stroke-width="2">
      <rect x="648" y="370" width="30" height="24"/><rect x="690" y="370" width="30" height="24"/><rect x="732" y="370" width="30" height="24"/>
    </g>
    <!-- ボールをつく人 -->
    <circle cx="614" cy="404" r="15" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
    <path d="M599 398 q15 -16 30 0 q-6 -11 -15 -11 q-9 0 -15 11 z" fill="#5b4a36"/>
    <path d="M596 424 q18 -10 36 0 l5 36 l-46 0 z" fill="#5c8b6d"/>
    <path d="M594 434 q-16 8 -16 22" stroke="#e6c49d" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="574" cy="468" r="13" fill="#dd8b46" stroke="#b06c31" stroke-width="3"/>
    <!-- マウンテンバイクの子ども -->
    <g>
      <circle cx="712" cy="452" r="18" fill="none" stroke="#3d464e" stroke-width="5"/>
      <circle cx="766" cy="452" r="18" fill="none" stroke="#3d464e" stroke-width="5"/>
      <path d="M712 452 L734 430 L758 452 M734 430 L748 430" stroke="#c0563c" stroke-width="5" fill="none"/>
      <circle cx="740" cy="404" r="13" fill="#f0d3ad" stroke="#c4a077" stroke-width="3"/>
      <path d="M727 400 q13 -16 26 0 z" fill="#4a7896"/>
      <path d="M730 418 q10 -8 20 0 l4 16 l-28 0 z" fill="#dc9a63"/>
    </g>
    <circle cx="800" cy="422" r="17" fill="#1f3e52"/>
    <text x="800" y="428" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">13:30</text>
  </g>

  <!-- 5. 16:00 バス停の時刻表 -->
  <g>
    <rect x="856" y="352" width="9" height="86" fill="#7d878c"/>
    <rect x="828" y="322" width="66" height="38" rx="5" fill="#f6f4ea" stroke="#7d878c" stroke-width="3"/>
    <g stroke="#98a2a6" stroke-width="3">
      <path d="M838 334 L884 334"/><path d="M838 343 L878 343"/><path d="M838 352 L882 352"/>
    </g>
    <circle cx="861" cy="314" r="11" fill="#4a7896"/>
    <circle cx="906" cy="404" r="16" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
    <path d="M890 398 q16 -17 32 0 q0 -14 -16 -14 q-16 0 -16 14 z" fill="#463d33"/>
    <path d="M886 424 q20 -12 40 0 l5 38 l-50 0 z" fill="#5c8b6d"/>
    <circle cx="950" cy="418" r="13" fill="#f0d3ad" stroke="#c4a077" stroke-width="3"/>
    <path d="M937 412 q13 -14 26 0 q-5 -10 -13 -10 q-8 0 -13 10 z" fill="#5b4a36"/>
    <path d="M934 434 q16 -10 32 0 l4 28 l-40 0 z" fill="#dc9a63"/>
    <circle cx="806" cy="484" r="17" fill="#1f3e52"/>
    <text x="806" y="490" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">16:00</text>
  </g>

  <!-- 6. 19:00 街灯の下を歩いて帰る -->
  <g>
    <rect x="330" y="470" width="10" height="76" fill="#5c666b"/>
    <path d="M330 470 q0 -22 26 -22" stroke="#5c666b" stroke-width="9" fill="none"/>
    <ellipse cx="360" cy="452" rx="16" ry="11" fill="#ffe9a8"/>
    <path d="M344 458 L300 546 L426 546 L376 458 Z" fill="#ffe9a8" opacity="0.4"/>
    <circle cx="212" cy="492" r="19" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
    <path d="M193 486 q19 -20 38 0 q0 -16 -19 -16 q-19 0 -19 16 z" fill="#463d33"/>
    <path d="M188 514 q24 -12 48 0 l6 42 l-60 0 z" fill="#4a7896"/>
    <circle cx="272" cy="504" r="15" fill="#f0d3ad" stroke="#c4a077" stroke-width="3"/>
    <path d="M257 498 q15 -15 30 0 q-6 -10 -15 -10 q-9 0 -15 10 z" fill="#5b4a36"/>
    <path d="M254 524 q18 -10 36 0 l5 32 l-46 0 z" fill="#dc9a63"/>
    <circle cx="140" cy="516" r="17" fill="#1f3e52"/>
    <text x="140" y="522" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">19:00</text>
  </g>
</svg>
