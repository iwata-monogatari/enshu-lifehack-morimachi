<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="fig1title fig1desc">
<title id="fig1title">森町の空き地の前で分かれる、二つの控除の道</title>
<desc id="fig1desc">草の伸びた空き地と古い実家の前から道が二手に分かれ、左は100万円控除、右は3,000万円控除。中央には同じ譲渡で両方は使えないという標識が立つ。</desc>
