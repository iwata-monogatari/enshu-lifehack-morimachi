<g>
<rect x="20" y="252" width="290" height="34" rx="7" fill="#2f6f96"/>
<text x="34" y="277" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="20" font-weight="bold" fill="#ffffff">道① 低未利用土地 100万円控除</text>
<rect x="20" y="296" width="290" height="132" fill="#fdf6e3" stroke="#b09b62" stroke-width="4"/>
<text x="34" y="322" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="17" fill="#6b5a24">・都市計画区域内であること</text>
<text x="34" y="348" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="17" fill="#6b5a24">・対価 500万円以下</text>
<text x="34" y="374" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="17" fill="#6b5a24">　（用途地域内は800万円以下）</text>
<text x="34" y="400" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="17" fill="#6b5a24">・所有期間 5年超</text>
<text x="34" y="422" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="16" fill="#8a5a1e">・令和10年12月31日まで</text>
<rect x="20" y="440" width="290" height="38" rx="6" fill="#e6f0e6" stroke="#4d7f63" stroke-width="3"/>
<text x="34" y="466" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="19" font-weight="bold" fill="#33604a">減税は最大 20万円</text>
</g>

<g>
<rect x="690" y="252" width="290" height="34" rx="7" fill="#9b4a2f"/>
<text x="704" y="277" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="20" font-weight="bold" fill="#ffffff">道② 空き家 3,000万円控除</text>
<rect x="690" y="296" width="290" height="132" fill="#fdf6e3" stroke="#b09b62" stroke-width="4"/>
<text x="704" y="322" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="17" fill="#6b5a24">・昭和56年5月31日以前の建築</text>
<text x="704" y="348" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="17" fill="#6b5a24">・売却代金 1億円以下</text>
<text x="704" y="374" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="17" fill="#6b5a24">・相続開始から3年目の年末まで</text>
<text x="704" y="400" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="17" fill="#6b5a24">・耐震基準適合 か 取壊し</text>
<text x="704" y="422" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="16" fill="#8a5a1e">・令和9年12月31日まで</text>
<rect x="690" y="440" width="290" height="38" rx="6" fill="#f6e8e2" stroke="#9b4a2f" stroke-width="3"/>
<text x="704" y="466" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="19" font-weight="bold" fill="#8b4128">相続人3人以上は2,000万円</text>
</g>

