<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="mori-editorial"><title id="title">文化財件数の三つの数字</title><desc id="desc">2026年9月1日現在の登録建造物14884件、7月17日の答申163件、官報告示後の見込み15041件を分けた図</desc><rect width="1200" height="675" fill="#f5f0e5"/><text x="600" y="76" text-anchor="middle" font-size="36" font-weight="700" fill="#284f49">三つの数字は、基準と状態が違う</text><g font-family="sans-serif" text-anchor="middle"><rect x="70" y="155" width="310" height="280" rx="24" fill="#fff" stroke="#648e82" stroke-width="5"/><text x="225" y="215" font-size="25" fill="#47665e">9月1日現在</text><text x="225" y="300" font-size="48" font-weight="700" fill="#315e55">14,884</text><text x="225" y="365" font-size="25" fill="#263f3b">登録済み</text><rect x="445" y="155" width="310" height="280" rx="24" fill="#fff" stroke="#c5974d" stroke-width="5"/><text x="600" y="215" font-size="25" fill="#76561f">7月17日</text><text x="600" y="300" font-size="48" font-weight="700" fill="#9a6b27">163</text><text x="600" y="365" font-size="25" fill="#263f3b">答申件数</text><rect x="820" y="155" width="310" height="280" rx="24" fill="#fff" stroke="#7c929a" stroke-width="5"/><text x="975" y="215" font-size="25" fill="#4e6870">官報告示後</text><text x="975" y="300" font-size="48" font-weight="700" fill="#3c6670">15,041</text><text x="975" y="365" font-size="25" fill="#263f3b">見込み</text></g><text x="600" y="510" text-anchor="middle" font-size="31" font-weight="700" fill="#a14e3b">14,884 ＋ 163 ＝ 15,047　→　6件差</text><text x="600" y="575" text-anchor="middle" font-size="25" fill="#52645f">確認した公表ページだけでは、差の理由を説明できない</text></svg>
