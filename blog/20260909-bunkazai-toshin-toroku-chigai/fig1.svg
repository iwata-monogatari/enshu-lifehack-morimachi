<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-illustration="mori-editorial"><title id="title">文化財の答申と登録の二段階</title><desc id="desc">文化審議会の答申から文部科学大臣の登録、通知と官報告示、基準日付き集計へ進む流れ</desc><rect width="1200" height="675" fill="#f1f3eb"/><text x="600" y="74" text-anchor="middle" font-size="36" font-weight="700" fill="#284f49">答申と登録は、同じ箱に入れない</text><g font-family="sans-serif"><rect x="65" y="170" width="300" height="270" rx="24" fill="#fff" stroke="#c59b55" stroke-width="5"/><text x="215" y="225" text-anchor="middle" font-size="30" font-weight="700" fill="#7b581f">1　答申</text><text x="105" y="290" font-size="25" fill="#263f3b">文化審議会</text><text x="105" y="335" font-size="25" fill="#263f3b">　↓</text><text x="105" y="380" font-size="25" fill="#263f3b">文部科学大臣</text><rect x="450" y="170" width="300" height="270" rx="24" fill="#fff" stroke="#609083" stroke-width="5"/><text x="600" y="225" text-anchor="middle" font-size="30" font-weight="700" fill="#315e55">2　登録</text><text x="490" y="290" font-size="25" fill="#263f3b">文化財登録原簿</text><text x="490" y="335" font-size="25" fill="#263f3b">所有者へ通知</text><text x="490" y="380" font-size="25" fill="#263f3b">官報で告示</text><rect x="835" y="170" width="300" height="270" rx="24" fill="#fff" stroke="#79949a" stroke-width="5"/><text x="985" y="225" text-anchor="middle" font-size="30" font-weight="700" fill="#365d65">件数集計</text><text x="875" y="290" font-size="25" fill="#263f3b">登録済み総数</text><text x="875" y="335" font-size="25" fill="#263f3b">基準日を付ける</text><text x="875" y="380" font-size="25" fill="#263f3b">予定数と分ける</text></g><path d="M375 305h58m-17-18 18 18-18 18M760 305h58m-17-18 18 18-18 18" fill="none" stroke="#536b64" stroke-width="9" stroke-linecap="round"/><rect x="160" y="505" width="880" height="90" rx="20" fill="#315e55"/><text x="600" y="562" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">「答申済み」と「登録済み」を日付ごとに記録する</text></svg>
