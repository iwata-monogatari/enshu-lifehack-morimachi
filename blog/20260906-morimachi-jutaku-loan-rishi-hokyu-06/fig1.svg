<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial"><title id="title">借入総額と利子補給を分ける図</title><desc id="desc">住宅ローン3000万円の例に対し、補給対象元本は700万円、10年総額上限は213786円で、日銀の1.0％とは引き算しないことを示す</desc><rect width="1000" height="560" rx="28" fill="#f4f1e8"/><path d="M0 142L145 72l108 54 123-84 128 91 119-63 143 69 118-73 116 72v84H0z" fill="#9dbda3"/><g fill="#fff" stroke="#315e58" stroke-width="5"><rect x="48" y="245" width="278" height="205" rx="18"/><rect x="361" y="245" width="278" height="205" rx="18"/><rect x="674" y="245" width="278" height="205" rx="18"/></g><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#244a47"><text x="187" y="294" font-size="26" font-weight="700">借入例</text><text x="187" y="367" font-size="50" font-weight="800">3,000万円</text><text x="500" y="294" font-size="26" font-weight="700">補給対象元本</text><text x="500" y="367" font-size="50" font-weight="800">700万円</text><text x="813" y="294" font-size="26" font-weight="700">10年総額上限</text><text x="813" y="367" font-size="43" font-weight="800">213,786円</text><text x="500" y="511" font-size="27" font-weight="800">日銀1.0％ − 町0.6％ とは計算しない</text></g><path d="M390 485L610 485" stroke="#c56f37" stroke-width="7"/><path d="M410 458L590 518" stroke="#c56f37" stroke-width="8"/></svg>
