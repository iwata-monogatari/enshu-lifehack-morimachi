<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title_fig desc_fig" data-illustration="mori-editorial">
<title id="title_fig">森町の町民バス・デマンド交通の全体像</title>
<desc id="desc_fig">定時定路線バスと予約制デマンド交通を組み合わせた森町の公共交通ネットワーク</desc>
<rect width="1000" height="560" rx="20" fill="#f4f1df"/>
<path d="M0 250 Q150 120 300 235 T600 210 T1000 185 V560 H0Z" fill="#b7cfb3"/>
<path d="M0 330 Q190 240 360 330 T700 300 T1000 320 V560 H0Z" fill="#d9e8d0"/>
<text x="50" y="52" font-family="sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">森町の町民バス・デマンド交通の全体像</text>
<g>
  <rect x="50" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="50" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="192" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">① 町民バス（定時路線）</text>
  <text x="68" y="155" font-family="sans-serif" font-size="14" fill="#334155">・吉川線、三倉線などの幹線運行</text>
<text x="68" y="183" font-family="sans-serif" font-size="14" fill="#334155">・役場・公立森町病院・駅を直結</text>
<text x="68" y="211" font-family="sans-serif" font-size="14" fill="#334155">・大人片道200円の均一運賃</text>
<text x="68" y="239" font-family="sans-serif" font-size="14" fill="#334155">・平日を中心に定時運行を実施</text>
<text x="68" y="267" font-family="sans-serif" font-size="14" fill="#334155">・主要バス停での乗り継ぎ連携</text>

</g><g>
  <rect x="355" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="355" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="497" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">② デマンド乗合タクシー</text>
  <text x="373" y="155" font-family="sans-serif" font-size="14" fill="#334155">・事前登録制・電話予約制の運行</text>
<text x="373" y="183" font-family="sans-serif" font-size="14" fill="#334155">・自宅前と指定乗降場所を送迎</text>
<text x="373" y="211" font-family="sans-serif" font-size="14" fill="#334155">・高齢者や交通弱者の外出を支援</text>
<text x="373" y="239" font-family="sans-serif" font-size="14" fill="#334155">・路線バス空白地帯をきめ細かく補完</text>
<text x="373" y="267" font-family="sans-serif" font-size="14" fill="#334155">・相乗り運行による効率的な運用</text>

</g><g>
  <rect x="660" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="660" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="802" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">③ 家族送迎・地域共助</text>
  <text x="678" y="155" font-family="sans-serif" font-size="14" fill="#334155">・通院日や買物日の曜日固定化</text>
<text x="678" y="183" font-family="sans-serif" font-size="14" fill="#334155">・近隣住民同士の乗り合い送迎</text>
<text x="678" y="211" font-family="sans-serif" font-size="14" fill="#334155">・自家用有償旅客運送の模索</text>
<text x="678" y="239" font-family="sans-serif" font-size="14" fill="#334155">・複数の足を組み合わせる複線化</text>
<text x="678" y="267" font-family="sans-serif" font-size="14" fill="#334155">・実家訪問時の移動計画の共有</text>

</g>
<rect x="50" y="465" width="900" height="60" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="500" y="502" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">定時定路線バスと予約制デマンド交通を組み合わせた森町の公共交通ネットワーク</text>
</svg>