<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="sk1Title sk1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="sk1Title">静岡県森町の水田地帯を横から見た情景のイラスト</title>
  <desc id="sk1Desc">奥に遠州の山並みと杉林、段になった茶畑が広がります。右奥には牛舎と牛、その手前にWCS用稲のロールが置かれ、田と牛舎の間を矢印が往復しています。中ほどを用水路が横切り、暗渠排水の管口が二か所あります。左手前には稲の実る水田が、右手前にはスイートコーンの列とレタスの畝が並ぶ裏作の畑が続き、あぜ道に軽トラックが止まっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="sk1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfd8ec"/><stop offset="1" stop-color="#e9f1e4"/>
    </linearGradient>
    <linearGradient id="sk1Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ba9bc"/><stop offset="1" stop-color="#b6cbd2"/>
    </linearGradient>
    <linearGradient id="sk1Paddy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc05c"/><stop offset="1" stop-color="#b3d777"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="176" fill="url(#sk1Sky)"/>
