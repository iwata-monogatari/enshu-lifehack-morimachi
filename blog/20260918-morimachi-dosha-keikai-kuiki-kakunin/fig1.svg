<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" data-illustration="mori-editorial">
  <rect width="1000" height="560" fill="#f6f9f7"/>
  <rect x="40" y="30" width="920" height="500" rx="14" fill="#ffffff" stroke="#c2d6cc" stroke-width="2"/>
  <text x="70" y="75" font-family="'Zen Maru Gothic', sans-serif" font-size="24" font-weight="bold" fill="#2d5240">森町の土砂災害警戒区域（イエロー・レッド）の確認区分</text>
  
  <g transform="translate(70, 105)">
    <!-- イエロー区域 -->
    <rect x="0" y="0" width="420" height="370" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="3"/>
    <rect x="20" y="20" width="380" height="40" rx="6" fill="#fef08a"/>
    <text x="210" y="48" font-family="'Zen Maru Gothic', sans-serif" font-size="19" font-weight="bold" fill="#854d0e" text-anchor="middle">土砂災害警戒区域（イエロー）</text>
    <text x="30" y="95" font-family="'Zen Maru Gothic', sans-serif" font-size="16" font-weight="bold" fill="#713f12">【対象と状態】</text>
    <text x="30" y="125" font-family="'Zen Maru Gothic', sans-serif" font-size="15" fill="#4b5563">急傾斜地等の崩壊により住民に危害が生じるおそれがある区域</text>
    <text x="30" y="170" font-family="'Zen Maru Gothic', sans-serif" font-size="16" font-weight="bold" fill="#713f12">【求められる行動】</text>
    <text x="30" y="200" font-family="'Zen Maru Gothic', sans-serif" font-size="15" fill="#4b5563">・大雨警報時の早めの避難準備</text>
    <text x="30" y="230" font-family="'Zen Maru Gothic', sans-serif" font-size="15" fill="#4b5563">・町が発令する高齢者等避難での移動</text>
    <text x="30" y="260" font-family="'Zen Maru Gothic', sans-serif" font-size="15" fill="#4b5563">・宅地建物取引時の重要事項説明対象</text>
    <rect x="25" y="300" width="370" height="45" rx="6" fill="#fef9c3"/>
    <text x="210" y="328" font-family="'Zen Maru Gothic', sans-serif" font-size="14" font-weight="bold" fill="#a16207" text-anchor="middle">警報段階で指定避難場所への移動を検討</text>
  </g>

  <g transform="translate(510, 105)">
    <!-- レッド区域 -->
    <rect x="0" y="0" width="420" height="370" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="3"/>
    <rect x="20" y="20" width="380" height="40" rx="6" fill="#fecaca"/>
    <text x="210" y="48" font-family="'Zen Maru Gothic', sans-serif" font-size="19" font-weight="bold" fill="#991b1b" text-anchor="middle">土砂災害特別警戒区域（レッド）</text>
    <text x="30" y="95" font-family="'Zen Maru Gothic', sans-serif" font-size="16" font-weight="bold" fill="#7f1d1d">【対象と状態】</text>
    <text x="30" y="125" font-family="'Zen Maru Gothic', sans-serif" font-size="15" fill="#4b5563">建築物に損壊が生じ住民に著しい危害が生じるおそれがある区域</text>
    <text x="30" y="170" font-family="'Zen Maru Gothic', sans-serif" font-size="16" font-weight="bold" fill="#7f1d1d">【求められる行動】</text>
    <text x="30" y="200" font-family="'Zen Maru Gothic', sans-serif" font-size="15" fill="#4b5563">・雨足が強まる前の明るい時間帯の立ち退き避難</text>
    <text x="30" y="230" font-family="'Zen Maru Gothic', sans-serif" font-size="15" fill="#4b5563">・住宅の構造規制、特定の開発行為の制限</text>
    <text x="30" y="260" font-family="'Zen Maru Gothic', sans-serif" font-size="15" fill="#4b5563">・山側の部屋を避け、2階の谷側へ（緊急時）</text>
    <rect x="25" y="300" width="370" height="45" rx="6" fill="#fee2e2"/>
    <text x="210" y="328" font-family="'Zen Maru Gothic', sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">夜間の移動は極めて危険。昼間に立ち退く</text>
  </g>
</svg>