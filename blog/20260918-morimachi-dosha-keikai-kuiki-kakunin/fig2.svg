<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" data-illustration="mori-editorial">
  <rect width="1000" height="560" fill="#f6f9f7"/>
  <rect x="40" y="30" width="920" height="500" rx="14" fill="#ffffff" stroke="#c2d6cc" stroke-width="2"/>
  <text x="70" y="75" font-family="'Zen Maru Gothic', sans-serif" font-size="24" font-weight="bold" fill="#2d5240">秋の長雨・台風期に家族で決める避難の3段階順序</text>

  <g transform="translate(70, 110)">
    <circle cx="35" cy="45" r="26" fill="#3b7a57"/>
    <text x="35" y="53" font-family="'Zen Maru Gothic', sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="80" y="15" width="770" height="65" rx="8" fill="#f0f7f3"/>
    <text x="105" y="44" font-family="'Zen Maru Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1b382b">自宅の指定区域とハザードマップ確認</text>
    <text x="105" y="67" font-family="'Zen Maru Gothic', sans-serif" font-size="14" fill="#527062">森町役場発行の土砂災害ハザードマップで実家の敷地がイエロー・レッドに該当するかを特定</text>
  </g>

  <g transform="translate(70, 215)">
    <circle cx="35" cy="45" r="26" fill="#3b7a57"/>
    <text x="35" y="53" font-family="'Zen Maru Gothic', sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="80" y="15" width="770" height="65" rx="8" fill="#f0f7f3"/>
    <text x="105" y="44" font-family="'Zen Maru Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1b382b">地区の避難所と移動ルートの安全確認</text>
    <text x="105" y="67" font-family="'Zen Maru Gothic', sans-serif" font-size="14" fill="#527062">最寄りの地区センターや体育館までの道順に、越水しやすい沢や崩れやすい法面がないかを点検</text>
  </g>

  <g transform="translate(70, 320)">
    <circle cx="35" cy="45" r="26" fill="#3b7a57"/>
    <text x="35" y="53" font-family="'Zen Maru Gothic', sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="80" y="15" width="770" height="65" rx="8" fill="#f0f7f3"/>
    <text x="105" y="44" font-family="'Zen Maru Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1b382b">『高齢者等避難（警戒レベル3）』での明るい内の出発</text>
    <text x="105" y="67" font-family="'Zen Maru Gothic', sans-serif" font-size="14" fill="#527062">夜間の土砂崩れ・停電に巻き込まれる前に、町からのレベル3発令に合わせて親戚宅や避難所へ移動</text>
  </g>

  <rect x="70" y="430" width="840" height="60" rx="8" fill="#e8f2ec"/>
  <text x="490" y="465" font-family="'Zen Maru Gothic', sans-serif" font-size="15" font-weight="bold" fill="#2d5240" text-anchor="middle">【大石の視点】空き家・実家の裏山点検は、天気の良い日に家族で行い、雨が降ってからは近づかない</text>
</svg>