<text x="40" y="540" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="17" font-weight="bold" fill="#ffffff">跳ねたのは一番茶ではなく、下級茶と秋冬番茶／出典 静岡県茶業の現状（令和8年3月）</text>
