<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ch1title ch1desc">
<title id="ch1title">静岡県の荒茶価格を茶期ごとに令和6年と令和7年で並べる</title>
<desc id="ch1desc">一番茶は1,763円から2,218円へわずかに伸び、四・秋冬茶は355円から1,760円へ大きく伸び、年平均は971円から1,730円になったことを棒グラフで示した図。</desc>
