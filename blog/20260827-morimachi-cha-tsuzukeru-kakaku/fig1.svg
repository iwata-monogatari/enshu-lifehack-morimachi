<g font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="13">
<rect x="440" y="198" width="18" height="14" fill="#a9bfae"/><text x="464" y="210" fill="#4b5b4e">令和6年</text>
<rect x="546" y="198" width="18" height="14" fill="#3f7d5c"/><text x="570" y="210" fill="#4b5b4e">令和7年</text>
