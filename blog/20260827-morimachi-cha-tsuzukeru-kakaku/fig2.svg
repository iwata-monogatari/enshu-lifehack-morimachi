<text x="382" y="434" font-size="13" fill="#5a6a5c">次の更新はいつか</text>
<text x="382" y="452" font-size="13" fill="#5a6a5c">摘採機・防除・管理</text>
</g>

<g font-family="'Meiryo','Hiragino Sans',sans-serif">
<circle cx="619" cy="262" r="25" fill="#1f3e52"/><text x="609" y="271" font-size="21" font-weight="bold" fill="#ffffff">4</text>
<rect x="555" y="304" width="128" height="86" fill="#ffffff" stroke="#7d8f76" stroke-width="3"/>
<path d="M575 372 L603 340 L631 356 L663 322" fill="none" stroke="#3f7d5c" stroke-width="5"/>
<circle cx="663" cy="322" r="6" fill="#3f7d5c"/>
<text x="565" y="332" font-size="12.5" fill="#6a7a6c">市場・農協・直販</text>
<text x="555" y="414" font-size="14.5" font-weight="bold" fill="#33503f">出荷先と精算</text>
<text x="555" y="434" font-size="13" fill="#5a6a5c">相場は自動で届かない</text>
<text x="555" y="452" font-size="13" fill="#5a6a5c">連動の仕方を聞く</text>
</g>

<g font-family="'Meiryo','Hiragino Sans',sans-serif">
<circle cx="792" cy="262" r="25" fill="#1f3e52"/><text x="782" y="271" font-size="21" font-weight="bold" fill="#ffffff">5</text>
<rect x="728" y="304" width="128" height="86" rx="10" fill="#ffffff" stroke="#7d8f76" stroke-width="3"/>
<rect x="742" y="318" width="100" height="34" rx="4" fill="#eaf1e4"/>
<text x="748" y="341" font-size="13.5" font-weight="bold" fill="#1f3e52">農業委員会</text>
<path d="M754 372 q11 -14 27 -6 q16 8 30 -4" fill="none" stroke="#4f6f86" stroke-width="5"/>
<text x="728" y="414" font-size="14.5" font-weight="bold" fill="#33503f">続けない道も聞く</text>
<text x="728" y="434" font-size="13" fill="#5a6a5c">茶園も農地</text>
<text x="728" y="452" font-size="13" fill="#5a6a5c">貸す・預ける</text>
</g>

<g font-family="'Meiryo','Hiragino Sans',sans-serif">
<rect x="874" y="216" width="112" height="176" fill="#ffffff" stroke="#9aa88f" stroke-width="4"/>
<text x="884" y="240" font-size="13.5" font-weight="bold" fill="#33503f">計算用紙</text>
<path d="M884 250 H976" stroke="#c3cebb" stroke-width="2"/>
<text x="884" y="272" font-size="12.5" fill="#8c3a30">続ける費用</text>
<g stroke="#e0c9c4" stroke-width="2"><path d="M884 282 H976"/><path d="M884 298 H976"/><path d="M884 314 H976"/></g>
<text x="884" y="340" font-size="12.5" fill="#2f5f45">入る金額</text>
<g stroke="#c9ddc9" stroke-width="2"><path d="M884 350 H976"/><path d="M884 366 H976"/></g>
<path d="M884 380 H976" stroke="#7d8f76" stroke-width="4"/>
<text x="866" y="414" font-size="13" fill="#5a6a5c">並べてから決める</text>
</g>

<rect x="26" y="500" width="700" height="36" rx="6" fill="#1f3e52"/>
<text x="40" y="525" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="17" font-weight="bold" fill="#ffffff">価格は動かせない。動かせるのは刈る範囲と機械の替え時</text>
</svg>
