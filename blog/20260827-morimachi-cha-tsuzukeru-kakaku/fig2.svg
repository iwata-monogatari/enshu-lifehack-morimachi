<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="ch2title ch2desc">
<title id="ch2title">茶園を続けるかを決めるために数える五つの条件</title>
<desc id="ch2desc">傾斜と乗用型機械、摘採の範囲、機械の年式と更新費、出荷先と精算、貸すか預けるかの相談先という五つの条件を順に並べ、右端に費用と収入を並べる計算用紙を置いた図。</desc>
<defs>
<linearGradient id="ch2sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#d4e5f0"/><stop offset="1" stop-color="#edf3e8"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="url(#ch2sky)"/>

