<path d="M70 262 H620" stroke="#b7c3ae" stroke-width="6" stroke-dasharray="14 10"/>

<g font-family="'Meiryo','Hiragino Sans',sans-serif">
<circle cx="100" cy="262" r="25" fill="#1f3e52"/><text x="90" y="271" font-size="21" font-weight="bold" fill="#ffffff">1</text>
<rect x="36" y="304" width="128" height="86" fill="#cfe0b8" stroke="#8fae76" stroke-width="3"/>
<path d="M36 380 L164 320" stroke="#6f8f5c" stroke-width="6"/>
<path d="M36 390 L164 330" stroke="#8fae76" stroke-width="5"/>
<rect x="112" y="326" width="34" height="20" rx="3" fill="#4f6f86"/>
<circle cx="120" cy="350" r="7" fill="#3d5567"/><circle cx="140" cy="346" r="7" fill="#3d5567"/>
<text x="36" y="414" font-size="14.5" font-weight="bold" fill="#33503f">傾斜と機械</text>
<text x="36" y="434" font-size="13" fill="#5a6a5c">乗用型が入るか</text>
<text x="36" y="452" font-size="13" fill="#5a6a5c">森町は合計92台</text>
</g>

<g font-family="'Meiryo','Hiragino Sans',sans-serif">
<circle cx="273" cy="262" r="25" fill="#1f3e52"/><text x="263" y="271" font-size="21" font-weight="bold" fill="#ffffff">2</text>
<rect x="209" y="304" width="128" height="86" fill="#ffffff" stroke="#7d8f76" stroke-width="3"/>
<rect x="221" y="316" width="104" height="26" rx="4" fill="#eaf1e4" stroke="#9aa88f" stroke-width="2"/>
<text x="229" y="335" font-size="13" fill="#3d4b40">一番茶</text>
<rect x="221" y="350" width="104" height="26" rx="4" fill="#fdf3e8" stroke="#c9a06a" stroke-width="3"/>
<text x="229" y="369" font-size="13" font-weight="bold" fill="#8a5a24">秋冬番茶</text>
<text x="209" y="414" font-size="14.5" font-weight="bold" fill="#33503f">どこまで刈るか</text>
<text x="209" y="434" font-size="13" fill="#5a6a5c">去年の範囲を書く</text>
<text x="209" y="452" font-size="13" fill="#5a6a5c">値が付いたのは下</text>
</g>

<g font-family="'Meiryo','Hiragino Sans',sans-serif">
<circle cx="446" cy="262" r="25" fill="#1f3e52"/><text x="436" y="271" font-size="21" font-weight="bold" fill="#ffffff">3</text>
<rect x="382" y="304" width="128" height="86" fill="#ffffff" stroke="#7d8f76" stroke-width="3"/>
<rect x="396" y="326" width="46" height="30" rx="3" fill="#c8ac72"/>
