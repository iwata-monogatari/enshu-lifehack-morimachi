<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial"><title id="title">有効期限通知書から二つの更新へ分かれる道</title><desc id="desc">森町の山並みと茶畑、役場を背景に、水色の封筒に入った有効期限通知書からカード本体と電子証明書へ道が分かれる</desc><rect width="1000" height="560" rx="28" fill="#eef4ea"/><path d="M0 128L126 64l112 58 119-80 132 88 121-62 143 70 119-76 128 80v86H0z" fill="#94b99c"/><path d="M0 218h1000v342H0z" fill="#dfe8cf"/><path d="M0 386c128-82 236-75 355-3s228 76 328 6 195-86 317-35v206H0z" fill="#aac58e"/><g stroke="#779c67" stroke-width="8"><path d="M0 436l242-112"/><path d="M72 500l258-130"/><path d="M650 434l290-116"/><path d="M736 510l264-108"/></g><rect x="402" y="246" width="196" height="142" rx="14" fill="#cde8f1" stroke="#315e58" stroke-width="5"/><path d="M416 264l84 62 84-62" fill="none" stroke="#315e58" stroke-width="5"/><text x="500" y="365" font-family="system-ui,sans-serif" text-anchor="middle" font-size="25" font-weight="800" fill="#244a47">有効期限通知書</text><path d="M424 395C350 421 296 435 234 438" fill="none" stroke="#c46e3b" stroke-width="9"/><path d="M576 395C650 421 704 435 766 438" fill="none" stroke="#c46e3b" stroke-width="9"/><g fill="#fff" stroke="#315e58" stroke-width="5"><rect x="78" y="400" width="260" height="112" rx="16"/><rect x="662" y="400" width="260" height="112" rx="16"/></g><circle cx="130" cy="452" r="24" fill="#ddb481"/><rect x="174" y="426" width="126" height="15" rx="7" fill="#8aa99d"/><rect x="174" y="454" width="94" height="13" rx="6" fill="#b4c7be"/><rect x="724" y="430" width="66" height="52" rx="8" fill="#d9c08c"/><path d="M746 430v52M768 430v52M724 447h66M724 465h66" stroke="#8b7049" stroke-width="3"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#244a47"><text x="208" y="390" font-size="25" font-weight="800">カード本体</text><text x="208" y="542" font-size="23" font-weight="700">18歳以上は原則10年</text><text x="792" y="390" font-size="25" font-weight="800">電子証明書</text><text x="792" y