<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial"><title id="title">病児保育を利用する五段階</title><desc id="desc">事前登録、施設へ電話、医療機関受診、医師連絡票、利用と送迎を五段階で示す</desc><rect width="1000" height="560" rx="28" fill="#eef4ea"/><path d="M0 132L128 70l106 51 112-78 132 83 123-60 138 73 126-77 135 78v74H0z" fill="#8eb497"/><path d="M82 375H918" stroke="#557b6c" stroke-width="16" stroke-linecap="round"/><g fill="#fff" stroke="#315e58" stroke-width="5"><circle cx="110" cy="375" r="52"/><circle cx="305" cy="375" r="52"/><circle cx="500" cy="375" r="52"/><circle cx="695" cy="375" r="52"/><circle cx="890" cy="375" r="52"/></g><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#244a47"><text x="110" y="388" font-size="36" font-weight="800">1</text><text x="305" y="388" font-size="36" font-weight="800">2</text><text x="500" y="388" font-size="36" font-weight="800">3</text><text x="695" y="388" font-size="36" font-weight="800">4</text><text x="890" y="388" font-size="36" font-weight="800">5</text><text x="110" y="272" font-size="23" font-weight="700">事前登録</text><text x="305" y="272" font-size="23" font-weight="700">施設へ電話</text><text x="500" y="272" font-size="23" font-weight="700">医療機関受診</text><text x="695" y="272" font-size="23" font-weight="700">医師連絡票</text><text x="890" y="250" font-size="22" font-weight="700">利用と</text><text x="890" y="280" font-size="22" font-weight="700">送迎</text><text x="500" y="510" font-size="28" font-weight="800">登録だけで当日利用は確定しない</text></g><g fill="#c9743c"><path d="M183 360l34 15-34 15z"/><path d="M378 360l34 15-34 15z"/><path d="M573 360l34 15-34 15z"/><path d="M768 360l34 15-34 15z"/></g></svg>
