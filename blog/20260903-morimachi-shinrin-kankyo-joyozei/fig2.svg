<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial">
  <title id="title">インフラ保全森林整備事業の総事業費と譲与税充当額を分ける図</title>
  <desc id="desc">総事業費357万5000円の箱の内側に、譲与税充当290万6000円を示し、所有地が対象かは地番で確認すると案内する</desc>
  <rect width="1000" height="560" rx="24" fill="#f4f0e5"/>
  <path d="M0 300l142-117 116 92 126-136 126 128 137-164 128 143 100-93 125 114v293H0z" fill="#adc3a6"/>
  <path d="M0 390c167-64 309-48 472 19 184 76 340 57 528-36v187H0z" fill="#6f936a"/>
  <g font-family="sans-serif">
    <rect x="70" y="70" width="540" height="344" rx="24" fill="#fff" stroke="#315b47" stroke-width="4"/>
    <text x="340" y="126" text-anchor="middle" font-size="26" font-weight="700" fill="#234638">インフラ保全森林整備事業</text>
    <rect x="125" y="167" width="430" height="178" rx="18" fill="#dfe8da" stroke="#688a70" stroke-width="4"/>
    <text x="340" y="210" text-anchor="middle" font-size="21" fill="#526158">総事業費</text><text x="340" y="255" text-anchor="middle" font-size="34" font-weight="800" fill="#234638">3,575,000円</text>
    <rect x="170" y="282" width="340" height="48" rx="12" fill="#315b47"/><text x="340" y="314" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">うち譲与税 2,906,000円</text>
    <g transform="translate(665 82)"><rect width="270" height="316" rx="24" fill="#fff" stroke="#315b47" stroke-width="4"/><path d="M38 180l63-83 46 52 46-72 46 103z" fill="#8faa83"/><path d="M42 228h187" stroke="#666" stroke-width="16"/><path d="M80 206v45M139 206v45M198 206v45" stroke="#eee" stroke-width="6"/><circle cx="219" cy="76" r="20" fill="#e1c66d"/><text x="135" y="271" text-anchor="middle" font-size="22" font-weight="700" fill="#234638">自分の山が対象か</text><text x="135" y="304" text-anchor="middle" font-size="20" fill="#526158">地番で確認</text></g>
  </g>
  <text x="500" y="510" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700" fill="#fff">290万6000円は総事業費ではなく、譲与税を充てた部分</text>
</svg>
