<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="kk2title kk2desc">
<title id="kk2title">実家が空白地域に入るかを確かめる四つの段</title>
<desc id="kk2desc">課税明細書から住所を出し、地図に駅とバス停の印を付け、1キロメートルと400メートルの円を引き、最後に町の担当課へ電話して確かめるまでの四つの段を、右端の一週間の予定表とあわせて描いた図。</desc>
<defs>
