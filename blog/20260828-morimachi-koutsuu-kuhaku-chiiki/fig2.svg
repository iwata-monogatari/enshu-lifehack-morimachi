<text x="90" y="211" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="17" font-weight="bold" fill="#33503f">手元の紙から住所と地番を出す</text>
<rect x="44" y="232" width="128" height="96" fill="#ffffff" stroke="#8b9a84" stroke-width="3" transform="rotate(-4 108 280)"/>
