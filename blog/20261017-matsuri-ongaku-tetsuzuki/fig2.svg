<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" data-illustration="mori-editorial" role="img"><title>机で資料を確認する人、電話で相談する人、スピーカーのある舞台を点線で結んだ概念図。開催条件の整理、問い合わせ、当日の利用という順序を表し、特定の催しへの許可や手続きの可否を図示するものではない。</title><rect width="1000" height="560" fill="#eef1df"/><path d="M0 260L160 110 300 235 470 90 640 250 820 120 1000 245V560H0Z" fill="#cad9bf"/><path d="M0 300Q200 215 420 300T1000 285V560H0Z" fill="#a6c3ac"/><path d="M0 455Q320 290 1000 480V560H0Z" fill="#e2d7b5"/><path d="M0 510Q400 345 1000 520" fill="none" stroke="#f8f2de" stroke-width="55"/><text x="42" y="55" font-family="Yu Gothic,sans-serif" font-size="23" font-weight="bold" fill="#244c47">音楽の準備は、条件の共有から</text><g transform="translate(60 350)"><path d="M0 0H170V14H0Z" fill="#956f4e"/><path d="M15 14V80M155 14V80" stroke="#59665c" stroke-width="8"/><rect x="45" y="-30" width="70" height="35" rx="3" fill="#fff9e9"/><path d="M56-17H103M56-6H95" stroke="#6b8b84" stroke-width="3"/></g><g transform="translate(270 365) scale(1)"><circle cy="-52" r="13" fill="#d7a681"/><path d="M-18-33 Q0-43 18-33 L22 12 H-22Z" fill="#345d63"/><path d="M-12 12 L-15 48 M12 12 L17 48" stroke="#263e42" stroke-width="9" stroke-linecap="round"/><path d="M-17-26 L-35 2 M17-26 L37-4" stroke="#345d63" stroke-width="9" stroke-linecap="round"/></g><g transform="translate(500 350) scale(1)"><circle cy="-52" r="13" fill="#d7a681"/><path d="M-18-33 Q0-43 18-33 L22 12 H-22Z" fill="#aa744b"/><path d="M-12 12 L-15 48 M12 12 L17 48" stroke="#263e42" stroke-width="9" stroke-linecap="round"/><path d="M-17-26 L-35 2 M17-26 L37-4" stroke="#aa744b" stroke-width="9" stroke-linecap="round"/></g><rect x="518" y="292" width="15" height="30" rx="3" fill="#233b42"/><rect x="720" y="340" width="190" height="55" fill="#947356"/><rect x="743" y="265" width="50" height="75" fill="#344e53"/><circle cx="768" cy="307" r="17" fill="#182f35"/><path d="M315 420H675" stroke="#668877" stroke-width="8" stroke-dasharray="14 9"/><text x="42"