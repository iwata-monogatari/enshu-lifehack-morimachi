<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="hr1Title hr1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="hr1Title">森町の実家の座敷で、帰省した兄弟が固定資産税の納税通知書を囲んでいる情景のイラスト</title>
<desc id="hr1Desc">左手には実家の門柱と郵便受けがあり、封筒が何通も差さったままになっています。そこから縁側へ続き、中央の座敷では低い座卓を三人が囲んでいます。卓の上には封を切った納税通知書と課税明細書、名寄帳らしい綴り、印鑑と朱肉、ボールペンが広げられ、一人が明細の行を指でたどっています。もう一人は郵便受けから抱えてきた封筒の束を持ち、三人目は縁側で電話をかけています。右手の柱には八月の暦と、十一月二日に赤い丸の付いた暦が並んで掛かっています。庭には柿の木と井戸が見え、その向こうに瓦屋根の家並みと生け垣、段になった茶畑、杉木立、遠州の山並みが夏の空を背に広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="hr1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bed6e4"/><stop offset="1" stop-color="#eef3e6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#f2f4ea"/>
  <rect width="1000" height="146" fill="url(#hr1Sky)"/>
  <circle cx="880" cy="44" r="23" fill="#f6e6b4"/>
  <path fill="#9db4be" d="M0 100 L96 46 L204 100 L316 40 L432 100 L552 44 L668 100 L788 48 L898 100 L1000 60 L1000 142 L0 142 Z"/>
  <g fill="#3d6350">
    <path d="M12 146 l13 -44 l13 44 z"/><path d="M42 146 l11 -36 l11 36 z"/><path d="M68 146 l12 -40 l12 40 z"/>
    <path d="M906 146 l13 -44 l13 44 z"/><path d="M936 146 l14 -48 l14 48 z"/><path d="M968 146 l11 -36 l11 36 z"/>
  </g>

  <!-- 段になった茶畑 -->
  <path fill="#8fb469" d="M0 148 C 240 140, 470 164, 720 150 C 840 144, 920 156, 1000 148 L1000 196 L0 202 Z"/>
  <g stroke="#5f8543" stroke-width="5" opacity="0.9" fill="none">
    <path d="M0 162 C 240 154, 470 178, 720 164 C 840 158, 920 170, 1000 162"/>
    <path d="M0 178 C 240 170, 470 194, 720 180 C 840 174, 920 186, 1000 178"/>
    <path d="M0 194 C 240 186, 470 210, 720 196 C 840 190, 920 202, 1000 194"/>
  </g>

  <!-- 奥の家並みと生け垣 -->
  <g>
    <rect x="120" y="212" width="104" height="44" fill="#efe9dd"/>
    <path d="M108 214 L172 182 L236 214 Z" fill="#7f8d93"/>
    <rect x="286" y="216" width="90" height="40" fill="#efe9dd"/>
    <path d="M274 218 L331 190 L388 218 Z" fill="#6f7f86"/>
    <rect x="700" y="210" width="112" height="46" fill="#efe9dd"/>
    <path d="M688 212 L756 178 L824 212 Z" fill="#7f8d93"/>
    <path d="M0 254 C 200 244, 560 262, 1000 248 L1000 272 L0 278 Z" fill="#6f9a58"/>
  </g>

  <rect x="0" y="272" width="1000" height="288" fill="#e6e9d9"/>

  <!-- 庭の柿の木と井戸 -->
  <g>
    <rect x="836" y="300" width="16" height="86" fill="#8a6a48"/>
    <circle cx="844" cy="286" r="46" fill="#5f8c4c"/>
    <circle cx="806" cy="300" r="30" fill="#54803f"/>
    <circle cx="884" cy="302" r="28" fill="#6a9755"/>
    <g fill="#e08a3c" stroke="#b56a26" stroke-width="2">
      <circle cx="818" cy="292" r="8"/><circle cx="862" cy="276" r="8"/><circle cx="874" cy="312" r="8"/>
    </g>
    <ellipse cx="922" cy="404" rx="40" ry="14" fill="#a9a294"/>
    <path d="M886 404 L886 372 L958 372 L958 404 Z" fill="#c2bbaa"/>
    <path d="M878 372 L922 348 L966 372 Z" fill="#7f8d93"/>
  </g>

  <!-- 左：門柱と郵便受け（封筒が差さったまま） -->
  <g>
    <rect x="30" y="288" width="34" height="176" fill="#b9b2a1" stroke="#8d8878" stroke-width="4"/>
    <rect x="20" y="276" width="54" height="16" fill="#a09a89"/>
    <rect x="66" y="330" width="86" height="58" rx="5" fill="#5f7b8c" stroke="#3f5768" stroke-width="4"/>
    <rect x="74" y="352" width="70" height="8" fill="#2f4453"/>
    <g fill="#fdfbf2" stroke="#a89b7c" stroke-width="3">
      <rect x="80" y="306" width="58" height="30"/>
      <rect x="92" y="296" width="58" height="30"/>
      <rect x="104" y="286" width="58" height="30"/>
    </g>
    <path d="M80 306 L109 322 L138 306" fill="none" stroke="#a89b7c" stroke-width="3"/>
    <rect x="12" y="470" width="150" height="34" rx="6" fill="#ffffff" stroke="#1f3e52" stroke-width="4"/>
    <text x="87" y="493" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3e52" text-anchor="middle">未開封のまま</text>
  </g>

  <!-- 縁側と座敷の床 -->
  <g>
    <rect x="180" y="392" width="640" height="20" fill="#c9a877"/>
    <rect x="180" y="412" width="640" height="148" fill="#ddc9a4"/>
    <g stroke="#c4ab84" stroke-width="3" fill="none">
      <path d="M180 444 L820 444 M180 486 L820 486 M180 528 L820 528"/>
    </g>
  </g>

  <!-- 座卓と書類 -->
  <g>
    <rect x="330" y="430" width="360" height="26" rx="4" fill="#b98f5d"/>
    <rect x="330" y="456" width="360" height="10" fill="#9c7648"/>
    <rect x="352" y="466" width="16" height="46" fill="#9c7648"/>
    <rect x="652" y="466" width="16" height="46" fill="#9c7648"/>
    <!-- 納税通知書 -->
    <rect x="350" y="392" width="118" height="40" fill="#ffffff" stroke="#98a2a8" stroke-width="3"/>
    <rect x="358" y="380" width="118" height="40" fill="#f6f8f7" stroke="#98a2a8" stroke-width="3"/>
    <rect x="358" y="380" width="118" height="14" fill="#1f3e52"/>
    <g stroke="#b8c1c6" stroke-width="3" fill="none"><path d="M370 404 L462 404 M370 414 L440 414"/></g>
    <!-- 課税明細書（行が並ぶ） -->
    <rect x="494" y="378" width="106" height="54" fill="#fdfbf2" stroke="#a89b7c" stroke-width="3"/>
    <g stroke="#cfc5a8" stroke-width="3" fill="none">
      <path d="M502 392 L592 392 M502 404 L592 404 M502 416 L592 416"/>
      <path d="M540 378 L540 432"/>
    </g>
    <!-- 名寄帳の綴り -->
    <rect x="614" y="386" width="66" height="46" fill="#e9e2cd" stroke="#a89b7c" stroke-width="3"/>
    <rect x="614" y="386" width="12" height="46" fill="#8d5f43"/>
    <!-- 印鑑と朱肉 -->
    <rect x="620" y="440" width="18" height="34" rx="4" fill="#8d5f43" stroke="#6b4630" stroke-width="3"/>
    <circle cx="662" cy="446" r="12" fill="#c0563c" stroke="#8f3b28" stroke-width="3"/>
    <path d="M360 448 L420 442" stroke="#3f4a52" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- 明細を指でたどる人（左） -->
  <g>
    <circle cx="292" cy="368" r="19" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M270 344 a22 20 0 0 1 44 0 z" fill="#4b4238"/>
    <path d="M272 396 C 272 440, 276 470, 278 502 L308 502 C 312 470, 318 440, 316 396 Z" fill="#5c86a0" stroke="#3f6379" stroke-width="3"/>
    <path d="M314 412 L352 400" stroke="#f0d2b0" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- 封筒の束を抱える人（右） -->
  <g>
    <circle cx="726" cy="360" r="19" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M704 336 a22 20 0 0 1 44 0 z" fill="#57493c"/>
    <path d="M706 388 C 706 432, 710 462, 712 496 L742 496 C 746 462, 752 432, 750 388 Z" fill="#a06a7c" stroke="#7d4d5e" stroke-width="3"/>
    <g fill="#fdfbf2" stroke="#a89b7c" stroke-width="3">
      <rect x="694" y="404" width="62" height="34"/><rect x="700" y="396" width="62" height="34"/>
    </g>
    <path d="M700 396 L731 414 L762 396" fill="none" stroke="#a89b7c" stroke-width="3"/>
  </g>

  <!-- 縁側で電話をかける人 -->
  <g>
    <circle cx="212" cy="380" r="17" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M192 358 a20 18 0 0 1 40 0 z" fill="#4b4238"/>
    <path d="M194 406 C 194 446, 198 472, 200 502 L228 502 C 232 472, 238 446, 236 406 Z" fill="#7d9a5c" stroke="#5b7640" stroke-width="3"/>
    <path d="M196 420 L206 392" stroke="#f0d2b0" stroke-width="9" stroke-linecap="round"/>
    <rect x="198" y="366" width="14" height="24" rx="3" fill="#3f4a52"/>
  </g>

  <!-- 右の柱に掛けた二つの暦 -->
  <g>
    <rect x="836" y="416" width="16" height="144" fill="#a68a5c"/>
    <rect x="700" y="252" width="16" height="140" fill="#a68a5c"/>
    <rect x="708" y="256" width="132" height="102" rx="5" fill="#fdfbf2" stroke="#8d8368" stroke-width="4"/>
    <rect x="708" y="256" width="132" height="28" rx="5" fill="#1f3e52"/>
    <text x="774" y="277" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">8月</text>
    <g stroke="#c3bda6" stroke-width="3" fill="none">
      <path d="M708 308 L840 308 M708 334 L840 334"/>
      <path d="M741 284 L741 358 M774 284 L774 358 M807 284 L807 358"/>
    </g>
    <rect x="856" y="256" width="132" height="102" rx="5" fill="#fdfbf2" stroke="#8d8368" stroke-width="4"/>
    <rect x="856" y="256" width="132" height="28" rx="5" fill="#7d3f2c"/>
    <text x="922" y="277" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">11月2日</text>
    <g stroke="#c3bda6" stroke-width="3" fill="none">
      <path d="M856 308 L988 308 M856 334 L988 334"/>
      <path d="M889 284 L889 358 M922 284 L922 358 M955 284 L955 358"/>
    </g>
    <circle cx="872" cy="322" r="12" fill="none" stroke="#c0563c" stroke-width="4"/>
  </g>

  <!-- 手前の帯 -->
  <g>
    <rect x="330" y="516" width="360" height="34" rx="6" fill="#ffffff" stroke="#1f3e52" stroke-width="4"/>
    <text x="510" y="539" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1f3e52" text-anchor="middle">通知書は止まらない。届く先だけが動く</text>
  </g>
</svg>
