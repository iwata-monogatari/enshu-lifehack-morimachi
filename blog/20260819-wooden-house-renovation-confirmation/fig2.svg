<text x="179" y="384" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">1 階数と面積を写す</text>
<text x="78" y="420" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">課税明細書か登記</text>
<text x="78" y="446" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">二階建てか平屋か</text>
<path d="M110 476 V520" stroke="#8d7f5e" stroke-width="9"/><path d="M248 476 V520" stroke="#8d7f5e" stroke-width="9"/>
</g>

<g>
<rect x="326" y="290" width="252" height="116" rx="8" fill="#fdfaf0" stroke="#8d7f5e" stroke-width="4"/>
<rect x="326" y="290" width="252" height="34" rx="8" fill="#4a7a4e"/>
<text x="452" y="314" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">2 工務店に一言聞く</text>
<text x="346" y="350" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">大規模の修繕に</text>
<text x="346" y="376" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">当たりますか</text>
<path d="M376 406 V448" stroke="#8d7f5e" stroke-width="9"/><path d="M528 406 V448" stroke="#8d7f5e" stroke-width="9"/>
</g>

<g>
