<text x="624" y="288" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">住まい支援係へ</text>
<text x="624" y="314" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">着手前の申請が要る</text>
<path d="M650 344 V382" stroke="#8d7f5e" stroke-width="9"/><path d="M798 344 V382" stroke="#8d7f5e" stroke-width="9"/>
