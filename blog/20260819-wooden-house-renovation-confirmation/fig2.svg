<rect x="700" y="412" width="258" height="34" rx="8" fill="#7d4a5c"/>
<text x="829" y="436" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="19" fill="#ffffff" text-anchor="middle">4 二枚の紙の日を書く</text>
<text x="720" y="472" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">確認済証と交付決定</text>
<text x="720" y="498" font-family="Meiryo, 'Hiragino Kaku Gothic ProN', sans-serif" font-size="17" fill="#3a4038">どちらも着工より前</text>
