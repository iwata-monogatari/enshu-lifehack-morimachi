<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title_fig desc_fig" data-illustration="mori-editorial">
<title id="title_fig">森町の実家を空き家にする際の水まわり管理手順</title>
<desc id="desc_fig">水漏れ事故や凍結破損を防ぎ不動産の価値を守るための3つのステップ</desc>
<rect width="1000" height="560" rx="20" fill="#f4f1df"/>
<path d="M0 250 Q150 120 300 235 T600 210 T1000 185 V560 H0Z" fill="#b7cfb3"/>
<path d="M0 330 Q190 240 360 330 T700 300 T1000 320 V560 H0Z" fill="#d9e8d0"/>
<text x="50" y="52" font-family="sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">森町の実家を空き家にする際の水まわり管理手順</text>
<g>
  <rect x="50" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="50" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="192" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ステップ1：水道メーターと止水</text>
  <text x="68" y="155" font-family="sans-serif" font-size="14" fill="#334155">・敷地内の止水栓（元栓）の位置確認</text>
<text x="68" y="183" font-family="sans-serif" font-size="14" fill="#334155">・ハンドルまたはバルブを時計回りに回す</text>
<text x="68" y="211" font-family="sans-serif" font-size="14" fill="#334155">・蛇口を開けて水が出ないことを確認</text>
<text x="68" y="239" font-family="sans-serif" font-size="14" fill="#334155">・メーター指針を記録し漏水有無を判定</text>
<text x="68" y="267" font-family="sans-serif" font-size="14" fill="#334155">・パイロットマークの静止を確認</text>

</g><g>
  <rect x="355" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="355" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="497" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ステップ2：冬期の完全水抜き作業</text>
  <text x="373" y="155" font-family="sans-serif" font-size="14" fill="#334155">・水抜き栓（不凍栓）を操作し水抜き</text>
<text x="373" y="183" font-family="sans-serif" font-size="14" fill="#334155">・屋外散水栓や給湯器の水抜き栓開放</text>
<text x="373" y="211" font-family="sans-serif" font-size="14" fill="#334155">・トイレタンク内の水を完全に抜く</text>
<text x="373" y="239" font-family="sans-serif" font-size="14" fill="#334155">・配管内に残った水を抜き凍結破損を防止</text>
<text x="373" y="267" font-family="sans-serif" font-size="14" fill="#334155">・寒波到来前の11〜12月に必ず実施</text>

</g><g>
  <rect x="660" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="660" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="802" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ステップ3：休止届と権利の整理</text>
  <text x="678" y="155" font-family="sans-serif" font-size="14" fill="#334155">・役場上下水道課へ「給水休止届」提出</text>
<text x="678" y="183" font-family="sans-serif" font-size="14" fill="#334155">・簡易水道の場合は地区組合長へ連絡</text>
<text x="678" y="211" font-family="sans-serif" font-size="14" fill="#334155">・メーター点検費用や維持費の取り決め確認</text>
<text x="678" y="239" font-family="sans-serif" font-size="14" fill="#334155">・売却・解体時の権利承継確認</text>
<text x="678" y="267" font-family="sans-serif" font-size="14" fill="#334155">・将来の再開通手順をメモに残す</text>

</g>
<rect x="50" y="465" width="900" height="60" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="500" y="502" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">水漏れ事故や凍結破損を防ぎ不動産の価値を守るための3つのステップ</text>
</svg>