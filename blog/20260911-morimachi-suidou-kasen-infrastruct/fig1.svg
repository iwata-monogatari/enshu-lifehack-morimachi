<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title_fig desc_fig" data-illustration="mori-editorial">
<title id="title_fig">森町の上水道区域と簡易水道・山間部給水施設</title>
<desc id="desc_fig">太田川の豊かな水系を活かした町営上水道と中山間集落を支える簡易水道の構造</desc>
<rect width="1000" height="560" rx="20" fill="#f4f1df"/>
<path d="M0 250 Q150 120 300 235 T600 210 T1000 185 V560 H0Z" fill="#b7cfb3"/>
<path d="M0 330 Q190 240 360 330 T700 300 T1000 320 V560 H0Z" fill="#d9e8d0"/>
<text x="50" y="52" font-family="sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">森町の上水道区域と簡易水道・山間部給水施設</text>
<g>
  <rect x="50" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="50" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="192" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">① 町営上水道（平野部中心）</text>
  <text x="68" y="155" font-family="sans-serif" font-size="14" fill="#334155">・森・飯田・園田など南部が中心</text>
<text x="68" y="183" font-family="sans-serif" font-size="14" fill="#334155">・森町役場上下水道課による一元管理</text>
<text x="68" y="211" font-family="sans-serif" font-size="14" fill="#334155">・口径別基本料金＋従量料金制</text>
<text x="68" y="239" font-family="sans-serif" font-size="14" fill="#334155">・定期的な水質検査と水圧維持</text>
<text x="68" y="267" font-family="sans-serif" font-size="14" fill="#334155">・給水装置工事事業者による施工</text>

</g><g>
  <rect x="355" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="355" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="497" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">② 簡易水道・組合管理施設</text>
  <text x="373" y="155" font-family="sans-serif" font-size="14" fill="#334155">・三倉・天方など北部山間集落に点在</text>
<text x="373" y="183" font-family="sans-serif" font-size="14" fill="#334155">・沢水や深井戸を水源とする自己給水</text>
<text x="373" y="211" font-family="sans-serif" font-size="14" fill="#334155">・地元集落の水道組合による維持管理</text>
<text x="373" y="239" font-family="sans-serif" font-size="14" fill="#334155">・組合費・維持管理分担金の納入</text>
<text x="373" y="267" font-family="sans-serif" font-size="14" fill="#334155">・台風・豪雨後のろ過装置・配水点検</text>

</g><g>
  <rect x="660" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="660" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="802" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">③ 実家・空き家の水管理</text>
  <text x="678" y="155" font-family="sans-serif" font-size="14" fill="#334155">・長期間不在時の元栓・止水栓閉止</text>
<text x="678" y="183" font-family="sans-serif" font-size="14" fill="#334155">・冬期の水道管凍結・破裂防止水抜き</text>
<text x="678" y="211" font-family="sans-serif" font-size="14" fill="#334155">・空き家使用休止届による基本料金節約</text>
<text x="678" y="239" font-family="sans-serif" font-size="14" fill="#334155">・年数回の通水点検と下水トラップ封水</text>
<text x="678" y="267" font-family="sans-serif" font-size="14" fill="#334155">・売却時の給水装置権利関係確認</text>

</g>
<rect x="50" y="465" width="900" height="60" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="500" y="502" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">太田川の豊かな水系を活かした町営上水道と中山間集落を支える簡易水道の構造</text>
</svg>