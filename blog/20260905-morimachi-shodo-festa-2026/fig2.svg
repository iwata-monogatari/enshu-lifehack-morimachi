<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="f2t f2d"><title id="f2t">9月19日の体験と展示を無理なく回る道筋</title><desc id="f2d">森町の山並みと文化会館を背景に、家族が10時の展示と体験、昼の休憩、13時のギャラリートーク、14時の高校書道部実演へ移る道筋を描く。</desc><defs><linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe1ec"/><stop offset="1" stop-color="#f0f2df"/></linearGradient></defs><rect width="1000" height="560" fill="url(#sky2)"/><path d="M0 140L125 45l120 90 125-82 120 88 130-96 130 92 120-78 150 78v75H0z" fill="#76968a"/><rect y="190" width="1000" height="370" fill="#e6ecd9"/><path d="M95 360h810" stroke="#b5a88d" stroke-width="18" fill="none"/><path d="M280 348l28 12-28 12m205-24 28 12-28 12m205-24 28 12-28 12" stroke="#35647b" stroke-width="7" fill="none"/><g font-family="Meiryo,sans-serif"><g><rect x="60" y="235" width="190" height="105" rx="12" fill="#fff" stroke="#5e8377" stroke-width="5"/><text x="82" y="270" font-size="25" font-weight="bold" fill="#294d55">10:00</text><text x="82" y="306" font-size="22" fill="#334">展示・体験</text><path d="M175 250l40 50" stroke="#3b2c24" stroke-width="7"/><path d="M210 298l10 20" stroke="#1e1e1e" stroke-width="15"/></g><g><rect x="320" y="235" width="150" height="105" rx="12" fill="#fff8dc" stroke="#bc8f36" stroke-width="5"/><text x="348" y="270" font-size="25" font-weight="bold" fill="#6b4c19">昼</text><text x="342" y="306" font-size="22" fill="#334">休憩</text><circle cx="430" cy="280" r="25" fill="#f2d27b"/></g><g><rect x="525" y="235" width="190" height="105" rx="12" fill="#fff" stroke="#5e8377" stroke-width="5"/><text x="547" y="270" font-size="25" font-weight="bold" fill="#294d55">13:00</text><text x="547" y="306" font-size="20" fill="#334">トーク40分</text><circle cx="675" cy="276" r="20" fill="#e1b27e"/><path d="M648 326q27-47 55 0" fill="#55778b"/></g><g><rect x="765" y="235" width="190" height="105" rx="12" fill="#fff" stroke="#5e8377" stroke-width="5"/><text x="787" y="270" font-size="25" font-weight="bold" fill="#294d55">14:00</text><text x="787" y="306" font-size="20" fill="#334">実演60分</text><path d="M905 255l-42 62" stroke="#392e27" stroke-width="9"/></g><text x="65" y="425" font-size="27" font-weight="bold" fill="#294d55">第一目的を一つ固定する</text><text x="65" y="465" font-size="22" fill="#465">予約・持ち物・満員時の代替を4行で共有</text><text x="65" y="510" font-size="19" fill="#465">文化会館とフジヤは別会場。移動時間は公式案内で確認する。</text></g></svg>
