<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">三倉八幡神社本殿を訪ねる前の確認順</title><desc id="d">公式情報、問い合わせ、現地の境界表示を順に確認する三段階の図</desc><rect width="1200" height="675" fill="#eef3ed"/><text x="600" y="72" text-anchor="middle" font-size="34" font-weight="700" fill="#294e4a">「非公開」を四つに分けて確認する</text><g font-family="sans-serif"><rect x="70" y="150" width="300" height="330" rx="24" fill="#fff" stroke="#88aa9a" stroke-width="4"/><text x="220" y="205" text-anchor="middle" font-size="27" font-weight="700" fill="#315e55">1　公式情報</text><text x="105" y="270" font-size="24" fill="#263f3b">・本殿内部</text><text x="105" y="318" font-size="24" fill="#263f3b">・指定年月日</text><text x="105" y="366" font-size="24" fill="#263f3b">・二つの年代解釈</text><rect x="450" y="150" width="300" height="330" rx="24" fill="#fff" stroke="#c8a76d" stroke-width="4"/><text x="600" y="205" text-anchor="middle" font-size="27" font-weight="700" fill="#805c22">2　訪問前の確認</text><text x="485" y="270" font-size="24" fill="#263f3b">・境内と外観</text><text x="485" y="318" font-size="24" fill="#263f3b">・駐車場所</text><text x="485" y="366" font-size="24" fill="#263f3b">・撮影可否</text><rect x="830" y="150" width="300" height="330" rx="24" fill="#fff" stroke="#88aa9a" stroke-width="4"/><text x="980" y="205" text-anchor="middle" font-size="27" font-weight="700" fill="#315e55">3　現地の表示</text><text x="865" y="270" font-size="24" fill="#263f3b">・柵を越えない</text><text x="865" y="318" font-size="24" fill="#263f3b">・掲示を優先</text><text x="865" y="366" font-size="24" fill="#263f3b">・建物に触れない</text></g><path d="M375 315h65m-18-18 18 18-18 18M755 315h65m-18-18 18 18-18 18" fill="none" stroke="#52645f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="210" y="535" width="780" height="80" rx="18" fill="#315e55"/><text x="600" y="586" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">見たい気持ちより、守る側が示した境界を優先する</text></svg>
