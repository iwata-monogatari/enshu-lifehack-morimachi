<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d" data-illustration="mori-editorial"><title id="t">三倉八幡神社本殿の年代を二つの公式説明で比べる</title><desc id="d">1552年、1684年、2007年、2026年の出来事を、森町と静岡県の説明を分けて並べた図</desc><rect width="1200" height="675" fill="#f3f0e5"/><text x="70" y="72" font-size="34" font-weight="700" fill="#294e4a">一つの年に丸めず、二つの公式説明を並べる</text><line x1="140" y1="170" x2="1080" y2="170" stroke="#577e71" stroke-width="8"/><g font-family="sans-serif" text-anchor="middle"><circle cx="210" cy="170" r="18" fill="#b45f45"/><text x="210" y="135" font-size="28" font-weight="700" fill="#263f3b">1552</text><circle cx="505" cy="170" r="18" fill="#c38b35"/><text x="505" y="135" font-size="28" font-weight="700" fill="#263f3b">1684</text><circle cx="795" cy="170" r="18" fill="#477d80"/><text x="795" y="135" font-size="28" font-weight="700" fill="#263f3b">2007</text><circle cx="1030" cy="170" r="18" fill="#477d80"/><text x="1030" y="135" font-size="28" font-weight="700" fill="#263f3b">2026</text></g><rect x="75" y="230" width="1050" height="145" rx="20" fill="#fff" stroke="#9bb6a9" stroke-width="3"/><text x="110" y="275" font-size="26" font-weight="700" fill="#315e55">森町の説明</text><text x="300" y="326" font-size="25" fill="#263f3b">再建棟札</text><text x="595" y="326" font-size="25" fill="#263f3b">現在の本殿</text><text x="886" y="326" font-size="25" fill="#263f3b">県指定</text><rect x="75" y="405" width="1050" height="145" rx="20" fill="#fff" stroke="#d3b47c" stroke-width="3"/><text x="110" y="450" font-size="26" font-weight="700" fill="#805c22">静岡県の説明</text><text x="300" y="501" font-size="25" fill="#263f3b">建立</text><text x="595" y="501" font-size="25" fill="#263f3b">大修理</text><text x="886" y="501" font-size="25" fill="#263f3b">2007年3月20日</text><text x="600" y="620" text-anchor="middle" font-size="23" fill="#52645f">地域計画の認定は2026年7月17日。公開決定とは別に確認する。</text></svg>
