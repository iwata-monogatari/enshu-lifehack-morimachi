  <rect x="22" y="18" width="485" height="54" rx="12" fill="#173f4b" opacity=".94"/><text x="48" y="54" font-family="sans-serif" font-size="25" font-weight="700" fill="#fff">期限より先に、予約できる日を取る</text>
