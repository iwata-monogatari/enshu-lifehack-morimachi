<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial">
  <title id="title">9月の予約から特定健診期限までの道</title>
  <desc id="desc">森町の山と茶畑の中を、受診券を持つ住民が9月の予約電話、10月以降の混雑注意、公式ページ本文の2027年2月27日期限へ向かう情景</desc>
