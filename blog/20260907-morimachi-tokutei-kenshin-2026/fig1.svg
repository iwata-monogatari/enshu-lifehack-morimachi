    <g transform="translate(502 247)"><path d="M-80 55V-38l80-57 80 57v93Z" fill="#fffdf4" stroke="#385e59" stroke-width="4"/><rect x="-51" y="-29" width="102" height="60" rx="7" fill="#e8f2ee"/><path d="M0-18v38M-19 1h38" stroke="#b44f40" stroke-width="9" stroke-linecap="round"/><text y="82" font-size="18" font-weight="700" fill="#234a48">健診会場</text></g>
