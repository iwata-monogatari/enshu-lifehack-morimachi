    <g transform="translate(876 444)"><path d="M0-85v117" stroke="#385e59" stroke-width="8"/><path d="M-105-81H16v57h-121l-25-28Z" fill="#274f5d"/><text x="-52" y="-58" font-size="16" font-weight="700" fill="#fff">本文期限</text><text x="-52" y="-35" font-size="18" font-weight="700" fill="#fff">2027/2/27</text></g></g>
