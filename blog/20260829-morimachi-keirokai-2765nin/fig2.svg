<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="kr2title kr2desc">
<title id="kr2title">森町の敬老会について家族が確かめる四つの段</title>
<desc id="kr2desc">親の生年月日を78歳の線と比べ、地区の役員へ電話して開催日と会場を聞き、集会所までの道のりの段差を歩いて確かめ、当日の送迎を家族の予定表に書き込むまでの順序を描いた図。右端には町から贈られる記念品の包みと寿詞の巻紙が置かれ、対象が最高長寿者と100歳と米寿であることを示している。</desc>
