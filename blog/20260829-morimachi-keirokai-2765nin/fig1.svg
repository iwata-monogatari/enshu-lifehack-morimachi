<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="kr1title kr1desc">
<title id="kr1title">森町の敬老会対象者7年分と100歳以上の推移</title>
<desc id="kr1desc">令和元年度から令和7年度までの78歳以上の人数をほぼ同じ高さの棒で並べ、令和6年度だけが低く令和7年度で戻る様子を示した図。棒の下には100歳以上の人数を丸の数で表し、30個から45個へ増えていく様子を並べている。背景には杉林の山並みと地区の集会所の屋根が描かれている。</desc>
