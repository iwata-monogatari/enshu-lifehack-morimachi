<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="lr2Title lr2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="lr2Title">免許を返す前に確かめる順番を、実家から役場の窓口まで続く一本の道として描いたイラスト</title>
  <desc id="lr2Desc">左端に森町の実家があり、縁側の机に運転免許証が置かれています。道を進むと最初の区間で、森町の地図の上を指でなぞって一宮・園田の地区の境を確かめる場面が描かれます。次の区間では、電話機と申込書で利用者登録をする場面と、二週間先に印の付いたカレンダーが描かれます。三つ目の地点で道が二つに分かれ、上の道は時刻表の札が立つバス停と小型の町営バスへ、下の道は緑色の地域タクシーと、病院・スーパー・駅の三つの指定目的地へ続きます。道の終わりには役場の窓口があり、領収証と預金通帳と運転経歴証明書を差し出して三千円の助成を申請する場面があります。背景には遠州の山並みと段になった茶畑が広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="lr2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#accfe0"/><stop offset="1" stop-color="#eaf1e6"/>
    </linearGradient>
    <linearGradient id="lr2Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa8bb"/><stop offset="1" stop-color="#b7ccd3"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="150" fill="url(#lr2Sky)"/>
  <circle cx="86" cy="48" r="30" fill="#ffd664"/>
  <path fill="url(#lr2Far)" d="M0 108 L96 52 L200 106 L312 44 L426 106 L540 44 L654 106 L768 54 L878 106 L1000 68 L1000 146 L0 146 Z"/>
  <path fill="#7fae57" d="M0 152 C 220 144, 420 168, 640 156 C 780 148, 880 160, 1000 152 L1000 190 L0 196 Z"/>
  <g stroke="#5f8a42" stroke-width="4" opacity="0.85" fill="none">
    <path d="M0 164 C 220 156, 420 180, 640 168 C 780 160, 880 172, 1000 164"/>
    <path d="M0 180 C 220 172, 420 196, 640 184 C 780 176, 880 188, 1000 180"/>
  </g>
  <g fill="#3f6b52">
    <path d="M10 192 l15 -50 l15 50 z"/><path d="M44 192 l12 -42 l12 42 z"/><path d="M950 192 l14 -48 l14 48 z"/>
  </g>
  <path fill="#dfe8d6" d="M0 192 L1000 186 L1000 560 L0 560 Z"/>

  <!-- 一本の道（分岐前） -->
  <path fill="#cdc8b9" d="M120 296 L620 296 L620 344 L120 344 Z"/>
  <g stroke="#ffffff" stroke-width="6" stroke-dasharray="28 24" fill="none"><path d="M124 320 L616 320"/></g>
  <!-- 上の分岐 -->
  <path fill="#cdc8b9" d="M600 296 L742 296 L742 226 L892 226 L892 274 L790 274 L790 344 L600 344 Z"/>
  <!-- 下の分岐 -->
  <path fill="#cdc8b9" d="M600 344 L700 344 L700 442 L892 442 L892 490 L652 490 L652 344 Z"/>

  <!-- 実家と運転免許証 -->
  <g>
    <path d="M18 262 L82 224 L146 262 L146 330 L18 330 Z" fill="#efe9dc" stroke="#a79f8c" stroke-width="4"/>
    <path d="M8 266 L82 218 L156 266 Z" fill="#6d7a80"/>
    <rect x="56" y="284" width="50" height="46" fill="#c9b48c" stroke="#9c8763" stroke-width="3"/>
  </g>
  <g>
    <rect x="20" y="384" width="128" height="34" rx="5" fill="#f3f4ef" stroke="#8f9a96" stroke-width="3"/>
    <rect x="28" y="392" width="24" height="20" fill="#c6cfc9"/>
    <rect x="58" y="392" width="80" height="6" fill="#b1bbb5"/>
    <rect x="58" y="404" width="58" height="6" fill="#b1bbb5"/>
    <rect x="10" y="420" width="150" height="30" rx="5" fill="#ffffff" stroke="#c0563c" stroke-width="3"/>
    <text x="85" y="442" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c0563c" text-anchor="middle">返す前に</text>
  </g>

  <!-- ① 地図で地区を確かめる -->
  <g>
    <rect x="176" y="212" width="150" height="112" rx="6" fill="#f6f4e9" stroke="#8f9a96" stroke-width="4"/>
    <path d="M186 300 C 216 254, 258 288, 316 240" fill="none" stroke="#7fae57" stroke-width="6"/>
    <path d="M244 216 L244 320" stroke="#c0563c" stroke-width="4" stroke-dasharray="10 8" fill="none"/>
    <text x="210" y="240" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">一宮</text>
    <text x="292" y="240" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">園田</text>
  </g>
  <!-- 地区の境をなぞる手 -->
  <g fill="#e8c9a8" stroke="#b99a7c" stroke-width="3" stroke-linejoin="round">
    <path d="M252 272 L292 262 L330 268 C 344 270, 344 292, 330 294 L296 294 L300 314 C 302 328, 282 332, 278 318 Z"/>
  </g>
  <path d="M252 272 L238 276" stroke="#b99a7c" stroke-width="4" fill="none"/>
  <rect x="164" y="356" width="176" height="34" rx="6" fill="#ffffff" stroke="#2f6b53" stroke-width="3"/>
  <text x="252" y="379" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3e52" text-anchor="middle">①どの地区か</text>

  <!-- ② 利用者登録とカレンダー -->
  <g>
    <rect x="368" y="220" width="82" height="58" rx="8" fill="#4d6f8c" stroke="#33506a" stroke-width="4"/>
    <rect x="380" y="232" width="58" height="24" rx="3" fill="#cfe0ea"/>
    <path d="M392 278 L392 300" stroke="#33506a" stroke-width="6" fill="none"/>
    <rect x="360" y="298" width="98" height="14" rx="4" fill="#33506a"/>
  </g>
  <g>
    <rect x="472" y="214" width="112" height="102" rx="6" fill="#ffffff" stroke="#8f9a96" stroke-width="4"/>
    <rect x="472" y="214" width="112" height="24" rx="6" fill="#c0563c"/>
    <g fill="#b1bbb5">
      <rect x="484" y="250" width="18" height="14"/><rect x="510" y="250" width="18" height="14"/><rect x="536" y="250" width="18" height="14"/>
      <rect x="484" y="272" width="18" height="14"/><rect x="510" y="272" width="18" height="14"/>
    </g>
    <circle cx="545" cy="279" r="14" fill="none" stroke="#c0563c" stroke-width="4"/>
    <text x="545" y="284" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c0563c" text-anchor="middle">2週</text>
  </g>
  <rect x="366" y="356" width="220" height="34" rx="6" fill="#ffffff" stroke="#2f6b53" stroke-width="3"/>
  <text x="476" y="379" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3e52" text-anchor="middle">②登録は2週間前まで</text>

  <!-- 上の道：バス停と町営バス -->
  <g>
    <path d="M700 274 L700 214" stroke="#8f9a96" stroke-width="7" fill="none"/>
    <rect x="616" y="172" width="118" height="36" rx="5" fill="#ffffff" stroke="#2f6b53" stroke-width="4"/>
    <text x="675" y="197" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3e52" text-anchor="middle">時刻表</text>
  </g>
  <g>
    <rect x="768" y="192" width="150" height="60" rx="9" fill="#f4f7f3" stroke="#5c6f66" stroke-width="5"/>
    <rect x="780" y="204" width="42" height="26" rx="3" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <rect x="832" y="204" width="38" height="26" rx="3" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <rect x="878" y="204" width="28" height="26" rx="3" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <circle cx="802" cy="256" r="16" fill="#4b5450" stroke="#2f3733" stroke-width="4"/>
    <circle cx="884" cy="256" r="16" fill="#4b5450" stroke="#2f3733" stroke-width="4"/>
  </g>
  <rect x="640" y="248" width="140" height="32" rx="6" fill="#ffffff" stroke="#2f6b53" stroke-width="3"/>
  <text x="710" y="270" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">●印は要予約</text>

  <!-- 下の道：地域タクシーと三つの目的地 -->
  <g>
    <path d="M596 452 L618 424 L698 424 L720 452 L720 478 L596 478 Z" fill="#3f8f6a" stroke="#2c6b4e" stroke-width="5"/>
    <rect x="624" y="430" width="34" height="20" rx="3" fill="#cfe6f0" stroke="#7fa5b6" stroke-width="3"/>
    <rect x="664" y="430" width="32" height="20" rx="3" fill="#cfe6f0" stroke="#7fa5b6" stroke-width="3"/>
    <circle cx="626" cy="482" r="15" fill="#4b5450" stroke="#2f3733" stroke-width="4"/>
    <circle cx="694" cy="482" r="15" fill="#4b5450" stroke="#2f3733" stroke-width="4"/>
    <rect x="596" y="392" width="124" height="28" rx="5" fill="#ffffff" stroke="#c0563c" stroke-width="3"/>
    <text x="658" y="413" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0563c" text-anchor="middle">1台500円</text>
  </g>
  <g>
    <rect x="750" y="386" width="76" height="52" fill="#f5eeee" stroke="#a79f8c" stroke-width="4"/>
    <path d="M742 386 L788 360 L834 386 Z" fill="#9c6f6f"/>
    <text x="788" y="420" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7a3535" text-anchor="middle">病院</text>
  </g>
  <g>
    <rect x="848" y="386" width="76" height="52" fill="#f0ede2" stroke="#a79f8c" stroke-width="4"/>
    <rect x="842" y="374" width="88" height="14" fill="#5c8fb0"/>
    <text x="886" y="420" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f3e52" text-anchor="middle">買い物</text>
  </g>
  <g>
    <rect x="750" y="486" width="174" height="46" fill="#eef2ef" stroke="#a79f8c" stroke-width="4"/>
    <path d="M742 486 L836 456 L930 486 Z" fill="#6b7f74"/>
    <text x="836" y="516" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">駅・行政の窓口</text>
  </g>
  <rect x="560" y="500" width="176" height="34" rx="6" fill="#ffffff" stroke="#2f6b53" stroke-width="3"/>
  <text x="648" y="523" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">③指定目的地だけ</text>

  <!-- 役場の窓口と助成申請 -->
  <g>
    <rect x="196" y="440" width="300" height="104" rx="8" fill="#f2f5f1" stroke="#5c6f66" stroke-width="5"/>
    <rect x="196" y="440" width="300" height="26" rx="8" fill="#1f3e52"/>
    <text x="346" y="460" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">役場の窓口</text>
    <rect x="214" y="480" width="72" height="48" rx="4" fill="#ffffff" stroke="#8f9a96" stroke-width="3"/>
    <text x="250" y="509" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f3e52" text-anchor="middle">領収証</text>
    <rect x="298" y="480" width="72" height="48" rx="4" fill="#ffffff" stroke="#8f9a96" stroke-width="3"/>
    <text x="334" y="509" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1f3e52" text-anchor="middle">通帳</text>
    <rect x="382" y="480" width="98" height="48" rx="4" fill="#ffffff" stroke="#c0563c" stroke-width="3"/>
    <text x="431" y="503" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c0563c" text-anchor="middle">運転経歴</text>
    <text x="431" y="520" font-family="sans-serif" font-size="13" font-weight="bold" fill="#c0563c" text-anchor="middle">証明書</text>
  </g>
  <rect x="196" y="400" width="222" height="34" rx="6" fill="#ffffff" stroke="#c0563c" stroke-width="4"/>
  <text x="307" y="424" font-family="sans-serif" font-size="16" font-weight="bold" fill="#c0563c" text-anchor="middle">④上限3,000円の助成</text>
</svg>
