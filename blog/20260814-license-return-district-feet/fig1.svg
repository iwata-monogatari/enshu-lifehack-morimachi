    <path d="M664 268 L724 236 L784 268 Z" fill="#9c6f6f"/>
    <text x="724" y="312" font-family="sans-serif" font-size="17" font-weight="bold" fill="#7a3535" text-anchor="middle">医院</text>
  </g>
  <g>
    <rect x="808" y="272" width="132" height="66" fill="#eef2ef" stroke="#a79f8c" stroke-width="4"/>
    <path d="M798 272 L874 240 L950 272 Z" fill="#6b7f74"/>
    <text x="874" y="314" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3e52" text-anchor="middle">天浜線の駅</text>
    <rect x="800" y="338" width="150" height="8" fill="#8f9a96"/>
  </g>

  <!-- 道しるべ -->
  <g>
    <path d="M540 560 L540 400" stroke="#8f7f5e" stroke-width="10" fill="none"/>
    <rect x="490" y="358" width="196" height="40" rx="6" fill="#ffffff" stroke="#c0563c" stroke-width="4"/>
    <text x="588" y="386" font-family="sans-serif" font-size="19" font-weight="bold" fill="#c0563c" text-anchor="middle">一宮・園田</text>
  </g>

  <!-- 家（瓦屋根） -->
  <g>
    <path d="M840 392 L900 356 L962 392 L962 470 L840 470 Z" fill="#efe9dc" stroke="#a79f8c" stroke-width="4"/>
    <path d="M828 396 L900 350 L974 396 Z" fill="#6d7a80"/>
    <rect x="874" y="418" width="52" height="52" fill="#c9b48c" stroke="#9c8763" stroke-width="3"/>
  </g>

  <!-- 地域タクシー -->
  <g>
    <path d="M628 470 L660 428 L784 428 L816 470 L816 508 L628 508 Z" fill="#3f8f6a" stroke="#2c6b4e" stroke-width="5"/>
    <rect x="668" y="436" width="50" height="30" rx="4" fill="#cfe6f0" stroke="#7fa5b6" stroke-width="3"/>
    <rect x="726" y="436" width="48" height="30" rx="4" fill="#cfe6f0" stroke="#7fa5b6" stroke-width="3"/>
    <rect x="688" y="404" width="72" height="26" rx="5" fill="#ffffff" stroke="#2c6b4e" stroke-width="3"/>
    <text x="724" y="424" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f5d44" text-anchor="middle">TAXI</text>
    <circle cx="672" cy="512" r="21" fill="#4b5450" stroke="#2f3733" stroke-width="5"/>
    <circle cx="672" cy="512" r="6" fill="#a8b0ac"/>
    <circle cx="776" cy="512" r="21" fill="#4b5450" stroke="#2f3733" stroke-width="5"/>
    <circle cx="776" cy="512" r="6" fill="#a8b0ac"/>
  </g>

  <!-- 玄関先の高齢男性とチケット -->
  <g>
    <circle cx="874" cy="482" r="15" fill="#e8c9a8" stroke="#b99a7c" stroke-width="3"/>
    <path d="M862 472 C 866 458, 884 458, 887 472 Z" fill="#9a9a9a"/>
    <path d="M858 498 C 858 536, 864 550, 866 560 L886 560 C 888 546, 894 526, 892 498 Z" fill="#5a6b86" stroke="#42506a" stroke-width="3"/>
