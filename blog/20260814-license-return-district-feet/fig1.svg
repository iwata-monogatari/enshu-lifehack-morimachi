  <g>
    <rect x="228" y="366" width="176" height="76" rx="10" fill="#f4f7f3" stroke="#5c6f66" stroke-width="5"/>
    <rect x="242" y="380" width="52" height="34" rx="4" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <rect x="304" y="380" width="46" height="34" rx="4" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <rect x="360" y="380" width="34" height="34" rx="4" fill="#bcdcea" stroke="#7fa5b6" stroke-width="3"/>
    <rect x="236" y="348" width="112" height="22" rx="5" fill="#2f6b53"/>
    <text x="292" y="365" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">町営バス</text>
    <circle cx="270" cy="446" r="20" fill="#4b5450" stroke="#2f3733" stroke-width="5"/>
    <circle cx="270" cy="446" r="6" fill="#a8b0ac"/>
    <circle cx="366" cy="446" r="20" fill="#4b5450" stroke="#2f3733" stroke-width="5"/>
    <circle cx="366" cy="446" r="6" fill="#a8b0ac"/>
  </g>

