  <path fill="#e2e6d4" d="M486 226 L1000 222 L1000 560 L478 560 Z"/>
  <!-- 奥の三施設 -->
  <g>
    <rect x="520" y="268" width="124" height="70" fill="#f0ede2" stroke="#a79f8c" stroke-width="4"/>
    <rect x="512" y="256" width="140" height="16" fill="#5c8fb0"/>
