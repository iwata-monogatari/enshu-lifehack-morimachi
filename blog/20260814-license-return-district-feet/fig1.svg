  <path fill="#9ec8dd" d="M0 552 C 90 540, 170 546, 250 560 L0 560 Z"/>
  <rect x="66" y="536" width="150" height="14" rx="4" fill="#b9a882" stroke="#8f7f5e" stroke-width="3"/>
  <g stroke="#8f7f5e" stroke-width="5" fill="none"><path d="M76 536 L76 518 M206 536 L206 518 M76 522 L206 522"/></g>

