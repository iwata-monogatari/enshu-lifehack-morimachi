<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="lr1Title lr1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="lr1Title">森町の山あいを走る町営バスと、一宮・園田の家の前に来た地域タクシーを並べて描いたイラスト</title>
  <desc id="lr1Desc">左側は山あいの集落です。杉林と段になった茶畑の下を細い道が通り、小型の町営バスが走っています。道端のポール型のバス停には「平日のみ」の札が下がり、杖をついた高齢の女性が立っています。手前には小川に架かる小さな橋があります。右側は平地の集落です。瓦屋根の家の門前に緑色の地域タクシーが停まり、玄関から出てきた高齢の男性が利用チケットを手にしています。奥にはスーパー、医院、天竜浜名湖鉄道の小さな駅舎が並び、その手前に「一宮・園田」と書かれた道しるべが立っています。全体の奥に遠州の山並みが連なっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="lr1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9cfe2"/><stop offset="1" stop-color="#e9f1e6"/>
    </linearGradient>
    <linearGradient id="lr1Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#87a6ba"/><stop offset="1" stop-color="#b4c9d1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="182" fill="url(#lr1Sky)"/>
  <circle cx="880" cy="52" r="34" fill="#ffd664"/>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="250" cy="66" r="30"/><circle cx="296" cy="48" r="38"/><circle cx="344" cy="68" r="28"/>
  </g>
  <path fill="url(#lr1Far)" d="M0 124 L92 60 L196 120 L306 52 L420 120 L534 48 L648 120 L764 62 L872 120 L1000 78 L1000 168 L0 168 Z"/>

  <!-- 遠景の杉林 -->
  <g fill="#3f6b52">
    <path d="M6 172 l16 -54 l16 54 z"/><path d="M40 172 l13 -44 l13 44 z"/><path d="M72 172 l15 -50 l15 50 z"/>
    <path d="M108 172 l12 -40 l12 40 z"/><path d="M938 172 l14 -46 l14 46 z"/><path d="M966 172 l16 -52 l16 52 z"/>
  </g>

  <!-- 段になった茶畑 -->
  <path fill="#7fae57" d="M0 176 C 210 168, 400 194, 620 180 C 760 170, 880 184, 1000 176 L1000 226 L0 232 Z"/>
  <g stroke="#5f8a42" stroke-width="4" opacity="0.85" fill="none">
    <path d="M0 190 C 210 182, 400 208, 620 194 C 760 184, 880 198, 1000 190"/>
    <path d="M0 208 C 210 200, 400 226, 620 212 C 760 202, 880 216, 1000 208"/>
  </g>
  <path fill="#dfe8d6" d="M0 228 L1000 222 L1000 560 L0 560 Z"/>

  <!-- ================= 左：山あいの集落と町営バス ================= -->
  <path fill="#cfdcc4" d="M0 232 L470 226 L462 560 L0 560 Z"/>
  <!-- 斜面と杉林 -->
  <path fill="#93b075" d="M0 240 L210 232 L268 300 L120 336 L0 318 Z"/>
  <g fill="#42705a">
    <path d="M22 302 l17 -58 l17 58 z"/><path d="M60 306 l14 -48 l14 48 z"/><path d="M96 300 l16 -54 l16 54 z"/>
  </g>
  <!-- 山あいの家 -->
  <g>
    <path d="M296 292 L360 254 L426 294 L426 348 L296 348 Z" fill="#e6e1d4" stroke="#a79f8c" stroke-width="4"/>
    <path d="M286 296 L360 248 L436 296 Z" fill="#7d8a86"/>
    <rect x="336" y="308" width="44" height="40" fill="#b9c1bb" stroke="#8f9a96" stroke-width="3"/>
  </g>
  <!-- 細い道 -->
  <path fill="#c8c3b4" d="M0 470 C 120 448, 240 430, 468 414 L468 466 C 250 482, 130 500, 0 524 Z"/>
  <g stroke="#ffffff" stroke-width="5" stroke-dasharray="26 22" fill="none">
