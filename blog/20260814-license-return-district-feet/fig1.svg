  <g>
    <path d="M120 540 L120 396" stroke="#8f9a96" stroke-width="8" fill="none"/>
    <circle cx="120" cy="386" r="24" fill="#ffffff" stroke="#2f6b53" stroke-width="5"/>
    <rect x="26" y="416" width="150" height="32" rx="6" fill="#ffffff" stroke="#2f6b53" stroke-width="3"/>
    <text x="101" y="438" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3e52" text-anchor="middle">平日のみ</text>
  </g>
  <g>
    <circle cx="182" cy="452" r="15" fill="#e8c9a8" stroke="#b99a7c" stroke-width="3"/>
    <path d="M170 442 C 174 428, 192 428, 195 442 Z" fill="#8d8f94"/>
    <path d="M166 468 C 168 508, 176 528, 178 540 L196 540 C 198 522, 202 496, 200 468 Z" fill="#b3577b" stroke="#8c4260" stroke-width="3"/>
    <path d="M204 474 L212 540" stroke="#8f7f5e" stroke-width="5" fill="none"/>
  </g>

