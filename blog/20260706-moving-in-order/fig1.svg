<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-label="森町への転入届は、オンライン予約だけで終わらないの事実整理">
<defs><style>.ttl{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;font-weight:700;fill:#203b32}.lbl{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;fill:#50645b}.num{font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;font-weight:700;fill:#fff}</style></defs>
<rect width="1000" height="430" rx="18" fill="#f8fbf8" stroke="#c9d9d0"/>
<rect x="0" y="0" width="1000" height="78" rx="18" fill="#174f3b"/>
<rect x="0" y="58" width="1000" height="20" fill="#174f3b"/>
<text x="40" y="51" class="num" font-size="27">公式資料から見えること</text>
<rect x="36" y="96" width="928" height="92" rx="13" fill="#fff" stroke="#d9e3dd"/>
<circle cx="77" cy="142" r="23" fill="#b78b35"/>
<text x="77" y="150" text-anchor="middle" class="num" font-size="19">1</text>
<text x="116" y="130" class="ttl" font-size="19">公式資料で確認</text>
<text x="116" y="157" class="lbl" font-size="15">転入届の期間は、引っ越しが完了した日から14日以内です。本人確</text>
<text x="116" y="177" class="lbl" font-size="15">認書類や転出証明書、該当者のマイナンバーカードなどが必要で、カ</text>
<rect x="36" y="198" width="928" height="92" rx="13" fill="#fff" stroke="#d9e3dd"/>
<circle cx="77" cy="244" r="23" fill="#b78b35"/>
<text x="77" y="252" text-anchor="middle" class="num" font-size="19">2</text>
<text x="116" y="232" class="ttl" font-size="19">良い点</text>
<text x="116" y="259" class="lbl" font-size="15">必要書類と届出期間が公式ページで具体的に示されている</text>
<rect x="36" y="300" width="928" height="92" rx="13" fill="#fff" stroke="#d9e3dd"/>
<circle cx="77" cy="346" r="23" fill="#b78b35"/>
<text x="77" y="354" text-anchor="middle" class="num" font-size="19">3</text>
<text x="116" y="334" class="ttl" font-size="19">注意点</text>
<text x="116" y="361" class="lbl" font-size="15">オンライン申請だけで転入が完了したと思わない</text>
</svg>