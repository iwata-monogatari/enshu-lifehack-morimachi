<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="th2title th2desc">
<title id="th2title">森町の駅から天浜線に乗る四つの段</title>
<desc id="th2desc">財布に小銭を入れる、無人駅で整理券を取る、車内で運賃表を確かめる、前の運賃箱に入れて降りるという四つの段と、有人駅では16時15分を境に渡す相手が変わる分岐、そして別の日に買う通学回数乗車券を描いた図。</desc>
