    <text x="26" y="346" font-size="17" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="14" y="514" width="204" height="30" rx="7" fill="#ffffff" opacity="0.95"/>
    <text x="116" y="535" font-size="15" fill="#2c4a52" text-anchor="middle">蔵を測って写真に残す</text>
  </g>

