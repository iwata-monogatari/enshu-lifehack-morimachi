    <text x="212" y="292" font-size="17" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="208" y="470" width="232" height="30" rx="7" fill="#ffffff" opacity="0.95"/>
    <text x="324" y="491" font-size="15" fill="#2c4a52" text-anchor="middle">家屋課税台帳の名義を聞く</text>
  </g>

