    <path d="M636 314 L664 320" stroke="#5c7f57" stroke-width="9" stroke-linecap="round"/>
    <circle cx="712" cy="292" r="16" fill="#e3c39d" stroke="#b9926b" stroke-width="3"/>
    <path d="M698 287 q14 -13 28 0 l0 -5 q-14 -12 -28 0 z" fill="#4a4038"/>
    <path d="M712 308 L712 350" stroke="#3f6f86" stroke-width="17" stroke-linecap="round"/>
    <path d="M704 350 L696 386 M720 350 L728 386" stroke="#43505a" stroke-width="9" stroke-linecap="round"/>
