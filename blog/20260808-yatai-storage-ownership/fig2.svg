    <text x="616" y="206" font-size="17" fill="#ffffff" text-anchor="middle">4</text>
    <rect x="506" y="396" width="240" height="30" rx="7" fill="#ffffff" opacity="0.95"/>
    <text x="626" y="417" font-size="15" fill="#2c4a52" text-anchor="middle">土地の持ち主と話しておく</text>
  </g>

  <!-- 5 総会で名義を決める -->
  <g>
    <rect x="762" y="470" width="216" height="14" rx="4" fill="#c19a68" stroke="#96754b" stroke-width="3"/>
    <rect x="790" y="424" width="72" height="46" fill="#ffffff" stroke="#7c8a90" stroke-width="3"/>
