<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="yso2Title yso2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="yso2Title">屋台蔵の名義と敷地を確かめる五つの場面を一本の道に並べたイラスト</title>
  <desc id="yso2Desc">画面の左下から右上へ集落の道が伸び、その道沿いに五つの場面が並びます。一つ目は屋台蔵の前で建物の外寸を測り、写真と図に残す場面。二つ目は役場の窓口で家屋課税台帳の登録名義を尋ねる場面。三つ目は法務局の登記事項証明書と公図を並べて、建物と敷地の名義を見比べる場面。四つ目は神社の境内に建つ蔵について、土地の持ち主と地区の代表者が向かい合って話す場面。五つ目は総会で、規約と構成員名簿を前にして地区の名義をどうするか決める場面です。奥には森町の山並み、杉林、段になった茶畑が見えます。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="yso2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3ef"/><stop offset="0.6" stop-color="#eef3ea"/><stop offset="1" stop-color="#f7f9ef"/>
    </linearGradient>
    <linearGradient id="yso2far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93b3c5"/><stop offset="1" stop-color="#bacfd4"/>
    </linearGradient>
    <linearGradient id="yso2road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8d1be"/><stop offset="1" stop-color="#c3bca8"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="url(#yso2sky)"/>

  <path fill="url(#yso2far)" d="M0 118 L98 84 L196 120 L296 78 L396 118 L496 80 L598 122 L698 82 L800 120 L900 84 L1000 122 L1000 178 L0 178 Z"/>
  <g fill="#6ea07d">
    <path d="M22 180 l19 -56 l19 56 z"/><path d="M66 180 l15 -44 l15 44 z"/>
    <path d="M906 180 l19 -54 l19 54 z"/><path d="M950 180 l21 -60 l21 60 z"/>
  </g>
  <path fill="#7fa957" d="M0 176 C 200 160, 380 154, 540 172 C 700 190, 850 182, 1000 166 L1000 236 L0 244 Z"/>
  <g stroke="#7aa44c" stroke-width="4" opacity="0.5">
    <path d="M0 198 L1000 184"/><path d="M0 218 L1000 204"/>
  </g>
  <path fill="#d3e2bb" d="M0 246 L1000 232 L1000 560 L0 560 Z"/>

  <path fill="url(#yso2road)" d="M26 560 C 136 480, 112 432, 292 408 C 462 386, 512 352, 692 342 C 822 334, 898 348, 1000 342 L1000 384 C 898 390, 822 376, 696 384 C 520 396, 472 426, 304 448 C 160 468, 198 502, 118 560 Z"/>
  <g stroke="#ffffff" stroke-width="5" stroke-dasharray="24 20" opacity="0.75" fill="none">
    <path d="M74 552 C 164 480, 144 446, 298 428 C 468 408, 514 368, 694 362 C 826 358, 898 368, 1000 362"/>
  </g>

