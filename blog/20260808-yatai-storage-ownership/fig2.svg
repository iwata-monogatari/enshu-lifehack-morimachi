    <path d="M422 278 L422 318" stroke="#3f6f86" stroke-width="17" stroke-linecap="round"/>
    <path d="M428 290 L448 280" stroke="#3f6f86" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">
    <circle cx="404" cy="216" r="17" fill="#2c4a52"/>
    <text x="404" y="222" font-size="17" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="412" y="426" width="248" height="30" rx="7" fill="#a8551a" opacity="0.95"/>
    <text x="536" y="447" font-size="15" fill="#ffffff" text-anchor="middle">建物と土地の登記を見比べる</text>
  </g>

  <!-- 4 境内の土地について向かい合って話す -->
  <g>
    <g fill="#b8503a">
      <rect x="654" y="228" width="8" height="52"/><rect x="702" y="228" width="8" height="52"/>
      <rect x="642" y="218" width="80" height="9"/><rect x="648" y="236" width="68" height="6"/>
    </g>
    <g fill="#4f7a52"><path d="M736 282 l14 -44 l14 44 z"/></g>
