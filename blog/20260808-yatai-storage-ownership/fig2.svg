    <path d="M962 422 L962 466" stroke="#3f6f86" stroke-width="17" stroke-linecap="round"/>
    <path d="M954 466 L946 504 M970 466 L978 504" stroke="#43505a" stroke-width="9" stroke-linecap="round"/>
    <path d="M956 434 L932 438" stroke="#3f6f86" stroke-width="9" stroke-linecap="round"/>
    <circle cx="866" cy="398" r="16" fill="#e3c39d" stroke="#b9926b" stroke-width="3"/>
    <path d="M866 414 L866 428" stroke="#8a6f9c" stroke-width="17" stroke-linecap="round"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">
    <circle cx="800" cy="372" r="17" fill="#2c4a52"/>
    <text x="800" y="378" font-size="17" fill="#ffffff" text-anchor="middle">5</text>
    <rect x="752" y="526" width="234" height="30" rx="7" fill="#2c4a52" opacity="0.93"/>
    <text x="869" y="547" font-size="15" fill="#ffffff" text-anchor="middle">総会で名義の行き先を決める</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">
    <rect x="24" y="24" width="344" height="34" rx="8" fill="#ffffff" opacity="0.95"/>
    <text x="196" y="47" font-size="17" fill="#2c4a52" text-anchor="middle">祭りの道具より、建物のほうが難しい</text>
    <rect x="24" y="64" width="344" height="30" rx="8" fill="#2c4a52" opacity="0.92"/>
    <text x="196" y="85" font-size="15" fill="#ffffff" text-anchor="middle">測る・聞く・見比べる・話す・決めるの順で</text>
  </g>
</svg>
