      <path d="M422 478 l0 32" stroke="#7a6b45" stroke-width="12" stroke-linecap="round"/>
      <path d="M422 484 l-24 10" stroke="#7a6b45" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M416 510 l-5 24 M430 510 l5 24" stroke="#4d5a63" stroke-width="7" stroke-linecap="round" fill="none"/>
