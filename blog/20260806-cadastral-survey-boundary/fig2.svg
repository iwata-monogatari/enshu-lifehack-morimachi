    <circle cx="246" cy="234" r="17" fill="#2c4a52"/>
    <text x="246" y="240" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="236" y="392" width="220" height="28" rx="7" fill="#ffffff" opacity="0.93"/>
    <text x="248" y="411" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#26414a">「地籍図」の記載を確かめる</text>
  </g>

