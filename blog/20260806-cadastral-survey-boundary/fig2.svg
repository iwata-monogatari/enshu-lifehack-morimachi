<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="cs2Title cs2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="cs2Title">森町で畑と山の境界を確かめるまでの五つの場面を、一本の道沿いに並べたイラスト</title>
  <desc id="cs2Desc">山あいの畑と林を背景に一本の道が奥へ続き、道沿いに五つの場面が順に並びます。法務局で公図と登記事項証明書を受け取る場面、机で公図に地籍図の記載があるか確かめる場面、役場の窓口で成果の交付を申請する場面、図面を持って現地で杭を探す場面、隣の土地の所有者と立会う場面です。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="cs2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4e6ef"/><stop offset="0.65" stop-color="#eaf2ec"/><stop offset="1" stop-color="#f5f8ee"/>
    </linearGradient>
    <linearGradient id="cs2hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#97b6c4"/><stop offset="1" stop-color="#b7ced2"/>
    </linearGradient>
    <linearGradient id="cs2field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9c682"/><stop offset="1" stop-color="#7ea75a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="url(#cs2sky)"/>
  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="176" cy="52" rx="54" ry="16"/><ellipse cx="224" cy="46" rx="36" ry="12"/>
  </g>

  <path fill="url(#cs2hill)" d="M0 146 L108 106 L212 144 L312 102 L414 142 L520 104 L626 146 L730 106 L834 144 L936 108 L1000 140 L1000 206 L0 206 Z"/>
  <g fill="#3f6b52" opacity="0.85">
    <path d="M46 206 l17 -44 l17 44 z"/><path d="M84 206 l13 -34 l13 34 z"/><path d="M118 206 l18 -48 l18 48 z"/>
    <path d="M866 206 l16 -42 l16 42 z"/><path d="M902 206 l13 -34 l13 34 z"/><path d="M934 206 l18 -46 l18 46 z"/>
  </g>
  <rect x="0" y="202" width="1000" height="358" fill="#e3edd9"/>
  <path fill="url(#cs2field)" d="M0 214 L1000 202 L1000 262 L0 276 Z"/>
  <g stroke="#6d9850" stroke-width="2" opacity="0.5">
    <path d="M0 230 L1000 218"/><path d="M0 248 L1000 236"/><path d="M0 266 L1000 254"/>
  </g>
  <path fill="none" stroke="#d3402c" stroke-width="2.6" stroke-dasharray="14 10" d="M0 210 L1000 198"/>

  <!-- 道 -->
  <path fill="#cfc3a8" stroke="#b3a689" stroke-width="2" d="M-10 516 C 170 474, 194 406, 372 388 C 552 370, 596 310, 786 300 C 896 294, 958 286, 1010 282 L1010 304 C 958 308, 896 316, 788 322 C 612 332, 572 390, 386 410 C 210 428, 192 494, -10 538 Z"/>
  <path fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="16 20" opacity="0.75" d="M-10 527 C 170 485, 194 417, 372 399 C 552 381, 596 321, 786 311 C 896 305, 958 297, 1010 293"/>

