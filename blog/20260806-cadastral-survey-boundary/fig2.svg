    </g>
    <circle cx="470" cy="212" r="17" fill="#2c4a52"/>
    <text x="470" y="218" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="466" y="414" width="216" height="28" rx="7" fill="#ffffff" opacity="0.93"/>
    <text x="478" y="433" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#26414a">用地係で成果を申請する</text>
  </g>

  <!-- 場面4：現地で杭を探す -->
  <g>
