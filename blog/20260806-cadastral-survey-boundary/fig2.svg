  <!-- 場面5：立会い -->
  <g>
    <path d="M232 556 L256 462 L448 456 L474 556 Z" fill="#dfe6d4"/>
    <path fill="none" stroke="#d3402c" stroke-width="3" stroke-dasharray="12 9" d="M352 456 L352 556"/>
