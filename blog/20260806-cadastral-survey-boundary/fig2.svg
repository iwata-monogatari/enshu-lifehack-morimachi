    </g>
    <rect x="502" y="312" width="146" height="13" rx="3" fill="#b8ac90" stroke="#8d8168" stroke-width="1.6"/>
    <g>
      <circle cx="520" cy="344" r="12" fill="#f0d6bd" stroke="#c9a684" stroke-width="1.6"/>
      <path d="M520 358 l0 30" stroke="#3f6b8c" stroke-width="11" stroke-linecap="round"/>
      <path d="M520 364 l22 6" stroke="#3f6b8c" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M515 388 l-5 20 M527 388 l6 20" stroke="#4d5a63" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
    <g>
      <circle cx="614" cy="344" r="12" fill="#f0d6bd" stroke="#c9a684" stroke-width="1.6"/>
      <path d="M614 358 l0 30" stroke="#4a5a6b" stroke-width="11" stroke-linecap="round"/>
      <path d="M614 364 l-22 6" stroke="#4a5a6b" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M609 388 l-5 20 M621 388 l6 20" stroke="#4d5a63" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
    <g>
      <rect x="552" y="356" width="32" height="24" rx="2" fill="#ffffff" stroke="#9aa3a8" stroke-width="1.6"/>
      <g stroke="#b6bfc4" stroke-width="1.6">
        <path d="M558 364 h20"/><path d="M558 371 h20"/>
