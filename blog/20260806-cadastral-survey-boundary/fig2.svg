  <g>
    <rect x="252" y="316" width="152" height="58" rx="4" fill="#8d7a5e" stroke="#6a5a42" stroke-width="2"/>
    <rect x="244" y="304" width="168" height="20" rx="4" fill="#a08c6c" stroke="#6a5a42" stroke-width="2"/>
