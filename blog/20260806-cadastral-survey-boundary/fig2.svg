      <rect x="700" y="352" width="30" height="22" rx="2" fill="#fbf7ea" stroke="#b9ac8e" stroke-width="1.6"/>
      <g stroke="#c9bd9f" stroke-width="1.4">
        <path d="M706 360 h18"/><path d="M706 367 h12"/>
      </g>
      <path d="M770 366 L800 384" stroke="#8d7f60" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle cx="690" cy="300" r="17" fill="#2c4a52"/>
    <text x="690" y="306" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <rect x="700" y="452" width="212" height="28" rx="7" fill="#ffffff" opacity="0.93"/>
    <text x="712" y="471" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#26414a">図面を持って杭を探す</text>
