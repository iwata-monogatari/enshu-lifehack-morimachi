      <rect x="100" y="462" width="30" height="22" rx="2" fill="#f6f2e4" stroke="#b9ac8e" stroke-width="1.6"/>
      <g stroke="#c9bd9f" stroke-width="1.4">
        <path d="M106 470 h18"/><path d="M106 477 h12"/>
      </g>
    </g>
    <circle cx="26" cy="286" r="17" fill="#2c4a52"/>
    <text x="26" y="292" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="16" y="496" width="204" height="28" rx="7" fill="#ffffff" opacity="0.93"/>
    <text x="28" y="515" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#26414a">公図と登記の写しを取る</text>
  </g>

