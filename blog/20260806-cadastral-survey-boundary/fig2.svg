    <circle cx="242" cy="438" r="17" fill="#2c4a52"/>
    <text x="242" y="444" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <rect x="472" y="524" width="136" height="28" rx="7" fill="#ffffff" opacity="0.93"/>
    <text x="484" y="543" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#26414a">立会いを頼む</text>
  </g>

  <!-- 見出しラベル -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">
    <rect x="24" y="24" width="330" height="34" rx="8" fill="#2c4a52" opacity="0.92"/>
    <text x="40" y="47" font-size="17" fill="#ffffff">草を刈る前に、図面と座標を手に入れる</text>
