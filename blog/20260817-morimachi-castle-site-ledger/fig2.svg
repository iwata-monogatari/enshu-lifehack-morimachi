<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" data-illustration="mori-editorial" aria-labelledby="t d"><title id="t">城館台帳の確認順序</title><desc id="d">町史、地形と年代、遺構典拠と所有者、許可後の現地確認を四場面で描く</desc><rect width="1000" height="560" fill="#f7f0e3"/><path d="M0 430Q230 350 470 430T1000 395" fill="none" stroke="#bd8d55" stroke-width="34"/><g font-family="sans-serif" font-weight="700"><g transform="translate(40 120)"><rect width="190" height="145" rx="12" fill="#fff" stroke="#4e6958" stroke-width="4"/><path d="M35 30h120v75H35z" fill="#e5d2a5"/><path d="M55 48h80M55 66h80M55 84h55" stroke="#806542" stroke-width="4"/><text x="30" y="130" font-size="17">1 城名と典拠</text></g><g transform="translate(285 180)"><rect width="190" height="145" rx="12" fill="#fff" stroke="#4e6958" stroke-width="4"/><path d="M20 105q60-90 120 0z" fill="#819871"/><rect x="130" y="30" width="42" height="60" fill="#d8b878"/><text x="28" y="130" font-size="17">2 地形と年代</text></g><g transform="translate(530 120)"><rect width="190" height="145" rx="12" fill="#fff" stroke="#4e6958" stroke-width="4"/><path d="M30 95h60V45H30z" fill="#aa8a65"/><circle cx="140" cy="65" r="27" fill="#e3b98e"/><text x="20" y="130" font-size="17">3 遺構・所有確認</text></g><g transform="translate(775 180)"><rect width="190" height="145" rx="12" fill="#fff" stroke="#4e6958" stroke-width="4"/><path d="M20 105q55-80 110 0z" fill="#78906b"/><circle cx="155" cy="60" r="17" fill="#e3b98e"/><path d="M155 77v38" stroke="#423b34" stroke-width="7"/><text x="20" y="130" font-size="17">4 許可範囲だけ現地へ</text></g><text x="55" y="510" font-size="19" fill="#304538">写真があることと、自由に立ち入れることを分ける</text></g></svg>
