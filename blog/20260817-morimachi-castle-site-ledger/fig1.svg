<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" data-illustration="mori-editorial" aria-labelledby="t d"><title id="t">森町七城の年代地形図</title><desc id="d">北から南へ連なる山並みに七つの城館と1501年から1573年の札を配置する</desc><rect width="1000" height="560" fill="#f4eddd"/><path d="M0 360Q110 120 230 350Q350 50 500 340Q650 100 780 350Q900 180 1000 330V560H0Z" fill="#78906b"/><path d="M0 480Q240 420 430 490T1000 450V560H0Z" fill="#b7ca91"/><g fill="#5c4332"><path d="M120 325l45-55 45 55z"/><path d="M255 250l50-60 50 60z"/><path d="M405 340l45-55 45 55z"/><path d="M555 300l48-58 48 58z"/><path d="M680 350l42-52 42 52z"/><path d="M795 330l44-54 44 54z"/><path d="M885 390l40-48 40 48z"/></g><g font-family="sans-serif" font-size="15" font-weight="700" fill="#26392e"><text x="70" y="370">天方本城 1501</text><text x="225" y="285">天方新城 1568頃</text><text x="380" y="380">城ヶ島</text><text x="525" y="340">真田山城</text><text x="650" y="390">片瀬城 1573</text><text x="775" y="370">飯田古城</text><text x="865" y="430">飯田城</text></g><path d="M150 420Q360 370 570 420T920 400" fill="none" stroke="#c28b54" stroke-width="12" stroke-dasharray="18 10"/><text x="35" y="55" font-family="sans-serif" font-size="29" font-weight="700" fill="#26392e">旧拠点・新拠点・攻防年を分けて読む</text><text x="35" y="90" font-family="sans-serif" font-size="17" fill="#26392e">位置は概念配置。見学路・私有地境界を示す図ではありません。</text></svg>
