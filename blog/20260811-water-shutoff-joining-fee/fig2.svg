<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="wf2Title wf2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="wf2Title">実家の水道を廃止するか続けるかを決める順番を描いたイラスト</title>
  <desc id="wf2Desc">上に森町の山並みと杉、段になった茶畑があります。左でメーターボックスをのぞき込んで口径を確かめる人がいて、そこから右へ道が伸びます。道の途中に「3年以内に使うか」と書いた分かれ道の標識があり、上の道は水の出る家と2か月ごとの請求書へ続き、下の道は給水届を持った人が上下水道課の窓口へ入り、その先に加入金38,500円の札が置かれています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="wf2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6dcec"/><stop offset="1" stop-color="#eef3e9"/>
    </linearGradient>
    <linearGradient id="wf2Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fadbe"/><stop offset="1" stop-color="#b8ccd2"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="64" fill="url(#wf2Sky)"/>

  <!-- 山並み・杉・茶畑 -->
  <path fill="url(#wf2Far)" d="M0 42 L98 14 L196 46 L300 10 L404 44 L512 8 L620 46 L724 12 L828 44 L924 12 L1000 40 L1000 58 L0 58 Z"/>
  <g fill="#57876a">
    <path d="M16 58 l10 -24 l10 24 z"/><path d="M40 58 l8 -18 l8 18 z"/>
    <path d="M944 58 l9 -22 l9 22 z"/><path d="M966 58 l11 -26 l11 26 z"/>
  </g>
  <path fill="#7ba954" d="M0 54 C 250 46, 470 44, 660 52 C 820 58, 910 54, 1000 48 L1000 70 L0 74 Z"/>
  <g stroke="#5f8a42" stroke-width="3" opacity="0.8" fill="none">
    <path d="M0 60 C 250 52, 470 50, 660 58 C 820 64, 910 60, 1000 54"/>
    <path d="M0 70 C 250 62, 470 60, 660 68 C 820 72, 910 68, 1000 62"/>
  </g>
  <path fill="#eef3e9" d="M0 72 L1000 66 L1000 560 L0 560 Z"/>

  <!-- 道 -->
  <g stroke="#cdc6b2" stroke-width="28" fill="none" stroke-linecap="round">
    <path d="M196 300 L436 300"/>
    <path d="M436 300 C 486 300, 500 240, 524 190"/>
    <path d="M436 300 C 486 300, 500 360, 524 410"/>
    <path d="M524 190 L700 190"/>
    <path d="M524 410 L640 410"/>
  </g>
  <g stroke="#ffffff" stroke-width="3" stroke-dasharray="16 16" opacity="0.75" fill="none">
    <path d="M220 300 L420 300"/>
  </g>

  <!-- 左：メーターをのぞき込む人 -->
  <g>
    <ellipse cx="96" cy="404" rx="72" ry="26" fill="#cfc9b8"/>
    <ellipse cx="96" cy="398" rx="64" ry="22" fill="#8e9aa0" stroke="#6f7a80" stroke-width="3"/>
    <ellipse cx="96" cy="396" rx="48" ry="15" fill="#3c4a52"/>
    <rect x="62" y="382" width="44" height="20" rx="5" fill="#c9ccc4" stroke="#8d938c" stroke-width="3"/>
    <circle cx="84" cy="392" r="7" fill="#eef2f3" stroke="#8d938c" stroke-width="3"/>
    <rect x="16" y="434" width="164" height="30" rx="8" fill="#ffffff" stroke="#8fb79c" stroke-width="3"/>
    <text x="98" y="455" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">口径を確かめる</text>
  </g>
  <g>
    <circle cx="122" cy="216" r="26" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
    <path d="M96 210 q26 -28 52 0 q0 -21 -26 -21 q-26 0 -26 21 z" fill="#463d33"/>
    <path d="M94 250 q28 -16 56 0 l10 74 l-76 0 z" fill="#4a7896"/>
    <path d="M158 268 L188 316" stroke="#e6c49d" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- 分かれ道の標識 -->
  <g>
    <rect x="352" y="196" width="196" height="40" rx="10" fill="#1f3e52"/>
    <text x="450" y="223" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">3年以内に使うか</text>
    <path d="M436 236 L436 288" stroke="#8d9aa0" stroke-width="6"/>
  </g>

  <!-- 上の道：使う（継続） -->
  <g>
    <rect x="546" y="120" width="130" height="34" rx="9" fill="#3e6b55"/>
    <text x="611" y="143" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">使う＝継続</text>
    <path d="M694 178 L742 148 L790 178 Z" fill="#7f8b8f"/>
    <rect x="704" y="178" width="76" height="40" fill="#f4f1e6" stroke="#bdb5a2" stroke-width="3"/>
    <rect x="724" y="190" width="22" height="28" fill="#b39a76"/>
    <path d="M792 190 C 806 194, 812 202, 810 212" fill="none" stroke="#7fa8c4" stroke-width="5" stroke-linecap="round"/>
    <g fill="#7fa8c4">
      <circle cx="812" cy="222" r="5"/><circle cx="812" cy="238" r="4"/>
    </g>
    <!-- 請求書 -->
    <path d="M834 152 L950 144 L956 232 L840 240 Z" fill="#ffffff" stroke="#b9c2c6" stroke-width="3"/>
    <g stroke="#a9bfcb" stroke-width="4" fill="none">
      <path d="M850 172 L938 165"/><path d="M851 188 L920 182"/>
    </g>
    <text x="896" y="220" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1f3e52" text-anchor="middle">2か月ごと</text>
    <rect x="806" y="252" width="184" height="32" rx="9" fill="#ffffff" stroke="#8fb79c" stroke-width="3"/>
    <text x="898" y="274" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">基本料金 1,100円</text>
  </g>

  <!-- 下の道：使わない（廃止） -->
  <g>
    <rect x="436" y="496" width="164" height="34" rx="9" fill="#1f3e52"/>
    <text x="518" y="519" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">使わない＝廃止</text>
    <!-- 給水届を持つ人 -->
    <circle cx="586" cy="352" r="22" fill="#e6c49d" stroke="#bd9a72" stroke-width="3"/>
    <path d="M564 346 q22 -24 44 0 q0 -18 -22 -18 q-22 0 -22 18 z" fill="#3f3830"/>
    <path d="M562 380 q24 -14 48 0 l8 60 l-64 0 z" fill="#63705c"/>
    <path d="M566 396 L614 390 L618 428 L570 434 Z" fill="#ffffff" stroke="#b9c2c6" stroke-width="3"/>
    <g stroke="#a9bfcb" stroke-width="3" fill="none"><path d="M576 408 L608 404"/><path d="M577 418 L602 415"/></g>
    <!-- 窓口 -->
    <path d="M646 388 L706 352 L766 388 Z" fill="#6f8391"/>
    <rect x="656" y="388" width="100" height="72" fill="#f2f0e6" stroke="#c0b9a6" stroke-width="3"/>
    <rect x="670" y="406" width="32" height="30" fill="#c3d6dd" stroke="#93a7ae" stroke-width="3"/>
    <rect x="716" y="406" width="28" height="54" fill="#b39a76" stroke="#8f7a5b" stroke-width="3"/>
    <rect x="632" y="478" width="148" height="32" rx="9" fill="#ffffff" stroke="#a49c8d" stroke-width="3"/>
    <text x="706" y="500" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">上下水道課の窓口</text>
    <!-- 再開のときの加入金 -->
    <path d="M780 424 L820 424" stroke="#8d9aa0" stroke-width="6"/>
    <path d="M820 414 L840 424 L820 434 Z" fill="#8d9aa0"/>
    <g>
      <rect x="846" y="380" width="120" height="30" rx="5" fill="#e8dfc2" stroke="#b9a970" stroke-width="3"/>
      <rect x="852" y="368" width="120" height="30" rx="5" fill="#f2ead0" stroke="#b9a970" stroke-width="3"/>
      <circle cx="912" cy="383" r="9" fill="#d8b25e" stroke="#a8842f" stroke-width="3"/>
    </g>
    <rect x="828" y="424" width="164" height="34" rx="9" fill="#1f3e52"/>
    <text x="910" y="447" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">再開に加入金38,500円</text>
  </g>
</svg>
