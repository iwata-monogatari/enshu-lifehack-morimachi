<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="wf1Title wf1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="wf1Title">誰も住まない森町の実家の水回りを一枚に描いたイラスト</title>
  <desc id="wf1Desc">奥に山並みと杉林、段になった茶畑、丘の上の配水池のタンクが見えます。中央に瓦屋根の実家があり、断面のように台所の流し、風呂の浴槽、便器と、それをつなぐ排水の管が描かれています。家の手前の地面にはメーターボックスの蓋が開けてあり、量水器と止水栓が見えます。右手には草の伸びた庭と散水栓、物置があります。左手前には給水届の用紙と印鑑、鉛筆が置かれています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="wf1Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3dbee"/><stop offset="1" stop-color="#e8f0e4"/>
    </linearGradient>
    <linearGradient id="wf1Far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa9bd"/><stop offset="1" stop-color="#b5cad2"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="#eef3e9"/>
  <rect width="1000" height="200" fill="url(#wf1Sky)"/>

  <!-- 山並み -->
  <path fill="url(#wf1Far)" d="M0 130 L112 74 L220 128 L330 62 L444 126 L560 58 L676 128 L788 72 L896 126 L1000 84 L1000 176 L0 176 Z"/>
  <g fill="#3f6b52">
    <path d="M22 200 l13 -34 l13 34 z"/><path d="M52 200 l10 -26 l10 26 z"/>
    <path d="M928 200 l12 -32 l12 32 z"/><path d="M958 200 l14 -36 l14 36 z"/>
  </g>

  <!-- 丘の上の配水池 -->
  <path fill="#9fb98f" d="M700 200 C 760 156, 860 152, 1000 178 L1000 214 L700 214 Z"/>
  <g>
    <rect x="820" y="128" width="96" height="46" rx="6" fill="#dfe4e2" stroke="#a9b2b0" stroke-width="3"/>
    <path d="M814 128 L868 106 L922 128 Z" fill="#94a3a6"/>
    <rect x="848" y="174" width="12" height="20" fill="#a9b2b0"/>
    <rect x="878" y="174" width="12" height="20" fill="#a9b2b0"/>
    <path d="M832 176 C 800 190, 780 196, 744 204" fill="none" stroke="#7fa8c4" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 茶畑 -->
  <path fill="#7fae57" d="M0 200 C 200 190, 420 214, 640 202 C 740 196, 830 206, 1000 200 L1000 248 L0 254 Z"/>
  <g stroke="#5f8a42" stroke-width="4" opacity="0.85" fill="none">
    <path d="M0 210 C 200 200, 420 224, 640 212 C 740 206, 830 216, 1000 210"/>
    <path d="M0 226 C 200 216, 420 240, 640 228 C 740 222, 830 232, 1000 226"/>
    <path d="M0 242 C 200 232, 420 256, 640 244 C 740 238, 830 248, 1000 242"/>
  </g>
  <path fill="#dfe8d6" d="M0 250 L1000 240 L1000 560 L0 560 Z"/>

  <!-- 実家（断面のように水回りを見せる） -->
  <g>
    <path d="M228 292 L468 190 L708 292 Z" fill="#6f7c82"/>
    <path d="M252 292 L468 200 L684 292 Z" fill="#8b979b"/>
    <g stroke="#66737a" stroke-width="3" fill="none">
      <path d="M300 274 L636 274"/><path d="M282 284 L654 284"/>
    </g>
    <rect x="252" y="292" width="432" height="176" fill="#f3efe3" stroke="#c2baa7" stroke-width="4"/>
    <!-- 間仕切り -->
    <g stroke="#d5cdba" stroke-width="4">
      <path d="M396 292 L396 468"/><path d="M540 292 L540 468"/>
    </g>
    <!-- 台所の流し -->
    <rect x="282" y="344" width="86" height="18" rx="4" fill="#cfd8da" stroke="#9dabaf" stroke-width="3"/>
    <rect x="298" y="362" width="54" height="26" fill="#e3e9ea" stroke="#9dabaf" stroke-width="3"/>
    <path d="M324 328 L324 344" stroke="#9dabaf" stroke-width="5"/>
    <path d="M324 328 L344 328 L344 340" fill="none" stroke="#9dabaf" stroke-width="5"/>
    <rect x="295" y="397" width="60" height="26" rx="7" fill="#ffffff" stroke="#c9d3cd" stroke-width="2"/><text x="325" y="416" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">台所</text>
    <!-- 風呂 -->
    <rect x="420" y="356" width="96" height="46" rx="8" fill="#e3edf0" stroke="#9dabaf" stroke-width="3"/>
    <rect x="428" y="368" width="80" height="26" rx="5" fill="#a9cede"/>
    <path d="M444 336 L444 356" stroke="#9dabaf" stroke-width="5"/>
    <rect x="438" y="405" width="60" height="26" rx="7" fill="#ffffff" stroke="#c9d3cd" stroke-width="2"/><text x="468" y="424" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">風呂</text>
    <!-- 便器 -->
    <path d="M578 356 q34 0 34 22 q0 22 -34 22 q-34 0 -34 -22 q0 -22 34 -22 z" fill="#eef2f3" stroke="#9dabaf" stroke-width="3"/>
    <rect x="558" y="330" width="40" height="26" rx="5" fill="#eef2f3" stroke="#9dabaf" stroke-width="3"/>
    <rect x="552" y="405" width="72" height="26" rx="7" fill="#ffffff" stroke="#c9d3cd" stroke-width="2"/><text x="588" y="424" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">トイレ</text>
    <!-- 排水の管 -->
    <path d="M325 388 L325 452 L588 452 L588 400" fill="none" stroke="#b6aa93" stroke-width="7" stroke-linejoin="round"/>
    <path d="M468 402 L468 452" fill="none" stroke="#b6aa93" stroke-width="7"/>
  </g>

  <!-- メーターボックス -->
  <g>
    <ellipse cx="196" cy="500" rx="86" ry="30" fill="#cfc9b8"/>
    <ellipse cx="196" cy="494" rx="78" ry="26" fill="#8e9aa0" stroke="#6f7a80" stroke-width="3"/>
    <ellipse cx="196" cy="492" rx="60" ry="19" fill="#3c4a52"/>
    <!-- 量水器 -->
    <rect x="152" y="474" width="52" height="24" rx="6" fill="#c9ccc4" stroke="#8d938c" stroke-width="3"/>
    <circle cx="178" cy="486" r="9" fill="#eef2f3" stroke="#8d938c" stroke-width="3"/>
    <path d="M178 486 L178 480" stroke="#c0563c" stroke-width="3"/>
    <!-- 止水栓 -->
    <rect x="216" y="480" width="20" height="16" rx="4" fill="#a9b2b0" stroke="#7d8785" stroke-width="3"/>
    <path d="M226 480 L226 468" stroke="#7d8785" stroke-width="4"/>
    <path d="M212 468 L240 468" stroke="#c0563c" stroke-width="6" stroke-linecap="round"/>
    <!-- 蓋 -->
    <path d="M262 468 L322 452 L330 476 L270 492 Z" fill="#b4bcbb" stroke="#8d9694" stroke-width="3"/>
    <rect x="146" y="524" width="176" height="28" rx="8" fill="#ffffff" stroke="#8fb79c" stroke-width="3"/>
    <text x="234" y="544" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">量水器と止水栓</text>
  </g>

  <!-- 右：庭と散水栓・物置 -->
  <g>
    <rect x="742" y="366" width="112" height="82" fill="#e4e8e5" stroke="#b2bab6" stroke-width="3"/>
    <path d="M732 366 L798 330 L864 366 Z" fill="#98a4a6"/>
    <rect x="778" y="396" width="40" height="52" fill="#c8cfcb" stroke="#a3aca8" stroke-width="3"/>
    <rect x="896" y="428" width="22" height="46" rx="5" fill="#a9b2b0" stroke="#7d8785" stroke-width="3"/>
    <path d="M907 428 L907 412" stroke="#7d8785" stroke-width="4"/>
    <path d="M892 412 L922 412" stroke="#c0563c" stroke-width="6" stroke-linecap="round"/>
    <rect x="864" y="486" width="98" height="28" rx="8" fill="#ffffff" stroke="#8fb79c" stroke-width="3"/>
    <text x="913" y="506" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1f3e52" text-anchor="middle">散水栓</text>
  </g>
  <g stroke="#79953f" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M716 508 C 712 486, 724 476, 720 458"/>
    <path d="M740 512 C 736 490, 748 480, 744 462"/>
    <path d="M764 508 C 760 488, 772 478, 768 460"/>
    <path d="M840 506 C 836 486, 848 476, 844 458"/>
    <path d="M864 510 C 860 490, 872 480, 868 462"/>
  </g>

  <!-- 左手前：給水届と印鑑 -->
  <g>
    <path d="M24 400 L136 388 L148 470 L36 482 Z" fill="#ffffff" stroke="#b9c2c6" stroke-width="3"/>
    <g stroke="#a9bfcb" stroke-width="4" fill="none">
      <path d="M40 416 L126 407"/><path d="M42 432 L112 424"/><path d="M44 448 L120 440"/>
    </g>
    <rect x="34" y="368" width="96" height="26" rx="7" fill="#3e6b55"/>
    <text x="82" y="387" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">給水届</text>
    <rect x="60" y="492" width="18" height="38" rx="4" fill="#8a6f5a" stroke="#6b5443" stroke-width="3"/>
    <rect x="60" y="522" width="18" height="10" fill="#c0563c"/>
    <ellipse cx="112" cy="516" rx="24" ry="14" fill="#ddd7c8" stroke="#b0a894" stroke-width="3"/>
    <ellipse cx="112" cy="514" rx="14" ry="8" fill="#c0563c"/>
  </g>
</svg>
