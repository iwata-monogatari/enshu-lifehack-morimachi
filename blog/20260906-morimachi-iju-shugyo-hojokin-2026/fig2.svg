<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial"><title id="title">転入前から申請までの順番</title><desc id="desc">転入前相談、移住元10年表、仕事の経路、森町へ転入、期限内の申請という五段階を示す</desc><rect width="1000" height="560" rx="28" fill="#eef4ea"/><path d="M0 132L128 70l106 51 112-78 132 83 123-60 138 73 126-77 135 78v74H0z" fill="#8eb497"/><path d="M78 370H922" stroke="#557b6c" stroke-width="18" stroke-linecap="round"/><g fill="#fff" stroke="#315e58" stroke-width="5"><circle cx="110" cy="370" r="54"/><circle cx="305" cy="370" r="54"/><circle cx="500" cy="370" r="54"/><circle cx="695" cy="370" r="54"/><circle cx="890" cy="370" r="54"/></g><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#244a47"><text x="110" y="383" font-size="38" font-weight="800">1</text><text x="305" y="383" font-size="38" font-weight="800">2</text><text x="500" y="383" font-size="38" font-weight="800">3</text><text x="695" y="383" font-size="38" font-weight="800">4</text><text x="890" y="383" font-size="38" font-weight="800">5</text><text x="110" y="273" font-size="24" font-weight="700">転入前相談</text><text x="305" y="255" font-size="23" font-weight="700">移住元</text><text x="305" y="283" font-size="23" font-weight="700">10年表</text><text x="500" y="255" font-size="23" font-weight="700">仕事の経路</text><text x="500" y="283" font-size="23" font-weight="700">を決める</text><text x="695" y="273" font-size="24" font-weight="700">森町へ転入</text><text x="890" y="255" font-size="23" font-weight="700">期限内に</text><text x="890" y="283" font-size="23" font-weight="700">申請</text><text x="500" y="500" font-size="28" font-weight="800">金額を見る前に、順番を見る</text></g><g fill="#c9743c"><path d="M185 355l34 15-34 15z"/><path d="M380 355l34 15-34 15z"/><path d="M575 355l34 15-34 15z"/><path d="M770 355l34 15-34 15z"/></g></svg>
