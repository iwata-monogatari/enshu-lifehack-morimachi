<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" data-illustration="mori-editorial" aria-labelledby="t d"><title id="t">古墳と土地を確認する四つの場面</title><desc id="d">町史を読む机、地番を囲む地図、役場への照会、許可後に丘陵を見る家族を道で結ぶ</desc><rect width="1000" height="560" fill="#f6efe2"/><path d="M0 430Q210 350 405 430T790 420T1000 385" fill="none" stroke="#c99b60" stroke-width="34"/><g font-family="sans-serif"><g transform="translate(45 105)"><rect width="180" height="150" rx="12" fill="#fff" stroke="#486b58" stroke-width="4"/><rect x="28" y="35" width="55" height="75" fill="#e4c790"/><rect x="92" y="35" width="55" height="75" fill="#efe0ba"/><text x="28" y="135" font-size="18" font-weight="700">1 町史を読む</text></g><g transform="translate(285 170)"><rect width="180" height="150" rx="12" fill="#fff" stroke="#486b58" stroke-width="4"/><path d="M25 30l55 18 45-18 35 16v62l-35-16-45 18-55-18z" fill="#cce0b9"/><circle cx="100" cy="67" r="15" fill="none" stroke="#b34f45" stroke-width="5"/><text x="24" y="135" font-size="18" font-weight="700">2 地番を確定</text></g><g transform="translate(525 105)"><rect width="180" height="150" rx="12" fill="#fff" stroke="#486b58" stroke-width="4"/><path d="M30 72l60-40 60 40v50H30z" fill="#9ab6b0"/><rect x="78" y="80" width="24" height="42" fill="#fff"/><text x="22" y="140" font-size="18" font-weight="700">3 町へ照会</text></g><g transform="translate(765 170)"><rect width="190" height="150" rx="12" fill="#fff" stroke="#486b58" stroke-width="4"/><path d="M20 105q55-80 110 0z" fill="#73906b"/><circle cx="150" cy="62" r="18" fill="#deb184"/><path d="M150 80v40m0-28l-25 18m25-18l22 20" stroke="#4b4038" stroke-width="7"/><text x="15" y="140" font-size="17" font-weight="700">4 許可後に現地へ</text></g><text x="60" y="505" font-size="20" font-weight="700" fill="#33483b">資料 → 地番と範囲 → 担当窓口 → 公開・安全・所有者確認</text></g></svg>
