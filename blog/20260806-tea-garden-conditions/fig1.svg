<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="fig1Title fig1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="fig1Title">森町の山あいに広がる茶園と、そこに付いてくる設備を描いたイラスト</title>
  <desc id="fig1Desc">奥に三倉・天方方面の山並みと集落の屋根、中景に段々の茶畑の畝と防霜ファン、乗用摘採機を配し、右手に空き家となった母屋と作業小屋、左手に用水路、手前に農道と軽トラックを描いています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="t1sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6f2"/><stop offset="0.6" stop-color="#e9f3f2"/><stop offset="1" stop-color="#f4f8ef"/>
    </linearGradient>
    <linearGradient id="t1far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dbccd"/><stop offset="1" stop-color="#b9d2d8"/>
    </linearGradient>
    <linearGradient id="t1mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e9a8e"/><stop offset="1" stop-color="#8fb4a4"/>
    </linearGradient>
    <linearGradient id="t1tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bb765"/><stop offset="1" stop-color="#4f8039"/>
    </linearGradient>
    <linearGradient id="t1tea2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fae5c"/><stop offset="1" stop-color="#456f31"/>
    </linearGradient>
    <linearGradient id="t1water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2dfec"/><stop offset="1" stop-color="#95c2da"/>
    </linearGradient>
  </defs>

