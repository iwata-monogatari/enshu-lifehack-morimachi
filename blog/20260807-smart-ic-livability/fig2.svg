<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="sic2Title sic2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="sic2Title">森町で立地を確かめる五つの場面を道沿いに並べたイラスト</title>
  <desc id="sic2Desc">森町の山並みと茶畑を背景に、一本の道が奥から手前へ曲がりながら続きます。道沿いに、地図の上で自宅予定地と勤務先を線で結ぶ場面、店と診療所と学校までの距離を測る場面、バス停の時刻表を見ながら予約の電話をかける場面、役場の窓口で用途地域図を広げる場面、家族が車を降りて土地に立ってみる場面が、手前へ向かって順に並んでいます。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="sic2sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3e4ee"/><stop offset="0.6" stop-color="#eaf2ec"/><stop offset="1" stop-color="#f5f8ef"/>
    </linearGradient>
    <linearGradient id="sic2far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93b2c4"/><stop offset="1" stop-color="#b6ccd2"/>
    </linearGradient>
    <linearGradient id="sic2ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc172"/><stop offset="1" stop-color="#7ba851"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="url(#sic2sky)"/>
  <circle cx="60" cy="58" r="24" fill="#ffffff" opacity="0.7"/>
  <g fill="#ffffff" opacity="0.5">
    <ellipse cx="500" cy="48" rx="56" ry="15"/><ellipse cx="548" cy="42" rx="36" ry="11"/>
  </g>

  <path fill="url(#sic2far)" d="M0 128 L96 92 L190 126 L286 86 L386 124 L484 88 L586 128 L686 92 L788 126 L888 90 L980 128 L1000 116 L1000 184 L0 184 Z"/>
  <g fill="#6d9e7c" opacity="0.85">
    <path d="M28 186 l20 -62 l20 62 z"/><path d="M84 186 l16 -50 l16 50 z"/><path d="M876 186 l19 -60 l19 60 z"/><path d="M928 186 l16 -50 l16 50 z"/>
  </g>

  <!-- 茶畑と地面 -->
  <path fill="#7fa957" d="M0 180 L1000 172 L1000 226 L0 236 Z"/>
  <g stroke="#5f8a3f" stroke-width="3.4" opacity="0.5">
    <path d="M0 192 L1000 184"/><path d="M0 206 L1000 198"/><path d="M0 220 L1000 212"/>
  </g>
  <path fill="url(#sic2ground)" d="M0 226 L1000 216 L1000 560 L0 560 Z"/>

  <!-- 曲がりくねる道 -->
  <path fill="#cfc8b8" d="M470 220 C 430 300, 720 320, 700 392 C 684 452, 300 462, 236 560 L 480 560 C 520 480, 900 462, 908 384 C 916 296, 560 292, 596 220 Z"/>
  <path fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="20 20" opacity="0.85"
        d="M534 222 C 500 300, 800 316, 792 388 C 782 456, 400 466, 348 556"/>

  <!-- 場面1：地図の上で自宅予定地と勤務先を結ぶ -->
  <g>
    <rect x="70" y="252" width="164" height="112" rx="8" fill="#fbf8ec" stroke="#bcae90" stroke-width="2.6"/>
    <g stroke="#ddd5bd" stroke-width="2">
      <path d="M70 286 h164"/><path d="M70 318 h164"/><path d="M112 252 v112"/><path d="M176 252 v112"/>
    </g>
    <path d="M92 344 L214 274" stroke="#d3402c" stroke-width="3.4" stroke-dasharray="10 8" fill="none"/>
    <circle cx="92" cy="344" r="8" fill="#2f5f45"/>
    <circle cx="214" cy="274" r="8" fill="#d3402c"/>
    <rect x="70" y="372" width="164" height="30" rx="7" fill="#2c4a52" opacity="0.92"/>
    <text x="152" y="393" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1 勤務先まで</text>
  </g>

  <!-- 場面2：店・診療所・学校までの距離を測る -->
  <g>
    <rect x="286" y="238" width="52" height="46" rx="4" fill="#f2ede0" stroke="#b5a687" stroke-width="2.2"/>
    <path d="M280 238 L312 216 L344 238 Z" fill="#8d6a4c"/>
    <rect x="298" y="256" width="28" height="28" fill="#c6dbe4" stroke="#9ab4c0" stroke-width="1.6"/>
    <rect x="352" y="242" width="50" height="42" rx="4" fill="#ffffff" stroke="#b5a687" stroke-width="2.2"/>
    <path d="M346 242 L377 220 L408 242 Z" fill="#4f7f9c"/>
    <rect x="371" y="252" width="12" height="26" fill="#cf4a34"/><rect x="365" y="259" width="24" height="12" fill="#cf4a34"/>
    <rect x="416" y="246" width="54" height="38" rx="4" fill="#f6f1e2" stroke="#b5a687" stroke-width="2.2"/>
    <path d="M410 246 L443 224 L476 246 Z" fill="#6f8f52"/>
    <g fill="#c6dbe4" stroke="#9ab4c0" stroke-width="1.4">
      <rect x="424" y="256" width="16" height="16"/><rect x="448" y="256" width="16" height="16"/>
    </g>
    <path d="M286 300 L470 296" stroke="#a8551a" stroke-width="3" fill="none"/>
    <g stroke="#a8551a" stroke-width="3">
      <path d="M286 292 v16"/><path d="M378 290 v16"/><path d="M470 288 v16"/>
    </g>
    <rect x="286" y="316" width="184" height="30" rx="7" fill="#2c4a52" opacity="0.92"/>
    <text x="378" y="337" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2 店・診療所・学校</text>
  </g>

  <!-- 場面3：バス停で時刻表を見て予約の電話 -->
  <g>
    <rect x="600" y="256" width="7" height="76" fill="#8d959a"/>
    <rect x="558" y="232" width="92" height="48" rx="6" fill="#ffffff" stroke="#2c4a52" stroke-width="2.6"/>
    <g stroke="#c3cdd0" stroke-width="2">
      <path d="M568 248 h72"/><path d="M568 260 h72"/><path d="M568 270 h48"/>
    </g>
    <circle cx="632" cy="270" r="7" fill="#a8551a"/>
    <circle cx="668" cy="286" r="12" fill="#f0d6bd" stroke="#c9a684" stroke-width="1.6"/>
    <path d="M668 298 l0 30" stroke="#8a5f7d" stroke-width="12" stroke-linecap="round"/>
    <path d="M668 306 l-14 12" stroke="#8a5f7d" stroke-width="6" stroke-linecap="round"/>
    <rect x="676" y="280" width="10" height="18" rx="3" fill="#3c4750"/>
    <path d="M663 328 l-5 22 M673 328 l6 22" stroke="#4d5a63" stroke-width="6" stroke-linecap="round" fill="none"/>
    <rect x="556" y="356" width="152" height="30" rx="7" fill="#2c4a52" opacity="0.92"/>
    <text x="632" y="377" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3 バスの予約要否</text>
  </g>

  <!-- 場面4：役場の窓口で用途地域図を広げる -->
  <g>
    <rect x="760" y="244" width="196" height="86" rx="5" fill="#f4f1e6" stroke="#b5a687" stroke-width="2.6"/>
    <path d="M752 244 L858 208 L964 244 Z" fill="#5f7f8c"/>
    <rect x="850" y="212" width="12" height="16" fill="#4e6b77"/>
    <g fill="#c6dbe4" stroke="#9ab4c0" stroke-width="1.6">
      <rect x="776" y="262" width="30" height="26"/><rect x="820" y="262" width="30" height="26"/><rect x="864" y="262" width="30" height="26"/>
    </g>
    <rect x="908" y="262" width="34" height="68" fill="#8d6a4c"/>
    <rect x="754" y="330" width="208" height="12" rx="3" fill="#a08b6a"/>
    <rect x="782" y="342" width="152" height="46" rx="3" fill="#fbf8ec" stroke="#bcae90" stroke-width="2.2"/>
    <g opacity="0.9">
      <rect x="794" y="350" width="42" height="30" fill="#f3d98f" stroke="#c9ab5b" stroke-width="1.4"/>
      <rect x="842" y="350" width="34" height="30" fill="#b9d4a8" stroke="#84a874" stroke-width="1.4"/>
      <rect x="882" y="350" width="40" height="30" fill="#c9c2e0" stroke="#9a92bd" stroke-width="1.4"/>
    </g>
    <circle cx="758" cy="356" r="12" fill="#f0d6bd" stroke="#c9a684" stroke-width="1.6"/>
    <path d="M758 368 l0 28" stroke="#3f6b8c" stroke-width="12" stroke-linecap="round"/>
    <path d="M758 376 l22 -8" stroke="#3f6b8c" stroke-width="6" stroke-linecap="round"/>
    <rect x="762" y="404" width="196" height="30" rx="7" fill="#2c4a52" opacity="0.92"/>
    <text x="860" y="425" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4 用途地域と面積</text>
  </g>

  <!-- 場面5：車を降りて土地に立ってみる -->
  <g>
    <rect x="120" y="452" width="126" height="42" rx="5" fill="#eef1ee" stroke="#98a1a6" stroke-width="2.2"/>
    <rect x="120" y="452" width="52" height="42" rx="5" fill="#dee5e5" stroke="#98a1a6" stroke-width="2.2"/>
    <rect x="130" y="460" width="30" height="20" fill="#bcd3dd" stroke="#8fa5ae" stroke-width="1.4"/>
    <circle cx="152" cy="498" r="14" fill="#3b444c" stroke="#20262b" stroke-width="2"/><circle cx="152" cy="498" r="6" fill="#8b959d"/>
    <circle cx="220" cy="498" r="14" fill="#3b444c" stroke="#20262b" stroke-width="2"/><circle cx="220" cy="498" r="6" fill="#8b959d"/>
  </g>
  <g>
    <circle cx="292" cy="446" r="14" fill="#f0d6bd" stroke="#c9a684" stroke-width="1.6"/>
    <path d="M292 462 l0 38" stroke="#4f7f9c" stroke-width="14" stroke-linecap="round"/>
    <path d="M292 470 l-20 14 M292 470 l18 16" stroke="#4f7f9c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M286 500 l-8 28 M298 500 l9 28" stroke="#4d5a63" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>
  <g>
    <circle cx="336" cy="466" r="11" fill="#f0d6bd" stroke="#c9a684" stroke-width="1.6"/>
    <path d="M336 478 l0 28" stroke="#c17f4e" stroke-width="11" stroke-linecap="round"/>
    <path d="M336 484 l-16 10 M336 484 l-24 -2" stroke="#c17f4e" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M331 506 l-6 22 M341 506 l7 22" stroke="#4d5a63" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
  <g>
    <rect x="404" y="424" width="20" height="72" rx="3" fill="#f2efe4" stroke="#9c9482" stroke-width="2.4"/>
    <rect x="407" y="446" width="14" height="6" fill="#c0392b"/>
    <ellipse cx="414" cy="500" rx="26" ry="9" fill="#6f9c46" opacity="0.6"/>
  </g>
  <rect x="118" y="516" width="316" height="32" rx="7" fill="#2c4a52" opacity="0.92"/>
  <text x="276" y="539" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5 車を降りて、その土地に立つ</text>

  <!-- 見出しラベル -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">
    <rect x="640" y="466" width="344" height="34" rx="8" fill="#ffffff" opacity="0.94"/>
    <text x="812" y="489" font-size="17" fill="#2c4a52" text-anchor="middle">ICまでの分数が効くのは1だけ</text>
    <rect x="640" y="506" width="344" height="30" rx="8" fill="#a8551a" opacity="0.92"/>
    <text x="812" y="527" font-size="15" fill="#ffffff" text-anchor="middle">残りの四つは自分で測る</text>
  </g>
</svg>
