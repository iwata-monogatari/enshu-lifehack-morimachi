<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="sic1Title sic1Desc" preserveAspectRatio="xMidYMid meet">
  <title id="sic1Title">森町の「速い層」と「細い層」が同居する交通を描いたイラスト</title>
  <desc id="sic1Desc">奥に山並みと茶畑、その手前に新東名の高架橋とパーキングエリア、ETC専用スマートICのゲートを配しています。高架から下りた町道が手前の集落へ続き、道沿いに予約が必要な町営バスの停留所、天竜浜名湖鉄道の木造駅舎と一両編成の列車、軽トラック、歩いて駅へ向かう人を描いています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="sic1sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3ef"/><stop offset="0.55" stop-color="#e8f1ec"/><stop offset="1" stop-color="#f4f8ee"/>
    </linearGradient>
    <linearGradient id="sic1far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb0c3"/><stop offset="1" stop-color="#b3cbd2"/>
    </linearGradient>
    <linearGradient id="sic1tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bb75f"/><stop offset="1" stop-color="#5f8f40"/>
    </linearGradient>
    <linearGradient id="sic1deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e6e6"/><stop offset="1" stop-color="#bcc4c6"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="560" fill="url(#sic1sky)"/>
  <circle cx="892" cy="62" r="26" fill="#ffffff" opacity="0.7"/>
  <g fill="#ffffff" opacity="0.5">
    <ellipse cx="170" cy="56" rx="58" ry="16"/><ellipse cx="222" cy="48" rx="38" ry="12"/>
    <ellipse cx="640" cy="44" rx="46" ry="13"/>
  </g>

  <!-- 遠景の山並み -->
  <path fill="url(#sic1far)" d="M0 152 L92 108 L184 148 L276 100 L376 146 L474 104 L574 150 L672 108 L776 148 L878 112 L968 152 L1000 138 L1000 212 L0 212 Z"/>
  <g fill="#6d9e7c" opacity="0.85">
    <path d="M20 214 l22 -70 l22 70 z"/><path d="M84 214 l17 -56 l17 56 z"/><path d="M846 214 l20 -64 l20 64 z"/>
    <path d="M902 214 l17 -54 l17 54 z"/><path d="M950 214 l22 -68 l22 68 z"/>
  </g>

  <!-- 茶畑（中景） -->
  <path fill="url(#sic1tea)" d="M0 206 L1000 194 L1000 262 L0 278 Z"/>
  <g stroke="#4d7c36" stroke-width="4" opacity="0.5">
    <path d="M0 218 L1000 206"/><path d="M0 232 L1000 220"/><path d="M0 246 L1000 234"/><path d="M0 262 L1000 250"/>
  </g>

  <!-- 新東名の高架橋 -->
  <g>
    <rect x="0" y="262" width="1000" height="34" fill="url(#sic1deck)"/>
    <rect x="0" y="256" width="1000" height="8" fill="#f2f5f5"/>
    <rect x="0" y="292" width="1000" height="7" fill="#9aa4a7"/>
    <g fill="#c9d0d1">
      <rect x="96" y="299" width="34" height="86" rx="4"/>
      <rect x="386" y="299" width="34" height="86" rx="4"/>
      <rect x="712" y="299" width="34" height="86" rx="4"/>
    </g>
    <g fill="#aeb7b9">
      <rect x="88" y="378" width="50" height="12" rx="3"/>
      <rect x="378" y="378" width="50" height="12" rx="3"/>
      <rect x="704" y="378" width="50" height="12" rx="3"/>
    </g>
    <!-- 高架上の車 -->
    <g>
      <rect x="212" y="238" width="62" height="20" rx="5" fill="#e9edec" stroke="#9aa4a7" stroke-width="2"/>
      <rect x="212" y="238" width="24" height="20" rx="5" fill="#cfd8d9"/>
      <circle cx="228" cy="260" r="5" fill="#43494e"/><circle cx="262" cy="260" r="5" fill="#43494e"/>
    </g>
    <g>
      <rect x="560" y="236" width="78" height="22" rx="4" fill="#7fa8c4" stroke="#5f8299" stroke-width="2"/>
      <rect x="620" y="240" width="20" height="18" rx="3" fill="#dee7ea"/>
      <circle cx="582" cy="260" r="6" fill="#43494e"/><circle cx="626" cy="260" r="6" fill="#43494e"/>
    </g>
  </g>

  <!-- パーキングエリアの建物 -->
  <g>
    <rect x="800" y="316" width="150" height="58" rx="5" fill="#f5f2e6" stroke="#bcae90" stroke-width="2.4"/>
    <path d="M792 316 L875 288 L958 316 Z" fill="#8d6a4c"/>
    <g fill="#c6dbe4" stroke="#9ab4c0" stroke-width="1.6">
      <rect x="816" y="332" width="30" height="24"/><rect x="860" y="332" width="30" height="24"/><rect x="904" y="332" width="30" height="24"/>
    </g>
    <rect x="800" y="374" width="150" height="8" fill="#b8ac92"/>
  </g>
  <path fill="#b9c1c2" d="M760 382 L1000 372 L1000 402 L760 414 Z"/>

  <!-- 高架から下りる連絡路 -->
  <path fill="#b9b2a2" d="M420 390 L520 296 L560 296 L488 400 Z"/>
  <path fill="#cfc8b8" d="M0 434 L1000 400 L1000 458 L0 500 Z"/>
  <g stroke="#ffffff" stroke-width="4" stroke-dasharray="26 22" opacity="0.85">
    <path d="M0 468 L1000 430"/>
  </g>

  <!-- ETC専用スマートICのゲート -->
  <g>
    <rect x="300" y="330" width="18" height="82" rx="3" fill="#8d959a"/>
    <rect x="480" y="326" width="18" height="80" rx="3" fill="#8d959a"/>
    <rect x="292" y="300" width="214" height="34" rx="6" fill="#2f5f45" stroke="#204532" stroke-width="2.4"/>
    <text x="399" y="323" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#ffffff" text-anchor="middle">ETC専用</text>
    <rect x="318" y="352" width="164" height="9" rx="4" fill="#d8842c"/>
    <g fill="#ffffff">
      <rect x="330" y="352" width="18" height="9"/><rect x="378" y="352" width="18" height="9"/><rect x="426" y="352" width="18" height="9"/>
    </g>
    <rect x="336" y="372" width="42" height="40" rx="4" fill="#eceff0" stroke="#9aa4a7" stroke-width="2"/>
    <rect x="344" y="380" width="26" height="14" fill="#9fc9d8"/>
    <circle cx="350" cy="404" r="5" fill="#cf4a34"/><circle cx="366" cy="404" r="5" fill="#3f9153"/>
  </g>
  <!-- ゲート前で一旦停止する車 -->
  <g>
    <rect x="392" y="386" width="72" height="26" rx="6" fill="#f0f3f1" stroke="#98a1a6" stroke-width="2.2"/>
    <rect x="392" y="386" width="28" height="26" rx="6" fill="#d9e1e2" stroke="#98a1a6" stroke-width="2.2"/>
    <rect x="399" y="392" width="16" height="12" fill="#b9d2dc"/>
    <circle cx="410" cy="414" r="9" fill="#3b444c"/><circle cx="448" cy="414" r="9" fill="#3b444c"/>
  </g>

  <!-- 手前の集落側：町道と施設 -->
  <path fill="#93b869" d="M0 494 L1000 452 L1000 560 L0 560 Z"/>
  <g stroke="#75a04f" stroke-width="3" opacity="0.55">
    <path d="M0 518 L1000 476"/><path d="M0 544 L1000 502"/>
  </g>

  <!-- 木造駅舎と一両編成の列車 -->
  <g>
    <rect x="24" y="418" width="176" height="66" rx="4" fill="#f4ecdc" stroke="#a98f68" stroke-width="2.4"/>
    <path d="M14 418 L112 384 L210 418 Z" fill="#6f5a45"/>
    <rect x="100" y="384" width="14" height="16" fill="#8b7358"/>
    <rect x="44" y="440" width="34" height="44" fill="#c9dde5" stroke="#96b0bb" stroke-width="1.8"/>
    <rect x="94" y="440" width="34" height="44" fill="#c9dde5" stroke="#96b0bb" stroke-width="1.8"/>
    <rect x="146" y="436" width="36" height="48" fill="#7d6549" stroke="#5f4c37" stroke-width="1.8"/>
    <rect x="24" y="480" width="176" height="8" fill="#b09777"/>
  </g>
  <g>
    <rect x="216" y="432" width="24" height="52" fill="#c8ccc6"/>
    <rect x="216" y="480" width="180" height="8" fill="#a8ada7"/>
    <rect x="240" y="430" width="150" height="54" rx="8" fill="#e6ebe6" stroke="#9aa4a7" stroke-width="2.4"/>
    <rect x="240" y="446" width="150" height="10" fill="#d8892e"/>
    <g fill="#bcd6e0" stroke="#93aeb9" stroke-width="1.6">
      <rect x="252" y="458" width="26" height="18"/><rect x="290" y="458" width="26" height="18"/><rect x="328" y="458" width="26" height="18"/>
    </g>
    <circle cx="272" cy="490" r="8" fill="#4a5158"/><circle cx="358" cy="490" r="8" fill="#4a5158"/>
  </g>

  <!-- 予約が必要な町営バスの停留所 -->
  <g>
    <rect x="556" y="404" width="7" height="86" fill="#8d959a"/>
    <rect x="504" y="392" width="112" height="42" rx="6" fill="#ffffff" stroke="#2c4a52" stroke-width="2.6"/>
    <text x="560" y="410" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#2c4a52" text-anchor="middle">町営バス</text>
    <text x="560" y="427" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#a8551a" text-anchor="middle">要予約の便あり</text>
    <ellipse cx="560" cy="492" rx="26" ry="8" fill="#6f9c46" opacity="0.55"/>
  </g>
  <!-- 停留所で電話をかけて予約する人 -->
  <g>
    <circle cx="624" cy="428" r="13" fill="#f0d6bd" stroke="#c9a684" stroke-width="1.6"/>
    <path d="M624 442 l0 36" stroke="#8a5f7d" stroke-width="14" stroke-linecap="round"/>
    <path d="M624 450 l-16 14" stroke="#8a5f7d" stroke-width="7" stroke-linecap="round"/>
    <path d="M624 450 l14 -12" stroke="#8a5f7d" stroke-width="7" stroke-linecap="round"/>
    <rect x="634" y="422" width="11" height="20" rx="3" fill="#3c4750"/>
    <path d="M618 478 l-6 26 M630 478 l7 26" stroke="#4d5a63" stroke-width="7" stroke-linecap="round" fill="none"/>
  </g>

  <!-- 軽トラックと歩く人 -->
  <g>
    <rect x="736" y="452" width="128" height="44" rx="5" fill="#eef1ee" stroke="#98a1a6" stroke-width="2.2"/>
    <rect x="736" y="452" width="54" height="44" rx="5" fill="#dee5e5" stroke="#98a1a6" stroke-width="2.2"/>
    <rect x="746" y="460" width="32" height="22" fill="#bcd3dd" stroke="#8fa5ae" stroke-width="1.4"/>
    <rect x="794" y="440" width="70" height="14" rx="3" fill="#b7a883" stroke="#8d7f60" stroke-width="1.6"/>
    <circle cx="770" cy="500" r="15" fill="#3b444c" stroke="#20262b" stroke-width="2"/><circle cx="770" cy="500" r="6" fill="#8b959d"/>
    <circle cx="840" cy="500" r="15" fill="#3b444c" stroke="#20262b" stroke-width="2"/><circle cx="840" cy="500" r="6" fill="#8b959d"/>
  </g>
  <g>
    <circle cx="922" cy="452" r="13" fill="#f0d6bd" stroke="#c9a684" stroke-width="1.6"/>
    <path d="M907 448 q15 -14 30 0 z" fill="#4f7f9c" stroke="#3c667f" stroke-width="1.6"/>
    <path d="M922 466 l0 36" stroke="#3f6b8c" stroke-width="13" stroke-linecap="round"/>
    <path d="M922 474 l-18 14 M922 474 l18 12" stroke="#3f6b8c" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M916 502 l-8 26 M928 502 l9 26" stroke="#4d5a63" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="936" y="480" width="26" height="20" rx="3" fill="#f6f1e2" stroke="#b9ac8e" stroke-width="1.8"/>
  </g>

  <!-- 説明ラベル -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700">
    <rect x="24" y="24" width="330" height="34" rx="8" fill="#ffffff" opacity="0.93"/>
    <text x="40" y="47" font-size="17" fill="#2c4a52">上の層は「町の外へ出る速さ」</text>
    <rect x="24" y="64" width="330" height="30" rx="8" fill="#2c4a52" opacity="0.9"/>
    <text x="40" y="85" font-size="15" fill="#ffffff">下の層は「毎日の暮らしを運ぶ道」</text>
  </g>
</svg>
