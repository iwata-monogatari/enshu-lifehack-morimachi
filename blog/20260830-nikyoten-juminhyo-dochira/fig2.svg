<circle cx="892" cy="252" r="15" fill="#e6c49e" stroke="#bb9470" stroke-width="3"/>
<rect x="878" y="270" width="30" height="34" rx="10" fill="#4d7f9e"/>
<rect x="744" y="308" width="126" height="30" rx="4" fill="#f4d774" stroke="#cfae3f" stroke-width="3"/>
<text x="754" y="329" font-size="15" fill="#6b5c22">0538-85-6312</text>
<text x="744" y="360" font-size="15" fill="#4a5a4b">転出証明書を忘れずに</text>
</g>

<rect x="0" y="396" width="1000" height="164" fill="#dfe8d2"/>
<text x="44" y="434" font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="19" font-weight="bold" fill="#33503f">住民票は「選ぶもの」ではなく「事実で決まるもの」</text>
<g font-family="'Meiryo','Hiragino Sans',sans-serif" font-size="16" fill="#4a5a4b">
<text x="44" y="470">・住所＝生活の本拠。1人1か所（住民基本台帳法第4条・民法第22条）</text>
<text x="44" y="500">・森町の国保均等割＋平等割は夫婦2人で年148,500円（軽減前・当方の計算）</text>
<text x="44" y="530">・ふるさと住民登録制度は住民票の代わりにならず、県内モデルは焼津市のみ</text>
</g>
</svg>
