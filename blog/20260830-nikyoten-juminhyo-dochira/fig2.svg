<text x="516" y="222" font-size="17" font-weight="bold" fill="#1f3e52">3　五つはまとめて</text>
<g font-size="13" fill="#4a5a4b">
<rect x="516" y="236" width="52" height="24" rx="3" fill="#e7eef4" stroke="#9aa6ae" stroke-width="2"/><text x="521" y="253">住民税</text>
