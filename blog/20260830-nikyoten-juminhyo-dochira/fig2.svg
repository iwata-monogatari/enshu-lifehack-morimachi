<text x="60" y="222" font-size="17" font-weight="bold" fill="#1f3e52">1　日数を数える</text>
<rect x="62" y="236" width="176" height="96" rx="4" fill="#fbfaf4" stroke="#b8c7b2" stroke-width="3"/>
