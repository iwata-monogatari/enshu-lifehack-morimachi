<text x="572" y="328" font-size="15" fill="#5a4f38">住所地はひとつ</text>
<text x="516" y="360" font-size="15" fill="#4a5a4b">別々には動かせない</text>

<rect x="728" y="194" width="228" height="182" rx="8" fill="#fdfaf0" stroke="#b9922f" stroke-width="3"/>
<text x="744" y="222" font-size="17" font-weight="bold" fill="#1f3e52">4　14日以内に届ける</text>
<rect x="744" y="238" width="112" height="60" rx="3" fill="#ffffff" stroke="#b8c7b2" stroke-width="3"/>
