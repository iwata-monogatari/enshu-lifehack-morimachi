<rect x="74" y="294" width="16" height="16" fill="#8fb3d0"/><rect x="94" y="294" width="16" height="16" fill="#8fb3d0"/>
<rect x="114" y="294" width="16" height="16" fill="#a9c98f"/><rect x="134" y="294" width="16" height="16" fill="#8fb3d0"/>
<rect x="154" y="294" width="16" height="16" fill="#8fb3d0"/><rect x="174" y="294" width="16" height="16" fill="#8fb3d0"/>
<rect x="194" y="294" width="16" height="16" fill="#a9c98f"/>
</g>
<text x="60" y="358" font-size="15" fill="#4a5a4b">青が都市部、緑が森町</text>

<rect x="272" y="194" width="212" height="182" rx="8" fill="#ffffff" stroke="#7d8f76" stroke-width="3"/>
<text x="288" y="222" font-size="17" font-weight="bold" fill="#1f3e52">2　1月1日を決める</text>
<rect x="300" y="238" width="82" height="94" rx="4" fill="#ffffff" stroke="#c8452f" stroke-width="3"/>
<rect x="300" y="238" width="82" height="22" fill="#c8452f"/>
<text x="322" y="256" font-size="15" fill="#ffffff">1月</text>
<text x="326" y="308" font-size="38" font-weight="bold" fill="#a63b31">1</text>
<path d="M398 268 L444 268" stroke="#8a7f6a" stroke-width="5"/>
<path d="M444 262 L458 274 L444 286 Z" fill="#8a7f6a"/>
<text x="288" y="358" font-size="15" fill="#4a5a4b">この日の住所地で課税</text>

