<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="nk2title nk2desc">
<title id="nk2title">二拠点生活で住民票をどちらに置くか決める四つの順序</title>
<desc id="nk2desc">一段目は一年分のカレンダーにどちらで寝たかを日ごとに印を付ける場面。二段目は1月1日の日めくりを前に、その日をどちらで迎えるかを決める場面。三段目は住民税・国保・介護・選挙・就学と書かれた五枚の札を、まとめて片側の箱へ入れる場面。四段目は役場の窓口で転入届を出す場面で、十四日以内と転出証明書の札が添えられている。右端には森町の住民生活課住民係の電話番号を控えたメモが描かれている。</desc>
<defs>
<linearGradient id="nk2sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#d3e0ea"/><stop offset="1" stop-color="#eff2e9"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="url(#nk2sky)"/>
<path d="M0 76 L130 32 L260 80 L390 28 L520 82 L650 30 L780 80 L910 32 L1000 68 L1000 122 L0 122 Z" fill="#7d94a4"/>
<path d="M0 102 L140 68 L280 108 L420 64 L560 110 L700 66 L840 108 L1000 80 L1000 138 L0 138 Z" fill="#6d8b76"/>
