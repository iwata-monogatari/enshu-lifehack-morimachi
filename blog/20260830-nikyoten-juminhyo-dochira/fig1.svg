<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="nk1title nk1desc">
<title id="nk1title">二拠点生活でも住民票は1か所にしか置けない</title>
<desc id="nk1desc">中央の天秤の左の皿に都市部の集合住宅、右の皿に森町の瓦屋根の家が載っている。支柱には「住所＝生活の本拠（民法第22条）」の板が掛かり、その下に「客観的な居住の事実が先、意思はその次」と記されている。左下には一年分のマス目のカレンダーがあり、どちらで寝たかの印が並ぶ。右下には1月1日の日めくりと、住民税・国保・介護・選挙・就学と書かれた五枚の札が置かれている。背景は茶畑の段と杉林の山並み。</desc>
