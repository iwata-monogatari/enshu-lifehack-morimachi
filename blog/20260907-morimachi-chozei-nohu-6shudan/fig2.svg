<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial">
  <title id="title">森町の親と町外家族が納付確認を共有する順序</title>
  <desc id="desc">山並みのある森町の家から納付書、家族との確認、選んだ支払方法、納付済みファイルまで一本の道が続く挿絵。</desc>
  <rect width="1000" height="560" fill="#eef6f3"/>
  <path d="M0 175L120 86 250 170 380 72 520 168 650 92 790 174 910 82 1000 155V260H0Z" fill="#9cbcae"/>
  <path d="M0 222L145 145 300 220 465 130 620 218 780 145 1000 220V305H0Z" fill="#c4d7b8"/>
  <rect y="280" width="1000" height="280" fill="#e3ebd4"/>
  <path d="M75 440C230 350 330 460 490 365S730 315 930 410" fill="none" stroke="#bb8146" stroke-width="34" stroke-linecap="round"/>
  <g fill="#fffdf3" stroke="#42635e" stroke-width="4">
    <path d="M54 330L135 270 216 330V430H54Z"/><rect x="78" y="345" width="48" height="85" fill="#c9e2e4"/>
    <rect x="265" y="286" width="140" height="175" rx="10"/><rect x="287" y="326" width="96" height="57" fill="#d8e9ec"/>
    <rect x="452" y="270" width="112" height="190" rx="18"/><rect x="468" y="295" width="80" height="120" fill="#d6e8e2"/>
    <rect x="610" y="290" width="160" height="130" rx="18"/><rect x="645" y="325" width="90" height="48" fill="#efdba9"/>
    <path d="M810 316H950V448H810Z"/><path d="M800 316L880 258 960 316Z"/><rect x="850" y="350" width="60" height="98" fill="#c7dfe2"/>
  </g>
  <g fill="#294f4a" font-family="system-ui, sans-serif" font-weight="700" text-anchor="middle">
    <text x="135" y="470" font-size="20">森町の親</text>
    <text x="335" y="316" font-size="20">納付書</text><text x="335" y="354" font-size="16">税目・期限・コード</text><text x="335" y="408" font-size="17">担当を一人に</text>
    <text x="508" y="440" font-size="18">町外家族と確認</text>
    <text x="690" y="320" font-size="20">一手段で納付</text><text x="690" y="397" font-size="17">完了を確認</text>
    <text x="880" y="474" font-size="20">支払済み記録</text>
  </g>
  <g fill="#fff" stroke="#54817a" stroke-width="3"><circle cx="508" cy="340" r="25"/><path d="M495 340l10 11 18-24" fill="none" stroke="#54817a" stroke-width="7"/></g>
  <text x="32" y="42" fill="#214b45" font-family="system-ui, sans-serif" font-size="28" font-weight="800">納付前の担当確認から、納付後の家族記録までつなぐ</text>
  <text x="968" y="535" text-anchor="end" fill="#526c67" font-family="system-ui, sans-serif" font-size="16">記事内容をもとに作成した説明用イラスト</text>
</svg>
