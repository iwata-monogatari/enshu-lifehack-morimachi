<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title_fig desc_fig" data-illustration="mori-editorial">
<title id="title_fig">遠州森のまつりを支える三層の組織構造</title>
<desc id="desc_fig">町内会・社寺総代・祭典若衆が一体となって伝統行事を運営する仕組み</desc>
<rect width="1000" height="560" rx="20" fill="#f4f1df"/>
<path d="M0 250 Q150 120 300 235 T600 210 T1000 185 V560 H0Z" fill="#b7cfb3"/>
<path d="M0 330 Q190 240 360 330 T700 300 T1000 320 V560 H0Z" fill="#d9e8d0"/>
<text x="50" y="52" font-family="sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">遠州森のまつりを支える三層の組織構造</text>
<g>
  <rect x="50" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="50" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="192" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">① 町内会・自治会</text>
  <text x="68" y="155" font-family="sans-serif" font-size="14" fill="#334155">・祭典寄付金（花代）の集金</text>
<text x="68" y="183" font-family="sans-serif" font-size="14" fill="#334155">・道路使用許可と地域への事前周知</text>
<text x="68" y="211" font-family="sans-serif" font-size="14" fill="#334155">・高齢者世帯への配慮と安全確保</text>
<text x="68" y="239" font-family="sans-serif" font-size="14" fill="#334155">・会所設営と炊き出し・接待支援</text>
<text x="68" y="267" font-family="sans-serif" font-size="14" fill="#334155">・祭典後の町内一斉清掃</text>

</g><g>
  <rect x="355" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="355" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="497" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">② 社寺総代・神社役員</text>
  <text x="373" y="155" font-family="sans-serif" font-size="14" fill="#334155">・三嶋神社など本宮での神事執行</text>
<text x="373" y="183" font-family="sans-serif" font-size="14" fill="#334155">・神輿渡御・還御の儀式統括</text>
<text x="373" y="211" font-family="sans-serif" font-size="14" fill="#334155">・無形民俗文化財の保存と継承</text>
<text x="373" y="239" font-family="sans-serif" font-size="14" fill="#334155">・氏子総代による神事の儀礼管理</text>
<text x="373" y="267" font-family="sans-serif" font-size="14" fill="#334155">・森町の歴史的伝統の記録</text>

</g><g>
  <rect x="660" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="660" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="802" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">③ 若衆・屋台係</text>
  <text x="678" y="155" font-family="sans-serif" font-size="14" fill="#334155">・漆塗り二輪屋台の保守・点検</text>
<text x="678" y="183" font-family="sans-serif" font-size="14" fill="#334155">・祭り囃子（森町独特の調子）の練習</text>
<text x="678" y="211" font-family="sans-serif" font-size="14" fill="#334155">・狭い街道での曳き廻しと安全運行</text>
<text x="678" y="239" font-family="sans-serif" font-size="14" fill="#334155">・他町内との交渉・すれ違い儀礼</text>
<text x="678" y="267" font-family="sans-serif" font-size="14" fill="#334155">・次世代への技術・所作の伝承</text>

</g>
<rect x="50" y="465" width="900" height="60" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="500" y="502" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">町内会・社寺総代・祭典若衆が一体となって伝統行事を運営する仕組み</text>
</svg>