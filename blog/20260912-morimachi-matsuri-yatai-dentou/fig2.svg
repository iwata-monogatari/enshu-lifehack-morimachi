<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title_fig desc_fig" data-illustration="mori-editorial">
<title id="title_fig">人口減少下で祭りを未来へ引き継ぐ3ステップ</title>
<desc id="desc_fig">担い手不足を克服し伝統文化の灯を守るための地域実践アプローチ</desc>
<rect width="1000" height="560" rx="20" fill="#f4f1df"/>
<path d="M0 250 Q150 120 300 235 T600 210 T1000 185 V560 H0Z" fill="#b7cfb3"/>
<path d="M0 330 Q190 240 360 330 T700 300 T1000 320 V560 H0Z" fill="#d9e8d0"/>
<text x="50" y="52" font-family="sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">人口減少下で祭りを未来へ引き継ぐ3ステップ</text>
<g>
  <rect x="50" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="50" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="192" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ステップ1：参加資格の柔軟化</text>
  <text x="68" y="155" font-family="sans-serif" font-size="14" fill="#334155">・町外在住の出身者・親族の受け入れ</text>
<text x="68" y="183" font-family="sans-serif" font-size="14" fill="#334155">・森町ファンや移住検討者の参加枠</text>
<text x="68" y="211" font-family="sans-serif" font-size="14" fill="#334155">・女性や子どもが活躍できる役割設計</text>
<text x="68" y="239" font-family="sans-serif" font-size="14" fill="#334155">・年齢制限の緩和とOBの技術サポート</text>
<text x="68" y="267" font-family="sans-serif" font-size="14" fill="#334155">・オープンなコミュニティづくり</text>

</g><g>
  <rect x="355" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="355" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="497" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ステップ2：実家・空き家の拠点化</text>
  <text x="373" y="155" font-family="sans-serif" font-size="14" fill="#334155">・祭典期間中の親族帰省と宿泊活用</text>
<text x="373" y="183" font-family="sans-serif" font-size="14" fill="#334155">・空き家を若衆の休憩所・会所に提供</text>
<text x="373" y="211" font-family="sans-serif" font-size="14" fill="#334155">・遠方に住む所有者への祭り便り送付</text>
<text x="373" y="239" font-family="sans-serif" font-size="14" fill="#334155">・実家じまい前に親子の思い出作り</text>
<text x="373" y="267" font-family="sans-serif" font-size="14" fill="#334155">・地域への愛着の再確認</text>

</g><g>
  <rect x="660" y="85" width="285" height="340" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="660" y="85" width="285" height="46" rx="10" fill="#1e40af"/>
  <text x="802" y="115" font-family="sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">ステップ3：寄付・協賛の透明化</text>
  <text x="678" y="155" font-family="sans-serif" font-size="14" fill="#334155">・花代（寄付）の負担金額の見直し</text>
<text x="678" y="183" font-family="sans-serif" font-size="14" fill="#334155">・企業協賛やクラウドファンディング</text>
<text x="678" y="211" font-family="sans-serif" font-size="14" fill="#334155">・会計報告のデジタル化と公開</text>
<text x="678" y="239" font-family="sans-serif" font-size="14" fill="#334155">・屋台修繕積立金の計画的な管理</text>
<text x="678" y="267" font-family="sans-serif" font-size="14" fill="#334155">・無理のない持続可能な財政運営</text>

</g>
<rect x="50" y="465" width="900" height="60" rx="10" fill="#ffffff" opacity="0.95"/>
<text x="500" y="502" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">担い手不足を克服し伝統文化の灯を守るための地域実践アプローチ</text>
