<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="tx2title tx2desc">
<title id="tx2title">地域タクシーに乗るまでの二つの締め切り</title>
<desc id="tx2desc">二週間前の利用者登録と、当日の一時間前予約という二つの締め切りを、カレンダーと時間の帯として並べた図。帯には七時の受付開始、八時三十分の運行開始、十四時三十分の帰りの電話締め切り、十五時三十分の運行終了が目盛りとして打たれている。</desc>
<defs>
<linearGradient id="tx2sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#d6e6ef"/><stop offset="1" stop-color="#eef3e9"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="url(#tx2sky)"/>

