<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="mh1title mh1desc">
<title id="mh1title">森町文化会館の大ホール797席と2026年度の4公演</title>
<desc id="mh1desc">大ホールの客席を斜め上から見た図。整然と並ぶ座席の中に車イス専用の三席が色を変えて置かれ、舞台にはマイクスタンドとギターとピアノがある。右側には8月30日・9月6日・10月4日・11月29日の四つの日付の札が縦に並び、すべて日曜であることが示されている。ホールの外には三方を囲む小高い山並みが描かれ、三木の里という愛称の由来を表している。</desc>
