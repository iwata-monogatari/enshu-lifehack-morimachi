<title id="mh2title">森町文化会館の公演に行くまでの確認の四段</title>
<desc id="mh2desc">カレンダーに四つの日曜の印を付け、友の会の入会金500円と年会費1,000円を500円引き三回と天秤にかけ、会館の窓口で現金を出して先行販売の券を受け取り、電話で車イス席を確かめるまでの順序を、終演後の帰りの足の注意とともに描いた図。</desc>
