<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="kk1title kk1desc">
<title id="kk1title">森町保健福祉センターに並ぶ二つの相談の入口</title>
<desc id="kk1desc">中央に二階建ての森町保健福祉センターが描かれ、その中が左右に分かれている。左側は福祉課の地域包括支援センター係で、平日八時三十分から十七時十五分、電話〇五三八の八五の六三四一と記されている。右側は森町社会福祉協議会で、毎月第一火曜十三時三十分から十六時三十分に司法書士の成年後見制度相談、七月と十一月と三月の第二火曜に弁護士相談があると記されている。建物の手前には離れて暮らす家族が携帯電話を持って立ち、足元に通帳と実家の登記の書類が置かれている。背景には段になった茶畑と杉林の山並みが広がっている。</desc>
<defs>
<linearGradient id="kk1sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#d5e2ec"/><stop offset="1" stop-color="#eff2e9"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="url(#kk1sky)"/>
<path d="M0 76 L130 30 L260 78 L390 26 L520 80 L650 28 L780 78 L910 30 L1000 66 L1000 122 L0 122 Z" fill="#7d94a4"/>
<path d="M0 102 L140 66 L280 106 L420 62 L560 108 L700 64 L840 106 L1000 78 L1000 138 L0 138 Z" fill="#6d8b76"/>
<g fill="#33604a"><path d="M14 138 L32 94 L50 138 Z"/><path d="M948 138 L966 92 L984 138 Z"/></g>
<g stroke="#5d8a6a" stroke-width="4" fill="none">
<path d="M0 126 L170 116"/><path d="M0 134 L170 124"/>
<path d="M830 124 L1000 116"/><path d="M830 132 L1000 124"/>
</g>
<rect x="0" y="138" width="1000" height="422" fill="#eceee4"/>

<g font-family="'Meiryo','Hiragino Sans',sans-serif">
<rect x="36" y="20" width="420" height="42" rx="6" fill="#1f3e52"/>
<text x="52" y="49" font-size="22" font-weight="bold" fill="#ffffff">同じ建物、別の電話番号</text>

<!-- 建物本体 -->
<rect x="150" y="196" width="700" height="212" fill="#efeadd" stroke="#b09a68" stroke-width="5"/>
<path d="M132 196 L500 148 L868 196 Z" fill="#8fa0a8" stroke="#6b7d85" stroke-width="5"/>
<rect x="150" y="196" width="700" height="34" fill="#e2dccb"/>
<text x="332" y="222" font-size="19" font-weight="bold" fill="#4a5a4b">森町保健福祉センター（森町森50-1）</text>
<rect x="496" y="230" width="8" height="178" fill="#b09a68"/>

<!-- 左：町直営 -->
<rect x="170" y="248" width="308" height="142" rx="6" fill="#ffffff" stroke="#7d8f76" stroke-width="4"/>
<rect x="170" y="248" width="308" height="34" fill="#4d7f9e"/>
<text x="184" y="273" font-size="17" font-weight="bold" fill="#ffffff">町直営　福祉課</text>
<text x="184" y="308" font-size="16" font-weight="bold" fill="#1f3e52">地域包括支援センター係</text>
<text x="184" y="336" font-size="15" fill="#41525c">平日 8:30〜17:15</text>
<text x="184" y="360" font-size="18" font-weight="bold" fill="#33503f">0538-85-6341</text>
<text x="184" y="382" font-size="13" fill="#6b7d85">時間外は宿日直 85-2111</text>

<!-- 右：社協 -->
<rect x="522" y="248" width="308" height="142" rx="6" fill="#fdfaf0" stroke="#b9922f" stroke-width="4"/>
<rect x="522" y="248" width="308" height="34" fill="#b9922f"/>
<text x="536" y="273" font-size="17" font-weight="bold" fill="#ffffff">森町社会福祉協議会</text>
<text x="536" y="306" font-size="15" fill="#41525c">第1火曜 13:30〜16:30 司法書士</text>
<text x="536" y="330" font-size="15" fill="#41525c">7・11・3月 第2火曜 弁護士</text>
<text x="536" y="356" font-size="18" font-weight="bold" fill="#8a6c1c">0538-85-5769</text>
<text x="536" y="380" font-size="13" fill="#6b7d85">予約制・無料・1回30分</text>

<!-- 手前左：離れて暮らす家族 -->
<circle cx="72" cy="316" r="28" fill="#e6c49e" stroke="#bb9470" stroke-width="4"/>
<path d="M40 350 Q72 336 104 350 L114 448 L30 448 Z" fill="#6f8fa6"/>
<rect x="96" y="300" width="20" height="34" rx="5" fill="#33404a"/>
<path d="M96 320 L86 336" stroke="#e6c49e" stroke-width="10" stroke-linecap="round"/>
<text x="24" y="476" font-size="15" fill="#4a5a4b">離れて暮らす家族</text>

<!-- 手前右：通帳と登記の書類 -->
<rect x="880" y="392" width="96" height="62" rx="4" fill="#4d7f9e" stroke="#31607d" stroke-width="4"/>
<rect x="894" y="408" width="68" height="10" fill="#dfeaf2"/>
<rect x="894" y="426" width="48" height="10" fill="#dfeaf2"/>
<rect x="856" y="446" width="120" height="76" rx="3" fill="#ffffff" stroke="#b6ae95" stroke-width="4"/>
<text x="868" y="472" font-size="14" fill="#7a6a4a">実家の登記</text>
<g stroke="#c3c9cc" stroke-width="4" stroke-linecap="round">
<path d="M868 488 L964 488"/><path d="M868 506 L930 506"/>
</g>
<text x="856" y="542" font-size="15" fill="#4a5a4b">名義と所在を先に</text>

<!-- 中央下の帯 -->
<rect x="188" y="430" width="620" height="46" rx="6" fill="#dfe8d2" stroke="#7d8f76" stroke-width="3"/>
<text x="208" y="460" font-size="18" font-weight="bold" fill="#33503f">後見人に選ばれる親族は16.4%、8割超は専門職</text>
<rect x="188" y="490" width="620" height="46" rx="6" fill="#eef6f2" stroke="#7d8f76" stroke-width="3"/>
<text x="208" y="520" font-size="18" font-weight="bold" fill="#33503f">申立ての動機の36.3%に「不動産の処分」が入る</text>
</g>
</svg>
