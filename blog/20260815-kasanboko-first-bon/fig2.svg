    <path d="M936 416 C 936 428, 938 432, 940 434 L962 434 C 964 430, 966 426, 964 416 Z" fill="#b8845e" stroke="#8d6242" stroke-width="3"/>
    <rect x="906" y="374" width="38" height="24" rx="3" fill="#fdfbf2" stroke="#b9b09a" stroke-width="3"/>
