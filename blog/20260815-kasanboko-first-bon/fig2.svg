<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" data-illustration="mori-editorial" aria-labelledby="kb2Title kb2Desc" preserveAspectRatio="xMidYMid meet">
  <title id="kb2Title">実家が新盆になった年に確かめる順番を、一本の道すじとして描いたイラスト</title>
  <desc id="kb2Desc">左端に森町の瓦屋根の実家があり、縁側には位牌を出した盆棚とススキが見えます。そこから右へ道が伸びています。最初の地点では家族が盆棚の前で紙に書き込みをしており、「仏壇と盆飾りを見る」の札が立っています。次の地点では、道端で町内会の役員らしい年配の人と家族が向かい合って話し、「新盆だと地区へ伝える」の札があります。三つ目の地点で道が二つに分かれ、上の道は赤い唐傘と提灯をつけた盆車の絵と「回る町内か」の札へ、下の道は灯りの消えた静かな家の絵と「回らない町内か」の札へ続きます。二つの道は再び合流し、最後に役場の窓口があって、死亡届と火葬予約の書類を前に職員と家族が話しています。背景には遠州の山並みと段になった茶畑が広がっています。写真ではなくイラストです。</desc>

  <defs>
    <linearGradient id="kb2Sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d6e4"/><stop offset="1" stop-color="#eef2e6"/>
    </linearGradient>
  </defs>

