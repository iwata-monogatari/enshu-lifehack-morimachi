    <text x="494" y="269" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3e52" text-anchor="middle">新盆だと地区へ伝える</text>
    <path d="M494 282 L494 322" stroke="#8f9a86" stroke-width="4"/>
  </g>

