    <text x="274" y="269" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1f3e52" text-anchor="middle">仏壇と盆飾りを見る</text>
    <path d="M274 282 L274 330" stroke="#8f9a86" stroke-width="4"/>
  </g>

  <!-- 2 新盆だと地区へ伝える -->
  <g>
    <circle cx="424" cy="344" r="16" fill="#f0d2b0" stroke="#c2a181" stroke-width="3"/>
    <path d="M408 368 C 408 398, 414 414, 416 430 L440 430 C 444 414, 450 398, 448 368 Z" fill="#87a45f" stroke="#5f7b3d" stroke-width="3"/>
