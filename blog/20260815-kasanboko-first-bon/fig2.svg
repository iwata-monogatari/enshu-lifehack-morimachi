  <rect width="1000" height="150" fill="url(#kb2Sky)"/>
  <path fill="#9ab3bd" d="M0 104 L104 52 L212 102 L320 46 L436 102 L556 48 L672 102 L790 54 L900 102 L1000 68 L1000 146 L0 146 Z"/>
  <g fill="#3d6350">
    <path d="M12 150 l13 -42 l13 42 z"/><path d="M42 150 l11 -36 l11 36 z"/>
    <path d="M934 150 l13 -42 l13 42 z"/><path d="M962 150 l14 -46 l14 46 z"/>
  </g>
  <path fill="#8fb469" d="M0 152 C 240 144, 460 166, 700 154 C 830 148, 910 160, 1000 152 L1000 192 L0 198 Z"/>
  <g stroke="#6a8f4c" stroke-width="4" opacity="0.8" fill="none">
    <path d="M0 166 C 240 158, 460 180, 700 168 C 830 162, 910 174, 1000 166"/>
    <path d="M0 182 C 240 174, 460 196, 700 184 C 830 178, 910 190, 1000 182"/>
  </g>
  <path fill="#e5e8d8" d="M0 194 L1000 188 L1000 560 L0 560 Z"/>

