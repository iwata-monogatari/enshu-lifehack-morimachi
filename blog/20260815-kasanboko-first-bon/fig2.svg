  <g>
    <path d="M42 322 L42 434 L176 434 L176 322 Z" fill="#f2ece0" stroke="#a3997f" stroke-width="4"/>
    <path d="M26 326 L109 268 L192 326 Z" fill="#6a7a80"/>
    <rect x="60" y="350" width="80" height="66" fill="#e7dcc4" stroke="#b0a488" stroke-width="3"/>
    <rect x="72" y="364" width="20" height="34" fill="#8a6b46" stroke="#6b5133" stroke-width="3"/>
    <g stroke="#5f8a42" stroke-width="3" fill="none"><path d="M112 400 L112 366 M122 400 L119 368"/></g>
    <circle cx="112" cy="362" r="5" fill="#c15b86"/><circle cx="121" cy="364" r="5" fill="#c15b86"/>
    <rect x="104" y="400" width="34" height="9" fill="#cdbf9c"/>
  </g>

