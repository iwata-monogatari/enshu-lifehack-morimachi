    <ellipse cx="800" cy="236" rx="10" ry="13" fill="#fbe2b4" stroke="#c9a24a" stroke-width="3"/>
    <ellipse cx="796" cy="268" rx="19" ry="16" fill="#b8563a" stroke="#8a3b26" stroke-width="3"/>
    <circle cx="758" cy="292" r="12" fill="#6a5b45" stroke="#463c2d" stroke-width="3"/>
    <circle cx="834" cy="292" r="12" fill="#6a5b45" stroke="#463c2d" stroke-width="3"/>
    <rect x="642" y="140" width="216" height="40" rx="6" fill="#ffffff" stroke="#c0563c" stroke-width="4"/>
    <text x="750" y="167" font-family="sans-serif" font-size="18" font-weight="bold" fill="#c0563c" text-anchor="middle">回る町内か：日時を聞く</text>
  </g>

  <!-- 下の道：回らない町内 -->
  <g>
    <path d="M700 528 L700 452 L800 452 L800 528 Z" fill="#eae6da" stroke="#a3997f" stroke-width="4"/>
    <path d="M686 456 L750 412 L814 456 Z" fill="#8b969a"/>
    <rect x="722" y="480" width="34" height="48" fill="#b9ae95" stroke="#948a72" stroke-width="3"/>
    <rect x="608" y="440" width="60" height="46" fill="#e2ded0" stroke="#a3997f" stroke-width="3"/>
    <path d="M600 444 L638 418 L676 444 Z" fill="#8b969a"/>
    <rect x="600" y="536" width="256" height="24" rx="4" fill="#d7d2bd"/>
    <path d="M350 470 L350 452 L586 452" stroke="#8f9a86" stroke-width="4" fill="none"/>
    <rect x="230" y="470" width="240" height="40" rx="6" fill="#ffffff" stroke="#5f7b3d" stroke-width="4"/>
    <text x="350" y="497" font-family="sans-serif" font-size="18" font-weight="bold" fill="#4f6b33" text-anchor="middle">回らない町内か：記録する</text>
  </g>

  <!-- 合流先：役場の窓口 -->
  <g>
    <rect x="860" y="316" width="126" height="118" rx="6" fill="#f4f2e8" stroke="#98917c" stroke-width="4"/>
