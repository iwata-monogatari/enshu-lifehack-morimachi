<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial"><title id="title">村松梢風と昭和100年の年表</title><desc id="desc">1889年の誕生、1926年の昭和開始、1961年の没年、2026年の昭和100年を結ぶ年表。</desc><rect width="1000" height="560" rx="24" fill="#f6f0e3"/><path d="M0 390 Q170 300 340 365 T680 350 T1000 370 V560 H0Z" fill="#d9e4cf"/><path d="M90 282 H910" stroke="#7b684f" stroke-width="10" stroke-linecap="round"/><g font-family="sans-serif" text-anchor="middle"><g fill="#8a5f37"><circle cx="140" cy="282" r="20"/><circle cx="400" cy="282" r="20"/><circle cx="650" cy="282" r="20"/><circle cx="870" cy="282" r="20"/></g><g fill="#263b43" font-weight="700" font-size="30"><text x="140" y="220">1889</text><text x="400" y="220">1926</text><text x="650" y="220">1961</text><text x="870" y="220">2026</text></g><g fill="#3d4d52" font-size="22"><text x="140" y="335">飯田で誕生</text><text x="400" y="335">昭和開始</text><text x="650" y="335">72歳で没</text><text x="870" y="335">開始から満100年</text></g><text x="500" y="76" fill="#263b43" font-size="38" font-weight="700">人物の生涯と元号の節目を分ける</text><text x="500" y="125" fill="#6d5c46" font-size="24">明治に生まれ、大正・昭和に書いた</text></g><g transform="translate(392 405)"><rect width="216" height="112" rx="8" fill="#fffdf8" stroke="#8a5f37" stroke-width="4"/><path d="M108 8 V104" stroke="#d7c5a9" stroke-width="3"/><path d="M22 34 H88 M22 58 H88 M128 34 H194 M128 58 H194" stroke="#9f927e" stroke-width="4"/><text x="108" y="91" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#6b4d2f">作品を開く</text></g></svg>
