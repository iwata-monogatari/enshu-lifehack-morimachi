<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" data-illustration="mori-editorial"><title id="title">作品・同時代資料・読書メモの三点</title><desc id="desc">机の上に作品一冊、昭和期の森町資料一枚、自分の要約メモ一枚を三角形に置いた図。</desc><rect width="1000" height="560" rx="24" fill="#eef2eb"/><rect x="55" y="90" width="890" height="410" rx="28" fill="#cba97c"/><path d="M500 178 L266 388 L734 388 Z" fill="none" stroke="#fff6dd" stroke-width="9" stroke-dasharray="18 14"/><g font-family="sans-serif" text-anchor="middle"><g transform="translate(385 105)"><rect width="230" height="150" rx="10" fill="#704a32"/><rect x="18" y="16" width="194" height="118" rx="6" fill="#f4e5bd"/><text x="115" y="67" font-size="25" font-weight="700" fill="#443328">村松梢風</text><text x="115" y="104" font-size="20" fill="#69513c">作品を一冊</text></g><g transform="translate(115 330)"><rect width="300" height="135" rx="8" fill="#fffdf6" stroke="#667c79" stroke-width="5"/><text x="150" y="43" font-size="23" font-weight="700" fill="#334f52">昭和期の森町資料</text><path d="M35 68 H265 M35 94 H230" stroke="#9aa9a5" stroke-width="5"/><text x="150" y="122" font-size="18" fill="#536a6b">同じ年かを確かめる</text></g><g transform="translate(585 330)"><rect width="300" height="135" rx="8" fill="#fffef8" stroke="#8a5f37" stroke-width="5"/><text x="150" y="43" font-size="23" font-weight="700" fill="#68482d">自分の読書メモ</text><path d="M35 68 H265 M35 94 H230" stroke="#bfa98b" stroke-width="5"/><text x="150" y="122" font-size="18" fill="#75563a">要約を一行</text></g><text x="500" y="50" font-size="32" font-weight="700" fill="#294247">看板ではなく、三点を並べて読む</text></g></svg>
